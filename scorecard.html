/* =====================================================

   ===================================================== */

async function testDatabase() {

  try {

    const {
      data,
      error
    } = await supabaseClient
      .from("scores")
      .select("*")
      .limit(1);

    if (error) {

/* =====================================================
   LOAD PAIRINGS
   ===================================================== */

async function loadPairings() {

  try {

    const {
      data: pairingRows,
      error: pairingError
    } = await supabaseClient
      .from("pairings")
      .select("*")
      .eq(
        "round_number",
        currentRound
      )
      .order(
        "pairing_number",
        { ascending: true }
      );

    if (pairingError) {
      throw pairingError;
    }


    const {
      data: playerRows,
      error: playerError
    } = await supabaseClient
      .from("pairing_players")
      .select("*");

    if (playerError) {
      throw playerError;
    }


    const loaded = [];


    (pairingRows || []).forEach(
      pairing => {

        const rows =
          (playerRows || [])
          .filter(
            row =>
              String(row.pairing_id) ===
              String(pairing.id)
          );


        const ryan =
          rows
          .filter(
            row =>
              String(row.side).toUpperCase() === "B"
          )
          .map(
            row => row.player_name
          )
          .filter(Boolean);


        const clayton =
          rows
          .filter(
            row =>
              String(row.side).toUpperCase() === "A"
          )
          .map(
            row => row.player_name
          )
          .filter(Boolean);


        if (
          ryan.length === 2 &&
          clayton.length === 2
        ) {

          loaded.push({

            pairingNumber:
              Number(pairing.pairing_number),

            ryan,

            clayton

          });

        }

      }
    );


    pairings[currentRound] =
      loaded.sort(
        (a,b) =>
          a.pairingNumber -
          b.pairingNumber
      );


  } catch (error) {

    console.error(
      "PAIRING LOAD ERROR:",
      error
    );

    pairings[currentRound] = [];

    showStatus(
      "PAIRING LOAD ERROR: " +
      error.message,
      "error"
    );
  }
}

            row.match_number,
            row.player_name,
            row.hole_number
          );

        scores[key] =
          row.gross_score;

  } catch (error) {

    console.error(
      "SCORE LOAD ERROR:",
      error

    showStatus(
      "SCORE LOAD ERROR: " +

    );
  }
}

      data,

    } = await supabaseClient
      .from("scorecard_certifications")
      .select("*")
      .eq(
        "round_number",
        currentRound
      );

    if (error) {

    }


    (data || []).forEach(
      row => {

        certifications[
          `${row.round_number}_${row.match_number}`
        ] = {

          marker_certified:
            Boolean(
              row.marker_certified
            ),

          opponent_certified:
            Boolean(
              row.opponent_certified
            )

        };

      }

  } catch (error) {

    /*
      Do not break the scorecard if the
      certification table is unavailable.
    */

    console.warn(
      "CERTIFICATION LOAD:",
      error.message
    );
  }
}


/* =====================================================
   HANDICAP
   ===================================================== */

function getPlayerCourseHandicap(
  playerName,
  course
) {

  const handicapIndex =
    Number(
      players[playerName]?.handicap || 0
    );


  const isWhiteTee =
    playerName === "Ryan D" ||
    playerName === "Brad";


  let courseRating;
  let slopeRating;
  let par;


  if (course === dinosaurMountain) {

    par = 70;


    if (isWhiteTee) {

      courseRating = 65.6;
      slopeRating = 117;

    } else {

      /*
        Everyone except Ryan D and Brad
        plays BLACK.
      */

      courseRating = 70.1;
      slopeRating = 137;

    }


  } else if (
    course === weKoPaCholla
  ) {

    par = 72;


    if (isWhiteTee) {

      courseRating = 68.6;
      slopeRating = 122;

    } else {

      courseRating = 71.7;
      slopeRating = 135;

    }


  } else if (
    course === weKoPaSaguaro
  ) {

    par = 71;


    if (isWhiteTee) {

      courseRating = 68.8;
      slopeRating = 125;

    } else {

      courseRating = 70.2;
      slopeRating = 132;

    }


  } else {

    return 0;

  }


  const courseHandicap =
    handicapIndex *
      (slopeRating / 113) +
    (courseRating - par);


  return Math.round(
    courseHandicap * 0.85
  );
}


/* =====================================================
   MATCH HANDICAPS
   ===================================================== */

function getMatchPlayingHandicaps(
  match,
  course
) {

  const allPlayers = [
    ...match.ryan,
    ...match.clayton
  ];


  const courseHandicaps =
    allPlayers.map(
      playerName => ({

        playerName,

        playingHandicap:
          getPlayerCourseHandicap(
            playerName,
            course
          )

      })
    );


  const lowest =
    Math.min(
      ...courseHandicaps.map(
        p => p.playingHandicap
      )
    );


  return Object.fromEntries(
    courseHandicaps.map(
      p => [

        p.playerName,

        Math.max(
          0,
          p.playingHandicap -
          lowest
        )

      ]
    )
  );
}


/* =====================================================
   STROKES
   ===================================================== */

function getsStrokesOnHole(
  playerName,
  holeIndex,
  course,
  matchPlayingHandicaps
) {

  const playingHandicap =
    matchPlayingHandicaps
      ? Number(
          matchPlayingHandicaps[
            playerName
          ] || 0
        )
      : getPlayerCourseHandicap(
          playerName,
          course
        );


  const holeRank =
    Number(
      course.handicap[
        holeIndex
      ]
    );


  let strokes = 0;


  if (
    playingHandicap >=
    holeRank
  ) {

    strokes++;

  }


  if (
    playingHandicap > 18 &&
    playingHandicap - 18 >=
    holeRank
  ) {

    strokes++;

  }


  return strokes;
}


function calculateNetScore(
  playerName,
  grossScore,
  holeIndex,
  course,
  matchPlayingHandicaps
) {

  if (
    grossScore === "" ||
    grossScore === null ||
    grossScore === undefined
  ) {

    return "";

  }


  return Number(grossScore) -
    getsStrokesOnHole(
      playerName,
      holeIndex,
      course,
      matchPlayingHandicaps
    );
}


/* =====================================================

   ===================================================== */

function getCertificationKey(
  round,
  match
) {

  return `${round}_${match}`;
}


function isScorecardLocked(
  matchNumber
) {

  const cert =
    certifications[
      getCertificationKey(
        currentRound,
        matchNumber
      )
    ];


  return Boolean(
    cert?.marker_certified &&
    cert?.opponent_certified
  );
}


async function updateCertification(
  matchNumber,
  type,
  checked
) {

  const key =
    getCertificationKey(
      currentRound,
      matchNumber
    );


  const current =
    certifications[key] || {

      marker_certified: false,

      opponent_certified: false

    };


  current[type] =
    Boolean(checked);


  certifications[key] =
    current;


  const matchElement =
    document.querySelector(
      `.match[data-match-number="${matchNumber}"]`
    );


  if (matchElement) {

    applyCertificationState(
      matchElement,
      matchNumber
    );

  }


  try {

    const {
      error
    } = await supabaseClient
      .from(
        "scorecard_certifications"
      )
      .upsert({

        round_number:
          Number(currentRound),

        match_number:
          Number(matchNumber),

        marker_certified:
          current.marker_certified,

        opponent_certified:
          current.opponent_certified,

        updated_at:
          new Date().toISOString()

      }, {

        onConflict:
          "round_number,match_number"

      });


    if (error) {
      throw error;
    }


  } catch (error) {

    console.error(
      "CERTIFICATION SAVE ERROR:",
      error
    );

  }
}


function applyCertificationState(
  matchElement,
  matchNumber
) {

  const locked =
    isScorecardLocked(
      matchNumber
    );


  matchElement.classList.toggle(
    "scorecard-locked",
    locked
  );


  matchElement
    .querySelectorAll(
      "input.score-input"
    )
    .forEach(
      input => {
        input.disabled = locked;
      }
    );


  const cert =
    certifications[
      getCertificationKey(
        currentRound,
        matchNumber
      )
    ] || {};


  const markerBox =
    matchElement.querySelector(
      '[data-cert-type="marker"]'
    );


  const opponentBox =
    matchElement.querySelector(
      '[data-cert-type="opponent"]'
    );


  if (markerBox) {

    markerBox.checked =
      Boolean(
        cert.marker_certified
      );

  }


  if (opponentBox) {

    opponentBox.checked =
      Boolean(
        cert.opponent_certified
      );

  }


  const status =
    matchElement.querySelector(
      ".certification-status"
    );


  if (status) {

    status.textContent =
      locked

        ? "✓ Both certifications complete — scorecard is LOCKED"

        : "Both certifications are required to lock this scorecard.";

    status.classList.toggle(
      "locked",
      locked
    );

  }
}

function getTeeForPlayer(

) {

  if (

  ) {

    return (
      playerName === "Ryan D" ||
      playerName === "Brad"
    )
      ? "blue"
      : "black";

  }


  return (
    playerName === "Ryan D" ||

  )
    ? "white"
    : "purple";
}


function getCourseTeeRows(

) {

  if (

      },

  return [

  ];
}

/* =====================================================
   UPDATE SCORE
   ===================================================== */

async function updateScore(
  playerName,
  matchNumber,
  hole,
  value
) {

  if (
    isScorecardLocked(
      matchNumber
    )
  ) {

    showStatus(
      "This scorecard is certified and locked.",
      "error"
    );

    renderScorecards();

    return;
  }


  const key =
    getScoreKey(
      currentRound,
      matchNumber,
      playerName,
      hole
    );


  if (value === "") {

    delete scores[key];

    updatePlayerTotals(
      matchNumber
    );

    calculateMatch(
      matchNumber
    );


    await deleteScoreAutomatically(
      currentRound,
      matchNumber,
      playerName,
      hole
    );


    return;
  }


  scores[key] =
    Number(value);


  updatePlayerTotals(
    matchNumber
  );


  calculateMatch(
    matchNumber
  );


  await saveScoreAutomatically(
    currentRound,
    matchNumber,
    playerName,
    hole,
    Number(value)
  );
}


/* =====================================================
   PLAYER TOTALS
   ===================================================== */

function updatePlayerTotals(
  matchNumber
) {

  const match =
    (pairings[currentRound] || [])
      .find(
        m =>
          Number(m.pairingNumber) ===
          Number(matchNumber)
      );


  if (!match) {
    return;
  }


  const allPlayers = [

    ...match.ryan,

    ...match.clayton

  ];


  allPlayers.forEach(
    playerName => {

      let front = 0;

      let back = 0;

      let frontComplete = true;

      let backComplete = true;


      for (
        let hole = 1;
        hole <= 18;
        hole++
      ) {

        const key =
          getScoreKey(
            currentRound,
            matchNumber,
            playerName,
            hole
          );


        const value =
          scores[key];


        if (
          value === undefined ||
          value === ""
        ) {

          if (hole <= 9) {

            frontComplete = false;

          } else {

            backComplete = false;

          }

          continue;
        }


        if (hole <= 9) {

          front += Number(value);

        } else {

          back += Number(value);

        }

      }


      const frontCell =
        document.getElementById(
          `front-${currentRound}-${matchNumber}-${playerName}`
        );


      const backCell =
        document.getElementById(
          `back-${currentRound}-${matchNumber}-${playerName}`
        );


      const totalCell =
        document.getElementById(
          `total-${currentRound}-${matchNumber}-${playerName}`
        );


      if (frontCell) {

        frontCell.textContent =
          frontComplete
            ? front
            : "-";

      }


      if (backCell) {

        backCell.textContent =
          backComplete
            ? back
            : "-";

      }


      if (totalCell) {

        totalCell.textContent =
          frontComplete &&
          backComplete
            ? front + back
            : "-";

      }

    }
  );
}


/* =====================================================
   MATCH CALCULATION
   ===================================================== */

function calculateMatch(
  matchNumber
) {

  const match =
    (pairings[currentRound] || [])
      .find(
        m =>
          Number(m.pairingNumber) ===
          Number(matchNumber)
      );


  if (!match) {
    return;
  }


  const course =
    getCourse(
      currentRound
    );


  const matchPlayingHandicaps =
    getMatchPlayingHandicaps(
      match,
      course
    );


  let ryanHolePoints = 0;

  let claytonHolePoints = 0;


  let ryanBirdieBonus = 0;

  let claytonBirdieBonus = 0;


  let frontRyanHoles = 0;

  let frontClaytonHoles = 0;

  let backRyanHoles = 0;

  let backClaytonHoles = 0;


  let ryanFrontTotal = 0;

  let claytonFrontTotal = 0;

  let ryanBackTotal = 0;

  let claytonBackTotal = 0;


  let completedHoles = 0;


  for (
    let holeIndex = 0;
    holeIndex < 18;
    holeIndex++
  ) {

    const hole =
      holeIndex + 1;


    const ryanScores =
      match.ryan.map(
        playerName => {

          const gross =
            scores[
              getScoreKey(
                currentRound,
                matchNumber,
                playerName,
                hole
              )
            ];


          if (
            gross === undefined ||
            gross === ""
          ) {

            return null;

          }


          return {

            player: playerName,

            gross: Number(gross),

            net: calculateNetScore(
              playerName,
              gross,
              holeIndex,
              course,
              matchPlayingHandicaps
            )

          };

        }
      );


    const claytonScores =
      match.clayton.map(
        playerName => {

          const gross =
            scores[
              getScoreKey(
                currentRound,
                matchNumber,
                playerName,
                hole
              )
            ];


          if (
            gross === undefined ||
            gross === ""
          ) {

            return null;

          }


          return {

            player: playerName,

            gross: Number(gross),

            net: calculateNetScore(
              playerName,
              gross,
              holeIndex,
              course,
              matchPlayingHandicaps
            )

          };

        }
      );


    if (
      ryanScores.includes(null) ||
      claytonScores.includes(null)
    ) {

      continue;

    }


    completedHoles++;


    const ryanBest =
      Math.min(
        ...ryanScores.map(
          s => s.net
        )
      );


    const claytonBest =
      Math.min(
        ...claytonScores.map(
          s => s.net
        )
      );


    if (hole <= 9) {

      ryanFrontTotal +=
        ryanBest;

      claytonFrontTotal +=
        claytonBest;

    } else {

      ryanBackTotal +=
        ryanBest;

      claytonBackTotal +=
        claytonBest;

    }


    /*
      ONLY THE TEAM WINNING THE HOLE
      CAN RECEIVE A BIRDIE/EAGLE BONUS.

      MAX ONE BONUS PER TEAM PER HOLE.

      Eagle = +2
      Birdie = +1
    */

    if (
      ryanBest <
      claytonBest
    ) {

      ryanHolePoints++;


      if (hole <= 9) {

        frontRyanHoles++;

      } else {

        backRyanHoles++;

      }


      const bonus =
        Math.max(
          ...ryanScores.map(
            score => {

              if (
                score.gross <=
                course.pars[holeIndex] - 2
              ) {

                return 2;

              }

              if (
                score.gross ===
                course.pars[holeIndex] - 1
              ) {

                return 1;

              }

              return 0;

            }
          )
        );


      ryanBirdieBonus +=
        bonus;


    } else if (
      claytonBest <
      ryanBest
    ) {

      claytonHolePoints++;


      if (hole <= 9) {

        frontClaytonHoles++;

      } else {

        backClaytonHoles++;

      }


      const bonus =
        Math.max(
          ...claytonScores.map(
            score => {

              if (
                score.gross <=
                course.pars[holeIndex] - 2
              ) {

                return 2;

              }

              if (
                score.gross ===
                course.pars[holeIndex] - 1
              ) {

                return 1;

              }

              return 0;

            }
          )
        );


      claytonBirdieBonus +=
        bonus;

    }

  }


  /*
    POINTS
  */

  let ryanPoints = 0;

  let claytonPoints = 0;


  let frontResult =
    "IN PROGRESS";


  if (
    completedHoles >= 9
  ) {

    if (
      frontRyanHoles >
      frontClaytonHoles
    ) {

      frontResult =
        "RYAN WINS FRONT";

      ryanPoints += 3;

    } else if (
      frontClaytonHoles >
      frontRyanHoles
    ) {

      frontResult =
        "CLAYTON WINS FRONT";

      claytonPoints += 3;

    } else {

      frontResult =
        "FRONT TIED";

    }

  }


  let backResult =
    "IN PROGRESS";


  if (
    completedHoles === 18
  ) {

    if (
      backRyanHoles >
      backClaytonHoles
    ) {

      backResult =
        "RYAN WINS BACK";

      ryanPoints += 3;

    } else if (
      backClaytonHoles >
      backRyanHoles
    ) {

      backResult =
        "CLAYTON WINS BACK";

      claytonPoints += 3;

    } else {

      backResult =
        "BACK TIED";

    }

  }


  /*
    18-HOLE STROKE PLAY
  */

  const ryan18 =
    ryanFrontTotal +
    ryanBackTotal;


  const clayton18 =
    claytonFrontTotal +
    claytonBackTotal;


  let strokeResult =
    "IN PROGRESS";


  if (
    completedHoles === 18
  ) {

    if (
      ryan18 <
      clayton18
    ) {

      strokeResult =
        "RYAN WINS 18";

      ryanPoints += 5;

    } else if (
      clayton18 <
      ryan18
    ) {

      strokeResult =
        "CLAYTON WINS 18";

      claytonPoints += 5;

    } else {

      strokeResult =
        "18 TIED";

    }

  }


  /*
    INDIVIDUAL HOLE POINTS
  */

  ryanPoints +=
    ryanHolePoints;


  claytonPoints +=
    claytonHolePoints;


  /*
    BIRDIE / EAGLE BONUS
  */

  ryanPoints +=
    ryanBirdieBonus;


  claytonPoints +=
    claytonBirdieBonus;


  /*
    ROUND 5 = 1.5X EVERYTHING
  */

  if (
    currentRound === 5
  ) {

    ryanPoints *= 1.5;

    claytonPoints *= 1.5;

  }


  const frontElement =
    document.getElementById(
      `front-result-${matchNumber}`
    );


  const backElement =
    document.getElementById(
      `back-result-${matchNumber}`
    );


  const strokeElement =
    document.getElementById(
      `stroke-result-${matchNumber}`
    );


  const bonusElement =
    document.getElementById(
      `bonus-result-${matchNumber}`
    );


  const pointsElement =
    document.getElementById(
      `points-result-${matchNumber}`
    );


  if (frontElement) {

    frontElement.textContent =
      `${frontResult} • ${frontRyanHoles}-${frontClaytonHoles}`;

  }


  if (backElement) {

    backElement.textContent =
      `${backResult} • ${backRyanHoles}-${backClaytonHoles}`;

  }


  if (strokeElement) {

    strokeElement.textContent =
      completedHoles === 18
        ? `${strokeResult} • ${ryan18}-${clayton18}`
        : "IN PROGRESS";

  }


  if (bonusElement) {

    bonusElement.textContent =
      `RYAN +${ryanBirdieBonus} • CLAYTON +${claytonBirdieBonus}`;

  }


  if (pointsElement) {

    pointsElement.textContent =
      `RYAN ${ryanPoints} • CLAYTON ${claytonPoints}`;

  }

}


/* =====================================================
   DELETE ONE SCORE
   ===================================================== */

async function deleteScoreAutomatically(
  roundNumber,
  matchNumber,
  playerName,
  holeNumber
) {

  const status =
    document.getElementById(
      "autosave-status"
    );


  status.className =
    "autosave-status saving";


  status.textContent =
    "Clearing score...";


  try {

    const {
      error
    } = await supabaseClient
      .from("scores")
      .delete()
      .eq(
        "round_number",
        Number(roundNumber)
      )
      .eq(
        "match_number",
        Number(matchNumber)
      )
      .eq(
        "player_name",
        playerName
      )
      .eq(
        "hole_number",
        Number(holeNumber)
      );


    if (error) {
      throw error;
    }


    status.className =
      "autosave-status saved";


    status.textContent =
      "Score cleared ✓";


  } catch (error) {

    console.error(
      "DELETE ERROR:",
      error
    );


    status.className =
      "autosave-status error";


    status.textContent =
      "CLEAR ERROR: " +
      error.message;

  }

}


/* =====================================================
   CLEAR MATCH
   ===================================================== */

async function clearMatchScores(
  matchNumber
) {

  const numericMatch =
    Number(matchNumber);


  if (
    isScorecardLocked(
      numericMatch
    )
  ) {

    showStatus(
      "Match is certified and locked. Uncheck both certifications first.",
      "error"
    );

    return;
  }


  if (
    !window.confirm(
      `Clear ALL scores for Match ${numericMatch} in Round ${currentRound}?`
    )
  ) {

    return;

  }


  const status =
    document.getElementById(
      "autosave-status"
    );


  status.className =
    "autosave-status saving";


  status.textContent =
    "Clearing match...";


  try {

    const {
      error
    } = await supabaseClient
      .from("scores")
      .delete()
      .eq(
        "round_number",
        Number(currentRound)
      )
      .eq(
        "match_number",
        numericMatch
      );


    if (error) {
      throw error;
    }


    const prefix =
      `${currentRound}_${numericMatch}_`;


    Object.keys(scores)
      .forEach(
        key => {

          if (
            key.startsWith(prefix)
          ) {

            delete scores[key];

          }

        }
      );


    renderScorecards();


    status.className =
      "autosave-status saved";


    status.textContent =
      `Match ${numericMatch} scores cleared ✓`;


  } catch (error) {

    console.error(
      "CLEAR MATCH ERROR:",
      error
    );


    status.className =
      "autosave-status error";


    status.textContent =
      "CLEAR ERROR: " +
      error.message;

  }

}


/* =====================================================
   SAVE SCORE
   ===================================================== */

async function saveScoreAutomatically(
  roundNumber,
  matchNumber,
  playerName,
  holeNumber,
  grossScore
) {

  const status =
    document.getElementById(
      "autosave-status"
    );


  status.className =
    "autosave-status saving";


  status.textContent =
    "Saving...";


  try {

    const {
      error
    } = await supabaseClient
      .from("scores")
      .upsert({

        round_number:
          Number(roundNumber),

        match_number:
          Number(matchNumber),

        player_name:
          playerName,

        hole_number:
          Number(holeNumber),

        gross_score:
          Number(grossScore)

      }, {

        onConflict:
          "round_number,match_number,player_name,hole_number"

      });


    if (error) {
      throw error;
    }


    status.className =
      "autosave-status saved";


    status.textContent =
      "Score saved ✓";


    setTimeout(
      () => {

        if (
          status.textContent ===
          "Score saved ✓"
        ) {

          status.textContent =
            "";

          status.className =
            "autosave-status";

        }

      },
      1200
    );


  } catch (error) {

    console.error(
      "SAVE ERROR:",
      error
    );


    status.className =
      "autosave-status error";


    status.textContent =
      "SAVE ERROR: " +
      error.message;

  }

}


/* =====================================================
   ROUND CHANGE
   ===================================================== */

async function setRound(
  roundNumber
) {

  currentRound =
    Number(roundNumber);


  document
    .querySelectorAll(
      ".round-btn"
    )
    .forEach(
      (button,index) => {

        button.classList.toggle(
          "active",
          index ===
          currentRound - 1
        );

      }
    );


  showStatus(
    `Loading Round ${currentRound}...`,
    "loading"
  );


  await loadPairings();

  await loadScores();

  await loadCertifications();

  renderScorecards();

  clearStatus();

}


/* =====================================================
   REALTIME
   ===================================================== */

function startRealtime() {

  if (realtimeChannel) {

    supabaseClient
      .removeChannel(
        realtimeChannel
      );

  }


  realtimeChannel =
    supabaseClient

      .channel(
        "scottsdale26-live-scorecard"
      )


      /*
        SCORES

        This is the important addition.

        INSERT:
        Someone enters a score.

        UPDATE:
        Someone changes a score.

        DELETE:
        Someone clears a score.

        Every connected device receives
        the change.
      */

      .on(

        "postgres_changes",

        {
          event: "*",
          schema: "public",
          table: "scores"
        },

        async payload => {

          console.log(
            "LIVE SCORE UPDATE:",
            payload
          );


          /*
            Only reload if the changed
            score belongs to the round
            currently being viewed.
          */

          const changedRound =
            Number(
              payload.new?.round_number ??
              payload.old?.round_number
            );


          if (
            changedRound !==
            Number(currentRound)
          ) {

            return;

          }


          await loadScores();

          renderScorecards();

        }

      )


      /*
        PAIRINGS
      */

      .on(

        "postgres_changes",

        {
          event: "*",
          schema: "public",
          table: "pairings"
        },

        async () => {

          await loadPairings();

          renderScorecards();

        }

      )


      /*
        PAIRING PLAYERS
      */

      .on(

        "postgres_changes",

        {
          event: "*",
          schema: "public",
          table: "pairing_players"
        },

        async () => {

          await loadPairings();

          renderScorecards();

        }

      )


      /*
        CERTIFICATIONS
      */

      .on(

        "postgres_changes",

        {
          event: "*",
          schema: "public",
          table: "scorecard_certifications"
        },

        async payload => {

          const changedRound =
            Number(
              payload.new?.round_number ??
              payload.old?.round_number
            );


          if (
            changedRound !==
            Number(currentRound)
          ) {

            return;

          }


          await loadCertifications();

          renderScorecards();

        }

      );


  realtimeChannel.subscribe(
    status => {

      console.log(
        "SCOTTSDALE REALTIME:",
        status
      );

    }
  );

}


/* =====================================================
   START
   ===================================================== */

async function startApp() {

  const connected =
    await testDatabase();


  if (!connected) {
    return;
  }


  await loadPairings();

  await loadScores();

  await loadCertifications();


  renderScorecards();


  startRealtime();

}


startApp();

</script>

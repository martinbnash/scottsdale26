/* =========================================================

const players = {

const dinosaurMountain = {

};


/* =========================================================

let currentRound = 4;

let pairings = {
  1:[],
  2:[],
  3:[],

};

let scores = {};

let certifications = {};

let certificationTableAvailable = false;

let realtimeChannel = null;

/* =========================================================
   COURSE
   ========================================================= */

function getCourse(round){

  if(round === 1){
    return dinosaurMountain;
  }

  if(round === 2 || round === 5){
    return weKoPaCholla;
  }

  return weKoPaSaguaro;

}


/* =========================================================
   SCORE KEY
   ========================================================= */

function getScoreKey(
  round,
  match,
  player,
  hole
){

  return `${round}_${match}_${player}_${hole}`;

}


/* =========================================================
   CERT KEY
   ========================================================= */

function certKey(
  round,
  match
){

  return `${round}_${match}`;

}


/* =========================================================
   STATUS
   ========================================================= */

function showStatus(
  message,
  type="loading"
){

  const element =
    document.getElementById("status");

  element.className =

  element.textContent =

/* =========================================================
   SYNC INDICATOR
   ========================================================= */

function setSyncIndicator(
  online
){

  const element =
    document.getElementById(
      "syncIndicator"
    );

  if(!element) return;

  element.textContent =
    online
      ? "● LIVE SYNC"

}


/* =========================================================
   TEE
   ========================================================= */

function teeForPlayer(
  player,
  course
){

  if(course === dinosaurMountain){

    if(
      player === "Ryan D" ||
      player === "Brad"
    ){

      return "blue";

    }

    return "black";

  }

  return "purple";

}


function getTeeLabel(
  player,
  course
){

  if(course === dinosaurMountain){

    return teeForPlayer(
      player,
      course
    ) === "blue"
      ? "BLUE TEES"
      : "BLACK TEES";

  }

  return "PURPLE TEES";

}


/* =========================================================
   COURSE HANDICAP
   ========================================================= */

function getPlayerCourseHandicap(
  playerName,
  course
){

  const handicapIndex =
    Number(
      players[playerName]?.handicap || 0
    );

  let courseRating;
  let slopeRating;


  if(course === dinosaurMountain){

    if(
      teeForPlayer(
        playerName,
        course
      ) === "blue"
    ){

      courseRating = 67.5;
      slopeRating = 125;

    }else{

      courseRating = 70.1;
      slopeRating = 137;

    }

  }else if(
    course === weKoPaCholla
  ){

    courseRating = 71.7;
    slopeRating = 135;

  }else{

    courseRating = 70.2;
    slopeRating = 132;

  }


  const courseHandicap =
    handicapIndex *
      (slopeRating / 113) +
    (courseRating - course.par);


  return Math.round(
    courseHandicap * 0.85
  );

}


/* =========================================================
   MATCH HANDICAPS
   ========================================================= */

function getMatchPlayingHandicaps(
  match,
  course
){

  const names = [
    ...match.ryan,
    ...match.clayton
  ];

  const raw =
    names.map(
      player => ({
        player,
        handicap:
          getPlayerCourseHandicap(
            player,
            course
          )
      })
    );


  const lowest =
    Math.min(
      ...raw.map(
        x => x.handicap
      )
    );


  return Object.fromEntries(
    raw.map(
      x => [
        x.player,
        Math.max(
          0,
          x.handicap - lowest
        )
      ]
    )
  );

}


/* =========================================================
   STROKES
   ========================================================= */

function strokesOnHole(
  player,
  holeIndex,
  course,
  matchHandicaps
){

  const playingHandicap =
    Number(
      matchHandicaps?.[player] ??
      getPlayerCourseHandicap(
        player,
        course
      )
    );

  const holeRank =
    Number(
      course.handicap[holeIndex]
    );

  let strokes = 0;


  if(
    playingHandicap >= holeRank
  ){

    strokes++;

  }


  if(
    playingHandicap > 18 &&
    playingHandicap - 18 >= holeRank
  ){

    strokes++;

  }


  return strokes;

}


/* =========================================================
   NET
   ========================================================= */

function netScore(
  player,
  gross,
  holeIndex,
  course,
  matchHandicaps
){

  return Number(gross) -
    strokesOnHole(
      player,
      holeIndex,
      course,
      matchHandicaps
    );

}


/* =========================================================
   LOCK
   ========================================================= */

function isLocked(
  matchNumber
){

  const certification =
    certifications[
      certKey(
        currentRound,
        matchNumber
      )
    ];

  return Boolean(
    certification?.marker_certified &&
    certification?.opponent_certified
  );

}


/* =========================================================
   LOAD PAIRINGS
   ========================================================= */

async function loadPairings(){

  const {
    data:pairingRows,
    error:pairingError
  } =
    await supabaseClient
      .from("pairings")
      .select("*")
      .eq(
        "round_number",
        currentRound
      )
      .order(
        "pairing_number",
        {ascending:true}
      );


  if(pairingError){
    throw pairingError;
  }


  const {
    data:playerRows,
    error:playerError
  } =
    await supabaseClient
      .from("pairing_players")
      .select("*");


  if(playerError){
    throw playerError;
  }


  const loaded = [];


  (pairingRows || []).forEach(
    pairing => {

      const rows =
        (playerRows || [])
          .filter(
            row =>
              String(row.pairing_id) ===
              String(pairing.id)
          );


      const ryan =
        rows
          .filter(
            row =>
              String(row.side).toUpperCase()
              === "B"
          )
          .map(
            row => row.player_name
          )
          .filter(Boolean);


      const clayton =
        rows
          .filter(
            row =>
              String(row.side).toUpperCase()
              === "A"
          )
          .map(
            row => row.player_name
          )
          .filter(Boolean);


      if(
        ryan.length === 2 &&
        clayton.length === 2
      ){

        loaded.push({

          pairingNumber:
            Number(
              pairing.pairing_number
            ),

          ryan,

          clayton

        });

      }

    }
  );


  pairings[currentRound] =
    loaded.sort(
      (a,b) =>
        a.pairingNumber -
        b.pairingNumber
    );

}


/* =========================================================
   LOAD SCORES
   ========================================================= */

async function loadScores(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("scores")
      .select("*")
      .eq(
        "round_number",
        currentRound
      );


  if(error){
    throw error;
  }


  const newScores = {};


  (data || []).forEach(
    row => {

      newScores[
        getScoreKey(
          row.round_number,
          row.match_number,
          row.player_name,
          row.hole_number
        )
      ] =
        row.gross_score;

    }
  );


  scores = newScores;

}


/* =========================================================
   LOAD CERTIFICATIONS
   ========================================================= */

async function loadCertifications(){

  certifications = {};

  certificationTableAvailable = false;


  const {
    data,
    error
  } =
    await supabaseClient
      .from(
        "scorecard_certifications"
      )
      .select("*")
      .eq(
        "round_number",
        currentRound
      );


  if(error){

    console.warn(
      "Certification table:",
      error.message
    );

    return;

  }


  certificationTableAvailable = true;


  (data || []).forEach(
    row => {

      certifications[
        certKey(
          row.round_number,
          row.match_number
        )
      ] = {

        marker_certified:
          Boolean(
            row.marker_certified
          ),

        opponent_certified:
          Boolean(
            row.opponent_certified
          )

      };

    }
  );

}


/* =========================================================
   SAVE SCORE
   IMPORTANT:
   UPDATE FIRST, INSERT IF NOT FOUND.
   ========================================================= */

async function saveScore(
  round,
  match,
  player,
  hole,
  gross
){

  const status =
    document.getElementById(
      "autosave-status"
    );

  status.className =
    "autosave-status saving";

  status.textContent =
    "Saving to Scottsdale 26...";


  try{

    const payload = {

      round_number:Number(round),
      match_number:Number(match),
      player_name:player,
      hole_number:Number(hole),
      gross_score:Number(gross)

    };


    /*
       FIRST TRY UPDATE.

       This avoids relying on a database
       UNIQUE constraint for upsert.
    */

    const {
      data:updateData,
      error:updateError
    } =
      await supabaseClient
        .from("scores")
        .update({
          gross_score:Number(gross)
        })
        .eq(
          "round_number",
          Number(round)
        )
        .eq(
          "match_number",
          Number(match)
        )
        .eq(
          "player_name",
          player
        )
        .eq(
          "hole_number",
          Number(hole)
        )
        .select();


    if(updateError){
      throw updateError;
    }


    /*
       IF NO EXISTING ROW,
       INSERT IT.
    */

    if(
      !updateData ||
      updateData.length === 0
    ){

      const {
        error:insertError
      } =
        await supabaseClient
          .from("scores")
          .insert(payload);


      if(insertError){
        throw insertError;
      }

    }


    setSyncIndicator(true);

    status.className =
      "autosave-status saved";

    status.textContent =
      "Saved to everyone ✓";


    setTimeout(
      () => {

        if(
          status.textContent ===
          "Saved to everyone ✓"
        ){

          status.textContent = "";

          status.className =
            "autosave-status";

        }

      },
      1500
    );


  }catch(error){

    console.error(
      "SAVE SCORE ERROR:",
      error
    );

    setSyncIndicator(false);

    status.className =
      "autosave-status error";

    status.textContent =
      "SAVE ERROR: " +
      error.message;

    showStatus(
      "Score could not be saved: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   DELETE SCORE
   ========================================================= */

async function deleteScore(
  round,
  match,
  player,
  hole
){

  const status =
    document.getElementById(
      "autosave-status"
    );

  status.className =
    "autosave-status saving";

  status.textContent =
    "Clearing score...";


  try{

    const {
      error
    } =
      await supabaseClient
        .from("scores")
        .delete()
        .eq(
          "round_number",
          Number(round)
        )
        .eq(
          "match_number",
          Number(match)
        )
        .eq(
          "player_name",
          player
        )
        .eq(
          "hole_number",
          Number(hole)
        );


    if(error){
      throw error;
    }


    status.className =
      "autosave-status saved";

    status.textContent =
      "Score cleared ✓";


    setTimeout(
      () => {

        if(
          status.textContent ===
          "Score cleared ✓"
        ){

          status.textContent = "";

          status.className =
            "autosave-status";

        }

      },
      1000
    );


  }catch(error){

    console.error(
      "DELETE SCORE ERROR:",
      error
    );

    status.className =
      "autosave-status error";

    status.textContent =
      "CLEAR ERROR: " +
      error.message;

  }

}


/* =========================================================
   UPDATE SCORE
   ========================================================= */

async function updateScore(
  player,
  matchNumber,
  hole,
  value
){

  if(
    isLocked(matchNumber)
  ){

    showStatus(
      "This scorecard is certified and locked.",
      "error"
    );

    await refreshCurrentRound();

    return;

  }


  const key =
    getScoreKey(
      currentRound,
      matchNumber,
      player,
      hole
    );


  if(value === ""){

    delete scores[key];

    await deleteScore(
      currentRound,
      matchNumber,
      player,
      hole
    );

  }else{

    const numericValue =
      Number(value);


    if(
      !Number.isFinite(
        numericValue
      )
    ){

      return;

    }


    scores[key] =
      numericValue;


    /*
       Calculate immediately on this device.
    */

    updatePlayerTotals(
      matchNumber
    );

    calculateMatch(
      matchNumber
    );


    /*
       Then save to Supabase.
    */

    await saveScore(
      currentRound,
      matchNumber,
      player,
      hole,
      numericValue
    );

  }

}


/* =========================================================
   PLAYER TOTALS
   ========================================================= */

function updatePlayerTotals(
  matchNumber
){

  const match =
    (
      pairings[currentRound] || []
    ).find(
      m =>
        Number(m.pairingNumber) ===
        Number(matchNumber)
    );


  if(!match) return;


  [
    ...match.ryan,
    ...match.clayton
  ].forEach(
    player => {

      let front = 0;
      let back = 0;

      let frontComplete = true;
      let backComplete = true;


      for(
        let hole=1;
        hole<=18;
        hole++
      ){

        const value =
          scores[
            getScoreKey(
              currentRound,
              matchNumber,
              player,
              hole
            )
          ];


        if(
          value === undefined ||
          value === null ||
          value === ""
        ){

          if(hole<=9){
            frontComplete=false;
          }else{
            backComplete=false;
          }

          continue;

        }


        if(hole<=9){
          front += Number(value);
        }else{
          back += Number(value);
        }

      }


      const safePlayer =
        player.replace(
          /[^a-zA-Z0-9_-]/g,
          "_"
        );


      const frontElement =
        document.getElementById(
          `front-${currentRound}-${matchNumber}-${safePlayer}`
        );

      const backElement =
        document.getElementById(
          `back-${currentRound}-${matchNumber}-${safePlayer}`
        );

      const totalElement =
        document.getElementById(
          `total-${currentRound}-${matchNumber}-${safePlayer}`
        );


      if(frontElement){
        frontElement.textContent =
          frontComplete ? front : "-";
      }

      if(backElement){
        backElement.textContent =
          backComplete ? back : "-";
      }

      if(totalElement){
        totalElement.textContent =
          frontComplete &&
          backComplete
            ? front + back
            : "-";
      }

    }
  );

}


/* =========================================================
   HOLE INDICATORS
   ========================================================= */

function updateHoleIndicators(
  matchNumber,
  matchHandicaps
){

  const match =
    (
      pairings[currentRound] || []
    ).find(
      m =>
        Number(m.pairingNumber) ===
        Number(matchNumber)
    );


  if(!match) return;


  const course =
    getCourse(currentRound);


  for(
    let holeIndex=0;
    holeIndex<18;
    holeIndex++
  ){

    const hole =
      holeIndex+1;


    const makeScores =
      playersList =>
        playersList.map(
          player => {

            const value =
              scores[
                getScoreKey(
                  currentRound,
                  matchNumber,
                  player,
                  hole
                )
              ];


            if(
              value === undefined ||
              value === null ||
              value === ""
            ){

              return null;

            }


            return {

              player,

              gross:Number(value),

              net:
                netScore(
                  player,
                  value,
                  holeIndex,
                  course,
                  matchHandicaps
                )

            };

          }
        );


    const ryanScores =
      makeScores(match.ryan);

    const claytonScores =
      makeScores(match.clayton);


    /*
       BIRDIE CIRCLE
    */

    [
      ...ryanScores,
      ...claytonScores
    ].forEach(
      score => {

        if(!score) return;


        const input =
          document.querySelector(
            `input[data-player="${CSS.escape(score.player)}"][data-hole="${hole}"][data-match="${matchNumber}"]`
          );


        if(input){

          input.classList.toggle(
            "gross-birdie",
            score.gross ===
              course.pars[holeIndex]-1
          );

        }

      }
    );


    /*
       RESET TROPHIES
    */

    document
      .querySelectorAll(
        `.net-score-display[data-match="${matchNumber}"][data-hole="${hole}"]`
      )
      .forEach(
        element => {

          element.classList.remove(
            "hole-winner"
          );

          element.innerHTML =
            element.dataset.baseNet || "";

        }
      );


    /*
       WAIT UNTIL ALL FOUR SCORES
       ARE ENTERED.
    */

    if(
      ryanScores.includes(null) ||
      claytonScores.includes(null)
    ){

      continue;

    }


    const ryanBest =
      Math.min(
        ...ryanScores.map(
          x=>x.net
        )
      );


    const claytonBest =
      Math.min(
        ...claytonScores.map(
          x=>x.net
        )
      );


    let winningScores = [];


    if(ryanBest < claytonBest){

      winningScores =
        ryanScores.filter(
          x=>x.net===ryanBest
        );

    }else if(
      claytonBest < ryanBest
    ){

      winningScores =
        claytonScores.filter(
          x=>x.net===claytonBest
        );

    }


    winningScores.forEach(
      score => {

        const display =
          document.querySelector(
            `.net-score-display[data-player="${CSS.escape(score.player)}"][data-hole="${hole}"][data-match="${matchNumber}"]`
          );


        if(display){

          display.classList.add(
            "hole-winner"
          );

          display.innerHTML =
            `${display.dataset.baseNet} <span class="net-trophy">🏆</span>`;

        }

      }
    );

  }

}


/* =========================================================
   FORMAT
   ========================================================= */

function formatPoints(value){

  return Number.isInteger(value)
    ? String(value)
    : Number(value).toFixed(1);

}


/* =========================================================
   MATCH CALCULATION
   ========================================================= */

function calculateMatch(
  matchNumber
){

  const match =
    (
      pairings[currentRound] || []
    ).find(
      m =>
        Number(m.pairingNumber) ===
        Number(matchNumber)
    );


  if(!match) return;


  const course =
    getCourse(currentRound);


  const matchHandicaps =
    getMatchPlayingHandicaps(
      match,
      course
    );


  let ryanHolePoints=0;
  let claytonHolePoints=0;

  let ryanBonus=0;
  let claytonBonus=0;

  let frontRyanHoles=0;
  let frontClaytonHoles=0;

  let backRyanHoles=0;
  let backClaytonHoles=0;

  let ryan18=0;
  let clayton18=0;

  let frontComplete=true;
  let backComplete=true;
  let allComplete=true;


  for(
    let holeIndex=0;
    holeIndex<18;
    holeIndex++
  ){

    const hole=holeIndex+1;


    const makeScores =
      playersList =>
        playersList.map(
          player => {

            const value =
              scores[
                getScoreKey(
                  currentRound,
                  matchNumber,
                  player,
                  hole
                )
              ];


            if(
              value === undefined ||
              value === null ||
              value === ""
            ){

              return null;

            }


            return {

              player,

              gross:Number(value),

              net:
                netScore(
                  player,
                  value,
                  holeIndex,
                  course,
                  matchHandicaps
                )

            };

          }
        );


    const ryanScores =
      makeScores(match.ryan);

    const claytonScores =
      makeScores(match.clayton);


    if(
      ryanScores.includes(null) ||
      claytonScores.includes(null)
    ){

      allComplete=false;

      if(holeIndex<9){
        frontComplete=false;
      }else{
        backComplete=false;
      }

      continue;

    }


    const ryanBest =
      Math.min(
        ...ryanScores.map(
          x=>x.net
        )
      );


    const claytonBest =
      Math.min(
        ...claytonScores.map(
          x=>x.net
        )
      );


    ryan18 += ryanBest;
    clayton18 += claytonBest;


    /*
       RYAN HOLE
    */

    if(ryanBest < claytonBest){

      ryanHolePoints++;


      if(holeIndex<9){
        frontRyanHoles++;
      }else{
        backRyanHoles++;
      }


      /*
         ONE BONUS MAXIMUM.
         If BOTH teams have a birdie,
         neither gets a bonus because
         the hole must be won.
      */

      const ryanBonusThisHole =
        Math.max(
          ...ryanScores.map(
            score => {

              const par =
                course.pars[holeIndex];

              if(
                score.gross <= par-2
              ){
                return 2;
              }

              if(
                score.gross === par-1
              ){
                return 1;
              }

              return 0;

            }
          )
        );


      ryanBonus +=
        ryanBonusThisHole;

    }


    /*
       CLAYTON HOLE
    */

    else if(
      claytonBest < ryanBest
    ){

      claytonHolePoints++;


      if(holeIndex<9){
        frontClaytonHoles++;
      }else{
        backClaytonHoles++;
      }


      const claytonBonusThisHole =
        Math.max(
          ...claytonScores.map(
            score => {

              const par =
                course.pars[holeIndex];

              if(
                score.gross <= par-2
              ){
                return 2;
              }

              if(
                score.gross === par-1
              ){
                return 1;
              }

              return 0;

            }
          )
        );


      claytonBonus +=
        claytonBonusThisHole;

    }

  }


  let ryanPoints =
    ryanHolePoints +
    ryanBonus;

  let claytonPoints =
    claytonHolePoints +
    claytonBonus;


  /*
     FRONT
  */

  let frontText;


  if(!frontComplete){

    frontText =
      `IN PROGRESS • ${frontRyanHoles}-${frontClaytonHoles}`;

  }else if(
    frontRyanHoles >
    frontClaytonHoles
  ){

    ryanPoints+=3;

    frontText =
      `RYAN WINS FRONT • ${frontRyanHoles}-${frontClaytonHoles} • +3`;

  }else if(
    frontClaytonHoles >
    frontRyanHoles
  ){

    claytonPoints+=3;

    frontText =
      `CLAYTON WINS FRONT • ${frontRyanHoles}-${frontClaytonHoles} • +3`;

  }else{

    ryanPoints+=1.5;
    claytonPoints+=1.5;

    frontText =
      `FRONT TIED • ${frontRyanHoles}-${frontClaytonHoles} • +1.5 EACH`;

  }


  /*
     BACK
  */

  let backText;


  if(!backComplete){

    backText =
      `IN PROGRESS • ${backRyanHoles}-${backClaytonHoles}`;

  }else if(
    backRyanHoles >
    backClaytonHoles
  ){

    ryanPoints+=3;

    backText =
      `RYAN WINS BACK • ${backRyanHoles}-${backClaytonHoles} • +3`;

  }else if(
    backClaytonHoles >
    backRyanHoles
  ){

    claytonPoints+=3;

    backText =
      `CLAYTON WINS BACK • ${backRyanHoles}-${backClaytonHoles} • +3`;

  }else{

    ryanPoints+=1.5;
    claytonPoints+=1.5;

    backText =
      `BACK TIED • ${backRyanHoles}-${backClaytonHoles} • +1.5 EACH`;

  }


  /*
     18 HOLE
  */

  let strokeText;


  if(!allComplete){

    strokeText =
      `IN PROGRESS • ${ryan18 || "-"}-${clayton18 || "-"}`;

  }else if(
    ryan18 < clayton18
  ){

    ryanPoints+=5;

    strokeText =
      `RYAN WINS 18 • ${ryan18}-${clayton18} • +5`;

  }else if(
    clayton18 < ryan18
  ){

    claytonPoints+=5;

    strokeText =
      `CLAYTON WINS 18 • ${ryan18}-${clayton18} • +5`;

  }else{

    ryanPoints+=2.5;
    claytonPoints+=2.5;

    strokeText =
      `18 TIED • ${ryan18}-${clayton18} • +2.5 EACH`;

  }


  /*
     ROUND 5 = 1.5X
  */

  if(currentRound===5){

    ryanPoints*=1.5;
    claytonPoints*=1.5;

  }


  function setResult(
    id,
    value
  ){

    const element =
      document.getElementById(id);

    if(element){
      element.textContent=value;
    }

  }


  setResult(
    `front-result-${matchNumber}`,
    frontText
  );

  setResult(
    `back-result-${matchNumber}`,
    backText
  );

  setResult(
    `stroke-result-${matchNumber}`,
    strokeText
  );

  setResult(
    `bonus-result-${matchNumber}`,
    `RYAN +${ryanBonus} • CLAYTON +${claytonBonus}`
  );

  setResult(
    `points-result-${matchNumber}`,
    `RYAN ${formatPoints(ryanPoints)} • CLAYTON ${formatPoints(claytonPoints)}`
  );


  updateHoleIndicators(
    matchNumber,
    matchHandicaps
  );

}


/* =========================================================
   CERTIFICATION STATE
   ========================================================= */

function applyCertificationState(
  element,
  matchNumber
){

  const locked =
    isLocked(matchNumber);


  element.classList.toggle(
    "scorecard-locked",
    locked
  );


  element
    .querySelectorAll(
      "input.score-input"
    )
    .forEach(
      input => {
        input.disabled=locked;
      }
    );


  const certification =
    certifications[
      certKey(
        currentRound,
        matchNumber
      )
    ] || {};


  const marker =
    element.querySelector(
      '[data-cert-type="marker"]'
    );

  const opponent =
    element.querySelector(
      '[data-cert-type="opponent"]'
    );


  if(marker){
    marker.checked =
      Boolean(
        certification.marker_certified
      );
  }

  if(opponent){
    opponent.checked =
      Boolean(
        certification.opponent_certified
      );
  }


  const status =
    element.querySelector(
      ".certification-status"
    );


  if(status){

    status.textContent =
      locked
        ? "✓ Both certifications complete — scorecard is LOCKED"
        : "Both certifications are required to lock this scorecard.";

    status.classList.toggle(
      "locked",
      locked
    );

  }

}

              <td
                id="total-${currentRound}-${matchNumber}-${safePlayer}"
                class="total-cell"
              >-</td>

            </tr>

          `;

        }
      );


      html += `

            </tbody>

          </table>

        </div>


        <div class="match-results">

          <div class="result-box">

            <div class="result-label">
              FRONT 9
            </div>

            <div
              class="result-value"
              id="front-result-${matchNumber}"
            >-</div>

          </div>


          <div class="result-box">

            <div class="result-label">
              BACK 9
            </div>

            <div
              class="result-value"
              id="back-result-${matchNumber}"
            >-</div>

          </div>


          <div class="result-box">

            <div class="result-label">
              18-HOLE STROKE
            </div>

            <div
              class="result-value"
              id="stroke-result-${matchNumber}"
            >-</div>

          </div>


          <div class="result-box">

            <div class="result-label">
              BIRDIE / EAGLE BONUS
            </div>

            <div
              class="result-value"
              id="bonus-result-${matchNumber}"
            >
              RYAN +0 • CLAYTON +0
            </div>

          </div>


          <div class="result-box">

            <div class="result-label">
              MATCH POINTS
            </div>

            <div
              class="result-value"
              id="points-result-${matchNumber}"
            >-</div>

          </div>

        </div>


        <div class="certification-panel">

          <label class="certification-label">

            <input
              type="checkbox"
              data-cert-type="marker"
            >

            Certified by marker

          </label>


          <label class="certification-label">

            <input
              type="checkbox"
              data-cert-type="opponent"
            >

            Certified by opponent

          </label>


          <div class="certification-status">
            Both certifications are required to lock this scorecard.
          </div>

        </div>

      `;


      div.innerHTML=html;

      container.appendChild(div);


      /*
         EVENT LISTENERS
      */

      div
        .querySelectorAll(
          "input.score-input"
        )
        .forEach(
          input => {

            input.addEventListener(
              "change",
              async function(){

                await updateScore(
                  this.dataset.player,
                  Number(
                    this.dataset.match
                  ),
                  Number(
                    this.dataset.hole
                  ),
                  this.value
                );

              }
            );

          }
        );


      const marker =
        div.querySelector(
          '[data-cert-type="marker"]'
        );


      const opponent =
        div.querySelector(
          '[data-cert-type="opponent"]'
        );


      marker.addEventListener(
        "change",
        () =>
          updateCertification(
            matchNumber,
            "marker_certified",
            marker.checked
          )
      );


      opponent.addEventListener(
        "change",
        () =>
          updateCertification(
            matchNumber,
            "opponent_certified",
            opponent.checked
          )
      );


      updatePlayerTotals(
        matchNumber
      );

      calculateMatch(
        matchNumber
      );

      applyCertificationState(
        div,
        matchNumber
      );

    }
  );

}


/* =========================================================
   CLEAR MATCH
   ========================================================= */

async function clearMatchScores(
  match
){

  if(
    isLocked(match)
  ){

    showStatus(
      `Match ${match} is certified and locked. Uncheck both certifications first.`,
      "error"
    );

    return;

  }


  if(
    !confirm(
      `Clear ALL scores for Match ${match} in Round ${currentRound}?`
    )
  ){
    return;
  }


  try{

    const {
      error
    } =
      await supabaseClient
        .from("scores")
        .delete()
        .eq(
          "round_number",
          Number(currentRound)
        )
        .eq(
          "match_number",
          Number(match)
        );


    if(error){
      throw error;
    }


    Object.keys(scores).forEach(
      key => {

        if(
          key.startsWith(
            `${currentRound}_${match}_`
          )
        ){

          delete scores[key];

        }

      }
    );


    renderScorecards();

    showStatus(
      `Match ${match} scores cleared.`,
      "success"
    );


    setTimeout(
      clearStatus,
      1500
    );


  }catch(error){

    showStatus(
      "CLEAR ERROR: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   CERTIFICATION
   ========================================================= */

async function updateCertification(
  match,
  type,
  checked
){

  const key =
    certKey(
      currentRound,
      match
    );


  const certification =
    certifications[key] || {

      marker_certified:false,
      opponent_certified:false

    };


  certification[type] =
    Boolean(checked);


  certifications[key] =
    certification;


  const matchElement =
    [
      ...document.querySelectorAll(
        ".match"
      )
    ].find(
      element =>
        element.dataset.matchNumber ===
        String(match)
    );


  if(matchElement){

    applyCertificationState(
      matchElement,
      match
    );

  }


  if(!certificationTableAvailable){

    showStatus(
      "Certification table is not available.",
      "error"
    );

    return;

  }


  try{

    /*
       UPDATE FIRST.
    */

    const {
      data:updateData,
      error:updateError
    } =
      await supabaseClient
        .from(
          "scorecard_certifications"
        )
        .update({

          marker_certified:
            certification.marker_certified,

          opponent_certified:
            certification.opponent_certified,

          updated_at:
            new Date().toISOString()

        })
        .eq(
          "round_number",
          Number(currentRound)
        )
        .eq(
          "match_number",
          Number(match)
        )
        .select();


    if(updateError){
      throw updateError;
    }


    /*
       INSERT IF ROW DOESN'T EXIST.
    */

    if(
      !updateData ||
      updateData.length===0
    ){

      const {
        error:insertError
      } =
        await supabaseClient
          .from(
            "scorecard_certifications"
          )
          .insert({

            round_number:
              Number(currentRound),

            match_number:
              Number(match),

            marker_certified:
              certification.marker_certified,

            opponent_certified:
              certification.opponent_certified,

            updated_at:
              new Date().toISOString()

          });


      if(insertError){
        throw insertError;
      }

    }


  }catch(error){

    showStatus(
      "CERTIFICATION SAVE ERROR: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   REFRESH CURRENT ROUND
   ========================================================= */

async function refreshCurrentRound(){

  if(syncing) return;

  syncing=true;


  try{

    await loadPairings();

    await loadScores();

    await loadCertifications();

    renderScorecards();

    setSyncIndicator(true);

  }catch(error){

    console.error(
      "SYNC ERROR:",
      error
    );

    setSyncIndicator(false);

  }finally{

    syncing=false;

  }

}


/* =========================================================
   ROUND CHANGE
   ========================================================= */

async function setRound(
  round
){

  currentRound =
    Number(round);


  document
    .querySelectorAll(
      ".round-btn"
    )
    .forEach(
      (button,index) => {

        button.classList.toggle(
          "active",
          index === currentRound-1
        );

      }
    );


  showStatus(
    `Loading Round ${currentRound}...`,
    "loading"
  );


  try{

    await refreshCurrentRound();

    clearStatus();

  }catch(error){

    showStatus(
      "ROUND LOAD ERROR: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   REALTIME
   ========================================================= */

function startRealtime(){

  if(realtimeChannel){

    supabaseClient.removeChannel(
      realtimeChannel
    );

  }


  realtimeChannel =
    supabaseClient
      .channel(
        "scottsdale26-scorecards"
      )


      .on(
        "postgres_changes",

        {
          event:"*",
          schema:"public",
          table:"scores"
        },

        async payload => {

          console.log(
            "SCORE REALTIME:",
            payload
          );

          await refreshCurrentRound();

        }
      )


      .on(
        "postgres_changes",

        {
          event:"*",
          schema:"public",
          table:"pairings"
        },

        async payload => {

          console.log(
            "PAIRING REALTIME:",
            payload
          );

          await refreshCurrentRound();

        }
      )


      .on(
        "postgres_changes",

        {
          event:"*",
          schema:"public",
          table:"pairing_players"
        },

        async payload => {

          console.log(
            "PAIRING PLAYER REALTIME:",
            payload
          );

          await refreshCurrentRound();

        }
      )


      .on(
        "postgres_changes",

        {
          event:"*",
          schema:"public",
          table:"scorecard_certifications"
        },

        async payload => {

          console.log(
            "CERT REALTIME:",
            payload
          );

          await refreshCurrentRound();

        }
      )


      .subscribe(
        status => {

          console.log(
            "SUPABASE REALTIME STATUS:",
            status
          );

        }
      );

}


/* =========================================================
   BACKUP SYNC
   Every 3 seconds.
   This means the scorecard will still synchronize
   even if realtime events are not configured.
   ========================================================= */

function startBackupSync(){

  if(syncTimer){

    clearInterval(
      syncTimer
    );

  }


  syncTimer =
    setInterval(
      async () => {

        await refreshCurrentRound();

      },
      3000
    );

}


/* =========================================================
   START APP
   ========================================================= */

async function startApp(){

  currentRound=4;


  document
    .querySelectorAll(
      ".round-btn"
    )
    .forEach(
      (button,index) => {

        button.classList.toggle(
          "active",
          index===3
        );

      }
    );


  showStatus(
    "Loading Scottsdale 26 Round 4 scorecard...",
    "loading"
  );


  try{

    await loadPairings();

    await loadScores();

    await loadCertifications();

    renderScorecards();

    clearStatus();

    startRealtime();

    startBackupSync();

    setSyncIndicator(true);

  }catch(error){

    console.error(
      "STARTUP ERROR:",
      error
    );


    setSyncIndicator(false);


    showStatus(
      "STARTUP ERROR: " +
      error.message,
      "error"
    );

  }

}


startApp();

</script>

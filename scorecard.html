const dinosaurMountain = {

/* =========================================================

let currentRound = 4;

let pairings = {

};

let syncing = false;

let pendingSaves = 0;


/*
   Tracks score cells that are currently being edited.
   The sync process will NEVER rebuild the page while
   a user is editing a score.
*/

const editingKeys = new Set();


/*
   Prevents remote sync from overwriting a local score
   that has not finished saving yet.
*/

const pendingScoreKeys = new Set();


/* =========================================================
   COURSE
   ========================================================= */

function getCourse(round){

  if(round === 1){
    return dinosaurMountain;
  }

  if(round === 2 || round === 5){
    return weKoPaCholla;
  }

  return weKoPaSaguaro;

}


/* =========================================================
   SCORE KEY
   ========================================================= */

function getScoreKey(
  round,
  match,
  player,
  hole
){

  return `${round}_${match}_${player}_${hole}`;

}


/* =========================================================
   SAFE PLAYER ID
   ========================================================= */

function safePlayerId(player){

  return player.replace(
    /[^a-zA-Z0-9_-]/g,
    "_"
  );

}


/* =========================================================
   STATUS
   ========================================================= */

function showStatus(
  message,
  type="loading"
){

  const element =
    document.getElementById("status");

  element.className =

  element.textContent =

}


function clearStatus(){

  const element =
    document.getElementById("status");

  element.className =

/* =========================================================
   SYNC INDICATOR
   ========================================================= */

function setSyncIndicator(online){

  const element =
    document.getElementById(
      "syncIndicator"
    );

  if(!element){
    return;
  }

  element.textContent =
    online
      ? "● LIVE SYNC"
      : "● SYNC ERROR";

  element.style.color =
    online
      ? "var(--green)"
      : "var(--red)";

}


/* =========================================================
   CHECK IF USER IS ACTIVELY EDITING
   ========================================================= */

function userIsEditing(){

  const active =
    document.activeElement;

  if(
    active &&
    active.classList &&
    active.classList.contains(
      "score-input"
    )
  ){

    return true;

  }

  return editingKeys.size > 0;

}


/* =========================================================
   TEE
   ========================================================= */

function teeForPlayer(
  player,
  course
){

  if(course === dinosaurMountain){

    if(
      player === "Ryan D" ||
      player === "Brad"
    ){

      return "blue";

    }

    return "black";

  }

  return "purple";

}


function getTeeLabel(
  player,
  course
){

  if(course === dinosaurMountain){

    return teeForPlayer(
      player,
      course
    ) === "blue"
      ? "BLUE TEES"
      : "BLACK TEES";

  }

  return "PURPLE TEES";

}


/* =========================================================
   COURSE HANDICAP
   ========================================================= */

function getPlayerCourseHandicap(
  playerName,
  course
){

  const handicapIndex =
    Number(
      players[playerName]?.handicap || 0
    );

  let courseRating;
  let slopeRating;


  if(course === dinosaurMountain){

    if(
      teeForPlayer(
        playerName,
        course
      ) === "blue"
    ){

      courseRating = 67.5;
      slopeRating = 125;

    }else{

      courseRating = 70.1;
      slopeRating = 137;

    }

  }else if(
    course === weKoPaCholla
  ){

    courseRating = 71.7;
    slopeRating = 135;

  }else{

    courseRating = 70.2;
    slopeRating = 132;

  }


  const courseHandicap =
    handicapIndex *
      (slopeRating / 113) +
    (courseRating - course.par);


  /*
     Scottsdale rule:
     Apply 85% and round to nearest whole number.
  */

  return Math.round(
    courseHandicap * 0.85
  );

}


/* =========================================================
   MATCH HANDICAPS
   ========================================================= */

function getMatchPlayingHandicaps(
  match,
  course
){

  const names = [
    ...match.ryan,
    ...match.clayton
  ];

  const raw =
    names.map(
      player => ({
        player,

        handicap:
          getPlayerCourseHandicap(
            player,
            course
          )

      })
    );


  if(!raw.length){
    return {};
  }


  const lowest =
    Math.min(
      ...raw.map(
        x => x.handicap
      )
    );


  return Object.fromEntries(
    raw.map(
      x => [

        x.player,

        Math.max(
          0,
          x.handicap - lowest
        )

      ]
    )
  );

}


/* =========================================================
   STROKES
   ========================================================= */

function strokesOnHole(
  player,
  holeIndex,
  course,
  matchHandicaps
){

  const playingHandicap =
    Number(
      matchHandicaps?.[player] ??
      getPlayerCourseHandicap(
        player,
        course
      )
    );


  const holeRank =
    Number(
      course.handicap[holeIndex]
    );


  let strokes = 0;


  if(
    playingHandicap >= holeRank
  ){

    strokes++;

  }


  /*
     Second stroke on handicaps above 18.
  */

  if(
    playingHandicap > 18 &&
    playingHandicap - 18 >= holeRank
  ){

    strokes++;

  }


  /*
     Handles a third stroke for a handicap
     above 36 as well.
  */

  if(
    playingHandicap > 36 &&
    playingHandicap - 36 >= holeRank
  ){

    strokes++;

  }


  return strokes;

}


/* =========================================================
   NET SCORE
   ========================================================= */

function netScore(
  player,
  gross,
  holeIndex,
  course,
  matchHandicaps
){

  return Number(gross) -
    strokesOnHole(
      player,
      holeIndex,
      course,
      matchHandicaps
    );

}


/* =========================================================
   LOCK
   ========================================================= */

function isLocked(matchNumber){

  const certification =
    certifications[
      certKey(
        currentRound,
        matchNumber
      )
    ];

  return Boolean(
    certification?.marker_certified &&
    certification?.opponent_certified
  );

}


/* =========================================================
   LOAD PAIRINGS
   ========================================================= */

async function loadPairings(){

  const {
    data:pairingRows,
    error:pairingError
  } =
    await supabaseClient
      .from("pairings")
      .select("*")
      .eq(
        "round_number",
        currentRound
      )
      .order(
        "pairing_number",
        {
          ascending:true
        }
      );


  if(pairingError){
    throw pairingError;
  }


  const {
    data:playerRows,
    error:playerError
  } =
    await supabaseClient
      .from("pairing_players")
      .select("*");


  if(playerError){
    throw playerError;
  }


  const loaded = [];


  (pairingRows || []).forEach(
    pairing => {

      const rows =
        (playerRows || [])
          .filter(
            row =>
              String(row.pairing_id) ===
              String(pairing.id)
          );


      const ryan =
        rows
          .filter(
            row =>
              String(row.side)
                .toUpperCase() === "B"
          )
          .map(
            row => row.player_name
          )
          .filter(Boolean);


      const clayton =
        rows
          .filter(
            row =>
              String(row.side)
                .toUpperCase() === "A"
          )
          .map(
            row => row.player_name
          )
          .filter(Boolean);


      if(
        ryan.length === 2 &&
        clayton.length === 2
      ){

        loaded.push({

          pairingNumber:
            Number(
              pairing.pairing_number
            ),

          ryan,

          clayton

        });

      }

    }
  );


  pairings[currentRound] =
    loaded.sort(
      (a,b) =>
        a.pairingNumber -
        b.pairingNumber
    );

}


/* =========================================================
   LOAD SCORES
   ========================================================= */

async function loadScores(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("scores")
      .select("*")
      .eq(
        "round_number",
        currentRound
      );


  if(error){
    throw error;
  }


  const newScores = {};


  (data || []).forEach(
    row => {

      const key =
        getScoreKey(
          row.round_number,
          row.match_number,
          row.player_name,
          row.hole_number
        );


      newScores[key] =
        row.gross_score;

    }
  );


  scores = newScores;

}


/* =========================================================
   LOAD CERTIFICATIONS
   ========================================================= */

async function loadCertifications(){

  certifications = {};

  certificationTableAvailable = false;


  const {
    data,
    error
  } =
    await supabaseClient
      .from(
        "scorecard_certifications"
      )
      .select("*")
      .eq(
        "round_number",
        currentRound
      );


  if(error){

    console.warn(
      "Certification table:",
      error.message
    );

    return;

  }


  certificationTableAvailable = true;


  (data || []).forEach(
    row => {

      certifications[
        certKey(
          row.round_number,
          row.match_number
        )
      ] = {

        marker_certified:
          Boolean(
            row.marker_certified
          ),

        opponent_certified:
          Boolean(
            row.opponent_certified
          )

      };

    }
  );

}


/* =========================================================
   SAVE SCORE
   ========================================================= */

async function saveScore(
  round,
  match,
  player,
  hole,
  gross
){

  const status =
    document.getElementById(
      "autosave-status"
    );


  pendingSaves++;


  const key =
    getScoreKey(
      round,
      match,
      player,
      hole
    );


  pendingScoreKeys.add(key);


  status.className =
    "autosave-status saving";

  status.textContent =
    "Saving to Scottsdale 26...";


  try{

    const numericGross =
      Number(gross);


    /*
       Update any existing matching rows.
       This is intentionally done without
       relying on a composite unique key.
    */

    const {
      data:updateData,
      error:updateError
    } =
      await supabaseClient
        .from("scores")
        .update({
          gross_score:numericGross
        })
        .eq(
          "round_number",
          Number(round)
        )
        .eq(
          "match_number",
          Number(match)
        )
        .eq(
          "player_name",
          player
        )
        .eq(
          "hole_number",
          Number(hole)
        )
        .select();


    if(updateError){
      throw updateError;
    }


    /*
       No existing row -> insert.
    */

    if(
      !updateData ||
      updateData.length === 0
    ){

      const {
        error:insertError
      } =
        await supabaseClient
          .from("scores")
          .insert({

            round_number:
              Number(round),

            match_number:
              Number(match),

            player_name:
              player,

            hole_number:
              Number(hole),

            gross_score:
              numericGross

          });


      if(insertError){
        throw insertError;
      }

    }


    setSyncIndicator(true);


    status.className =
      "autosave-status saved";

    status.textContent =
      "Saved to everyone ✓";


  }catch(error){

    console.error(
      "SAVE SCORE ERROR:",
      error
    );


    setSyncIndicator(false);


    status.className =
      "autosave-status error";

    status.textContent =
      "SAVE ERROR: " +
      error.message;


    showStatus(
      "Score could not be saved: " +
      error.message,
      "error"
    );


  }finally{

    pendingSaves--;

    pendingScoreKeys.delete(key);

  }

}


/* =========================================================
   DELETE SCORE
   ========================================================= */

async function deleteScore(
  round,
  match,
  player,
  hole
){

  const status =
    document.getElementById(
      "autosave-status"
    );


  pendingSaves++;

/* =========================================================
   UPDATE SCORE
   ========================================================= */

async function updateScore(
  player,
  matchNumber,
  hole,
  value
){

  if(
    isLocked(matchNumber)
  ){

    showStatus(
      "This scorecard is certified and locked.",
      "error"
    );

    return;

  }


  const key =
    getScoreKey(
      currentRound,
      matchNumber,
      player,
      hole
    );


  editingKeys.delete(key);


  /*
     Empty score.
  */

  if(
    value === "" ||
    value === null ||
    value === undefined
  ){

    delete scores[key];


    /*
       Recalculate immediately.
    */

    calculateMatch(
      matchNumber
    );


    await deleteScore(
      currentRound,
      matchNumber,
      player,
      hole
    );


    return;

  }


  const numericValue =
    Number(value);


  if(
    !Number.isFinite(
      numericValue
    )
  ){

    return;

  }


  /*
     Prevent ridiculous entries.
  */

  if(
    numericValue < 1 ||
    numericValue > 15
  ){

    showStatus(
      "Enter a gross score between 1 and 15.",
      "error"
    );

    return;

  }


  /*
     LOCAL STATE FIRST.

     This is critical.

     The scorecard calculates immediately
     and does NOT wait for Supabase.
  */

  scores[key] =
    numericValue;


  updateScoreCellDisplay(
    player,
    matchNumber,
    hole
  );


  calculateMatch(
    matchNumber
  );


  /*
     Save in background.
  */

  await saveScore(
    currentRound,
    matchNumber,
    player,
    hole,
    numericValue
  );

}


/* =========================================================
   UPDATE ONE SCORE CELL
   ========================================================= */

function updateScoreCellDisplay(
  player,
  matchNumber,
  hole
){

  const course =
    getCourse(currentRound);


  const match =
    (
      pairings[currentRound] || []
    ).find(
      m =>
        Number(m.pairingNumber) ===
        Number(matchNumber)
    );


  if(!match){
    return;
  }


  const matchHandicaps =
    getMatchPlayingHandicaps(
      match,
      course
    );


  const key =
    getScoreKey(
      currentRound,
      matchNumber,
      player,
      hole
    );


  const value =
    scores[key] ?? "";


  const selector =
    `input.score-input[data-player="${CSS.escape(player)}"][data-hole="${hole}"][data-match="${matchNumber}"]`;


  const input =
    document.querySelector(
      selector
    );


  if(input){

    /*
       Only set the value if it is
       different. This prevents cursor
       jumping.
    */

    if(
      String(input.value) !==
      String(value)
    ){

      input.value =
        value;

    }


    const isBirdie =
      value !== "" &&
      Number(value) ===
      course.pars[hole-1]-1;


    input.classList.toggle(
      "gross-birdie",
      isBirdie
    );

  }


  const display =
    document.querySelector(
      `.net-score-display[data-player="${CSS.escape(player)}"][data-hole="${hole}"][data-match="${matchNumber}"]`
    );


  if(display){

    if(
      value === "" ||
      value === null ||
      value === undefined
    ){

      display.dataset.baseNet="";
      display.innerHTML="";

    }else{

      const net =
        netScore(
          player,
          Number(value),
          hole-1,
          course,
          matchHandicaps
        );


      display.dataset.baseNet =
        `Net ${net}`;

      display.innerHTML =
        `Net ${net}`;

    }

  }

}


/* =========================================================
   PLAYER TOTALS
   ========================================================= */

function updatePlayerTotals(
  matchNumber
){

  const match =
    (
      pairings[currentRound] || []
    ).find(
      m =>
        Number(m.pairingNumber) ===
        Number(matchNumber)
    );


  if(!match){
    return;
  }


  [
    ...match.ryan,
    ...match.clayton
  ].forEach(
    player => {

      let front=0;
      let back=0;

      let frontComplete=true;
      let backComplete=true;


      for(
        let hole=1;
        hole<=18;
        hole++
      ){

        const value =
          scores[
            getScoreKey(
              currentRound,
              matchNumber,
              player,
              hole
            )
          ];


        if(
          value === undefined ||
          value === null ||
          value === ""
        ){

          if(hole<=9){
            frontComplete=false;
          }else{
            backComplete=false;
          }

          continue;

        }


        if(hole<=9){
          front += Number(value);
        }else{
          back += Number(value);
        }

      }


      const safePlayer =
        safePlayerId(player);


      const frontElement =
        document.getElementById(
          `front-${currentRound}-${matchNumber}-${safePlayer}`
        );


      const backElement =
        document.getElementById(
          `back-${currentRound}-${matchNumber}-${safePlayer}`
        );


      const totalElement =
        document.getElementById(
          `total-${currentRound}-${matchNumber}-${safePlayer}`
        );


      if(frontElement){

        frontElement.textContent =
          frontComplete
            ? front
            : "-";

      }


      if(backElement){

        backElement.textContent =
          backComplete
            ? back
            : "-";

      }


      if(totalElement){

        totalElement.textContent =
          frontComplete &&
          backComplete
            ? front + back
            : "-";

      }

    }
  );

}


/* =========================================================
   HOLE INDICATORS
   ========================================================= */

function updateHoleIndicators(
  matchNumber,
  matchHandicaps
){

  const match =
    (
      pairings[currentRound] || []
    ).find(
      m =>
        Number(m.pairingNumber) ===
        Number(matchNumber)
    );


  if(!match){
    return;
  }


  const course =
    getCourse(currentRound);


  for(
    let holeIndex=0;
    holeIndex<18;
    holeIndex++
  ){

    const hole =
      holeIndex+1;


    const makeScores =
      playersList =>
        playersList.map(
          player => {

            const value =
              scores[
                getScoreKey(
                  currentRound,
                  matchNumber,
                  player,
                  hole
                )
              ];


            if(
              value === undefined ||
              value === null ||
              value === ""
            ){

              return null;

            }


            return {

              player,

              gross:
                Number(value),

              net:
                netScore(
                  player,
                  Number(value),
                  holeIndex,
                  course,
                  matchHandicaps
                )

            };

          }
        );


    const ryanScores =
      makeScores(match.ryan);


    const claytonScores =
      makeScores(match.clayton);


    /*
       Birdie circles.
    */

    [
      ...ryanScores,
      ...claytonScores
    ].forEach(
      score => {

        if(!score){
          return;
        }


        const input =
          document.querySelector(
            `input.score-input[data-player="${CSS.escape(score.player)}"][data-hole="${hole}"][data-match="${matchNumber}"]`
          );


        if(input){

          input.classList.toggle(
            "gross-birdie",

            score.gross ===
            course.pars[holeIndex]-1

          );

        }

      }
    );


    /*
       Reset trophies.
    */

    document
      .querySelectorAll(
        `.net-score-display[data-match="${matchNumber}"][data-hole="${hole}"]`
      )
      .forEach(
        element => {

          element.classList.remove(
            "hole-winner"
          );

          element.innerHTML =
            element.dataset.baseNet || "";

        }
      );


    /*
       Need all four gross scores
       before determining a hole winner.
    */

    if(
      ryanScores.length !== 2 ||
      claytonScores.length !== 2 ||
      ryanScores.includes(null) ||
      claytonScores.includes(null)
    ){

      continue;

    }


    const ryanBest =
      Math.min(
        ...ryanScores.map(
          x => x.net
        )
      );


    const claytonBest =
      Math.min(
        ...claytonScores.map(
          x => x.net
        )
      );


    let winningScores=[];


    if(
      ryanBest <
      claytonBest
    ){

      winningScores =
        ryanScores.filter(
          x =>
            x.net === ryanBest
        );

    }else if(
      claytonBest <
      ryanBest
    ){

      winningScores =
        claytonScores.filter(
          x =>
            x.net === claytonBest
        );

    }


    winningScores.forEach(
      score => {

        const display =
          document.querySelector(
            `.net-score-display[data-player="${CSS.escape(score.player)}"][data-hole="${hole}"][data-match="${matchNumber}"]`
          );


        if(display){

          display.classList.add(
            "hole-winner"
          );


          display.innerHTML =
            `${display.dataset.baseNet} <span class="net-trophy">🏆</span>`;

        }

      }
    );

  }

}


/* =========================================================
   FORMAT POINTS
   ========================================================= */

function formatPoints(value){

  return Number.isInteger(value)
    ? String(value)
    : Number(value).toFixed(1);

}


/* =========================================================
   MATCH CALCULATION
   ========================================================= */

function calculateMatch(
  matchNumber
){

  const match =
    (
      pairings[currentRound] || []
    ).find(
      m =>
        Number(m.pairingNumber) ===
        Number(matchNumber)
    );


  if(!match){
    return;
  }


  const course =
    getCourse(currentRound);


  const matchHandicaps =
    getMatchPlayingHandicaps(
      match,
      course
    );


  let ryanHolePoints=0;
  let claytonHolePoints=0;

  let ryanBonus=0;
  let claytonBonus=0;

  let frontRyanHoles=0;
  let frontClaytonHoles=0;

  let backRyanHoles=0;
  let backClaytonHoles=0;

  let ryan18=0;
  let clayton18=0;

  let frontComplete=true;
  let backComplete=true;
  let allComplete=true;


  for(
    let holeIndex=0;
    holeIndex<18;
    holeIndex++
  ){

    const hole =
      holeIndex+1;


    const makeScores =
      playersList =>
        playersList.map(
          player => {

            const value =
              scores[
                getScoreKey(
                  currentRound,
                  matchNumber,
                  player,
                  hole
                )
              ];


            if(
              value === undefined ||
              value === null ||
              value === ""
            ){

              return null;

            }


            return {

              player,

              gross:
                Number(value),

              net:
                netScore(
                  player,
                  Number(value),
                  holeIndex,
                  course,
                  matchHandicaps
                )

            };

          }
        );


    const ryanScores =
      makeScores(match.ryan);


    const claytonScores =
      makeScores(match.clayton);


    /*
       If either side is missing a score,
       this hole cannot count yet.
    */

    if(
      ryanScores.length !== 2 ||
      claytonScores.length !== 2 ||
      ryanScores.includes(null) ||
      claytonScores.includes(null)
    ){

      allComplete=false;


      if(holeIndex<9){

        frontComplete=false;

      }else{

        backComplete=false;

      }


      continue;

    }


    const ryanBest =
      Math.min(
        ...ryanScores.map(
          x => x.net
        )
      );


    const claytonBest =
      Math.min(
        ...claytonScores.map(
          x => x.net
        )
      );


    ryan18 += ryanBest;
    clayton18 += claytonBest;


    /*
       RYAN WINS HOLE
    */

    if(
      ryanBest <
      claytonBest
    ){

      ryanHolePoints++;


      if(holeIndex<9){

        frontRyanHoles++;

      }else{

        backRyanHoles++;

      }


      /*
         Birdie/eagle bonus.

         Only the winning side receives
         the bonus.

         Maximum one bonus per side
         per hole.

         Eagle = 2
         Birdie = 1
      */

      const ryanBonusThisHole =
        Math.max(
          ...ryanScores.map(
            score => {

              const par =
                course.pars[holeIndex];


              if(
                score.gross <= par-2
              ){

                return 2;

              }


              if(
                score.gross === par-1
              ){

                return 1;

              }


              return 0;

            }
          )
        );


      ryanBonus +=
        ryanBonusThisHole;

    }


    /*
       CLAYTON WINS HOLE
    */

    else if(
      claytonBest <
      ryanBest
    ){

      claytonHolePoints++;


      if(holeIndex<9){

        frontClaytonHoles++;

      }else{

        backClaytonHoles++;

      }


      const claytonBonusThisHole =
        Math.max(
          ...claytonScores.map(
            score => {

              const par =
                course.pars[holeIndex];


              if(
                score.gross <= par-2
              ){

                return 2;

              }


              if(
                score.gross === par-1
              ){

                return 1;

              }


              return 0;

            }
          )
        );


      claytonBonus +=
        claytonBonusThisHole;

    }

    /*
       Tied hole = zero hole points.
    */

  }


  /*
     BASE POINTS

     Each hole won = 1 point.
     Birdie/eagle bonus added separately.
  */

  let ryanPoints =
    ryanHolePoints +
    ryanBonus;


  let claytonPoints =
    claytonHolePoints +
    claytonBonus;


  /* =======================================================
     FRONT 9
     ======================================================= */

  let frontText;


  if(!frontComplete){

    frontText =
      `IN PROGRESS • ${frontRyanHoles}-${frontClaytonHoles}`;

  }else if(
    frontRyanHoles >
    frontClaytonHoles
  ){

    ryanPoints += 3;


    frontText =
      `RYAN WINS FRONT • ${frontRyanHoles}-${frontClaytonHoles} • +3`;

  }else if(
    frontClaytonHoles >
    frontRyanHoles
  ){

    claytonPoints += 3;


    frontText =
      `CLAYTON WINS FRONT • ${frontRyanHoles}-${frontClaytonHoles} • +3`;

  }else{

    ryanPoints += 1.5;
    claytonPoints += 1.5;


    frontText =
      `FRONT TIED • ${frontRyanHoles}-${frontClaytonHoles} • +1.5 EACH`;

  }


  /* =======================================================
     BACK 9
     ======================================================= */

  let backText;


  if(!backComplete){

    backText =
      `IN PROGRESS • ${backRyanHoles}-${backClaytonHoles}`;

  }else if(
    backRyanHoles >
    backClaytonHoles
  ){

    ryanPoints += 3;


    backText =
      `RYAN WINS BACK • ${backRyanHoles}-${backClaytonHoles} • +3`;

  }else if(
    backClaytonHoles >
    backRyanHoles
  ){

    claytonPoints += 3;


    backText =
      `CLAYTON WINS BACK • ${backRyanHoles}-${backClaytonHoles} • +3`;

  }else{

    ryanPoints += 1.5;
    claytonPoints += 1.5;


    backText =
      `BACK TIED • ${backRyanHoles}-${backClaytonHoles} • +1.5 EACH`;

  }


  /* =======================================================
     18-HOLE BEST BALL
     ======================================================= */

  let strokeText;


  if(!allComplete){

    strokeText =
      `IN PROGRESS • ${ryan18 || "-"}-${clayton18 || "-"}`;

  }else if(
    ryan18 <
    clayton18
  ){

    ryanPoints += 5;


    strokeText =
      `RYAN WINS 18 • ${ryan18}-${clayton18} • +5`;

  }else if(
    clayton18 <
    ryan18
  ){

    claytonPoints += 5;


    strokeText =
      `CLAYTON WINS 18 • ${ryan18}-${clayton18} • +5`;

  }else{

    ryanPoints += 2.5;
    claytonPoints += 2.5;


    strokeText =
      `18 TIED • ${ryan18}-${clayton18} • +2.5 EACH`;

  }


  /* =======================================================
     ROUND 5 FINAL ROUND MULTIPLIER
     ======================================================= */

  if(currentRound === 5){

    ryanPoints *= 1.5;
    claytonPoints *= 1.5;

  }


  function setResult(
    id,
    value
  ){

    const element =
      document.getElementById(id);


    if(element){

      element.textContent =
        value;

    }

  }


  setResult(
    `front-result-${matchNumber}`,
    frontText
  );


  setResult(
    `back-result-${matchNumber}`,
    backText
  );


  setResult(
    `stroke-result-${matchNumber}`,
    strokeText
  );


  setResult(
    `bonus-result-${matchNumber}`,

    `RYAN +${ryanBonus} • CLAYTON +${claytonBonus}`

  );


  setResult(
    `points-result-${matchNumber}`,

    `RYAN ${formatPoints(ryanPoints)} • CLAYTON ${formatPoints(claytonPoints)}`

  );


  updatePlayerTotals(
    matchNumber
  );


  updateHoleIndicators(
    matchNumber,
    matchHandicaps
  );

}


/* =========================================================
   CALCULATE ALL MATCHES
   ========================================================= */

function calculateAllMatches(){

  (
    pairings[currentRound] || []
  ).forEach(
    match => {

      calculateMatch(
        match.pairingNumber
      );

    }
  );

}


/* =========================================================
   CERTIFICATION STATE
   ========================================================= */

function applyCertificationState(
  element,
  matchNumber
){

  const locked =
    isLocked(matchNumber);


  element.classList.toggle(
    "scorecard-locked",
    locked
  );


  element
    .querySelectorAll(
      "input.score-input"
    )
    .forEach(
      input => {

        input.disabled =
          locked;

      }
    );


  const certification =
    certifications[
      certKey(
        currentRound,
        matchNumber
      )
    ] || {};


  const marker =
    element.querySelector(
      '[data-cert-type="marker"]'
    );


  const opponent =
    element.querySelector(
      '[data-cert-type="opponent"]'
    );


  if(marker){

    marker.checked =
      Boolean(
        certification.marker_certified
      );

  }


  if(opponent){

    opponent.checked =
      Boolean(
        certification.opponent_certified
      );

  }


  const status =
    element.querySelector(
      ".certification-status"
    );


  if(status){

    status.textContent =
      locked

        ? "✓ Both certifications complete — scorecard is LOCKED"

        : "Both certifications are required to lock this scorecard.";


    status.classList.toggle(
      "locked",
      locked
    );

  }

}

          <table>

            <thead>

              <tr>

                <th>PLAYER</th>

                ${Array.from(
                  {length:18},
                  (_,i) =>
                    `<th>${i+1}</th>`
                ).join("")}

                <th>OUT</th>
                <th>IN</th>
                <th>TOTAL</th>

              </tr>

            </thead>

            <tbody>

      `;


      /* =====================================================
         YARDAGES
         ===================================================== */

      const courseKey =
        course === dinosaurMountain
          ? "Dinosaur Mountain"
          : course === weKoPaCholla
            ? "We-Ko-Pa Cholla"
            : "We-Ko-Pa Saguaro";


      const teeRows =
        TEE_YARDAGES[courseKey];


      Object.entries(
        teeRows
      ).forEach(
        ([tee,distances]) => {

          const front =
            distances
              .slice(0,9)
              .reduce(
                (a,b) => a+b,
                0
              );


          const back =
            distances
              .slice(9)
              .reduce(
                (a,b) => a+b,
                0
              );


          const total =
            distances.reduce(
              (a,b) => a+b,
              0
            );


          html += `

            <tr class="tee-yardage-row">

              <td class="name-cell tee-yardage-label">
                ${tee.toUpperCase()}
              </td>

              ${distances.map(
                x =>
                  `<td>${x}</td>`
              ).join("")}

              <td>${front}</td>
              <td>${back}</td>
              <td>${total}</td>

            </tr>

          `;

        }
      );


      /* =====================================================
         HCP
         ===================================================== */

      html += `

        <tr class="hole-handicap-row">

          <td class="name-cell tee-yardage-label">
            HCP
          </td>

          ${course.handicap.map(
            x =>
              `<td>${x}</td>`
          ).join("")}

          <td></td>
          <td></td>
          <td></td>

        </tr>

      `;


      /* =====================================================
         PAR
         ===================================================== */

      const frontPar =
        course.pars
          .slice(0,9)
          .reduce(
            (a,b) => a+b,
            0
          );


      const backPar =
        course.pars
          .slice(9)
          .reduce(
            (a,b) => a+b,
            0
          );


      html += `

        <tr class="par-row">

          <td class="name-cell">
            PAR
          </td>

          ${course.pars.map(
            x =>
              `<td>${x}</td>`
          ).join("")}

          <td>${frontPar}</td>
          <td>${backPar}</td>
          <td>${course.par}</td>

        </tr>

      `;


      /* =====================================================
         PLAYER ROWS
         ===================================================== */

      allPlayers.forEach(
        player => {

          const safePlayer =
            safePlayerId(player);


          const teamClass =
            players[player].team === "Ryan"
              ? "team-ryan"
              : "team-clayton";


          html += `

            <tr class="${teamClass}">

              <td class="name-cell">

                ${player}

                <br>

                <small>

                  PLAYING HCP
                  ${getPlayerCourseHandicap(
                    player,
                    course
                  )}

                  •
                  ${getTeeLabel(
                    player,
                    course
                  )}

                </small>

              </td>

          `;


          for(
            let holeIndex=0;
            holeIndex<18;
            holeIndex++
          ){

            const hole =
              holeIndex+1;


            const key =
              getScoreKey(
                currentRound,
                matchNumber,
                player,
                hole
              );


            const value =
              scores[key] ?? "";


            const hasStroke =
              strokesOnHole(
                player,
                holeIndex,
                course,
                matchHandicaps
              ) > 0;


            let initialNet="";


            if(
              value !== "" &&
              value !== null &&
              value !== undefined
            ){

              initialNet =
                netScore(
                  player,
                  Number(value),
                  holeIndex,
                  course,
                  matchHandicaps
                );

            }


            const isBirdie =
              value !== "" &&
              Number(value) ===
              course.pars[holeIndex]-1;


            html += `

              <td class="score-cell">

                ${
                  hasStroke

                    ? '<span class="stroke-dot" title="Stroke"></span>'

                    : ""
                }

                <input
                  class="score-input ${isBirdie ? "gross-birdie" : ""}"
                  type="number"
                  inputmode="numeric"
                  min="1"
                  max="15"
                  value="${value}"
                  data-player="${player.replace(/"/g,"&quot;")}"
                  data-hole="${hole}"
                  data-match="${matchNumber}"
                >

                <div
                  class="net-score-display"
                  data-player="${player.replace(/"/g,"&quot;")}"
                  data-hole="${hole}"
                  data-match="${matchNumber}"
                  data-base-net="${initialNet !== "" ? `Net ${initialNet}` : ""}"
                >
                  ${initialNet !== "" ? `Net ${initialNet}` : ""}
                </div>

              </td>

            `;

          }


          html += `

              <td
                id="front-${currentRound}-${matchNumber}-${safePlayer}"
                class="total-cell"
              >-</td>

              <td
                id="back-${currentRound}-${matchNumber}-${safePlayer}"
                class="total-cell"
              >-</td>

              <td
                id="total-${currentRound}-${matchNumber}-${safePlayer}"
                class="total-cell"
              >-</td>

            </tr>

          `;

        }
      );


      html += `

            </tbody>

          </table>

        </div>


        <div class="match-results">

          <div class="result-box">

            <div class="result-label">
              FRONT 9
            </div>

            <div
              class="result-value"
              id="front-result-${matchNumber}"
            >-</div>

          </div>


          <div class="result-box">

            <div class="result-label">
              BACK 9
            </div>

            <div
              class="result-value"
              id="back-result-${matchNumber}"
            >-</div>

          </div>


          <div class="result-box">

            <div class="result-label">
              18-HOLE STROKE
            </div>

            <div
              class="result-value"
              id="stroke-result-${matchNumber}"
            >-</div>

          </div>


          <div class="result-box">

            <div class="result-label">
              BIRDIE / EAGLE BONUS
            </div>

            <div
              class="result-value"
              id="bonus-result-${matchNumber}"
            >
              RYAN +0 • CLAYTON +0
            </div>

          </div>


          <div class="result-box">

            <div class="result-label">
              MATCH POINTS
            </div>

            <div
              class="result-value"
              id="points-result-${matchNumber}"
            >-</div>

          </div>

        </div>


        <div class="certification-panel">

          <label class="certification-label">

            <input
              type="checkbox"
              data-cert-type="marker"
            >

            Certified by marker

          </label>


          <label class="certification-label">

            <input
              type="checkbox"
              data-cert-type="opponent"
            >

            Certified by opponent

          </label>


          <div class="certification-status">
            Both certifications are required to lock this scorecard.
          </div>

        </div>

      `;


      div.innerHTML =
        html;


      container.appendChild(
        div
      );


      /* ===================================================
         SCORE INPUT EVENTS

         IMPORTANT:
         We do NOT rebuild the page here.
         =================================================== */

      div
        .querySelectorAll(
          "input.score-input"
        )
        .forEach(
          input => {

            input.addEventListener(
              "focus",
              function(){

                const key =
                  getScoreKey(
                    currentRound,
                    Number(
                      this.dataset.match
                    ),
                    this.dataset.player,
                    Number(
                      this.dataset.hole
                    )
                  );


                editingKeys.add(key);

              }
            );


            input.addEventListener(
              "input",
              function(){

                /*
                   Update the visible birdie
                   circle while typing.
                */

                const course =
                  getCourse(
                    currentRound
                  );


                const hole =
                  Number(
                    this.dataset.hole
                  );


                const value =
                  this.value;


                this.classList.toggle(
                  "gross-birdie",

                  value !== "" &&
                  Number(value) ===
                    course.pars[hole-1]-1

                );

              }
            );


            input.addEventListener(
              "change",
              async function(){

                await updateScore(
                  this.dataset.player,

                  Number(
                    this.dataset.match
                  ),

                  Number(
                    this.dataset.hole
                  ),

                  this.value
                );

              }
            );


            input.addEventListener(
              "blur",
              function(){

                const key =
                  getScoreKey(
                    currentRound,
                    Number(
                      this.dataset.match
                    ),
                    this.dataset.player,
                    Number(
                      this.dataset.hole
                    )
                  );


                editingKeys.delete(key);

              }
            );

          }
        );


      /* ===================================================
         CERTIFICATION
         =================================================== */

      const marker =
        div.querySelector(
          '[data-cert-type="marker"]'
        );


      const opponent =
        div.querySelector(
          '[data-cert-type="opponent"]'
        );


      marker.addEventListener(
        "change",
        () =>
          updateCertification(
            matchNumber,
            "marker_certified",
            marker.checked
          )
      );


      opponent.addEventListener(
        "change",
        () =>
          updateCertification(
            matchNumber,
            "opponent_certified",
            opponent.checked
          )
      );


      updatePlayerTotals(
        matchNumber
      );


      calculateMatch(
        matchNumber
      );


      applyCertificationState(
        div,
        matchNumber
      );

    }
  );

}


/* =========================================================
   CLEAR MATCH
   ========================================================= */

async function clearMatchScores(
  match
){

  if(
    isLocked(match)
  ){

    showStatus(
      `Match ${match} is certified and locked. Uncheck both certifications first.`,
      "error"
    );

    return;

  }


  if(
    !confirm(
      `Clear ALL scores for Match ${match} in Round ${currentRound}?`
    )
  ){

    return;

  }


  try{

    pendingSaves++;


    const {
      error
    } =
      await supabaseClient
        .from("scores")
        .delete()
        .eq(
          "round_number",
          Number(currentRound)
        )
        .eq(
          "match_number",
          Number(match)
        );


    if(error){
      throw error;
    }


    Object.keys(scores).forEach(
      key => {

        if(
          key.startsWith(
            `${currentRound}_${match}_`
          )
        ){

          delete scores[key];

        }

      }
    );


    renderScorecards();


    showStatus(
      `Match ${match} scores cleared.`,
      "success"
    );


    setTimeout(
      clearStatus,
      1500
    );


  }catch(error){

    console.error(
      "CLEAR ERROR:",
      error
    );


    showStatus(
      "CLEAR ERROR: " +
      error.message,
      "error"
    );

  }finally{

    pendingSaves--;

  }

}


/* =========================================================
   CERTIFICATION
   ========================================================= */

async function updateCertification(
  match,
  type,
  checked
){

  const key =
    certKey(
      currentRound,
      match
    );


  const certification =
    certifications[key] || {

      marker_certified:false,

      opponent_certified:false

    };


  certification[type] =
    Boolean(checked);


  certifications[key] =
    certification;


  const matchElement =
    [
      ...document.querySelectorAll(
        ".match"
      )
    ].find(
      element =>
        element.dataset.matchNumber ===
        String(match)
    );


  if(matchElement){

    applyCertificationState(
      matchElement,
      match
    );

  }


  if(!certificationTableAvailable){

    showStatus(
      "Certification table is not available.",
      "error"
    );

    return;

  }


  try{

    const {
      data:updateData,
      error:updateError
    } =
      await supabaseClient
        .from(
          "scorecard_certifications"
        )
        .update({

          marker_certified:
            certification.marker_certified,

          opponent_certified:
            certification.opponent_certified,

          updated_at:
            new Date().toISOString()

        })
        .eq(
          "round_number",
          Number(currentRound)
        )
        .eq(
          "match_number",
          Number(match)
        )
        .select();


    if(updateError){
      throw updateError;
    }


    if(
      !updateData ||
      updateData.length === 0
    ){

      const {
        error:insertError
      } =
        await supabaseClient
          .from(
            "scorecard_certifications"
          )
          .insert({

            round_number:
              Number(currentRound),

            match_number:
              Number(match),

            marker_certified:
              certification.marker_certified,

            opponent_certified:
              certification.opponent_certified,

            updated_at:
              new Date().toISOString()

          });


      if(insertError){
        throw insertError;
      }

    }


  }catch(error){

    showStatus(
      "CERTIFICATION SAVE ERROR: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   SAFE FULL REFRESH
   ========================================================= */

async function refreshCurrentRound(
  force=false
){

  /*
     NEVER destroy the scorecard while someone
     is entering a score or while a score is saving.
  */

  if(
    !force &&
    (
      userIsEditing() ||
      pendingSaves > 0 ||
      pendingScoreKeys.size > 0
    )
  ){

    return;

  }


  if(syncing){
    return;
  }


  syncing=true;


  try{

    await loadPairings();

    await loadScores();

    await loadCertifications();

    renderScorecards();

    setSyncIndicator(true);

  }catch(error){

    console.error(
      "SYNC ERROR:",
      error
    );

    setSyncIndicator(false);

  }finally{

    syncing=false;

  }

}


/* =========================================================
   ROUND CHANGE
   ========================================================= */

async function setRound(
  round
){

  if(
    pendingSaves > 0
  ){

    showStatus(
      "Please wait for the current score to finish saving.",
      "error"
    );

    return;

  }


  currentRound =
    Number(round);


  document
    .querySelectorAll(
      ".round-btn"
    )
    .forEach(
      button => {

        const buttonRound =
          Number(
            button.textContent
              .replace(
                "Round ",
                ""
              )
          );


        button.classList.toggle(
          "active",
          buttonRound ===
            currentRound
        );

      }
    );


  showStatus(
    `Loading Round ${currentRound}...`,
    "loading"
  );


  try{

    await refreshCurrentRound(
      true
    );

    clearStatus();

  }catch(error){

    showStatus(
      "ROUND LOAD ERROR: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   REALTIME SCORE UPDATE
   ========================================================= */

function handleRealtimeScore(
  payload
){

  const row =
    payload.eventType === "DELETE"
      ? payload.old
      : payload.new;


  if(!row){
    return;
  }


  if(
    Number(row.round_number) !==
    Number(currentRound)
  ){

    return;

  }


  const key =
    getScoreKey(
      row.round_number,
      row.match_number,
      row.player_name,
      row.hole_number
    );


  /*
     If this is a local save that is still
     completing, do not overwrite the local
     value.
  */

  if(
    pendingScoreKeys.has(key)
  ){

    return;

  }


  if(
    payload.eventType === "DELETE"
  ){

    delete scores[key];

  }else{

    scores[key] =
      row.gross_score;

  }


  /*
     Update ONLY the affected cell.
     No page rebuild.
  */

  updateScoreCellDisplay(
    row.player_name,
    Number(row.match_number),
    Number(row.hole_number)
  );


  calculateMatch(
    Number(row.match_number)
  );


  setSyncIndicator(true);

}


/* =========================================================
   REALTIME
   ========================================================= */

function startRealtime(){

  if(realtimeChannel){

    supabaseClient.removeChannel(
      realtimeChannel
    );

  }


  realtimeChannel =
    supabaseClient
      .channel(
        "scottsdale26-scorecards-v2"
      )


      /* ===============================================
         SCORES

         DO NOT CALL renderScorecards HERE.
         =============================================== */

      .on(
        "postgres_changes",

        {
          event:"*",
          schema:"public",
          table:"scores"
        },

        payload => {

          console.log(
            "SCORE REALTIME:",
            payload
          );


          handleRealtimeScore(
            payload
          );

        }
      )


      /* ===============================================
         PAIRINGS
         =============================================== */

      .on(
        "postgres_changes",

        {
          event:"*",
          schema:"public",
          table:"pairings"
        },

        async payload => {

          console.log(
            "PAIRING REALTIME:",
            payload
          );


          /*
             Pairing changes are rare.
             Only rebuild if user isn't editing.
          */

          if(
            !userIsEditing() &&
            pendingSaves === 0
          ){

            await refreshCurrentRound(
              true
            );

          }

        }
      )


      /* ===============================================
         PAIRING PLAYERS
         =============================================== */

      .on(
        "postgres_changes",

        {
          event:"*",
          schema:"public",
          table:"pairing_players"
        },

        async payload => {

          console.log(
            "PAIRING PLAYER REALTIME:",
            payload
          );


          if(
            !userIsEditing() &&
            pendingSaves === 0
          ){

            await refreshCurrentRound(
              true
            );

          }

        }
      )


      /* ===============================================
         CERTIFICATIONS
         =============================================== */

      .on(
        "postgres_changes",

        {
          event:"*",
          schema:"public",
          table:"scorecard_certifications"
        },

        async payload => {

          console.log(
            "CERT REALTIME:",
            payload
          );


          /*
             Don't rebuild the entire scorecard
             just because somebody checked a box.
          */

          const row =
            payload.eventType === "DELETE"
              ? payload.old
              : payload.new;


          if(!row){
            return;
          }


          if(
            Number(row.round_number) !==
            Number(currentRound)
          ){

            return;

          }


          const key =
            certKey(
              row.round_number,
              row.match_number
            );


          certifications[key] = {

            marker_certified:
              Boolean(
                row.marker_certified
              ),

            opponent_certified:
              Boolean(
                row.opponent_certified
              )

          };


          const matchElement =
            [
              ...document.querySelectorAll(
                ".match"
              )
            ].find(
              element =>
                element.dataset.matchNumber ===
                String(row.match_number)
            );


          if(matchElement){

            applyCertificationState(
              matchElement,
              Number(row.match_number)
            );

          }

        }
      )


      .subscribe(
        status => {

          console.log(
            "SUPABASE REALTIME STATUS:",
            status
          );


          if(
            status === "SUBSCRIBED"
          ){

            setSyncIndicator(true);

          }


          if(
            status === "CHANNEL_ERROR" ||
            status === "TIMED_OUT" ||
            status === "CLOSED"
          ){

            setSyncIndicator(false);

          }

        }
      );

}


/* =========================================================
   BACKUP SYNC
   =========================================================

   IMPORTANT:

   This used to run every 3 seconds and completely
   rebuild the page.

   That was the primary cause of the refresh/
   score-entry problem.

   Now it checks every 20 seconds and ONLY refreshes
   when nobody is typing and no save is pending.
   ========================================================= */

function startBackupSync(){

  if(backupSyncTimer){

    clearInterval(
      backupSyncTimer
    );

  }


  backupSyncTimer =
    setInterval(
      async () => {

        if(
          userIsEditing() ||
          pendingSaves > 0 ||
          pendingScoreKeys.size > 0
        ){

          return;

        }


        await refreshCurrentRound();

      },

      20000

    );

}


/* =========================================================
   START APP
   ========================================================= */

async function startApp(){

  currentRound=4;


  document
    .querySelectorAll(
      ".round-btn"
    )
    .forEach(
      button => {

        const buttonRound =
          Number(
            button.textContent
              .replace(
                "Round ",
                ""
              )
          );


        button.classList.toggle(
          "active",
          buttonRound === 4
        );

      }
    );


  showStatus(
    "Loading Scottsdale 26 Round 4 scorecard...",
    "loading"
  );


  try{

    /*
       Load everything ONCE.
    */

    await loadPairings();

    await loadScores();

    await loadCertifications();


    /*
       Render ONCE.
    */

    renderScorecards();


    /*
       Then calculate everything.
    */

    calculateAllMatches();


    clearStatus();


    /*
       Start realtime AFTER the initial
       page is fully rendered.
    */

    startRealtime();


    /*
       Backup sync is intentionally slow
       and never runs while editing.
    */

    startBackupSync();


    setSyncIndicator(true);

  }catch(error){

    console.error(
      "STARTUP ERROR:",
      error
    );


    setSyncIndicator(false);


    showStatus(
      "STARTUP ERROR: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   START
   ========================================================= */

startApp();

</script>

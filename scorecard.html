/*

TEE SELECTION STATE
=====================================================

Ryan D and Brad can select Purple or White
for Rounds 2-5.

Default = White.

Selections are saved locally on the device.
=====================================================
*/

let teeSelections = {};

try {

  teeSelections =
    JSON.parse(
      localStorage.getItem(
        "scottsdale26_tee_selections"
      ) || "{}"
    );

} catch(error) {

  console.error(
    "TEE SELECTION LOAD ERROR:",
    error
  );

  teeSelections = {};

}


/*
=====================================================
TEE SELECTION HELPERS
=====================================================
*/

function getTeeSelectionKey(
  round,
  playerName
) {

  return `${round}_${playerName}`;

}


function getSelectedTee(
  round,
  playerName
) {

  /*
  Round 1 is always Blue for
  Ryan D and Brad.
  */

  if(round === 1) {

    return "blue";

  }


  /*
  Everyone other than Ryan D and Brad
  is always Purple at We-Ko-Pa.
  */

  if(
    playerName !== "Ryan D" &&
    playerName !== "Brad"
  ) {

    return "purple";

  }


  const key =
    getTeeSelectionKey(
      round,
      playerName
    );


  /*
  Default to WHITE because that is
  the current tournament assignment.
  */

  return (
    teeSelections[key] ||
    "white"
  );

}


function saveTeeSelection(
  round,
  playerName,
  tee
) {

  /*
  Safety check
  */

  if(
    round < 2 ||
    round > 5
  ) {

    return;

  }


  if(
    playerName !== "Ryan D" &&
    playerName !== "Brad"
  ) {

    return;

  }


  if(
    tee !== "purple" &&
    tee !== "white"
  ) {

    return;

  }


  const key =
    getTeeSelectionKey(
      round,
      playerName
    );


  teeSelections[key] =
    tee;


  try {

    localStorage.setItem(
      "scottsdale26_tee_selections",
      JSON.stringify(
        teeSelections
      )
    );

  } catch(error) {

    console.error(
      "TEE SELECTION SAVE ERROR:",
      error
    );

  }


  /*
  Immediately redraw the scorecard.

  This causes the following to recalculate:

  • Course handicap
  • 85% playing handicap
  • Match handicap
  • Stroke dots
  • Net scores
  • Match results
  */

  renderScorecards();

}

  /*

  if(

  const selectedTee =

/*

COURSE
=====================================================
*/

function getCourse(round) {

  if(round === 1) {
    return dinosaurMountain;
  }

  if(round === 2 || round === 5) {
    return weKoPaCholla;
  }

  return weKoPaSaguaro;
}


/*
=====================================================
TEE ASSIGNMENT
=====================================================
*/

function getPlayerTee(
  playerName,
  course
) {

  /*
  ===============================================
  DINOSAUR MOUNTAIN
  ===============================================

  Everyone = BLACK

  Ryan D + Brad = BLUE
  */

  if(course === dinosaurMountain) {

    return (
      playerName === "Ryan D" ||
      playerName === "Brad"
    )
      ? "blue"
      : "black";

  }


  /*
  ===============================================
  WE-KO-PA
  ===============================================

  Everyone = PURPLE

  Ryan D + Brad = selectable
  PURPLE / WHITE
  */

  if(
    course === weKoPaCholla ||
    course === weKoPaSaguaro
  ) {

    if(
      playerName === "Ryan D" ||
      playerName === "Brad"
    ) {

      return getSelectedTee(
        currentRound,
        playerName
      );

    }


    return "purple";

  }


  return null;

}

/*
=====================================================
DATABASE TEST
=====================================================
*/

async function testDatabase() {

  showStatus(
    "Testing database connection...",
    "loading"
  );

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("scores")
        .select("*")
        .limit(1);

    if(error) {

      console.error(
        "SUPABASE ERROR:",
        error
      );

      showStatus(
        "SUPABASE ERROR: " +
        error.message +
        " | Code: " +
        (error.code || "none"),
        "error"
      );

      return false;
    }

    showStatus(
      "Connected to Supabase successfully.",
      "success"
    );

    setTimeout(
      clearStatus,
      2500
    );

    return true;

  } catch(error) {

    console.error(
      "DATABASE CONNECTION EXCEPTION:",
      error
    );

    showStatus(
      "DATABASE CONNECTION ERROR: " +
      error.message,
      "error"
    );

    return false;

  }

}

async function loadPairings() {

  try {

    const {
      data: pairingRows,
      error: pairingError
    } =
      await supabaseClient
        .from("pairings")
        .select("*")
        .eq(
          "round_number",
          currentRound
        )
        .order(
          "pairing_number",
          {
            ascending:true
          }
        );

    if(pairingError)
      throw pairingError;


    const {
      data: playerRows,
      error: playerError
    } =
      await supabaseClient
        .from("pairing_players")
        .select("*");

    if(playerError)
      throw playerError;


    const loaded = [];


    (pairingRows || [])
      .forEach(pairing => {

        const rows =
          (playerRows || [])
            .filter(
              row =>
                String(row.pairing_id) ===
                String(pairing.id)
            );


        const ryan =
          rows
            .filter(
              row =>
                String(row.side).toUpperCase() === "B"
            )
            .map(
              row => row.player_name
            )
            .filter(Boolean);


        const clayton =
          rows
            .filter(
              row =>
                String(row.side).toUpperCase() === "A"
            )
            .map(
              row => row.player_name
            )
            .filter(Boolean);


        if(
          ryan.length === 2 &&
          clayton.length === 2
        ) {

          loaded.push({

            pairingNumber:
              Number(pairing.pairing_number),

            ryan,
            clayton

          });

        }

      });


    pairings[currentRound] =
      loaded.sort(
        (a,b) =>
          a.pairingNumber -
          b.pairingNumber
      );


  } catch(error) {

    console.error(
      "PAIRING LOAD ERROR:",
      error
    );

    pairings[currentRound] = [];

    showStatus(
      "PAIRING LOAD ERROR: " +
      error.message,
      "error"
    );

  }

}

/*
=====================================================
HANDICAPS
=====================================================
*/

function getPlayerCourseHandicap(
  playerName,
  course
) {

  const handicapIndex =
    Number(
      players[playerName]?.handicap || 0
    );


  const tee =
    getPlayerTee(
      playerName,
      course
    );


  let courseRating;
  let slopeRating;
  let par;


  /*
  ===============================================
  DINOSAUR MOUNTAIN
  ===============================================
  */

  if(course === dinosaurMountain) {

    par = 70;


    if(tee === "blue") {

      courseRating = 67.5;
      slopeRating = 125;

    } else {

      courseRating = 70.1;
      slopeRating = 137;

    }

  }


  /*
  ===============================================
  WE-KO-PA CHOLLA
  ===============================================
  */

  else if(
    course === weKoPaCholla
  ) {

    par = 72;


    if(tee === "white") {

      courseRating = 68.6;
      slopeRating = 122;

    } else {

      courseRating = 71.7;
      slopeRating = 135;

    }

  }


  /*
  ===============================================
  WE-KO-PA SAGUARO
  ===============================================
  */

  else if(
    course === weKoPaSaguaro
  ) {

    par = 71;


    if(tee === "white") {

      courseRating = 68.8;
      slopeRating = 125;

    } else {

      courseRating = 70.2;
      slopeRating = 132;

    }

  }


  else {

    return 0;

  }


  /*
  ===============================================
  WHS COURSE HANDICAP
  ===============================================
  */

  const courseHandicap =
    handicapIndex *
      (slopeRating / 113) +
    (courseRating - par);


  /*
  ===============================================
  SCOTTSDALE 26 = 85%
  ===============================================
  */

  return Math.round(
    courseHandicap * 0.85
  );

}


/*
=====================================================
MATCH PLAYING HANDICAPS
=====================================================
*/

function getMatchPlayingHandicaps(
  match,
  course
) {

  const allPlayers = [
    ...match.ryan,
    ...match.clayton
  ];


  const courseHandicaps =
    allPlayers.map(
      playerName => ({

        playerName,

        playingHandicap:
          getPlayerCourseHandicap(
            playerName,
            course
          )

      })
    );


  const lowest =
    Math.min(
      ...courseHandicaps.map(
        p => p.playingHandicap
      )
    );


  return Object.fromEntries(

    courseHandicaps.map(
      p => [

        p.playerName,

        Math.max(
          0,
          p.playingHandicap -
          lowest
        )

      ]
    )

  );

}


/*
=====================================================
STROKES
=====================================================
*/

function getsStrokesOnHole(
  playerName,
  holeIndex,
  course,
  matchPlayingHandicaps=null
) {

  const playingHandicap =
    matchPlayingHandicaps
      ? Number(
          matchPlayingHandicaps[
            playerName
          ] || 0
        )
      : getPlayerCourseHandicap(
          playerName,
          course
        );


  const holeRank =
    Number(
      course.handicap[holeIndex]
    );


  let strokes = 0;


  if(
    playingHandicap >=
    holeRank
  ) {

    strokes++;

  }


  if(
    playingHandicap > 18 &&
    playingHandicap - 18 >=
    holeRank
  ) {

    strokes++;

  }


  return strokes;

}


function getsStrokeDot(
  playerName,
  holeIndex,
  course,
  matchPlayingHandicaps=null
) {

  return getsStrokesOnHole(
    playerName,
    holeIndex,
    course,
    matchPlayingHandicaps
  ) > 0;

}


function calculateNetScore(
  playerName,
  grossScore,
  holeIndex,
  course,
  matchPlayingHandicaps=null
) {

  if(
    grossScore === "" ||
    grossScore === null ||
    grossScore === undefined
  ) {

    return "";

  }


  return Number(grossScore) -
    getsStrokesOnHole(
      playerName,
      holeIndex,
      course,
      matchPlayingHandicaps
    );

}


/*

CERTIFICATION
=====================================================
*/

function getCertificationKey(
  round,
  matchNumber
) {

  return `${round}_${matchNumber}`;

}


function isScorecardLocked(
  matchNumber
) {

  const certification =
    certifications[
      getCertificationKey(
        currentRound,
        matchNumber
      )
    ];


  return Boolean(
    certification?.marker_certified &&
    certification?.opponent_certified
  );

}


async function loadCertifications() {

  certifications = {};


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from(
          "scorecard_certifications"
        )
        .select("*")
        .eq(
          "round_number",
          currentRound
        );


    if(error)
      throw error;


    (data || [])
      .forEach(row => {

        certifications[
          getCertificationKey(

          )
        ] = {

            Boolean(
              row.marker_certified
            ),

            )

        };

      });


  } catch(error) {

    );

    showStatus(
      "CERTIFICATION LOAD ERROR: " +
      error.message +
      " | Create the scorecard_certifications table if it does not exist.",
      "error"
    );

  }

}


async function updateCertification(
  matchNumber,
  type,
  checked
) {

  const key =
    getCertificationKey(
      currentRound,
      matchNumber
    );


  const current =
    certifications[key] || {

      marker_certified:false,
      opponent_certified:false

    };


  current[type] =
    Boolean(checked);


  certifications[key] =
    current;


  const matchElement =
    [
      ...document.querySelectorAll(".match")
    ]
      .find(
        el =>
          el.dataset.matchNumber ===
          String(matchNumber)
      );


  if(matchElement) {

    applyCertificationState(
      matchElement,
      matchNumber
    );

  }


  try {

    const { error } =
      await supabaseClient
        .from(
          "scorecard_certifications"
        )
        .upsert({

          round_number:
            Number(currentRound),

          match_number:
            Number(matchNumber),

          marker_certified:
            current.marker_certified,

          opponent_certified:
            current.opponent_certified,

          updated_at:
            new Date().toISOString()

        },{
          onConflict:
            "round_number,match_number"
        });


    if(error)
      throw error;


    const status =
      document.getElementById(
        "autosave-status"
      );


    status.className =
      "autosave-status saved";


    status.textContent =
      isScorecardLocked(
        matchNumber
      )
        ? "Scorecard certified and locked ✓"
        : "Certification updated ✓";


    setTimeout(() => {

      if(
        status.textContent.includes(
          "certified"
        ) ||
        status.textContent ===
          "Certification updated ✓"
      ) {

        status.textContent = "";

        status.className =
          "autosave-status";

      }

    },1800);


  } catch(error) {

    console.error(
      "CERTIFICATION SAVE ERROR:",
      error
    );

    showStatus(
      "CERTIFICATION SAVE ERROR: " +
      error.message,
      "error"
    );

  }

}


function applyCertificationState(
  matchElement,
  matchNumber
) {

  const locked =
    isScorecardLocked(
      matchNumber
    );


  matchElement.classList.toggle(
    "scorecard-locked",
    locked
  );


  matchElement
    .querySelectorAll(
      "input.score-input"
    )
    .forEach(
      input => {
        input.disabled =
          locked;
      }
    );


  const markerBox =
    matchElement.querySelector(
      'input[data-cert-type="marker"]'
    );


  const opponentBox =
    matchElement.querySelector(
      'input[data-cert-type="opponent"]'
    );


  const cert =
    certifications[
      getCertificationKey(
        currentRound,
        matchNumber
      )
    ];


  if(markerBox)
    markerBox.checked =
      Boolean(
        cert?.marker_certified
      );


  if(opponentBox)
    opponentBox.checked =
      Boolean(
        cert?.opponent_certified
      );


  const status =
    matchElement.querySelector(
      ".certification-status"
    );


  if(status) {

    status.textContent =
      locked
        ? "✓ Both certifications complete — scorecard is LOCKED"
        : "Both certifications are required to lock this scorecard.";


    status.classList.toggle(
      "locked",
      locked
    );

  }

}

/*
=====================================================
UPDATE SCORE
=====================================================
*/

async function updateScore(
  playerName,
  matchNumber,
  hole,
  value
) {

  if(
    isScorecardLocked(
      matchNumber
    )
  ) {

    showStatus(
      "This scorecard is certified by both marker and opponent and is locked.",
      "error"
    );

    renderScorecards();

    return;

  }


  const key =
    getScoreKey(
      currentRound,
      matchNumber,
      playerName,
      hole
    );


  if(value === "") {

    delete scores[key];


    await deleteScoreAutomatically(
      currentRound,
      matchNumber,
      playerName,
      hole
    );


    updatePlayerTotals(
      matchNumber
    );


    calculateMatch(
      matchNumber
    );


    return;

  }


  scores[key] =
    Number(value);


  updatePlayerTotals(
    matchNumber
  );


  calculateMatch(
    matchNumber
  );


  await saveScoreAutomatically(
    currentRound,
    matchNumber,
    playerName,
    hole,
    Number(value)
  );

}


/*
=====================================================
PLAYER TOTALS
=====================================================
*/

function updatePlayerTotals(
  matchNumber
) {

  const match =
    (pairings[currentRound] || [])
      .find(
        m =>
          Number(m.pairingNumber) ===
          Number(matchNumber)
      );


  if(!match)
    return;


  const allPlayers = [
    ...match.ryan,
    ...match.clayton
  ];


  allPlayers.forEach(
    playerName => {

      let front = 0;
      let back = 0;

      let frontComplete = true;
      let backComplete = true;


      for(
        let hole=1;
        hole<=18;
        hole++
      ) {

        const key =
          getScoreKey(
            currentRound,
            matchNumber,
            playerName,
            hole
          );


        const value =
          scores[key];


        if(
          value === undefined ||
          value === ""
        ) {

          if(hole <= 9)
            frontComplete = false;
          else
            backComplete = false;

          continue;

        }


        if(hole <= 9)
          front += Number(value);
        else
          back += Number(value);

      }


      const frontElement =
        document.getElementById(
          `front-${currentRound}-${matchNumber}-${playerName}`
        );


      const backElement =
        document.getElementById(
          `back-${currentRound}-${matchNumber}-${playerName}`
        );


      const totalElement =
        document.getElementById(
          `total-${currentRound}-${matchNumber}-${playerName}`
        );


      if(frontElement)
        frontElement.textContent =
          frontComplete
            ? front
            : "-";


      if(backElement)
        backElement.textContent =
          backComplete
            ? back
            : "-";


      if(totalElement)
        totalElement.textContent =
          frontComplete &&
          backComplete
            ? front + back
            : "-";

    }
  );

}


/*
=====================================================
MATCH CALCULATIONS
=====================================================
*/

function calculateMatch(
  matchNumber
) {

  const match =
    (pairings[currentRound] || [])
      .find(
        m =>
          Number(m.pairingNumber) ===
          Number(matchNumber)
      );


  if(!match)
    return;


  const course =
    getCourse(
      currentRound
    );


  const matchPlayingHandicaps =
    getMatchPlayingHandicaps(
      match,
      course
    );


  let ryanHolePoints = 0;
  let claytonHolePoints = 0;

  let ryanBirdieBonus = 0;
  let claytonBirdieBonus = 0;

  let frontRyan = 0;
  let frontClayton = 0;

  let backRyan = 0;
  let backClayton = 0;

  let frontRyanHoles = 0;
  let frontClaytonHoles = 0;

  let backRyanHoles = 0;
  let backClaytonHoles = 0;


  for(
    let holeIndex=0;
    holeIndex<18;
    holeIndex++
  ) {

    const hole =
      holeIndex + 1;


    const ryanScores =
      match.ryan.map(
        playerName => {

          const key =
            getScoreKey(
              currentRound,
              matchNumber,
              playerName,
              hole
            );


          const gross =
            scores[key];


          if(
            gross === undefined
          )
            return null;


          return {

            player:playerName,

            gross:Number(gross),

            net:
              calculateNetScore(
                playerName,
                gross,
                holeIndex,
                course,
                matchPlayingHandicaps
              )

          };

        }
      );


    const claytonScores =
      match.clayton.map(
        playerName => {

          const key =
            getScoreKey(
              currentRound,
              matchNumber,
              playerName,
              hole
            );


          const gross =
            scores[key];


          if(
            gross === undefined
          )
            return null;


          return {

            player:playerName,

            gross:Number(gross),

            net:
              calculateNetScore(
                playerName,
                gross,
                holeIndex,
                course,
                matchPlayingHandicaps
              )

          };

        }
      );


    if(
      ryanScores.includes(null) ||
      claytonScores.includes(null)
    ) {

      continue;

    }


    const ryanBest =
      Math.min(
        ...ryanScores.map(
          score => score.net
        )
      );


    const claytonBest =
      Math.min(
        ...claytonScores.map(
          score => score.net
        )
      );


    if(hole <= 9) {

      frontRyan +=
        ryanBest;

      frontClayton +=
        claytonBest;

    } else {

      backRyan +=
        ryanBest;

      backClayton +=
        claytonBest;

    }


    /*
    ===============================================
    RYAN WINS HOLE
    ===============================================
    */

    if(
      ryanBest <
      claytonBest
    ) {

      ryanHolePoints++;


      if(hole <= 9)
        frontRyanHoles++;
      else
        backRyanHoles++;


      const ryanHoleBonus =
        Math.max(
          ...ryanScores.map(
            score => {

              if(
                score.gross <=
                course.pars[holeIndex] - 2
              )
                return 2;


              if(
                score.gross ===
                course.pars[holeIndex] - 1
              )
                return 1;


              return 0;

            }
          )
        );


      ryanBirdieBonus +=
        ryanHoleBonus;

    }


    /*
    ===============================================
    CLAYTON WINS HOLE
    ===============================================
    */

    else if(
      claytonBest <
      ryanBest
    ) {

      claytonHolePoints++;


      if(hole <= 9)
        frontClaytonHoles++;
      else
        backClaytonHoles++;


      const claytonHoleBonus =
        Math.max(
          ...claytonScores.map(
            score => {

              if(
                score.gross <=
                course.pars[holeIndex] - 2
              )
                return 2;


              if(
                score.gross ===
                course.pars[holeIndex] - 1
              )
                return 1;


              return 0;

            }
          )
        );


      claytonBirdieBonus +=
        claytonHoleBonus;

    }

  }


  /*
  ===============================================
  FRONT 9
  ===============================================
  */

  let frontResult =
    "TIED";


  let ryanPoints = 0;
  let claytonPoints = 0;


  if(
    frontRyanHoles >
    frontClaytonHoles
  ) {

    frontResult =
      "RYAN WINS FRONT";

    ryanPoints += 3;

  }


  else if(
    frontClaytonHoles >
    frontRyanHoles
  ) {

    frontResult =
      "CLAYTON WINS FRONT";

    claytonPoints += 3;

  }


  /*
  ===============================================
  BACK 9
  ===============================================
  */

  let backResult =
    "TIED";


  if(
    backRyanHoles >
    backClaytonHoles
  ) {

    backResult =
      "RYAN WINS BACK";

    ryanPoints += 3;

  }


  else if(
    backClaytonHoles >
    backRyanHoles
  ) {

    backResult =
      "CLAYTON WINS BACK";

    claytonPoints += 3;

  }


  /*
  ===============================================
  18 HOLE STROKE
  ===============================================
  */

  const ryan18 =
    frontRyan + backRyan;


  const clayton18 =
    frontClayton + backClayton;


  let strokeResult =
    "IN PROGRESS";


  if(
    ryan18 > 0 &&
    clayton18 > 0
  ) {

    if(
      ryan18 <
      clayton18
    ) {

      strokeResult =
        "RYAN WINS 18";

      ryanPoints += 5;

    }


    else if(
      clayton18 <
      ryan18
    ) {

      strokeResult =
        "CLAYTON WINS 18";

      claytonPoints += 5;

    }


    else {

      strokeResult =
        "18 TIED";

    }

  }


  /*
  ===============================================
  HOLE + BONUS POINTS
  ===============================================
  */

  ryanPoints +=
    ryanHolePoints +
    ryanBirdieBonus;


  claytonPoints +=
    claytonHolePoints +
    claytonBirdieBonus;


  /*
  ===============================================
  ROUND 5 = 1.5X
  ===============================================
  */

  if(
    currentRound === 5
  ) {

    ryanPoints *= 1.5;

    claytonPoints *= 1.5;

  }


  /*
  ===============================================
  DISPLAY RESULTS
  ===============================================
  */

  const frontResultElement =
    document.getElementById(
      `front-result-${matchNumber}`
    );


  if(frontResultElement) {

    frontResultElement.textContent =
      `${frontResult} • ${frontRyanHoles}-${frontClaytonHoles}`;

  }


  const backResultElement =
    document.getElementById(
      `back-result-${matchNumber}`
    );


  if(backResultElement) {

    backResultElement.textContent =
      `${backResult} • ${backRyanHoles}-${backClaytonHoles}`;

  }


  const strokeResultElement =
    document.getElementById(
      `stroke-result-${matchNumber}`
    );


  if(strokeResultElement) {

    strokeResultElement.textContent =
      `${strokeResult} • ${ryan18 || "-"}-${clayton18 || "-"}`;

  }


  const bonusResultElement =
    document.getElementById(
      `bonus-result-${matchNumber}`
    );


  if(bonusResultElement) {

    bonusResultElement.textContent =
      `RYAN +${ryanBirdieBonus} • CLAYTON +${claytonBirdieBonus}`;

  }


  const pointsResultElement =
    document.getElementById(
      `points-result-${matchNumber}`
    );


  if(pointsResultElement) {

    pointsResultElement.textContent =
      `RYAN ${ryanPoints} • CLAYTON ${claytonPoints}`;

  }

}


/*
=====================================================
DELETE ONE SCORE
=====================================================
*/

async function deleteScoreAutomatically(
  roundNumber,
  matchNumber,
  playerName,
  holeNumber
) {

  const status =
    document.getElementById(
      "autosave-status"
    );


  status.className =
    "autosave-status saving";


  status.textContent =
    "Clearing score...";


  try {

    const { error } =
      await supabaseClient
        .from("scores")
        .delete()
        .eq(
          "round_number",
          Number(roundNumber)
        )
        .eq(
          "match_number",
          Number(matchNumber)
        )
        .eq(
          "player_name",
          playerName
        )
        .eq(
          "hole_number",
          Number(holeNumber)
        );


    if(error)
      throw error;


    const key =
      getScoreKey(
        roundNumber,
        matchNumber,
        playerName,
        holeNumber
      );


    delete scores[key];


    status.className =
      "autosave-status saved";


    status.textContent =
      "Score cleared ✓";


    setTimeout(() => {

      if(
        status.textContent ===
        "Score cleared ✓"
      ) {

        status.textContent =
          "";

        status.className =
          "autosave-status";

      }

    },1200);


  } catch(error) {

    console.error(
      "DELETE SCORE ERROR:",
      error
    );


    status.className =
      "autosave-status error";


    status.textContent =
      "CLEAR ERROR: " +
      error.message;

  }

}


/*
=====================================================
CLEAR MATCH SCORES
=====================================================
*/

async function clearMatchScores(
  matchNumber
) {

  const numericMatch =
    Number(matchNumber);


  if(
    isScorecardLocked(
      numericMatch
    )
  ) {

    showStatus(
      `Match ${numericMatch} is certified and locked. Uncheck both certifications before clearing its scores.`,
      "error"
    );

    return;

  }


  if(
    !window.confirm(
      `Clear ALL scores for Match ${numericMatch} in Round ${currentRound}?\n\nThis will permanently delete the saved scores for this match from Supabase.`
    )
  ) {

    return;

  }


  const status =
    document.getElementById(
      "autosave-status"
    );


  status.className =
    "autosave-status saving";


  status.textContent =
    `Clearing Match ${numericMatch}...`;


  try {

    const { error } =
      await supabaseClient
        .from("scores")
        .delete()
        .eq(
          "round_number",
          Number(currentRound)
        )
        .eq(
          "match_number",
          numericMatch
        );


    if(error)
      throw error;


    const prefix =
      `${currentRound}_${numericMatch}_`;


    Object.keys(scores)
      .forEach(
        key => {

          if(
            key.startsWith(prefix)
          ) {

            delete scores[key];

          }

        }
      );


    renderScorecards();


    status.className =
      "autosave-status saved";


    status.textContent =
      `Match ${numericMatch} scores cleared ✓`;


  } catch(error) {

    console.error(
      "CLEAR MATCH SCORES ERROR:",
      error
    );


    status.className =
      "autosave-status error";


    status.textContent =
      "CLEAR ERROR: " +
      error.message;

  }

}


/*
=====================================================
AUTOSAVE SCORE
=====================================================
*/

async function saveScoreAutomatically(
  roundNumber,
  matchNumber,
  playerName,
  holeNumber,
  grossScore
) {

  const status =
    document.getElementById(
      "autosave-status"
    );


  status.className =
    "autosave-status saving";


  status.textContent =
    "Saving...";


  try {

    const { error } =
      await supabaseClient
        .from("scores")
        .upsert(

          {

            round_number:
              Number(roundNumber),

            match_number:
              Number(matchNumber),

            player_name:
              playerName,

            hole_number:
              Number(holeNumber),

            gross_score:
              Number(grossScore)

          },

          {

            onConflict:
              "round_number,match_number,player_name,hole_number"

          }

        );


    if(error)
      throw error;


    status.className =
      "autosave-status saved";


    status.textContent =
      "Score saved ✓";


    setTimeout(() => {

      if(
        status.textContent ===
        "Score saved ✓"
      ) {

        status.textContent =
          "";

        status.className =
          "autosave-status";

      }

    },1500);


  } catch(error) {

    console.error(
      "AUTO-SAVE ERROR:",
      error
    );


    status.className =
      "autosave-status error";


    status.textContent =
      "SAVE ERROR: " +
      error.message;

  }

}


/*
=====================================================
ROUND CHANGE
=====================================================
*/

async function setRound(
  roundNumber
) {

  currentRound =
    roundNumber;


  document
    .querySelectorAll(
      ".round-btn"
    )
    .forEach(
      (button,index) => {

        button.classList.remove(
          "active"
        );


        if(
          index ===
          roundNumber - 1
        ) {

          button.classList.add(
            "active"
          );

        }

      }
    );


  showStatus(
    "Loading Round " +
    currentRound +
    "...",
    "loading"
  );


  await loadPairings();

  await loadScores();

  await loadCertifications();

  renderScorecards();

  clearStatus();

}


/*
=====================================================
REALTIME
=====================================================
*/

function startRealtime() {

  supabaseClient

    .channel(
      "scottsdale26-scorecard-pairings"
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"pairings"
      },
      async() => {

        await loadPairings();

        renderScorecards();

      }
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"pairing_players"
      },
      async() => {

        await loadPairings();

        renderScorecards();

      }
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"scores"
      },
      async(payload) => {

        if(
          payload.new?.round_number ===
          currentRound ||
          payload.old?.round_number ===
          currentRound
        ) {

          await loadScores();

          renderScorecards();

        }

      }
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"scorecard_certifications"
      },
      async() => {

        await loadCertifications();

        renderScorecards();

      }
    )

    .subscribe();

}


/*
=====================================================
START APP
=====================================================
*/

async function startApp() {

  const connected =
    await testDatabase();


  if(!connected)
    return;


  await loadPairings();

  await loadScores();

  await loadCertifications();

  renderScorecards();

  startRealtime();

}


startApp();

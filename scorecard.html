/*

*/

function getScoreKey(

  match,
  player,
  hole
) {

}


/*

=========================================================
*/

function showStatus(

  type = "loading"
) {

  const status =
    document.getElementById("status");

  status.className =

  status.textContent =

function clearStatus() {

/*
=========================================================
DATABASE TEST
=========================================================
*/

async function testDatabase() {

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("scores")
        .select("*")
        .limit(1);

    if (error) {

      console.error(
        "SUPABASE ERROR:",
        error
      );

      showStatus(
        "SUPABASE ERROR: " +
        error.message,
        "error"
      );

      return false;

    }

    return true;

  } catch (error) {

    console.error(error);

    showStatus(
      "DATABASE ERROR: " +
      error.message,
      "error"
    );

    return false;

  }

}


/*
=========================================================
LOAD PAIRINGS
=========================================================
*/

async function loadPairings() {

  try {

    const {
      data: pairingRows,
      error: pairingError
    } =
      await supabaseClient
        .from("pairings")
        .select("*")
        .eq(
          "round_number",
          currentRound
        )
        .order(
          "pairing_number",
          {
            ascending: true
          }
        );

    if (pairingError)
      throw pairingError;


    const {
      data: playerRows,
      error: playerError
    } =
      await supabaseClient
        .from("pairing_players")
        .select("*");

    if (playerError)
      throw playerError;


    const loaded = [];


    (pairingRows || []).forEach(
      pairing => {

        const rows =
          (playerRows || [])
            .filter(
              row =>
                String(row.pairing_id) ===
                String(pairing.id)
            );


        const ryan =
          rows
            .filter(
              row =>
                String(row.side).toUpperCase() ===
                "B"
            )
            .map(
              row =>
                row.player_name
            )
            .filter(Boolean);


        const clayton =
          rows
            .filter(
              row =>
                String(row.side).toUpperCase() ===
                "A"
            )
            .map(
              row =>
                row.player_name
            )
            .filter(Boolean);


        if (
          ryan.length === 2 &&
          clayton.length === 2
        ) {

          loaded.push({

            pairingNumber:
              Number(pairing.pairing_number),

            ryan,

            clayton

          });

        }

      }
    );


    pairings[currentRound] =
      loaded.sort(
        (a, b) =>
          a.pairingNumber -
          b.pairingNumber
      );


  } catch (error) {

    console.error(
      "PAIRING LOAD ERROR:",
      error
    );

    pairings[currentRound] = [];

    showStatus(
      "PAIRING LOAD ERROR: " +
      error.message,
      "error"
    );

  }

}

LOAD SCORES
=========================================================

    } =

        .select("*")
        .eq(

      throw error;


    scores = {};


    (data || []).forEach(
      row => {

        const key =
          getScoreKey(
            row.round_number,
            row.match_number,
            row.player_name,
            row.hole_number
          );

        scores[key] =
          row.gross_score;

      }
    );


  } catch (error) {

    console.error(
      "LOAD SCORE ERROR:",
      error
    );

    showStatus(
      "LOAD ERROR: " +
      error.message,
      "error"
    );

  }

}


/*
=========================================================
CERTIFICATION
=========================================================
*/

function getCertificationKey(
  round,
  matchNumber
) {

  return `${round}_${matchNumber}`;

}


function isScorecardLocked(
  matchNumber
) {

  const certification =
    certifications[
      getCertificationKey(
        currentRound,
        matchNumber
      )
    ];


  return Boolean(
    certification?.marker_certified &&
    certification?.opponent_certified
  );

}


async function loadCertifications() {

  certifications = {};

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("scorecard_certifications")
        .select("*")
        .eq(
          "round_number",
          currentRound
        );

    if (error)
      throw error;


    (data || []).forEach(
      row => {

        certifications[
          getCertificationKey(
            row.round_number,
            row.match_number
          )
        ] = {

          marker_certified:
            Boolean(
              row.marker_certified
            ),

          opponent_certified:
            Boolean(
              row.opponent_certified
            )

        };

      }
    );


  } catch (error) {

    console.error(
      "CERTIFICATION LOAD ERROR:",
      error
    );

    /*
      Do not prevent the scorecard from loading
      if the certification table is unavailable.
    */

  }

}


async function updateCertification(
  matchNumber,
  type,
  checked
) {

  const key =
    getCertificationKey(
      currentRound,
      matchNumber
    );


  const current =
    certifications[key] || {

      marker_certified: false,

      opponent_certified: false

    };


  current[type] =
    Boolean(checked);


  certifications[key] =
    current;


  const matchElement =
    [...document.querySelectorAll(".match")]
      .find(
        el =>
          el.dataset.matchNumber ===
          String(matchNumber)
      );


  if (matchElement) {

    applyCertificationState(
      matchElement,
      matchNumber
    );

  }


  try {

    const {
      error
    } =
      await supabaseClient
        .from("scorecard_certifications")
        .upsert({

          round_number:
            Number(currentRound),

          match_number:
            Number(matchNumber),

          marker_certified:
            current.marker_certified,

          opponent_certified:
            current.opponent_certified,

          updated_at:
            new Date().toISOString()

        }, {

          onConflict:
            "round_number,match_number"

        });


    if (error)
      throw error;


    const status =
      document.getElementById(
        "autosave-status"
      );


    status.className =
      "autosave-status saved";


    status.textContent =
      isScorecardLocked(matchNumber)
        ? "Scorecard certified and locked ✓"
        : "Certification updated ✓";


    setTimeout(() => {

      status.textContent = "";

      status.className =
        "autosave-status";

    }, 1800);


  } catch (error) {

    console.error(
      "CERTIFICATION SAVE ERROR:",
      error
    );

    showStatus(
      "CERTIFICATION SAVE ERROR: " +
      error.message,
      "error"
    );

  }

}


function applyCertificationState(
  matchElement,
  matchNumber
) {

  const locked =
    isScorecardLocked(
      matchNumber
    );


  matchElement.classList.toggle(
    "scorecard-locked",
    locked
  );


  matchElement
    .querySelectorAll(
      "input.score-input"
    )
    .forEach(
      input => {

        input.disabled =
          locked;

      }
    );


  const certification =
    certifications[
      getCertificationKey(
        currentRound,
        matchNumber
      )
    ] || {};


  const markerBox =
    matchElement.querySelector(
      'input[data-cert-type="marker"]'
    );


  const opponentBox =
    matchElement.querySelector(
      'input[data-cert-type="opponent"]'
    );


  if (markerBox) {

    markerBox.checked =
      Boolean(
        certification.marker_certified
      );

  }


  if (opponentBox) {

    opponentBox.checked =
      Boolean(
        certification.opponent_certified
      );

  }


  const status =
    matchElement.querySelector(
      ".certification-status"
    );


  if (status) {

    status.textContent =
      locked
        ? "✓ Both certifications complete — scorecard is LOCKED"
        : "Both certifications are required to lock this scorecard.";

    status.classList.toggle(
      "locked",
      locked
    );

  }

}


/*

function getPlayerCourseHandicap(
  playerName,
  course

  const handicapIndex =
    Number(
      players[playerName]?.handicap || 0
    );


  let courseRating;

  let slopeRating;

  let par;


  /*
    DINOSAUR

    BLACK:
      Everyone except Ryan D and Brad

    BLUE:
      Ryan D and Brad
  */

  if (course === dinosaurMountain) {

    par = 70;


    const isBlueTee =
      playerName === "Ryan D" ||
      playerName === "Brad";


    if (isBlueTee) {

      courseRating = 67.5;

      slopeRating = 125;

    } else {

      courseRating = 70.1;

      slopeRating = 137;

    }

  }


  /*
    CHOLLA

    Everyone Purple
  */

  else if (
    course === weKoPaCholla
  ) {

    par = 72;

    courseRating = 71.7;

    slopeRating = 135;

  }


  /*
    SAGUARO

    Everyone Purple
  */

  else if (
    course === weKoPaSaguaro
  ) {

    par = 71;

    courseRating = 70.2;

    slopeRating = 132;

  }


  else {

    return 0;

  }


  const courseHandicap =

    handicapIndex *
    (slopeRating / 113) +

    (courseRating - par);


  /*
    Scottsdale 26 = 85%
  */

  return Math.round(
    courseHandicap * 0.85
  );

}


/*
=========================================================
MATCH PLAYING HANDICAPS

Lowest 85% playing handicap = zero.

Everyone else receives the difference.
=========================================================
*/

function getMatchPlayingHandicaps(
  match,
  course
) {

  const allPlayers = [

    ...match.ryan,

    ...match.clayton

  ];


  const courseHandicaps =
    allPlayers.map(
      playerName => ({

        playerName,

        playingHandicap:
          getPlayerCourseHandicap(
            playerName,
            course
          )

      })
    );


  const lowest =
    Math.min(
      ...courseHandicaps.map(
        p =>
          p.playingHandicap
      )
    );


  return Object.fromEntries(

    courseHandicaps.map(
      p => [

        p.playerName,

        Math.max(
          0,
          p.playingHandicap -
          lowest
        )

      ]
    )

  );

}


/*
=========================================================
STROKES
=========================================================
*/

function getsStrokesOnHole(
  playerName,
  holeIndex,
  course,
  matchPlayingHandicaps = null
) {

  const playingHandicap =
    matchPlayingHandicaps

      ? Number(
          matchPlayingHandicaps[
            playerName
          ] || 0
        )

      : getPlayerCourseHandicap(
          playerName,
          course
        );


  const holeRank =
    Number(
      course.handicap[
        holeIndex
      ]
    );


  let strokes = 0;


  if (
    playingHandicap >=
    holeRank
  ) {

    strokes++;

  }


  if (
    playingHandicap > 18 &&
    playingHandicap - 18 >=
    holeRank
  ) {

    strokes++;

  }


  return strokes;

}


function getsStrokeDot(
  playerName,
  holeIndex,
  course,
  matchPlayingHandicaps = null
) {

  return getsStrokesOnHole(
    playerName,
    holeIndex,
    course,
    matchPlayingHandicaps
  ) > 0;

}


function calculateNetScore(
  playerName,
  grossScore,
  holeIndex,
  course,
  matchPlayingHandicaps = null
) {

  if (
    grossScore === "" ||
    grossScore === null ||
    grossScore === undefined
  ) {

    return "";

  }


  return Number(grossScore) -

    getsStrokesOnHole(
      playerName,
      holeIndex,
      course,
      matchPlayingHandicaps
    );

}

/*
=========================================================
UPDATE SCORE
=========================================================
*/

async function updateScore(
  playerName,
  matchNumber,
  hole,
  value
) {

  if (
    isScorecardLocked(
      matchNumber
    )
  ) {

    showStatus(
      "This scorecard is certified by both marker and opponent and is locked.",
      "error"
    );

    return;

  }


  const key =
    getScoreKey(
      currentRound,
      matchNumber,
      playerName,
      hole
    );


  if (value === "") {

    delete scores[key];

    updatePlayerTotals(
      matchNumber
    );

    calculateMatch(
      matchNumber
    );

    await deleteScoreAutomatically(
      currentRound,
      matchNumber,
      playerName,
      hole
    );

    return;

  }


  scores[key] =
    Number(value);


  updatePlayerTotals(
    matchNumber
  );


  calculateMatch(
    matchNumber
  );


  await saveScoreAutomatically(

    currentRound,

    matchNumber,

    playerName,

    hole,

    Number(value)

  );

}


/*
=========================================================
PLAYER TOTALS
=========================================================
*/

function updatePlayerTotals(
  matchNumber
) {

  const match =
    (pairings[currentRound] || [])
      .find(
        m =>
          Number(m.pairingNumber) ===
          Number(matchNumber)
      );


  if (!match)
    return;


  const allPlayers = [

    ...match.ryan,

    ...match.clayton

  ];


  allPlayers.forEach(
    playerName => {

      let front = 0;

      let back = 0;

      let frontComplete = true;

      let backComplete = true;


      for (
        let hole = 1;
        hole <= 18;
        hole++
      ) {

        const key =
          getScoreKey(
            currentRound,
            matchNumber,
            playerName,
            hole
          );


        const value =
          scores[key];


        if (
          value === undefined ||
          value === ""
        ) {

          if (hole <= 9)
            frontComplete = false;

          else
            backComplete = false;

          continue;

        }


        if (hole <= 9)
          front += Number(value);

        else
          back += Number(value);

      }


      const frontEl =
        document.getElementById(
          `front-${currentRound}-${matchNumber}-${playerName}`
        );


      const backEl =
        document.getElementById(
          `back-${currentRound}-${matchNumber}-${playerName}`
        );


      const totalEl =
        document.getElementById(
          `total-${currentRound}-${matchNumber}-${playerName}`
        );


      if (frontEl)
        frontEl.textContent =
          frontComplete
            ? front
            : "-";


      if (backEl)
        backEl.textContent =
          backComplete
            ? back
            : "-";


      if (totalEl)
        totalEl.textContent =

          frontComplete &&
          backComplete

            ? front + back

            : "-";

    }
  );

}


/*
=========================================================
MATCH CALCULATIONS
=========================================================

BEST BALL NET MATCH PLAY

Each hole won:
  +1

Front 9:
  +3

Back 9:
  +3

Overall 18:
  +5

Birdie:
  +1

Eagle:
  +2

IMPORTANT:

Birdie/eagle bonus is awarded ONLY:

1. To the team that wins the hole
2. Based on gross score
3. Once per team per hole

If both teammates make birdie:
  Team gets +1 total.

If one makes birdie and the other eagle:
  Team gets +2 total.

If both make eagle:
  Team gets +2 total.

Tied hole:
  No birdie/eagle bonus.
=========================================================
*/

function calculateMatch(
  matchNumber
) {

  const match =
    (pairings[currentRound] || [])
      .find(
        m =>
          Number(m.pairingNumber) ===
          Number(matchNumber)
      );


  if (!match)
    return;


  const course =
    getCourse(currentRound);


  const matchPlayingHandicaps =
    getMatchPlayingHandicaps(
      match,
      course
    );


  let ryanHolePoints = 0;

  let claytonHolePoints = 0;


  let ryanBirdieBonus = 0;

  let claytonBirdieBonus = 0;


  let frontRyan = 0;

  let frontClayton = 0;

  let backRyan = 0;

  let backClayton = 0;


  let frontRyanHoles = 0;

  let frontClaytonHoles = 0;

  let backRyanHoles = 0;

  let backClaytonHoles = 0;


  let completedHoles = 0;


  for (
    let holeIndex = 0;
    holeIndex < 18;
    holeIndex++
  ) {

    const hole =
      holeIndex + 1;


    const ryanScores =
      match.ryan.map(
        playerName => {

          const key =
            getScoreKey(
              currentRound,
              matchNumber,
              playerName,
              hole
            );


          const gross =
            scores[key];


          if (
            gross === undefined ||
            gross === ""
          ) {

            return null;

          }


          return {

            player:
              playerName,

            gross:
              Number(gross),

            net:
              calculateNetScore(
                playerName,
                gross,
                holeIndex,
                course,
                matchPlayingHandicaps
              )

          };

        }
      );


    const claytonScores =
      match.clayton.map(
        playerName => {

          const key =
            getScoreKey(
              currentRound,
              matchNumber,
              playerName,
              hole
            );


          const gross =
            scores[key];


          if (
            gross === undefined ||
            gross === ""
          ) {

            return null;

          }


          return {

            player:
              playerName,

            gross:
              Number(gross),

            net:
              calculateNetScore(
                playerName,
                gross,
                holeIndex,
                course,
                matchPlayingHandicaps
              )

          };

        }
      );


    if (
      ryanScores.includes(null) ||
      claytonScores.includes(null)
    ) {

      continue;

    }


    completedHoles++;


    const ryanBest =
      Math.min(
        ...ryanScores.map(
          score =>
            score.net
        )
      );


    const claytonBest =
      Math.min(
        ...claytonScores.map(
          score =>
            score.net
        )
      );


    if (hole <= 9) {

      frontRyan +=
        ryanBest;

      frontClayton +=
        claytonBest;

    } else {

      backRyan +=
        ryanBest;

      backClayton +=
        claytonBest;

    }


    /*
    ================================================
    RYAN WINS HOLE
    ================================================
    */

    if (
      ryanBest <
      claytonBest
    ) {

      ryanHolePoints++;


      if (hole <= 9)
        frontRyanHoles++;

      else
        backRyanHoles++;


      /*
        TEAM BONUS

        Only ONE bonus per team per hole.

        Eagle takes priority over birdie.
      */

      const ryanHoleBonus =
        Math.max(
          ...ryanScores.map(
            score => {

              if (
                score.gross <=
                course.pars[holeIndex] - 2
              ) {

                return 2;

              }


              if (
                score.gross ===
                course.pars[holeIndex] - 1
              ) {

                return 1;

              }


              return 0;

            }
          )
        );


      ryanBirdieBonus +=
        ryanHoleBonus;

    }


    /*
    ================================================
    CLAYTON WINS HOLE
    ================================================
    */

    else if (
      claytonBest <
      ryanBest
    ) {

      claytonHolePoints++;


      if (hole <= 9)
        frontClaytonHoles++;

      else
        backClaytonHoles++;


      /*
        TEAM BONUS

        Only ONE bonus per team per hole.
      */

      const claytonHoleBonus =
        Math.max(
          ...claytonScores.map(
            score => {

              if (
                score.gross <=
                course.pars[holeIndex] - 2
              ) {

                return 2;

              }


              if (
                score.gross ===
                course.pars[holeIndex] - 1
              ) {

                return 1;

              }


              return 0;

            }
          )
        );


      claytonBirdieBonus +=
        claytonHoleBonus;

    }

  }


  /*
  =====================================================
  MATCH POINTS
  =====================================================
  */

  let ryanPoints = 0;

  let claytonPoints = 0;


  /*
  FRONT 9
  */

  let frontResult =
    "IN PROGRESS";


  if (
    frontRyanHoles +
    frontClaytonHoles >= 9
  ) {

    if (
      frontRyanHoles >
      frontClaytonHoles
    ) {

      frontResult =
        "RYAN WINS FRONT";

      ryanPoints += 3;

    }

    else if (
      frontClaytonHoles >
      frontRyanHoles
    ) {

      frontResult =
        "CLAYTON WINS FRONT";

      claytonPoints += 3;

    }

    else {

      frontResult =
        "FRONT TIED";

    }

  }


  /*
  BACK 9
  */

  let backResult =
    "IN PROGRESS";


  if (
    backRyanHoles +
    backClaytonHoles >= 9
  ) {

    if (
      backRyanHoles >
      backClaytonHoles
    ) {

      backResult =
        "RYAN WINS BACK";

      ryanPoints += 3;

    }

    else if (
      backClaytonHoles >
      backRyanHoles
    ) {

      backResult =
        "CLAYTON WINS BACK";

      claytonPoints += 3;

    }

    else {

      backResult =
        "BACK TIED";

    }

  }


  /*
  =====================================================
  18-HOLE STROKE
  =====================================================
  */

  const ryan18 =
    frontRyan +
    backRyan;


  const clayton18 =
    frontClayton +
    backClayton;


  let strokeResult =
    "IN PROGRESS";


  if (
    completedHoles === 18
  ) {

    if (
      ryan18 <
      clayton18
    ) {

      strokeResult =
        "RYAN WINS 18";

      ryanPoints += 5;

    }

    else if (
      clayton18 <
      ryan18
    ) {

      strokeResult =
        "CLAYTON WINS 18";

      claytonPoints += 5;

    }

    else {

      strokeResult =
        "18 TIED";

    }

  }


  /*
  =====================================================
  ADD HOLE POINTS + BIRDIE/EAGLE TEAM BONUS
  =====================================================
  */

  ryanPoints +=
    ryanHolePoints +
    ryanBirdieBonus;


  claytonPoints +=
    claytonHolePoints +
    claytonBirdieBonus;


  /*
  =====================================================
  ROUND 5 = 1.5X

  This applies to ALL match points,
  including birdie/eagle bonus points.
  =====================================================
  */

  if (
    currentRound === 5
  ) {

    ryanPoints *= 1.5;

    claytonPoints *= 1.5;

  }


  const frontResultEl =
    document.getElementById(
      `front-result-${matchNumber}`
    );


  const backResultEl =
    document.getElementById(
      `back-result-${matchNumber}`
    );


  const strokeResultEl =
    document.getElementById(
      `stroke-result-${matchNumber}`
    );


  const bonusResultEl =
    document.getElementById(
      `bonus-result-${matchNumber}`
    );


  const pointsResultEl =
    document.getElementById(
      `points-result-${matchNumber}`
    );


  if (frontResultEl) {

    frontResultEl.textContent =
      `${frontResult} • ${frontRyanHoles}-${frontClaytonHoles}`;

  }


  if (backResultEl) {

    backResultEl.textContent =
      `${backResult} • ${backRyanHoles}-${backClaytonHoles}`;

  }


  if (strokeResultEl) {

    strokeResultEl.textContent =
      `${strokeResult} • ${
        ryan18 || "-"
      }-${
        clayton18 || "-"
      }`;

  }


  if (bonusResultEl) {

    bonusResultEl.textContent =
      `RYAN +${ryanBirdieBonus} • CLAYTON +${claytonBirdieBonus}`;

  }


  if (pointsResultEl) {

    pointsResultEl.textContent =
      `RYAN ${ryanPoints} • CLAYTON ${claytonPoints}`;

  }

}


/*
=========================================================
SAVE SCORE
=========================================================
*/

async function saveScoreAutomatically(
  roundNumber,
  matchNumber,
  playerName,
  holeNumber,
  grossScore
) {

  const status =
    document.getElementById(
      "autosave-status"
    );


  status.className =
    "autosave-status saving";


  status.textContent =
    "Saving...";


  try {

    const {
      error
    } =
      await supabaseClient
        .from("scores")
        .upsert({

          round_number:
            Number(roundNumber),

          match_number:
            Number(matchNumber),

          player_name:
            playerName,

          hole_number:
            Number(holeNumber),

          gross_score:
            Number(grossScore)

        }, {

          onConflict:
            "round_number,match_number,player_name,hole_number"

        });


    if (error)
      throw error;


    status.className =
      "autosave-status saved";


    status.textContent =
      "Score saved ✓";


    setTimeout(() => {

      status.textContent = "";

      status.className =
        "autosave-status";

    }, 1200);


  } catch (error) {

    console.error(
      "AUTO-SAVE ERROR:",
      error
    );


    status.className =
      "autosave-status error";


    status.textContent =
      "SAVE ERROR: " +
      error.message;

  }

}

/*
=========================================================
CLEAR MATCH SCORES
=========================================================
*/

async function clearMatchScores(
  matchNumber
) {

  const numericMatch =
    Number(matchNumber);


  if (
    isScorecardLocked(
      numericMatch
    )
  ) {

    showStatus(
      `Match ${numericMatch} is certified and locked. Uncheck both certifications before clearing its scores.`,
      "error"
    );

    return;

  }


  const confirmed =
    window.confirm(

      `Clear ALL scores for Match ${numericMatch} in Round ${currentRound}?\n\n` +

      `This will permanently delete the saved scores for this match from Supabase.`

    );


  if (!confirmed)
    return;


  const status =
    document.getElementById(
      "autosave-status"
    );


  status.className =
    "autosave-status saving";


  status.textContent =
    `Clearing Match ${numericMatch}...`;


  try {

    const {
      error
    } =
      await supabaseClient
        .from("scores")
        .delete()
        .eq(
          "round_number",
          Number(currentRound)
        )
        .eq(
          "match_number",
          numericMatch
        );


    if (error)
      throw error;


    const prefix =
      `${currentRound}_${numericMatch}_`;


    Object.keys(scores)
      .forEach(
        key => {

          if (
            key.startsWith(prefix)
          ) {

            delete scores[key];

          }

        }
      );


    renderScorecards();


    status.className =
      "autosave-status saved";


    status.textContent =
      `Match ${numericMatch} scores cleared ✓`;


  } catch (error) {

    console.error(
      "CLEAR MATCH SCORES ERROR:",
      error
    );


    status.className =
      "autosave-status error";


    status.textContent =
      "CLEAR ERROR: " +
      error.message;

  }

}


/*
=========================================================
ROUND CHANGE
=========================================================
*/

async function setRound(
  roundNumber
) {

  currentRound =
    roundNumber;


  document
    .querySelectorAll(
      ".round-btn"
    )
    .forEach(
      (button, index) => {

        button.classList.remove(
          "active"
        );


        if (
          index ===
          roundNumber - 1
        ) {

          button.classList.add(
            "active"
          );

        }

      }
    );


  showStatus(
    `Loading Round ${currentRound}...`,
    "loading"
  );


  await loadPairings();

  await loadScores();

  await loadCertifications();


  renderScorecards();


  clearStatus();

}


/*
=========================================================
REALTIME
=========================================================

Scores:
  Updates from other phones/devices.

Pairings:
  Updates when pairings change.

Certifications:
  Updates when either certification changes.
=========================================================
*/

function startRealtime() {

  supabaseClient

    .channel(
      "scottsdale26-live-scorecard"
    )


    /*
    SCORE CHANGES
    */

    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "scores"
      },

      async payload => {

        if (
          payload.new &&
          Number(
            payload.new.round_number
          ) !== Number(
            currentRound
          )
        ) {

          return;

        }


        if (
          payload.old &&
          Number(
            payload.old.round_number
          ) !== Number(
            currentRound
          )
        ) {

          return;

        }


        await loadScores();

        renderScorecards();

      }
    )


    /*
    PAIRING CHANGES
    */

    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "pairings"
      },

      async () => {

        await loadPairings();

        renderScorecards();

      }
    )


    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "pairing_players"
      },

      async () => {

        await loadPairings();

        renderScorecards();

      }
    )


    /*
    CERTIFICATION CHANGES
    */

    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "scorecard_certifications"
      },

      async payload => {

        const newRow =
          payload.new || {};

        const oldRow =
          payload.old || {};


        const relevantRound =
          Number(
            newRow.round_number ||
            oldRow.round_number
          );


        if (
          relevantRound !==
          Number(currentRound)
        ) {

          return;

        }


        await loadCertifications();

        renderScorecards();

      }
    )


    .subscribe(
      status => {

        console.log(
          "Realtime status:",
          status
        );

      }
    );

}


/*
=========================================================
START APP
=========================================================
*/

async function startApp() {

  const connected =
    await testDatabase();


  if (!connected)
    return;


  await loadPairings();

  await loadScores();

  await loadCertifications();


  renderScorecards();


  startRealtime();

}


startApp();

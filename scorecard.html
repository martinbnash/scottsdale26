/* =========================================================

   ========================================================= */

function getCourse(round){

/* =========================================================

   ========================================================= */

function getScoreKey(

  match,

  hole

   ========================================================= */

function certKey(

){

/* =========================================================
   TEE ASSIGNMENTS
   ========================================================= */

function teeForPlayer(
  player,
  course
){

  if(
    course === dinosaurMountain
  ){

    if(
      player === "Ryan D" ||
      player === "Brad"
    ){

      return "blue";

    }

    return "black";

  }

  return "purple";

}


function getTeeLabel(
  player,
  course
){

  if(
    course === dinosaurMountain
  ){

    if(
      teeForPlayer(
        player,
        course
      ) === "blue"
    ){

      return "BLUE TEES";

    }

    return "BLACK TEES";

  }

  return "PURPLE TEES";

}


/* =========================================================
   COURSE HANDICAP
   ========================================================= */

function getPlayerCourseHandicap(
  playerName,
  course
){

  const handicapIndex =
    Number(
      players[playerName]?.handicap || 0
    );

  let courseRating;
  let slopeRating;


  if(
    course === dinosaurMountain
  ){

    if(
      teeForPlayer(
        playerName,
        course
      ) === "blue"
    ){

      courseRating = 67.5;
      slopeRating = 125;

    }

    else{

      courseRating = 70.1;
      slopeRating = 137;

    }

  }

  else if(
    course === weKoPaCholla
  ){

    courseRating = 71.7;
    slopeRating = 135;

  }

  else{

    courseRating = 70.2;
    slopeRating = 132;

  }


  const courseHandicap =
    handicapIndex *
      (slopeRating / 113) +
    (courseRating - course.par);


  return Math.round(
    courseHandicap * 0.85
  );

}


/* =========================================================
   MATCH PLAY HANDICAPS
   ========================================================= */

function getMatchPlayingHandicaps(
  match,
  course
){

  const names = [
    ...match.ryan,
    ...match.clayton
  ];


  const raw =
    names.map(
      player => ({

        player:player,

        handicap:
          getPlayerCourseHandicap(
            player,
            course
          )

      })
    );


  const lowest =
    Math.min(
      ...raw.map(
        x => x.handicap
      )
    );


  return Object.fromEntries(
    raw.map(
      x => [

        x.player,

        Math.max(
          0,
          x.handicap - lowest
        )

      ]
    )
  );

}


/* =========================================================
   STROKES
   ========================================================= */

function strokesOnHole(
  player,
  holeIndex,
  course,
  matchHandicaps
){

  const playingHandicap =
    Number(
      matchHandicaps?.[player] ??
      getPlayerCourseHandicap(
        player,
        course
      )
    );


  const holeRank =
    Number(
      course.handicap[holeIndex]
    );


  let strokes = 0;


  if(
    playingHandicap >= holeRank
  ){

    strokes++;

  }


  if(
    playingHandicap > 18 &&
    playingHandicap - 18 >= holeRank
  ){

    strokes++;

  }


  return strokes;

}


/* =========================================================
   NET SCORE
   ========================================================= */

function netScore(
  player,
  gross,
  holeIndex,
  course,
  matchHandicaps
){

  return Number(gross) -
    strokesOnHole(
      player,
      holeIndex,
      course,
      matchHandicaps
    );

}


/* =========================================================
   LOCK CHECK
   ========================================================= */

function isLocked(
  matchNumber
){

  const certification =
    certifications[
      certKey(
        currentRound,
        matchNumber
      )
    ];


  return Boolean(
    certification?.marker_certified &&
    certification?.opponent_certified
  );

}


/* =========================================================
   LOAD PAIRINGS
   ========================================================= */

async function loadPairings(){

  const myToken =
    loadToken;


  try{

    const {
      data: pairingRows,
      error: pairingError
    } =
      await supabaseClient
        .from("pairings")
        .select("*")
        .eq(
          "round_number",
          currentRound
        )
        .order(
          "pairing_number",
          {
            ascending:true
          }
        );


    if(pairingError){

      throw pairingError;

    }


    const {
      data: playerRows,
      error: playerError
    } =
      await supabaseClient
        .from("pairing_players")
        .select("*");


    if(playerError){

      throw playerError;

    }


    const loaded = [];


    (pairingRows || []).forEach(
      pairing => {

        const rows =
          (playerRows || [])
            .filter(
              row =>
                String(
                  row.pairing_id
                ) ===
                String(
                  pairing.id
                )
            );


        const ryan =
          rows
            .filter(
              row =>
                String(
                  row.side
                ).toUpperCase() === "B"
            )
            .map(
              row =>
                row.player_name
            )
            .filter(Boolean);


        const clayton =
          rows
            .filter(
              row =>
                String(
                  row.side
                ).toUpperCase() === "A"
            )
            .map(
              row =>
                row.player_name
            )
            .filter(Boolean);


        if(
          ryan.length === 2 &&
          clayton.length === 2
        ){

          loaded.push({

            pairingNumber:
              Number(
                pairing.pairing_number
              ),

            ryan:ryan,

            clayton:clayton

          });

        }

      }
    );


    if(
      myToken === loadToken
    ){

      pairings[currentRound] =
        loaded.sort(
          (a,b) =>
            a.pairingNumber -
            b.pairingNumber
        );

    }

  }

  catch(error){

    console.error(
      "PAIRING LOAD ERROR:",
      error
    );


    pairings[currentRound] = [];


    showStatus(
      "PAIRING LOAD ERROR: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   LOAD SCORES
   ========================================================= */

async function loadScores(){

  try{

    const roundBeingLoaded =
      currentRound;


    const {
      data,
      error
    } =
      await supabaseClient
        .from("scores")
        .select("*")
        .eq(
          "round_number",
          roundBeingLoaded
        );


    if(error){

      throw error;

    }


    /*
       IMPORTANT:
       Only replace local scores if we're
       still on the same round.
    */

    if(
      roundBeingLoaded !== currentRound
    ){

      return;

    }


    const loadedScores = {};


    (data || []).forEach(
      row => {

        loadedScores[
          getScoreKey(
            row.round_number,
            row.match_number,
            row.player_name,
            row.hole_number
          )
        ] =
          row.gross_score;

      }
    );


    scores =
      loadedScores;

  }

  catch(error){

    console.error(
      "SCORE LOAD ERROR:",
      error
    );


    showStatus(
      "SCORE LOAD ERROR: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   LOAD CERTIFICATIONS
   ========================================================= */

async function loadCertifications(){

  certifications = {};

  certificationTableAvailable =
    false;


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from(
          "scorecard_certifications"
        )
        .select("*")
        .eq(
          "round_number",
          currentRound
        );


    if(error){

      throw error;

    }


    certificationTableAvailable =
      true;


    (data || []).forEach(
      row => {

        certifications[
          certKey(
            row.round_number,
            row.match_number
          )
        ] = {

          marker_certified:
            Boolean(
              row.marker_certified
            ),

          opponent_certified:
            Boolean(
              row.opponent_certified
            )

        };

      }
    );

  }

  catch(error){

    console.warn(
      "Certification table unavailable:",
      error.message
    );

  }

}


/* =========================================================
   PLAYER TOTALS
   ========================================================= */

function updatePlayerTotals(
  matchNumber
){

  const match =
    (
      pairings[currentRound] || []
    ).find(
      m =>
        Number(
          m.pairingNumber
        ) ===
        Number(matchNumber)
    );


  if(!match){

    return;

  }


  const playersInMatch = [

    ...match.ryan,

    ...match.clayton

  ];


  playersInMatch.forEach(
    player => {

      let front = 0;
      let back = 0;

      let frontComplete = true;
      let backComplete = true;


      for(
        let hole = 1;
        hole <= 18;
        hole++
      ){

        const value =
          scores[
            getScoreKey(
              currentRound,
              matchNumber,
              player,
              hole
            )
          ];


        if(
          value === undefined ||
          value === null ||
          value === ""
        ){

          if(hole <= 9){

            frontComplete = false;

          }

          else{

            backComplete = false;

          }

          continue;

        }


        if(hole <= 9){

          front += Number(value);

        }

        else{

          back += Number(value);

        }

      }


      const safePlayer =
        player.replace(
          /[^a-zA-Z0-9_-]/g,
          "_"
        );


      const frontElement =
        document.getElementById(
          `front-${currentRound}-${matchNumber}-${safePlayer}`
        );


      const backElement =
        document.getElementById(
          `back-${currentRound}-${matchNumber}-${safePlayer}`
        );


      const totalElement =
        document.getElementById(
          `total-${currentRound}-${matchNumber}-${safePlayer}`
        );


      if(frontElement){

        frontElement.textContent =
          frontComplete
            ? front
            : "-";

      }


      if(backElement){

        backElement.textContent =
          backComplete
            ? back
            : "-";

      }


      if(totalElement){

        totalElement.textContent =
          frontComplete &&
          backComplete
            ? front + back
            : "-";

      }

    }
  );

}


/* =========================================================
   MATCH CALCULATION
   ========================================================= */

function calculateMatch(
  matchNumber
){

  const match =
    (
      pairings[currentRound] || []
    ).find(
      m =>
        Number(
          m.pairingNumber
        ) ===
        Number(matchNumber)
    );


  if(!match){

    return;

  }


  const course =
    getCourse(currentRound);


  const matchHandicaps =
    getMatchPlayingHandicaps(
      match,
      course
    );


  let ryanHolePoints = 0;
  let claytonHolePoints = 0;

  let ryanBonus = 0;
  let claytonBonus = 0;

  let frontRyanHoles = 0;
  let frontClaytonHoles = 0;

  let backRyanHoles = 0;
  let backClaytonHoles = 0;

  let ryan18 = 0;
  let clayton18 = 0;

  let frontComplete = true;
  let backComplete = true;
  let allComplete = true;


  for(
    let holeIndex = 0;
    holeIndex < 18;
    holeIndex++
  ){

    const hole =
      holeIndex + 1;


    const ryanScores =
      match.ryan.map(
        player => {

          const value =
            scores[
              getScoreKey(
                currentRound,
                matchNumber,
                player,
                hole
              )
            ];


          if(
            value === undefined ||
            value === null ||
            value === ""
          ){

            return null;

          }


          return {

            player:player,

            gross:Number(value),

            net:
              netScore(
                player,
                value,
                holeIndex,
                course,
                matchHandicaps
              )

          };

        }
      );


    const claytonScores =
      match.clayton.map(
        player => {

          const value =
            scores[
              getScoreKey(
                currentRound,
                matchNumber,
                player,
                hole
              )
            ];


          if(
            value === undefined ||
            value === null ||
            value === ""
          ){

            return null;

          }


          return {

            player:player,

            gross:Number(value),

            net:
              netScore(
                player,
                value,
                holeIndex,
                course,
                matchHandicaps
              )

          };

        }
      );


    if(
      ryanScores.includes(null) ||
      claytonScores.includes(null)
    ){

      allComplete = false;


      if(holeIndex < 9){

        frontComplete = false;

      }

      else{

        backComplete = false;

      }


      continue;

    }


    const ryanBest =
      Math.min(
        ...ryanScores.map(
          score =>
            score.net
        )
      );


    const claytonBest =
      Math.min(
        ...claytonScores.map(
          score =>
            score.net
        )
      );


    ryan18 += ryanBest;
    clayton18 += claytonBest;


    /*
       RYAN WINS HOLE
    */

    if(
      ryanBest <
      claytonBest
    ){

      ryanHolePoints++;


      if(holeIndex < 9){

        frontRyanHoles++;

      }

      else{

        backRyanHoles++;

      }


      const holeBonus =
        Math.max(
          ...ryanScores.map(
            score => {

              if(
                score.gross <=
                course.pars[holeIndex] - 2
              ){

                return 2;

              }


              if(
                score.gross ===
                course.pars[holeIndex] - 1
              ){

                return 1;

              }


              return 0;

            }
          )
        );


      ryanBonus +=
        holeBonus;

    }


    /*
       CLAYTON WINS HOLE
    */

    else if(
      claytonBest <
      ryanBest
    ){

      claytonHolePoints++;


      if(holeIndex < 9){

        frontClaytonHoles++;

      }

      else{

        backClaytonHoles++;

      }


      const holeBonus =
        Math.max(
          ...claytonScores.map(
            score => {

              if(
                score.gross <=
                course.pars[holeIndex] - 2
              ){

                return 2;

              }


              if(
                score.gross ===
                course.pars[holeIndex] - 1
              ){

                return 1;

              }


              return 0;

            }
          )
        );


      claytonBonus +=
        holeBonus;

    }

  }


  let ryanPoints =
    ryanHolePoints +
    ryanBonus;


  let claytonPoints =
    claytonHolePoints +
    claytonBonus;


  let frontText;


  if(!frontComplete){

    frontText =
      `IN PROGRESS • ${frontRyanHoles}-${frontClaytonHoles}`;

  }

  else if(
    frontRyanHoles >
    frontClaytonHoles
  ){

    ryanPoints += 3;

    frontText =
      `RYAN WINS FRONT • ${frontRyanHoles}-${frontClaytonHoles}`;

  }

  else if(
    frontClaytonHoles >
    frontRyanHoles
  ){

    claytonPoints += 3;

    frontText =
      `CLAYTON WINS FRONT • ${frontRyanHoles}-${frontClaytonHoles}`;

  }

  else{

    frontText =
      `FRONT TIED • ${frontRyanHoles}-${frontClaytonHoles}`;

  }


  let backText;


  if(!backComplete){

    backText =
      `IN PROGRESS • ${backRyanHoles}-${backClaytonHoles}`;

  }

  else if(
    backRyanHoles >
    backClaytonHoles
  ){

    ryanPoints += 3;

    backText =
      `RYAN WINS BACK • ${backRyanHoles}-${backClaytonHoles}`;

  }

  else if(
    backClaytonHoles >
    backRyanHoles
  ){

    claytonPoints += 3;

    backText =
      `CLAYTON WINS BACK • ${backRyanHoles}-${backClaytonHoles}`;

  }

  else{

    backText =
      `BACK TIED • ${backRyanHoles}-${backClaytonHoles}`;

  }


  let strokeText;


  if(!allComplete){

    strokeText =
      `IN PROGRESS • ${ryan18 || "-"}-${clayton18 || "-"}`;

  }

  else if(
    ryan18 <
    clayton18
  ){

    ryanPoints += 5;

    strokeText =
      `RYAN WINS 18 • ${ryan18}-${clayton18}`;

  }

  else if(
    clayton18 <
    ryan18
  ){

    claytonPoints += 5;

    strokeText =
      `CLAYTON WINS 18 • ${ryan18}-${clayton18}`;

  }

  else{

    strokeText =
      `18 TIED • ${ryan18}-${clayton18}`;

  }


  if(currentRound === 5){

    ryanPoints *= 1.5;

    claytonPoints *= 1.5;

  }


  const setResult =
    (id,value) => {

      const element =
        document.getElementById(id);

      if(element){

        element.textContent =
          value;

      }

    };


  setResult(
    `front-result-${matchNumber}`,
    frontText
  );


  setResult(
    `back-result-${matchNumber}`,
    backText
  );


  setResult(
    `stroke-result-${matchNumber}`,
    strokeText
  );


  setResult(
    `bonus-result-${matchNumber}`,
    `RYAN +${ryanBonus} • CLAYTON +${claytonBonus}`
  );


  setResult(
    `points-result-${matchNumber}`,
    `RYAN ${ryanPoints} • CLAYTON ${claytonPoints}`
  );

}


/* =========================================================
   APPLY CERTIFICATION
   ========================================================= */

function applyCertificationState(
  element,
  matchNumber
){

  const locked =
    isLocked(matchNumber);


  element.classList.toggle(
    "scorecard-locked",
    locked
  );


  element
    .querySelectorAll(
      "input.score-input"
    )
    .forEach(
      input => {

        input.disabled =
          locked;

      }
    );


  const certification =
    certifications[
      certKey(
        currentRound,
        matchNumber
      )
    ] || {};


  const marker =
    element.querySelector(
      '[data-cert-type="marker"]'
    );


  const opponent =
    element.querySelector(
      '[data-cert-type="opponent"]'
    );


  if(marker){

    marker.checked =
      Boolean(
        certification.marker_certified
      );

  }


  if(opponent){

    opponent.checked =
      Boolean(
        certification.opponent_certified
      );

  }


  const status =
    element.querySelector(
      ".certification-status"
    );


  if(status){

    status.textContent =
      locked

        ? "✓ Both certifications complete — scorecard is LOCKED"

        : "Both certifications are required to lock this scorecard.";


    status.classList.toggle(
      "locked",
      locked
    );

  }

}

/* =========================================================
   SCORE INPUT HANDLER
   ========================================================= */

async function handleScoreInput(
  event
){

  const input =
    event.currentTarget;


  if(
    input.dataset.savedValue ===
    input.value
  ){

    return;

  }


  const player =
    decodeURIComponent(
      input.dataset.player
    );


  const matchNumber =
    Number(
      input.dataset.match
    );


  const hole =
    Number(
      input.dataset.hole
    );


  await updateScore(
    player,
    matchNumber,
    hole,
    input.value,
    input
  );

}


/* =========================================================
   UPDATE SCORE
   ========================================================= */

async function updateScore(
  player,
  matchNumber,
  hole,
  value,
  inputElement=null
){

  if(
    isLocked(matchNumber)
  ){

    showStatus(
      "This scorecard is certified and locked.",
      "error"
    );


    if(inputElement){

      inputElement.value =
        inputElement.dataset.savedValue || "";

    }


    return;

  }


  const key =
    getScoreKey(
      currentRound,
      matchNumber,
      player,
      hole
    );


  const previousValue =
    scores[key] ?? "";


  /*
     EMPTY SCORE
  */

  if(
    value === ""
  ){

    delete scores[key];


    if(inputElement){

      inputElement.dataset.savedValue =
        "";

    }


    /*
       UPDATE SCREEN IMMEDIATELY
    */

    updatePlayerTotals(
      matchNumber
    );


    calculateMatch(
      matchNumber
    );


    await deleteScore(
      currentRound,
      matchNumber,
      player,
      hole
    );


    return;

  }


  const numericValue =
    Number(value);


  /*
     VALIDATION
  */

  if(
    !Number.isFinite(
      numericValue
    ) ||
    numericValue < 1 ||
    numericValue > 15
  ){

    showStatus(
      "Enter a score from 1 to 15.",
      "error"
    );


    if(inputElement){

      inputElement.value =
        previousValue;

    }


    return;

  }


  /*
     UPDATE LOCAL STATE FIRST.
     This makes scoring instant.
  */

  scores[key] =
    numericValue;


  if(inputElement){

    inputElement.value =
      numericValue;

    inputElement.dataset.savedValue =
      String(numericValue);

  }


  updatePlayerTotals(
    matchNumber
  );


  calculateMatch(
    matchNumber
  );


  /*
     SAVE TO SUPABASE.
  */

  await saveScore(
    currentRound,
    matchNumber,
    player,
    hole,
    numericValue
  );

}


/* =========================================================
   SAVE SCORE
   ========================================================= */

async function saveScore(
  round,
  match,
  player,
  hole,
  gross
){

  const thisSave =
    ++saveSequence;


  setSaveStatus(
    `Saving ${player} • Hole ${hole}...`,
    "saving"
  );


  try{

    const row = {

      round_number:
        Number(round),

      match_number:
        Number(match),

      player_name:
        player,

      hole_number:
        Number(hole),

      gross_score:
        Number(gross)

    };


    const {
      data,
      error
    } =
      await supabaseClient
        .from("scores")
        .upsert(
          row,
          {
            onConflict:
              "round_number,match_number,player_name,hole_number"
          }
        )
        .select();


    if(error){

      throw error;

    }


    console.log(
      "SCORE SAVED:",
      row,
      data
    );


    if(
      thisSave === saveSequence
    ){

      setSaveStatus(
        "Score saved ✓",
        "saved"
      );


      setTimeout(
        () => {

          const status =
            document.getElementById(
              "autosave-status"
            );


          if(
            status &&
            status.textContent ===
            "Score saved ✓"
          ){

            status.textContent =
              "";

            status.className =
              "autosave-status";

          }

        },
        1200
      );

    }

  }

  catch(error){

    console.error(
      "SAVE SCORE ERROR:",
      error
    );


    setSaveStatus(
      "SAVE ERROR: " +
      (
        error.message ||
        "Unable to save score"
      ),
      "error"
    );


    /*
       Do NOT erase the local score.
       This lets you see exactly which score
       failed to save.
    */

  }

}


/* =========================================================
   DELETE SCORE
   ========================================================= */

async function deleteScore(
  round,
  match,
  player,
  hole
){

  setSaveStatus(
    `Clearing ${player} • Hole ${hole}...`,
    "saving"
  );


  try{

    const {
      error
    } =
      await supabaseClient
        .from("scores")
        .delete()
        .eq(
          "round_number",
          Number(round)
        )
        .eq(
          "match_number",
          Number(match)
        )
        .eq(
          "player_name",
          player
        )
        .eq(
          "hole_number",
          Number(hole)
        );


    if(error){

      throw error;

    }


    console.log(
      "SCORE DELETED:",
      round,
      match,
      player,
      hole
    );


    setSaveStatus(
      "Score cleared ✓",
      "saved"
    );


    setTimeout(
      () => {

        const status =
          document.getElementById(
            "autosave-status"
          );


        if(
          status &&
          status.textContent ===
          "Score cleared ✓"
        ){

          status.textContent =
            "";

          status.className =
            "autosave-status";

        }

      },
      1000
    );

  }

  catch(error){

    console.error(
      "DELETE SCORE ERROR:",
      error
    );


    setSaveStatus(
      "CLEAR ERROR: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   CLEAR MATCH
   ========================================================= */

async function clearMatchScores(
  match
){

  if(
    isLocked(match)
  ){

    showStatus(
      `Match ${match} is certified and locked. Uncheck both certifications first.`,
      "error"
    );

    return;

  }


  if(
    !confirm(
      `Clear ALL scores for Match ${match} in Round ${currentRound}?`
    )
  ){

    return;

  }


  try{

    const {
      error
    } =
      await supabaseClient
        .from("scores")
        .delete()
        .eq(
          "round_number",
          Number(currentRound)
        )
        .eq(
          "match_number",
          Number(match)
        );


    if(error){

      throw error;

    }


    Object.keys(
      scores
    ).forEach(
      key => {

        if(
          key.startsWith(
            `${currentRound}_${match}_`
          )
        ){

          delete scores[key];

        }

      }
    );


    renderScorecards();


    setSaveStatus(
      `Match ${match} scores cleared ✓`,
      "saved"
    );

  }

  catch(error){

    console.error(
      "CLEAR MATCH ERROR:",
      error
    );


    showStatus(
      "CLEAR ERROR: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   CERTIFICATION
   ========================================================= */

async function updateCertification(
  match,
  type,
  checked
){

  const key =
    certKey(
      currentRound,
      match
    );


  const certification =
    certifications[key] || {

      marker_certified:false,

      opponent_certified:false

    };


  certification[type] =
    Boolean(checked);


  certifications[key] =
    certification;


  const matchElement =
    [
      ...document.querySelectorAll(
        ".match"
      )
    ].find(
      element =>
        element.dataset.matchNumber ===
        String(match)
    );


  if(matchElement){

    applyCertificationState(
      matchElement,
      match
    );

  }


  if(
    !certificationTableAvailable
  ){

    showStatus(
      "Certification table is not available in Supabase.",
      "error"
    );

    return;

  }


  try{

    const {
      error
    } =
      await supabaseClient
        .from(
          "scorecard_certifications"
        )
        .upsert(

          {

            round_number:
              Number(currentRound),

            match_number:
              Number(match),

            marker_certified:
              certification.marker_certified,

            opponent_certified:
              certification.opponent_certified,

            updated_at:
              new Date().toISOString()

          },

          {

            onConflict:
              "round_number,match_number"

          }

        );


    if(error){

      throw error;

    }


    console.log(
      "CERTIFICATION SAVED:",
      certification
    );

  }

  catch(error){

    console.error(
      "CERTIFICATION SAVE ERROR:",
      error
    );


    showStatus(
      "CERTIFICATION SAVE ERROR: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   ROUND CHANGE
   ========================================================= */

async function setRound(
  round
){

  currentRound =
    Number(round);


  loadToken++;


  document
    .querySelectorAll(
      ".round-btn"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          Number(
            button.dataset.round
          ) === currentRound
        );

      }
    );


  showStatus(
    `Loading Round ${currentRound}...`,
    "loading"
  );


  /*
     Clear old round display immediately.
  */

  document.getElementById(
    "scorecards"
  ).innerHTML = "";


  /*
     Load everything for the new round.
  */

  await Promise.all([

    loadPairings(),

    loadScores(),

    loadCertifications()

  ]);


  renderScorecards();


  clearStatus();

}


/* =========================================================
   REALTIME
   ========================================================= */

function startRealtime(){

  if(
    realtimeChannel
  ){

    supabaseClient.removeChannel(
      realtimeChannel
    );

  }


  realtimeChannel =
    supabaseClient
      .channel(
        "scottsdale26-live-scorecard-v2"
      );


  /*
     SCORES
  */

  realtimeChannel.on(

    "postgres_changes",

    {

      event:"*",

      schema:"public",

      table:"scores"

    },

    async payload => {

      console.log(
        "REALTIME SCORE EVENT:",
        payload
      );


      /*
         If the event belongs to the
         current round, refresh scores.
      */

      const eventRound =
        Number(
          payload?.new?.round_number ??
          payload?.old?.round_number
        );


      if(
        eventRound !== currentRound
      ){

        return;

      }


      /*
         Don't reload immediately while
         the user is actively saving a score.
      */

      await loadScores();


      if(
        eventRound === currentRound
      ){

        renderScorecards();

      }

    }

  );


  /*
     PAIRINGS
  */

  realtimeChannel.on(

    "postgres_changes",

    {

      event:"*",

      schema:"public",

      table:"pairings"

    },

    async payload => {

      console.log(
        "REALTIME PAIRING EVENT:",
        payload
      );


      const eventRound =
        Number(
          payload?.new?.round_number ??
          payload?.old?.round_number
        );


      if(
        eventRound !== currentRound
      ){

        return;

      }


      await loadPairings();

      renderScorecards();

    }

  );


  /*
     PAIRING PLAYERS
  */

  realtimeChannel.on(

    "postgres_changes",

    {

      event:"*",

      schema:"public",

      table:"pairing_players"

    },

    async () => {

      console.log(
        "REALTIME PAIRING PLAYER EVENT"
      );


      await loadPairings();

      renderScorecards();

    }

  );


  /*
     CERTIFICATIONS
  */

  realtimeChannel.on(

    "postgres_changes",

    {

      event:"*",

      schema:"public",

      table:"scorecard_certifications"

    },

    async payload => {

      console.log(
        "REALTIME CERTIFICATION EVENT:",
        payload
      );


      const eventRound =
        Number(
          payload?.new?.round_number ??
          payload?.old?.round_number
        );


      if(
        eventRound !== currentRound
      ){

        return;

      }


      await loadCertifications();

      renderScorecards();

    }

  );


  realtimeChannel.subscribe(
    status => {

      console.log(
        "SCOTTSDALE REALTIME STATUS:",
        status
      );

    }
  );

}


/* =========================================================
   INITIALIZE ROUND BUTTONS
   ========================================================= */

function initializeRoundButtons(){

  document
    .querySelectorAll(
      ".round-btn"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          Number(
            button.dataset.round
          ) === currentRound
        );

      }
    );

}


/* =========================================================
   START APP
   ========================================================= */

async function startApp(){

  /*
     DEFAULT ROUND 4
  */

  currentRound = 4;


  initializeRoundButtons();


  showStatus(
    "Loading Scottsdale 26 Round 4 scorecard...",
    "loading"
  );


  try{

    await Promise.all([

      loadPairings(),

      loadScores(),

      loadCertifications()

    ]);


    renderScorecards();


    clearStatus();


    startRealtime();


    console.log(
      "SCOTTSDALE 26 SCORECARD READY — ROUND 4"
    );

  }

  catch(error){

    console.error(
      "STARTUP ERROR:",
      error
    );


    showStatus(
      "STARTUP ERROR: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   START
   ========================================================= */

startApp();


</script>

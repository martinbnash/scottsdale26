  <script>

  <style>
    :root {
      --bg: #0b1220;
      --panel: #172033;
      --card: #243247;
      --line: #40516a;
      --text: #f8fafc;
      --muted: #a9b6c8;
      --blue: #3b82f6;
      --red: #ef4444;
      --gold: #fbbf24;
      --green: #22c55e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 22px 15px;
      background: #111827;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      color: var(--gold);
      margin-top: 8px;
      font-weight: bold;
    }

    .nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 15px;
      flex-wrap: wrap;
    }

    .nav a,
    .round-btn {
      text-decoration: none;
      border: 0;
      cursor: pointer;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      background: var(--panel);
      color: var(--text);
    }

    .nav a:hover,
    .round-btn:hover {
      opacity: .85;
    }

    .round-btn.active {
      background: var(--gold);
      color: #111827;
    }

    .container {
      width: min(1800px, 98%);
      margin: auto;
      padding-bottom: 40px;
    }

    .status {
      text-align: center;
      padding: 10px;
      margin: 10px auto;
      border-radius: 8px;
      max-width: 900px;
      display: none;
    }

    .status.error {
      display: block;
      background: #7f1d1d;
      border: 1px solid #ef4444;
      color: white;
    }

    .status.success {
      display: block;
      background: #14532d;
      border: 1px solid #22c55e;
    }

    .status.loading {
      display: block;
      background: #1e3a8a;
      border: 1px solid #3b82f6;
    }

    .course-info {
      text-align: center;
      margin: 15px 0;
      color: var(--muted);

    .match {

      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 22px;
      overflow-x: auto;
    }

    .match-header {
      text-align: center;
      margin-bottom: 15px;
    }

    .match-header h2 {
      margin: 0;
      color: var(--gold);
    }

    .vs {
      color: var(--muted);
      margin-top: 5px;
    }

    .scorecard-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 1200px;
      border-collapse: collapse;
      background: white;
      color: #111827;
    }

    th,
    td {
      border: 1px solid #777;
      text-align: center;
      padding: 6px;
      min-width: 48px;
    }

    th {
      background: #6b4f0d;
      color: white;
      font-weight: bold;
    }

    .name-cell {
      text-align: left;
      font-weight: bold;
      min-width: 160px;
      padding-left: 10px;
    }

    .team-ryan {
      background: #fee2e2;
    }

    .team-clayton {
      background: #dbeafe;
    }

    .par-row td,
    .par-row .name-cell {
      background: #d6c4a4;
      font-weight: bold;
    }

    .hdcp-row td,
    .hdcp-row .name-cell {
      background: #f1f1f1;
      font-weight: bold;
    }

    input.score-input {
      width: 44px;
      text-align: center;
      border: 0;
      background: transparent;
      font-size: 16px;
      font-weight: bold;
    }

    input.score-input:focus {
      outline: 2px solid var(--gold);
      background: #fffbea;
    }

    .total-cell {
      font-weight: bold;
      background: #f3f4f6;
    }

    .net-cell {
      font-weight: bold;
    }

    .match-results {
      margin-top: 15px;
      background: var(--card);
      border-radius: 10px;
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      text-align: center;
    }

    .result-box {
      background: #111827;
      padding: 12px;
      border-radius: 8px;
    }

    .result-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .result-value {
      color: var(--gold);
      font-size: 20px;
      font-weight: bold;
    }

    .controls {
      text-align: center;
      margin: 15px;
    }

    .save-btn {

    .save-btn:hover {

    }

    .debug {
      margin-top: 15px;
      background: #111827;
      border: 1px solid var(--line);
      padding: 12px;
      border-radius: 8px;
      color: var(--muted);
      white-space: pre-wrap;
      display: none;
    }

    @media (max-width: 900px) {
      .match-results {
        grid-template-columns: repeat(2, 1fr);
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

  <script>

    /*

    const pairings = {

        },

        }
      ],

      3: [
        {
          ryan: ["Brad", "Brent"],

        },
        {

        },

      ],

        },

        },

        }
      ]
    };


    /*
      =====================================================
      COURSE DATA

      Dinosaur Mountain - Blue
      We-Ko-Pa - Purple

      Round 1 Dinosaur
      Rounds 2-5 We-Ko-Pa
      =====================================================
    */

    const dinosaurMountain = {

      name: "Dinosaur Mountain • Blue Tees",

      pars: [
        4, 3, 5, 4, 3, 5, 4, 3, 5,
        3, 5, 4, 5, 3, 4, 5, 3, 4
      ],

      handicap: [
        5, 15, 3, 1, 9, 11, 7, 13, 17,
        16, 18, 12, 2, 6, 4, 14, 8, 10
      ]
    };


    /*
      IMPORTANT:
      We-Ko-Pa Purple data is kept separate because
      Cholla and Saguaro use different scorecards.
    */

    const weKoPaCholla = {

      name: "We-Ko-Pa Cholla • Purple Tees",

      pars: [
        4, 4, 5, 4, 3, 4, 4, 3, 5,
        4, 5, 3, 4, 4, 3, 5, 4, 4
      ],

      handicap: [
        9, 5, 1, 13, 17, 7, 11, 15, 3,
        12, 4, 18, 6, 10, 16, 2, 8, 14
      ]
    };


    const weKoPaSaguaro = {

      name: "We-Ko-Pa Saguaro • Purple Tees",

      pars: [
        4, 4, 5, 4, 3, 4, 4, 3, 5,
        4, 5, 3, 4, 4, 3, 5, 4, 4
      ],

      handicap: [
        9, 5, 1, 13, 17, 7, 11, 15, 3,
        12, 4, 18, 6, 10, 16, 2, 8, 14
      ]
    };


    /*
      =====================================================
      APP STATE
      =====================================================
    */

    let currentRound = 1;

    let scores = {};


    function getCourse(round) {

      if (round === 1) {
        return dinosaurMountain;
      }

      if (round === 2 || round === 5) {
        return weKoPaCholla;
      }

      return weKoPaSaguaro;
    }


    function getScoreKey(round, match, player, hole) {

      return `${round}_${match}_${player}_${hole}`;
    }


    function showStatus(message, type = "loading") {

      const status = document.getElementById("status");

      status.className = `status ${type}`;

      status.textContent = message;
    }


    function clearStatus() {

      const status = document.getElementById("status");

      status.style.display = "none";

      status.textContent = "";
    }


    /*
      =====================================================
      DATABASE TEST
      =====================================================
    */

    async function testDatabase() {

      showStatus("Testing database connection...", "loading");

      try {

        const { data, error } = await supabaseClient
          .from("scores")
          .select("*")
          .limit(1);

        if (error) {

          console.error("SUPABASE ERROR:", error);

          showStatus(
            "SUPABASE ERROR: " +
            error.message +
            " | Code: " +
            (error.code || "none"),
            "error"
          );

          return false;
        }

        showStatus(
          "Connected to Supabase successfully.",
          "success"
        );

        setTimeout(clearStatus, 2500);

        return true;

      } catch (error) {

        console.error("DATABASE CONNECTION EXCEPTION:", error);

        showStatus(
          "DATABASE CONNECTION ERROR: " +
          error.message,
          "error"
        );

        return false;
      }
    }


    /*
      =====================================================
      LOAD SCORES
      =====================================================
    */

    async function loadScores() {

      try {

        const { data, error } = await supabaseClient
          .from("scores")
          .select("*")
          .eq("round_number", currentRound);

        if (error) {

          console.error(error);

          showStatus(
            "LOAD ERROR: " +
            error.message +
            " | Code: " +
            (error.code || "none"),
            "error"
          );

          return;
        }

        scores = {};

        data.forEach(row => {

          const key = getScoreKey(
            row.round_number,
            row.match_number,
            row.player_name,
            row.hole_number
          );

          scores[key] = row.gross_score;
        });

      } catch (error) {

        console.error(error);

        showStatus(
          "LOAD EXCEPTION: " + error.message,
          "error"
        );
      }
    }


    /*
      =====================================================
      HANDICAP STROKES
      =====================================================
    */

    function getPlayerCourseHandicap(playerName) {

      /*
        For now this uses the frozen tournament handicap.

        We can replace this with exact course handicap
        calculations once all course rating/slope values
        are entered.
      */

      return Math.round(players[playerName].handicap);
    }


    function getsStrokesOnHole(playerName, holeIndex, course) {

      const courseHandicap =
        getPlayerCourseHandicap(playerName);

      const holeRank =
        course.handicap[holeIndex];

      let strokes = 0;

      if (courseHandicap >= holeRank) {
        strokes++;
      }

      if (courseHandicap > 18 &&
          courseHandicap - 18 >= holeRank) {
        strokes++;
      }

      return strokes;
    }


    function calculateNetScore(
      playerName,
      grossScore,
      holeIndex,
      course
    ) {

      if (
        grossScore === "" ||
        grossScore === null ||
        grossScore === undefined
      ) {
        return "";
      }

      const strokes =
        getsStrokesOnHole(
          playerName,
          holeIndex,
          course
        );

      return Number(grossScore) - strokes;
    }


    /*
      =====================================================
      RENDER SCORECARD
      =====================================================
    */

    function renderScorecards() {

      const course =
        getCourse(currentRound);

      document.getElementById("courseInfo").innerHTML =
        `<strong>ROUND ${currentRound}</strong><br>${course.name}`;

      const container =
        document.getElementById("scorecards");

      container.innerHTML = "";

      pairings[currentRound].forEach(
        (match, matchIndex) => {

          const matchNumber =
            matchIndex + 1;

          const allPlayers = [
            ...match.ryan,
            ...match.clayton
          ];

          const div =
            document.createElement("div");

          div.className = "match";

          let html = `
            <div class="match-header">
              <h2>MATCH ${matchNumber}</h2>

              <div class="vs">
                ${match.ryan.join(" & ")}
                VS
                ${match.clayton.join(" & ")}
              </div>
            </div>

            <div class="scorecard-wrap">

              <table>

                <thead>

                  <tr>

                    <th>PLAYER</th>
          `;

          for (let hole = 1; hole <= 18; hole++) {

            html += `<th>${hole}</th>`;
          }

          html += `
                    <th>OUT</th>
                    <th>IN</th>
                    <th>TOTAL</th>
                  </tr>

                </thead>

                <tbody>
          `;


          /*
            PAR ROW
          */

          html += `
            <tr class="par-row">

              <td class="name-cell">
                PAR
              </td>
          `;

          for (
            let holeIndex = 0;
            holeIndex < 18;
            holeIndex++
          ) {

            html += `
              <td>
                ${course.pars[holeIndex]}
              </td>
            `;
          }

          const frontPar =
            course.pars
              .slice(0, 9)
              .reduce((a, b) => a + b, 0);

          const backPar =
            course.pars
              .slice(9, 18)
              .reduce((a, b) => a + b, 0);

          html += `
              <td>${frontPar}</td>
              <td>${backPar}</td>
              <td>${frontPar + backPar}</td>
            </tr>
          `;


          /*
            HANDICAP ROW
          */

          html += `
            <tr class="hdcp-row">

              <td class="name-cell">
                HDCP
              </td>
          `;

          for (
            let holeIndex = 0;
            holeIndex < 18;
            holeIndex++
          ) {

            html += `
              <td>
                ${course.handicap[holeIndex]}
              </td>
            `;
          }

          html += `
              <td></td>
              <td></td>
              <td></td>
            </tr>
          `;


          /*
            PLAYER ROWS
          */

          allPlayers.forEach(
            playerName => {

              const teamClass =
                players[playerName].team === "Ryan"
                  ? "team-ryan"
                  : "team-clayton";

              html += `
                <tr class="${teamClass}">

                  <td class="name-cell">

                    ${playerName}

                    <br>

                    <small>
                      HCP ${players[playerName].handicap}
                    </small>

                  </td>
              `;

              for (
                let holeIndex = 0;
                holeIndex < 18;
                holeIndex++
              ) {

                const hole =
                  holeIndex + 1;

                const key =
                  getScoreKey(
                    currentRound,
                    matchNumber,
                    playerName,
                    hole
                  );

                const value =
                  scores[key] ?? "";

                html += `
                  <td>

                    <input
                      class="score-input"
                      type="number"
                      min="1"
                      max="15"
                      value="${value}"

                      onchange="
                        updateScore(
                          '${playerName}',
                          ${matchNumber},
                          ${hole},
                          this.value
                        )
                      "
                    >

                  </td>
                `;
              }

              html += `
                    <td
                      id="front-${currentRound}-${matchNumber}-${playerName}"
                      class="total-cell"
                    >
                      -
                    </td>

                    <td
                      id="back-${currentRound}-${matchNumber}-${playerName}"
                      class="total-cell"
                    >
                      -
                    </td>

                    <td
                      id="total-${currentRound}-${matchNumber}-${playerName}"
                      class="total-cell"
                    >
                      -
                    </td>

                  </tr>
              `;
            }
          );

          html += `
                </tbody>

              </table>

            </div>

            <div class="match-results">

              <div class="result-box">

                <div class="result-label">
                  FRONT 9
                </div>

                <div
                  class="result-value"
                  id="front-result-${matchNumber}"
                >
                  -
                </div>

              </div>

              <div class="result-box">

                <div class="result-label">
                  BACK 9
                </div>

                <div
                  class="result-value"
                  id="back-result-${matchNumber}"
                >
                  -
                </div>

              </div>

              <div class="result-box">

                <div class="result-label">
                  18-HOLE STROKE
                </div>

                <div
                  class="result-value"
                  id="stroke-result-${matchNumber}"
                >
                  -
                </div>

              </div>

              <div class="result-box">

                <div class="result-label">
                  MATCH POINTS
                </div>

                <div
                  class="result-value"
                  id="points-result-${matchNumber}"
                >
                  -
                </div>

              </div>

            </div>
          `;

          div.innerHTML = html;

          container.appendChild(div);

          updatePlayerTotals(matchNumber);

          calculateMatch(matchNumber);
        }
      );
    }


    /*
      =====================================================
      UPDATE SCORE
      =====================================================
    */

    function updateScore(
      playerName,
      matchNumber,
      hole,
      value
    ) {

      const key =
        getScoreKey(
          currentRound,
          matchNumber,
          playerName,
          hole
        );

      if (value === "") {

        delete scores[key];

      } else {

        scores[key] = Number(value);
      }

      updatePlayerTotals(matchNumber);

      calculateMatch(matchNumber);
    }


    /*
      =====================================================
      PLAYER TOTALS
      =====================================================
    */

    function updatePlayerTotals(matchNumber) {

      const match =
        pairings[currentRound][matchNumber - 1];

      const allPlayers = [
        ...match.ryan,
        ...match.clayton
      ];

      allPlayers.forEach(
        playerName => {

          let front = 0;
          let back = 0;

          let frontComplete = true;
          let backComplete = true;

          for (
            let hole = 1;
            hole <= 18;
            hole++
          ) {

            const key =
              getScoreKey(
                currentRound,
                matchNumber,
                playerName,
                hole
              );

            const value =
              scores[key];

            if (
              value === undefined ||
              value === ""
            ) {

              if (hole <= 9) {
                frontComplete = false;
              } else {
                backComplete = false;
              }

              continue;
            }

            if (hole <= 9) {
              front += Number(value);
            } else {
              back += Number(value);
            }
          }

          document.getElementById(
            `front-${currentRound}-${matchNumber}-${playerName}`
          ).textContent =
            frontComplete ? front : "-";

          document.getElementById(
            `back-${currentRound}-${matchNumber}-${playerName}`
          ).textContent =
            backComplete ? back : "-";

          document.getElementById(
            `total-${currentRound}-${matchNumber}-${playerName}`
          ).textContent =
            frontComplete && backComplete
              ? front + back
              : "-";
        }
      );
    }


    /*
      =====================================================
      MATCH CALCULATIONS

      Best ball net match play.
      Each hole won = 1 point.
      Front 9 = 3 points.
      Back 9 = 3 points.
      Overall 18 = 5 points.

      Birdie +1
      Eagle +2

      Only if the side wins the hole.
      =====================================================
    */

    function calculateMatch(matchNumber) {

      const match =
        pairings[currentRound][matchNumber - 1];

      const course =
        getCourse(currentRound);

      let ryanHolePoints = 0;
      let claytonHolePoints = 0;

      let ryanBirdieBonus = 0;
      let claytonBirdieBonus = 0;

      let frontRyan = 0;
      let frontClayton = 0;

      let backRyan = 0;
      let backClayton = 0;

      let frontRyanHoles = 0;
      let frontClaytonHoles = 0;

      let backRyanHoles = 0;
      let backClaytonHoles = 0;

      for (
        let holeIndex = 0;
        holeIndex < 18;
        holeIndex++
      ) {

        const hole =
          holeIndex + 1;

        const ryanScores =
          match.ryan.map(
            playerName => {

              const key =
                getScoreKey(
                  currentRound,
                  matchNumber,
                  playerName,
                  hole
                );

              const gross =
                scores[key];

              if (
                gross === undefined
              ) {
                return null;
              }

              return {
                player: playerName,
                gross: Number(gross),
                net: calculateNetScore(
                  playerName,
                  gross,
                  holeIndex,
                  course
                )
              };
            }
          );

        const claytonScores =
          match.clayton.map(
            playerName => {

              const key =
                getScoreKey(
                  currentRound,
                  matchNumber,
                  playerName,
                  hole
                );

              const gross =
                scores[key];

              if (
                gross === undefined
              ) {
                return null;
              }

              return {
                player: playerName,
                gross: Number(gross),
                net: calculateNetScore(
                  playerName,
                  gross,
                  holeIndex,
                  course
                )
              };
            }
          );


        if (
          ryanScores.includes(null) ||
          claytonScores.includes(null)
        ) {
          continue;
        }


        const ryanBest =
          Math.min(
            ...ryanScores.map(
              score => score.net
            )
          );

        const claytonBest =
          Math.min(
            ...claytonScores.map(
              score => score.net
            )
          );


        if (hole <= 9) {

          frontRyan += ryanBest;
          frontClayton += claytonBest;
        } else {

          backRyan += ryanBest;
          backClayton += claytonBest;
        }


        if (ryanBest < claytonBest) {

          ryanHolePoints++;

          if (hole <= 9) {
            frontRyanHoles++;
          } else {
            backRyanHoles++;
          }

          ryanScores.forEach(
            score => {

              if (
                score.gross ===
                course.pars[holeIndex] - 1
              ) {
                ryanBirdieBonus++;
              }

              if (
                score.gross <=
                course.pars[holeIndex] - 2
              ) {
                ryanBirdieBonus += 2;
              }
            }
          );
        }


        if (claytonBest < ryanBest) {

          claytonHolePoints++;

          if (hole <= 9) {
            frontClaytonHoles++;
          } else {
            backClaytonHoles++;
          }

          claytonScores.forEach(
            score => {

              if (
                score.gross ===
                course.pars[holeIndex] - 1
              ) {
                claytonBirdieBonus++;
              }

              if (
                score.gross <=
                course.pars[holeIndex] - 2
              ) {
                claytonBirdieBonus += 2;
              }
            }
          );
        }
      }


      /*
        Front nine 3 points
      */

      let frontResult = "TIED";

      let ryanPoints = 0;
      let claytonPoints = 0;

      if (
        frontRyanHoles >
        frontClaytonHoles
      ) {

        frontResult =
          "RYAN WINS FRONT";

        ryanPoints += 3;

      } else if (
        frontClaytonHoles >
        frontRyanHoles
      ) {

        frontResult =
          "CLAYTON WINS FRONT";

        claytonPoints += 3;
      }


      /*
        Back nine 3 points
      */

      let backResult = "TIED";

      if (
        backRyanHoles >
        backClaytonHoles
      ) {

        backResult =
          "RYAN WINS BACK";

        ryanPoints += 3;

      } else if (
        backClaytonHoles >
        backRyanHoles
      ) {

        backResult =
          "CLAYTON WINS BACK";

        claytonPoints += 3;
      }


      /*
        18-hole stroke play
      */

      const ryan18 =
        frontRyan + backRyan;

      const clayton18 =
        frontClayton + backClayton;

      let strokeResult = "IN PROGRESS";

      if (
        ryan18 > 0 &&
        clayton18 > 0
      ) {

        if (
          ryan18 < clayton18
        ) {

          strokeResult =
            "RYAN WINS 18";

          ryanPoints += 5;

        } else if (
          clayton18 < ryan18
        ) {

          strokeResult =
            "CLAYTON WINS 18";

          claytonPoints += 5;

        } else {

          strokeResult =
            "18 TIED";
        }
      }


      ryanPoints +=
        ryanHolePoints +
        ryanBirdieBonus;

      claytonPoints +=
        claytonHolePoints +
        claytonBirdieBonus;


      /*
        Round 5 is 1.5x
      */

      if (currentRound === 5) {

        ryanPoints *= 1.5;

        claytonPoints *= 1.5;
      }


      document.getElementById(
        `front-result-${matchNumber}`
      ).textContent =
        `${frontResult} • ${frontRyanHoles}-${frontClaytonHoles}`;


      document.getElementById(
        `back-result-${matchNumber}`
      ).textContent =
        `${backResult} • ${backRyanHoles}-${backClaytonHoles}`;


      document.getElementById(
        `stroke-result-${matchNumber}`
      ).textContent =
        `${strokeResult} • ${ryan18 || "-"}-${clayton18 || "-"}`;


      document.getElementById(
        `points-result-${matchNumber}`
      ).textContent =
        `RYAN ${ryanPoints} • CLAYTON ${claytonPoints}`;
    }


    /*
      =====================================================
      SAVE TO SUPABASE
      =====================================================
    */

    async function saveAllScores() {

      showStatus(
        "Saving scores...",
        "loading"
      );

      const rows = [];

      Object.keys(scores).forEach(
        key => {

          const [
            roundNumber,
            matchNumber,
            playerName,
            holeNumber
          ] =
            key.split("_");

          rows.push({

            round_number:
              Number(roundNumber),

            match_number:
              Number(matchNumber),

            player_name:
              playerName,

            hole_number:
              Number(holeNumber),

            gross_score:
              Number(scores[key])
          });
        }
      );


      if (rows.length === 0) {

        showStatus(
          "No scores to save.",
          "error"
        );

        return;
      }


      try {

        const { error } =
          await supabaseClient
            .from("scores")
            .upsert(
              rows,
              {
                onConflict:
                  "round_number,match_number,player_name,hole_number"
              }
            );


        if (error) {

          console.error(
            "SAVE ERROR:",
            error
          );

          showStatus(
            "SAVE ERROR: " +
            error.message +
            " | Code: " +
            (error.code || "none") +
            " | Details: " +
            (error.details || "none"),
            "error"
          );

          return;
        }


        showStatus(
          "Scores saved successfully!",
          "success"
        );

        setTimeout(
          clearStatus,
          2500
        );

      } catch (error) {

        console.error(
          "SAVE EXCEPTION:",
          error
        );

        showStatus(
          "SAVE EXCEPTION: " +
          error.message,
          "error"
        );
      }
    }


    /*
      =====================================================
      ROUND CHANGE
      =====================================================
    */

    async function setRound(roundNumber) {

      currentRound =
        roundNumber;

      document
        .querySelectorAll(".round-btn")
        .forEach(
          (button, index) => {

            button.classList.remove(
              "active"
            );

            if (
              index ===
              roundNumber - 1
            ) {

              button.classList.add(
                "active"
              );
            }
          }
        );


      showStatus(
        "Loading Round " +
        currentRound +
        "...",
        "loading"
      );


      await loadScores();

      renderScorecards();

      clearStatus();
    }


    /*
      =====================================================
      START APP
      =====================================================
    */

    async function startApp() {

      const connected =
        await testDatabase();

      if (!connected) {
        return;
      }

      await loadScores();

      renderScorecards();
    }


    startApp();

  </script>

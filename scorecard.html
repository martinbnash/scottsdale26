    :root {
      --bg: #0b1220;
      --panel: #172033;
      --card: #243247;
      --line: #40516a;
      --text: #f8fafc;
      --muted: #a9b6c8;
      --blue: #3b82f6;
      --red: #ef4444;
      --gold: #fbbf24;
      --green: #22c55e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b1220;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 22px 15px 15px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 6vw, 42px);
    }

    .subtitle {
      color: var(--muted);
      margin-top: 6px;
      font-weight: bold;
    }

    .back-link {
      display: inline-block;
      margin-top: 14px;
      padding: 10px 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    .tabs,
    .match-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 15px 10px;
    }

    .tab,
    .match-tab {
      border: 1px solid var(--line);
      background: var(--panel);
      color: white;
      border-radius: 10px;
      padding: 11px 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab.active {
      background: var(--gold);
      color: #111827;
      border-color: var(--gold);
    }

    .match-tab.active {
      border-color: var(--gold);
      color: var(--gold);
    }

    .course-info {
      text-align: center;
      padding: 5px 15px 15px;
    }

    .course-name {
      color: var(--gold);
      font-size: 22px;
      font-weight: bold;
    }

    .course-details {
      color: var(--muted);
      margin-top: 5px;
    }

    .container {
      max-width: 1600px;
      margin: auto;
      padding: 0 12px 50px;
    }

    .match-heading {
      text-align: center;
      margin: 15px 0;
      color: var(--gold);
      font-size: 20px;
      font-weight: bold;
    }

    .scorecard-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
    }

    table {
      width: 100%;
      min-width: 1550px;
      border-collapse: collapse;
    }

    th,
    td {
      border: 1px solid var(--line);
      text-align: center;
      padding: 7px 3px;
    }

    th {
      background: #111827;
      color: white;
    }

    .player-column {
      position: sticky;
      left: 0;
      z-index: 3;
      min-width: 165px;
      width: 165px;
      background: #172033;
      text-align: left;
      padding-left: 10px;
      font-weight: bold;
    }

    th.player-column {
      z-index: 5;
    }

    .hole-header {
      min-width: 57px;
      width: 57px;
      color: var(--gold);
    }

    .summary-column {
      min-width: 65px;
      background: #111827;
      font-weight: bold;
    }

    .par-row td,
    .hcp-row td {
      background: #101827;
      color: var(--muted);
      font-size: 12px;
      font-weight: bold;
    }

    .team-clayton {
      background: rgba(59, 130, 246, 0.10);
    }

    .team-ryan {
      background: rgba(239, 68, 68, 0.10);
    }

    .player-name {
      font-size: 15px;
    }

    .player-info {
      display: block;
      margin-top: 3px;

      font-weight: normal;

    .gross-input {
      width: 42px;

      text-align: center;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #0f172a;
      color: white;
    }

    .gross-input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .net-row td {
      padding: 4px 3px;
      font-size: 12px;
      color: #93c5fd;
      background: #0f172a;

    .net-label {
      color: #93c5fd !important;
      font-size: 12px;
      font-weight: bold;
    }

    .stroke-dot {
      display: block;
      color: var(--gold);
      font-size: 9px;

    }

    .team-row td {
      background: #111827;
      color: var(--green);
      font-weight: bold;
    }

    .team-row .player-column {
      background: #111827;
      color: var(--green);
    }

    .result-row td {

    }

    .winner-clayton {
      color: #93c5fd;
      font-weight: bold;
    }

      color: #fca5a5;

    }

    .tie {
      color: var(--gold);
      font-weight: bold;
    }

    .out-in-total {
      font-weight: bold;

    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    .result-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      text-align: center;
    }

    .result-card h3 {
      margin: 0 0 10px;
      color: var(--gold);
    }

    .score-line {
      font-size: 30px;
      font-weight: bold;
      margin: 10px 0;
    }

    .points-line {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .team-point {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      background: #111827;
    }

    .team-point.clayton {
      border: 1px solid var(--blue);
    }

    .team-point.ryan {
      border: 1px solid var(--red);
    }

    .hole-results {
      margin-top: 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
    }

    .hole-results h2 {
      text-align: center;
      color: var(--gold);
      margin-top: 0;
    }

    .hole-results-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    .hole-result {
      background: #111827;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      font-size: 12px;
    }

    .match-total {
      margin-top: 20px;
      background: var(--panel);
      border: 2px solid var(--gold);
      border-radius: 16px;
      padding: 22px;
      text-align: center;
    }

    .match-total h2 {
      color: var(--gold);
      margin-top: 0;
    }

    .match-score-grid {
      display: grid;
      grid-template-columns: 1fr 80px 1fr;
      align-items: center;
    }

    .big-score {
      font-size: 48px;
      font-weight: bold;
    }

    .vs {
      color: var(--muted);
      font-weight: bold;
      font-size: 20px;
    }

    .team-label {
      color: var(--muted);
      font-size: 13px;
    }

    .no-pairings {
      max-width: 700px;
      margin: 40px auto;
      background: var(--panel);
      border: 1px solid var(--gold);
      border-radius: 15px;
      padding: 25px;
      text-align: center;
    }

    @media (max-width: 800px) {

      .results-grid {
        grid-template-columns: 1fr;
      }

      .hole-results-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .big-score {
        font-size: 38px;
      }

    }

  </style>

    <h1>

  <div

  ></div>


  <div
    class="container"
    id="app"
  ></div>


  <script>

    /*
    =========================================
    COURSE DATA
    =========================================
    */

    const courses = {

      dinosaur: {

        name:
          "Dinosaur Mountain",

        tee:
          "Blue",

        rating:
          67.5,

        slope:
          125,

        par:
          70,

        holePars: [
          4, 3, 5, 4, 3,
          4, 4, 3, 5,
          3, 5, 4, 4, 3,
          4, 5, 3, 4
        ],

        strokeIndexes: [
          5, 15, 3, 1, 9,
          11, 7, 13, 17,
          16, 18, 12, 2, 6,
          4, 14, 8, 10
        ]

      },


      cholla: {

        name:
          "We-Ko-Pa Cholla",

        tee:
          "Purple",

        rating:
          70.7,

        slope:
          133,

        par:
          72,

        holePars: [
          4, 5, 3, 4, 3,
          4, 4, 5, 4,
          5, 3, 4, 4, 3,
          4, 4, 5, 4
        ],

        strokeIndexes: [
          13, 3, 17, 9, 15,
          7, 11, 1, 5,
          4, 16, 10, 12, 18,
          14, 6, 2, 8
        ]

      },


      saguaro: {

        name:
          "We-Ko-Pa Saguaro",

        tee:
          "Purple",

        rating:
          70.2,

        slope:
          132,

        par:
          71,

        holePars: [
          4, 4, 4, 5, 3,
          4, 4, 5, 3,
          4, 3, 4, 4, 5,
          3, 4, 4, 4
        ],

        strokeIndexes: [
          5, 11, 9, 1, 15,
          7, 13, 3, 17,
          14, 18, 6, 8, 2,
          16, 12, 10, 4
        ]

      }

    };


    /*
    =========================================
    ROUNDS
    =========================================
    */

    const rounds = [

      {
        name: "Round 1",
        courseKey: "dinosaur"
      },

      {
        name: "Round 2",
        courseKey: "cholla"
      },

      {
        name: "Round 3",
        courseKey: "saguaro"
      },

      {
        name: "Round 4",
        courseKey: "saguaro"
      },

      {
        name: "Round 5",
        courseKey: "cholla"
      }

    ];


    /*
    =========================================
    PLAYER HANDICAP INDEXES
    =========================================
    */

    const players = {

      "Clayton": 9.7,
      "Marty": 7.2,
      "Raymond": 15,
      "Brian": 10.7,
      "Michael": 19,
      "Aaron": 20,

      "Ryan": 14,
      "Jon": 8,
      "Ryan D": 19.9,
      "Brad": 15,
      "Brent": 11.4,
      "Travis": 16

    };


    /*
    =========================================
    LOAD PAIRINGS AND SCORES
    =========================================
    */

    let pairings =

      JSON.parse(
        localStorage.getItem(
          "scottsdale26Pairings"
        )
      )

      ||

      {};


    let scores =

      JSON.parse(
        localStorage.getItem(
          "scottsdale26Scores"
        )
      )

      ||

      {};


    let currentRound = 0;

    let currentMatch = 0;


    /*
    =========================================
    SAVE SCORES
    =========================================
    */

    function saveScores() {

      localStorage.setItem(

        "scottsdale26Scores",

        JSON.stringify(scores)

      );

    }


    /*
    =========================================
    PLAYING HANDICAP
    Course Handicap:
    HI × Slope / 113
    + (Rating - Par)

    Then apply 85%
    =========================================
    */

    function getPlayingHandicap(
      playerName
    ) {

      const handicapIndex =
        players[playerName];


      const course =

        courses[
          rounds[currentRound]
            .courseKey
        ];


      const courseHandicap =

        Math.round(

          handicapIndex *

          (
            course.slope / 113
          )

          +

          (
            course.rating -
            course.par
          )

        );


      return Math.round(
        courseHandicap * 0.85
      );

    }


    /*
    =========================================
    STROKES ON A HOLE
    =========================================
    */

    function getStrokesOnHole(
      playerName,
      holeIndex
    ) {

      const playingHandicap =
        getPlayingHandicap(
          playerName
        );


      const course =

        courses[
          rounds[currentRound]
            .courseKey
        ];


      const strokeIndex =

        course.strokeIndexes[
          holeIndex
        ];


      const baseStrokes =
        Math.floor(
          playingHandicap / 18
        );


      const remainingStrokes =
        playingHandicap % 18;


      let strokes =
        baseStrokes;


      if (
        strokeIndex <=
        remainingStrokes
      ) {

        strokes++;

      }


      return strokes;

    }


    /*
    =========================================
    SCORE STORAGE
    =========================================
    */

    function ensureScoreStructure() {

      if (
        !scores[currentRound]
      ) {

        scores[currentRound] = {};

      }


      if (
        !scores[currentRound][currentMatch]
      ) {

        scores[currentRound][currentMatch] = {};

      }

    }


    function getGrossScore(
      playerName,
      holeIndex
    ) {

      ensureScoreStructure();


      const value =

        scores[currentRound]
          [currentMatch]
          [playerName]
          ?.[holeIndex];


      return value === undefined
        ? ""
        : value;

    }


    function setGrossScore(
      playerName,
      holeIndex,
      value
    ) {

      ensureScoreStructure();


      if (
        !scores[currentRound]
          [currentMatch]
          [playerName]
      ) {

        scores[currentRound]
          [currentMatch]
          [playerName] = {};

      }


      scores[currentRound]
        [currentMatch]
        [playerName]
        [holeIndex] = value;


      saveScores();

      render();

    }


    function getNumericGross(
      playerName,
      holeIndex
    ) {

      const value =
        getGrossScore(
          playerName,
          holeIndex
        );


      if (
        value === ""
      ) {

        return null;

      }


      return Number(value);

    }


    function getNetScore(
      playerName,
      holeIndex
    ) {

      const gross =
        getNumericGross(
          playerName,
          holeIndex
        );


      if (
        gross === null
      ) {

        return null;

      }


      return gross -

        getStrokesOnHole(
          playerName,
          holeIndex
        );

    }


    /*
    =========================================
    OUT / IN / TOTAL
    =========================================
    */

    function getGrossRangeTotal(
      playerName,
      start,
      end
    ) {

      let total = 0;

      let count = 0;


      for (
        let hole = start;
        hole <= end;
        hole++
      ) {

        const score =
          getNumericGross(
            playerName,
            hole
          );


        if (
          score !== null
        ) {

          total += score;

          count++;

        }

      }


      return {
        total,
        count
      };

    }


    function getNetRangeTotal(
      playerName,
      start,
      end
    ) {

      let total = 0;

      let count = 0;


      for (
        let hole = start;
        hole <= end;
        hole++
      ) {

        const score =
          getNetScore(
            playerName,
            hole
          );


        if (
          score !== null
        ) {

          total += score;

          count++;

        }

      }


      return {
        total,
        count
      };

    }


    /*
    =========================================
    TEAM BEST BALL
    =========================================
    */

    function getTeamBestNet(
      team,
      holeIndex
    ) {

      const scores =

        team

          .map(
            player =>
              getNetScore(
                player,
                holeIndex
              )
          )

          .filter(
            score =>
              score !== null
          );


      if (
        scores.length === 0
      ) {

        return null;

      }


      return Math.min(
        ...scores
      );

    }


    function getBestBallRangeTotal(
      team,
      start,
      end
    ) {

      let total = 0;

      let completed = 0;


      for (
        let hole = start;
        hole <= end;
        hole++
      ) {

        const best =
          getTeamBestNet(
            team,
            hole
          );


        if (
          best !== null
        ) {

          total += best;
          completed++;

        }

      }


      return {
        total,
        completed
      };

    }


    /*
    =========================================
    HOLE RESULT + BIRDIE/EAGLE BONUS
    =========================================
    */

    function calculateBonus(
      team,
      holeIndex
    ) {

      const course =

        courses[
          rounds[currentRound]
            .courseKey
        ];


      const par =
        course.holePars[
          holeIndex
        ];


      let bonus = 0;


      team.forEach(
        player => {

          const gross =
            getNumericGross(
              player,
              holeIndex
            );


          if (
            gross === null
          ) {

            return;

          }


          if (
            gross === par - 2
          ) {

            bonus += 2;

          }

          else if (
            gross === par - 1
          ) {

            bonus += 1;

          }

        }
      );


      return bonus;

    }


    function getHoleResult(
      match,
      holeIndex
    ) {

      const claytonBest =
        getTeamBestNet(
          match.clayton,
          holeIndex
        );


      const ryanBest =
        getTeamBestNet(
          match.ryan,
          holeIndex
        );


      const result = {

        winner: null,

        claytonPoints: 0,

        ryanPoints: 0,

        claytonBonus: 0,

        ryanBonus: 0,

        claytonBest,

        ryanBest

      };


      if (
        claytonBest === null ||
        ryanBest === null
      ) {

        return result;

      }


      if (
        claytonBest <
        ryanBest
      ) {

        result.winner =
          "clayton";

        result.claytonPoints = 1;

        result.claytonBonus =
          calculateBonus(
            match.clayton,
            holeIndex
          );

      }


      else if (
        ryanBest <
        claytonBest
      ) {

        result.winner =
          "ryan";

        result.ryanPoints = 1;

        result.ryanBonus =
          calculateBonus(
            match.ryan,
            holeIndex
          );

      }


      else {

        result.winner =
          "tie";

        const totalBonus =

          calculateBonus(
            match.clayton,
            holeIndex
          )

          +

          calculateBonus(
            match.ryan,
            holeIndex
          );


        if (
          totalBonus > 0
        ) {

          result.claytonBonus =
            totalBonus / 2;

          result.ryanBonus =
            totalBonus / 2;

        }

      }


      return result;

    }


    /*
    =========================================
    FRONT / BACK / OVERALL POINTS
    =========================================
    */

    function getSegmentPoints(
      match
    ) {

      const claytonFront =
        getBestBallRangeTotal(
          match.clayton,
          0,
          8
        );

      const ryanFront =
        getBestBallRangeTotal(
          match.ryan,
          0,
          8
        );


      const claytonBack =
        getBestBallRangeTotal(
          match.clayton,
          9,
          17
        );

      const ryanBack =
        getBestBallRangeTotal(
          match.ryan,
          9,
          17
        );


      const claytonOverall =
        getBestBallRangeTotal(
          match.clayton,
          0,
          17
        );

      const ryanOverall =
        getBestBallRangeTotal(
          match.ryan,
          0,
          17
        );


      const result = {

        front: {
          clayton: 0,
          ryan: 0
        },

        back: {
          clayton: 0,
          ryan: 0
        },

        overall: {
          clayton: 0,
          ryan: 0
        },

        totals: {

          claytonFront,
          ryanFront,

          claytonBack,
          ryanBack,

          claytonOverall,
          ryanOverall

        }

      };


      if (
        claytonFront.completed === 9 &&
        ryanFront.completed === 9
      ) {

        if (
          claytonFront.total <
          ryanFront.total
        ) {

          result.front.clayton = 3;

        }

        else if (
          ryanFront.total <
          claytonFront.total
        ) {

          result.front.ryan = 3;

        }

        else {

          result.front.clayton = 1.5;
          result.front.ryan = 1.5;

        }

      }


      if (
        claytonBack.completed === 9 &&
        ryanBack.completed === 9
      ) {

        if (
          claytonBack.total <
          ryanBack.total
        ) {

          result.back.clayton = 3;

        }

        else if (
          ryanBack.total <
          claytonBack.total
        ) {

          result.back.ryan = 3;

        }

        else {

          result.back.clayton = 1.5;
          result.back.ryan = 1.5;

        }

      }


      if (
        claytonOverall.completed === 18 &&
        ryanOverall.completed === 18
      ) {

        if (
          claytonOverall.total <
          ryanOverall.total
        ) {

          result.overall.clayton = 5;

        }

        else if (
          ryanOverall.total <
          claytonOverall.total
        ) {

          result.overall.ryan = 5;

        }

        else {

          result.overall.clayton = 2.5;
          result.overall.ryan = 2.5;

        }

      }


      return result;

    }


    /*
    =========================================
    ROUND TABS
    =========================================
    */

    function renderRoundTabs() {

      document.getElementById(
        "roundTabs"
      ).innerHTML =

        rounds.map(
          (round, index) => `

            <button
              class="
                tab
                ${index === currentRound ? "active" : ""}
              "
              onclick="changeRound(${index})"
            >
              ${round.name}
            </button>

          `
        ).join("");

    }


    function changeRound(
      index
    ) {

      currentRound = index;

      currentMatch = 0;

      render();

    }


    /*
    =========================================
    MATCH TABS
    =========================================
    */

    function getCurrentRoundPairings() {

      return pairings[currentRound]
        || null;

    }


    function renderMatchTabs() {

      const roundPairings =
        getCurrentRoundPairings();


      if (
        !roundPairings
      ) {

        document.getElementById(
          "matchTabs"
        ).innerHTML = "";

        return;

      }


      document.getElementById(
        "matchTabs"
      ).innerHTML =

        roundPairings.map(
          (match, index) => `

            <button
              class="
                match-tab
                ${index === currentMatch ? "active" : ""}
              "
              onclick="changeMatch(${index})"
            >
              Match ${index + 1}
            </button>

          `
        ).join("");

    }


    function changeMatch(
      index
    ) {

      currentMatch = index;

      render();

    }


    /*
    =========================================
    COURSE INFO
    =========================================
    */

    function renderCourseInfo() {

      const course =

        courses[
          rounds[currentRound]
            .courseKey
        ];


      document.getElementById(
        "courseInfo"
      ).innerHTML = `

        <div class="course-name">
          ${course.name}
          •
          ${course.tee} Tees
        </div>

        <div class="course-details">
          Rating ${course.rating}
          •
          Slope ${course.slope}
          •
          Par ${course.par}
          •
          85% Playing Handicap
        </div>

      `;

    }


    /*
    =========================================
    RENDER PLAYER ROW
    =========================================
    */

    function renderPlayerRows(
      player,
      teamClass
    ) {

      const handicapIndex =
        players[player];

      const playingHandicap =
        getPlayingHandicap(
          player
        );


      const grossFront =
        getGrossRangeTotal(
          player,
          0,
          8
        );

      const grossBack =
        getGrossRangeTotal(
          player,
          9,
          17
        );


      const grossTotal =
        getGrossRangeTotal(
          player,
          0,
          17
        );


      const netFront =
        getNetRangeTotal(
          player,
          0,
          8
        );

      const netBack =
        getNetRangeTotal(
          player,
          9,
          17
        );


      const netTotal =
        getNetRangeTotal(
          player,
          0,
          17
        );


      let grossCells = "";

      let netCells = "";


      for (
        let hole = 0;
        hole < 18;
        hole++
      ) {

        const gross =
          getGrossScore(
            player,
            hole
          );


        const net =
          getNetScore(
            player,
            hole
          );


        const strokes =
          getStrokesOnHole(
            player,
            hole
          );


        grossCells += `

          <td>

            <input
              class="gross-input"
              type="number"
              inputmode="numeric"
              min="1"
              max="20"
              value="${gross}"
              oninput="
                setGrossScore(
                  '${player}',
                  ${hole},
                  this.value
                )
              "
            >

          </td>

        `;


        netCells += `

          <td>

            ${
              net === null
                ? "—"
                : net
            }

            ${
              strokes > 0
                ? `
                  <span class="stroke-dot">
                    ${strokes} stroke
                    ${strokes > 1 ? "s" : ""}
                  </span>
                `
                : ""
            }

          </td>

        `;

      }


      return `

        <tr class="${teamClass}">

          <td
            class="
              player-column
              player-name
            "
          >

            ${player}

            <span class="player-info">
              HI ${handicapIndex}
              •
              Playing ${playingHandicap}
            </span>

          </td>

          ${grossCells}

          <td class="summary-column">
            ${
              grossFront.count === 9
                ? grossFront.total
                : "—"
            }
          </td>

          <td class="summary-column">
            ${
              grossBack.count === 9
                ? grossBack.total
                : "—"
            }
          </td>

          <td class="summary-column">
            ${
              grossTotal.count === 18
                ? grossTotal.total
                : "—"
            }
          </td>

        </tr>


        <tr class="net-row">

          <td
            class="
              player-column
              net-label
            "
          >
            ${player} Net
          </td>

          ${netCells}

          <td class="summary-column">
            ${
              netFront.count === 9
                ? netFront.total
                : "—"
            }
          </td>

          <td class="summary-column">
            ${
              netBack.count === 9
                ? netBack.total
                : "—"
            }
          </td>

          <td class="summary-column">
            ${
              netTotal.count === 18
                ? netTotal.total
                : "—"
            }
          </td>

        </tr>

      `;

    }


    /*
    =========================================
    MAIN SCORECARD
    =========================================
    */

    function renderScorecard() {

      const app =
        document.getElementById(
          "app"
        );


      const roundPairings =
        getCurrentRoundPairings();


      if (
        !roundPairings ||
        !roundPairings[currentMatch]
      ) {

        app.innerHTML = `

          <div class="no-pairings">

            <h2>
              No Pairing Found
            </h2>

            <p>
              Build the pairings for this round
              first on the Pairings page.
            </p>

          </div>

        `;

        return;

      }


      const match =
        roundPairings[currentMatch];


      if (
        !match.clayton ||
        !match.ryan
      ) {

        app.innerHTML = `

          <div class="no-pairings">
            Incomplete match pairing.
          </div>

        `;

        return;

      }


      const course =

        courses[
          rounds[currentRound]
            .courseKey
        ];


      let headerCells = "";

      let parCells = "";

      let hcpCells = "";


      for (
        let hole = 0;
        hole < 18;
        hole++
      ) {

        headerCells += `

          <th class="hole-header">
            ${hole + 1}
          </th>

        `;


        parCells += `

          <td>
            ${course.holePars[hole]}
          </td>

        `;


        hcpCells += `

          <td>
            ${course.strokeIndexes[hole]}
          </td>

        `;

      }


      /*
      TEAM BEST BALL ROWS
      */

      let claytonBestCells = "";
      let ryanBestCells = "";
      let resultCells = "";


      let claytonBestFront = 0;
      let ryanBestFront = 0;

      let claytonBestBack = 0;
      let ryanBestBack = 0;

      let claytonBestTotal = 0;
      let ryanBestTotal = 0;


      let claytonFrontCount = 0;
      let ryanFrontCount = 0;

      let claytonBackCount = 0;
      let ryanBackCount = 0;


      let claytonHolePoints = 0;
      let ryanHolePoints = 0;

      let claytonBonusPoints = 0;
      let ryanBonusPoints = 0;


      for (
        let hole = 0;
        hole < 18;
        hole++
      ) {

        const claytonBest =
          getTeamBestNet(
            match.clayton,
            hole
          );

        const ryanBest =
          getTeamBestNet(
            match.ryan,
            hole
          );


        claytonBestCells += `

          <td>
            ${
              claytonBest === null
                ? "—"
                : claytonBest
            }
          </td>

        `;


        ryanBestCells += `

          <td>
            ${
              ryanBest === null
                ? "—"
                : ryanBest
            }
          </td>

        `;


        if (
          claytonBest !== null
        ) {

          claytonBestTotal +=
            claytonBest;

          if (
            hole < 9
          ) {

            claytonBestFront +=
              claytonBest;

            claytonFrontCount++;

          }

          else {

            claytonBestBack +=
              claytonBest;

          }

        }


        if (
          ryanBest !== null
        ) {

          ryanBestTotal +=
            ryanBest;

          if (
            hole < 9
          ) {

            ryanBestFront +=
              ryanBest;

            ryanFrontCount++;

          }

          else {

            ryanBestBack +=
              ryanBest;

          }

        }


        const result =
          getHoleResult(
            match,
            hole
          );


        claytonHolePoints +=
          result.claytonPoints;

        ryanHolePoints +=
          result.ryanPoints;

        claytonBonusPoints +=
          result.claytonBonus;

        ryanBonusPoints +=
          result.ryanBonus;


        let resultText = "—";
        let resultClass = "";


        if (
          result.winner === "clayton"
        ) {

          resultText =
            `C +${
              result.claytonPoints +
              result.claytonBonus
            }`;

          resultClass =
            "winner-clayton";

        }

        else if (
          result.winner === "ryan"
        ) {

          resultText =
            `R +${
              result.ryanPoints +
              result.ryanBonus
            }`;

          resultClass =
            "winner-ryan";

        }

        else if (
          result.winner === "tie"
        ) {

          resultText = "TIE";
          resultClass = "tie";

        }


        resultCells += `

          <td class="${resultClass}">
            ${resultText}
          </td>

        `;

      }


      const segmentPoints =
        getSegmentPoints(
          match
        );


      const claytonTotalPoints =

        claytonHolePoints

        +

        claytonBonusPoints

        +

        segmentPoints.front.clayton

        +

        segmentPoints.back.clayton

        +

        segmentPoints.overall.clayton;


      const ryanTotalPoints =

        ryanHolePoints

        +

        ryanBonusPoints

        +

        segmentPoints.front.ryan

        +

        segmentPoints.back.ryan

        +

        segmentPoints.overall.ryan;


      app.innerHTML = `

        <div class="match-heading">

          ${match.clayton[0]}
          &
          ${match.clayton[1]}

          vs

          ${match.ryan[0]}
          &
          ${match.ryan[1]}

        </div>


        <div class="scorecard-wrap">

          <table>

            <thead>

              <tr>

                <th class="player-column">
                  PLAYER
                </th>

                ${headerCells}

                <th class="summary-column">
                  OUT
                </th>

                <th class="summary-column">
                  IN
                </th>

                <th class="summary-column">
                  TOTAL
                </th>

              </tr>

            </thead>


            <tbody>

              <tr class="par-row">

                <td class="player-column">
                  PAR
                </td>

                ${parCells}

                <td class="summary-column">
                  ${
                    course.holePars
                      .slice(0, 9)
                      .reduce(
                        (a, b) => a + b,
                        0
                      )
                  }
                </td>

                <td class="summary-column">
                  ${
                    course.holePars
                      .slice(9, 18)
                      .reduce(
                        (a, b) => a + b,
                        0
                      )
                  }
                </td>

                <td class="summary-column">
                  ${course.par}
                </td>

              </tr>


              <tr class="hcp-row">

                <td class="player-column">
                  HCP
                </td>

                ${hcpCells}

                <td class="summary-column">
                  —
                </td>

                <td class="summary-column">
                  —
                </td>

                <td class="summary-column">
                  —
                </td>

              </tr>


              ${renderPlayerRows(
                match.clayton[0],
                "team-clayton"
              )}


              ${renderPlayerRows(
                match.clayton[1],
                "team-clayton"
              )}


              <tr class="team-row">

                <td class="player-column">
                  CLAYTON BEST BALL
                </td>

                ${claytonBestCells}

                <td class="summary-column">
                  ${
                    claytonFrontCount === 9
                      ? claytonBestFront
                      : "—"
                  }
                </td>

                <td class="summary-column">
                  ${
                    claytonBestBack
                    ? claytonBestBack
                    : "—"
                  }
                </td>

                <td class="summary-column">
                  ${
                    claytonBestTotal
                    ? claytonBestTotal
                    : "—"
                  }
                </td>

              </tr>


              ${renderPlayerRows(
                match.ryan[0],
                "team-ryan"
              )}


              ${renderPlayerRows(
                match.ryan[1],
                "team-ryan"
              )}


              <tr class="team-row">

                <td class="player-column">
                  RYAN BEST BALL
                </td>

                ${ryanBestCells}

                <td class="summary-column">
                  ${
                    ryanFrontCount === 9
                      ? ryanBestFront
                      : "—"
                  }
                </td>

                <td class="summary-column">
                  ${
                    ryanBestBack
                    ? ryanBestBack
                    : "—"
                  }
                </td>

                <td class="summary-column">
                  ${
                    ryanBestTotal
                    ? ryanBestTotal
                    : "—"
                  }
                </td>

              </tr>


              <tr class="result-row">

                <td class="player-column">
                  HOLE RESULT
                </td>

                ${resultCells}

                <td class="summary-column">
                  —
                </td>

                <td class="summary-column">
                  —
                </td>

                <td class="summary-column">
                  —
                </td>

              </tr>

            </tbody>

          </table>

        </div>


        <div class="results-grid">


          <div class="result-card">

            <h3>
              FRONT 9
            </h3>

            <div class="score-line">

              ${
                segmentPoints.totals
                  .claytonFront
                  .completed === 9

                ?

                segmentPoints.totals
                  .claytonFront
                  .total

                :

                "—"
              }

              -

              ${
                segmentPoints.totals
                  .ryanFront
                  .completed === 9

                ?

                segmentPoints.totals
                  .ryanFront
                  .total

                :

                "—"
              }

            </div>

            <div class="points-line">

              <div class="team-point clayton">
                Clayton<br>
                ${segmentPoints.front.clayton} pts
              </div>

              <div class="team-point ryan">
                Ryan<br>
                ${segmentPoints.front.ryan} pts
              </div>

            </div>

          </div>


          <div class="result-card">

            <h3>
              BACK 9
            </h3>

            <div class="score-line">

              ${
                segmentPoints.totals
                  .claytonBack
                  .completed === 9

                ?

                segmentPoints.totals
                  .claytonBack
                  .total

                :

                "—"
              }

              -

              ${
                segmentPoints.totals
                  .ryanBack
                  .completed === 9

                ?

                segmentPoints.totals
                  .ryanBack
                  .total

                :

                "—"
              }

            </div>

            <div class="points-line">

              <div class="team-point clayton">
                Clayton<br>
                ${segmentPoints.back.clayton} pts
              </div>

              <div class="team-point ryan">
                Ryan<br>
                ${segmentPoints.back.ryan} pts
              </div>

            </div>

          </div>


          <div class="result-card">

            <h3>
              OVERALL 18
            </h3>

            <div class="score-line">

              ${
                segmentPoints.totals
                  .claytonOverall
                  .completed === 18

                ?

                segmentPoints.totals
                  .claytonOverall
                  .total

                :

                "—"
              }

              -

              ${
                segmentPoints.totals
                  .ryanOverall
                  .completed === 18

                ?

                segmentPoints.totals
                  .ryanOverall
                  .total

                :

                "—"
              }

            </div>

            <div class="points-line">

              <div class="team-point clayton">
                Clayton<br>
                ${segmentPoints.overall.clayton} pts
              </div>

              <div class="team-point ryan">
                Ryan<br>
                ${segmentPoints.overall.ryan} pts
              </div>

            </div>

          </div>


        </div>


        <div class="match-total">

          <h2>
            LIVE MATCH TOTAL
          </h2>

          <div class="match-score-grid">

            <div>

              <div class="team-label">
                CLAYTON'S TEAM
              </div>

              <div class="big-score winner-clayton">
                ${claytonTotalPoints}
              </div>

            </div>


            <div class="vs">
              VS
            </div>


            <div>

              <div class="team-label">
                RYAN'S TEAM
              </div>

              <div class="big-score winner-ryan">
                ${ryanTotalPoints}
              </div>

            </div>

          </div>


          <div
            style="
              margin-top:15px;
              color:#a9b6c8;
              font-size:13px;
              line-height:1.7;
            "
          >

            Hole Points:
            ${claytonHolePoints}
            -
            ${ryanHolePoints}

            &nbsp;•&nbsp;

            Birdie/Eagle Bonus:
            ${claytonBonusPoints}
            -
            ${ryanBonusPoints}

            &nbsp;•&nbsp;

            Front:
            ${segmentPoints.front.clayton}
            -
            ${segmentPoints.front.ryan}

            &nbsp;•&nbsp;

            Back:
            ${segmentPoints.back.clayton}
            -
            ${segmentPoints.back.ryan}

            &nbsp;•&nbsp;

            18:
            ${segmentPoints.overall.clayton}
            -
            ${segmentPoints.overall.ryan}

          </div>

        </div>

      `;

    }


    /*
    =========================================
    MAIN RENDER
    =========================================
    */

    function render() {

      renderRoundTabs();

      renderCourseInfo();

      renderMatchTabs();

      renderScorecard();

    }


    render();

  </script>

</body>

</html>

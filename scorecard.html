<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Scottsdale 26 Championship - Live Scorecard
  </title>

  <style>

    :root {
      --bg: #0b1220;
      --panel: #172033;
      --card: #243247;
      --line: #40516a;
      --text: #f8fafc;
      --muted: #a9b6c8;
      --blue: #3b82f6;
      --red: #ef4444;
      --gold: #fbbf24;
      --green: #22c55e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        linear-gradient(
          160deg,
          #0b1220,
          #111c2f
        );
      color: var(--text);
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 25px 15px 15px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size:
        clamp(
          28px,
          6vw,
          44px
        );
    }

    .subtitle {
      color: var(--muted);
      margin-top: 6px;
      font-weight: bold;
    }

    .back-link {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 20px 10px 10px;
    }

    .tab {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab.active {
      background: var(--gold);
      color: #111827;
      border-color: var(--gold);
    }

    .course-info {
      max-width: 1100px;
      margin: 10px auto;
      padding: 0 15px;
      text-align: center;
    }

    .course-name {
      color: var(--gold);
      font-size: 22px;
      font-weight: bold;
    }

    .course-details {
      color: var(--muted);
      margin-top: 5px;
    }

    .match-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 15px;
      flex-wrap: wrap;
    }

    .match-tab {
      background: var(--panel);
      border: 1px solid var(--line);
      color: white;
      border-radius: 10px;
      padding: 10px 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .match-tab.active {
      border-color: var(--gold);
      color: var(--gold);
    }

    .container {
      max-width: 1400px;
      margin: auto;
      padding: 10px 15px 50px;
    }

    .no-pairings {
      max-width: 700px;
      margin: 40px auto;
      padding: 25px;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--gold);
      border-radius: 15px;
    }

    .players-header {
      display: grid;
      grid-template-columns:
        150px
        repeat(4, 1fr);
      gap: 4px;
      margin-bottom: 4px;
    }

    .player-header {
      background: var(--panel);
      padding: 12px 8px;
      text-align: center;
      border-radius: 8px;
      font-weight: bold;
    }

    .player-header.clayton {
      border-top: 3px solid var(--blue);
    }

    .player-header.ryan {
      border-top: 3px solid var(--red);
    }

    .player-hcp {
      display: block;
      color: var(--gold);
      font-size: 12px;
      margin-top: 4px;
    }

    .player-course-hcp {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
    }

    .scorecard-wrap {
      overflow-x: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1050px;
    }

    th,
    td {
      border: 1px solid var(--line);
      text-align: center;
      padding: 8px 4px;
    }

    th {
      background: #111827;
      color: var(--muted);
      font-size: 13px;
    }

    .hole-row td:first-child {
      color: var(--gold);
      font-weight: bold;
    }

    .par-cell {
      color: var(--muted);
      font-size: 12px;
    }

    .si-cell {
      color: #94a3b8;
      font-size: 11px;
    }

    .gross-input {
      width: 52px;
      padding: 8px 4px;
      text-align: center;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: #0f172a;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .gross-input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .net-score {
      color: #93c5fd;
      font-size: 12px;
      margin-top: 3px;
    }

    .stroke {
      color: var(--gold);
      font-size: 10px;
      min-height: 12px;
    }

    .best-ball {
      color: var(--green);
      font-weight: bold;
    }

    .winner-clayton {
      color: #93c5fd;
      font-weight: bold;
    }

    .winner-ryan {
      color: #fca5a5;
      font-weight: bold;
    }

    .tie {
      color: var(--gold);
      font-weight: bold;
    }

    .summary-grid {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    .summary-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 20px;
      text-align: center;
    }

    .summary-card h3 {
      margin-top: 0;
      color: var(--gold);
    }

    .summary-score {
      font-size: 32px;
      font-weight: bold;
      margin: 10px 0;
    }

    .points-row {
      display: grid;
      grid-template-columns:
        1fr
        1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .team-points {
      padding: 12px;
      border-radius: 10px;
      background: #111827;
    }

    .team-points.clayton {
      border: 1px solid var(--blue);
    }

    .team-points.ryan {
      border: 1px solid var(--red);
    }

    .bonus-section {
      margin-top: 20px;
      background: var(--panel);
      border: 1px solid var(--gold);
      border-radius: 15px;
      padding: 20px;
    }

    .bonus-section h2 {
      margin-top: 0;
      color: var(--gold);
      text-align: center;
    }

    .hole-results {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 10px;
    }

    .hole-result {
      background: #111827;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }

    .hole-result-title {
      color: var(--gold);
      font-weight: bold;
      margin-bottom: 5px;
    }

    .match-total {
      margin-top: 25px;
      background: linear-gradient(
        135deg,
        #172033,
        #243247
      );
      border: 2px solid var(--gold);
      border-radius: 18px;
      padding: 25px;
      text-align: center;
    }

    .match-total h2 {
      margin-top: 0;
      color: var(--gold);
    }

    .total-score-grid {
      display: grid;
      grid-template-columns:
        1fr
        80px
        1fr;
      align-items: center;
      gap: 15px;
    }

    .total-team-score {
      font-size: 42px;
      font-weight: bold;
    }

    .total-team-name {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .total-vs {
      color: var(--muted);
      font-weight: bold;
      font-size: 22px;
    }

    .legend {
      max-width: 900px;
      margin: 20px auto;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 700px) {

      .summary-grid {
        grid-template-columns: 1fr;
      }

      .hole-results {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .total-team-score {
        font-size: 32px;
      }

    }

  </style>

</head>

<body>

  <header>

    <h1>
      SCOTTSDALE 26 CHAMPIONSHIP
    </h1>

    <div class="subtitle">
      Live Match Scorecard
    </div>

    <a
      href="index.html"
      class="back-link"
    >
      ← Back to Pairings
    </a>

  </header>

  <div
    class="tabs"
    id="roundTabs"
  ></div>

  <div
    class="course-info"
    id="courseInfo"
  ></div>

  <div
    class="match-tabs"
    id="matchTabs"
  ></div>

  <div
    class="container"
    id="app"
  ></div>


  <script>

    /*
    ========================================
    COURSE DATA
    ========================================
    */

    const courses = {

      dinosaur: {

        name:
          "Dinosaur Mountain",

        tee:
          "Blue",

        rating:
          67.5,

        slope:
          125,

        par:
          70,

        holePars: [
          4, 3, 5, 4, 3,
          4, 4, 3, 5,
          3, 5, 4, 4, 3,
          4, 5, 3, 4
        ],

        strokeIndexes: [
          5, 15, 3, 1, 9,
          11, 7, 13, 17,
          16, 18, 12, 2, 6,
          4, 14, 8, 10
        ]

      },


      cholla: {

        name:
          "We-Ko-Pa Cholla",

        tee:
          "Purple",

        rating:
          70.7,

        slope:
          133,

        par:
          72,

        holePars: [
          4, 5, 3, 4, 3,
          4, 4, 5, 4,
          5, 3, 4, 4, 3,
          4, 4, 5, 4
        ],

        strokeIndexes: [
          13, 3, 17, 9, 15,
          7, 11, 1, 5,
          4, 16, 10, 12, 18,
          14, 6, 2, 8
        ]

      },


      saguaro: {

        name:
          "We-Ko-Pa Saguaro",

        tee:
          "Purple",

        rating:
          70.2,

        slope:
          132,

        par:
          71,

        holePars: [
          4, 4, 4, 5, 3,
          4, 4, 5, 3,
          4, 3, 4, 4, 5,
          3, 4, 4, 4
        ],

        strokeIndexes: [
          5, 11, 9, 1, 15,
          7, 13, 3, 17,
          14, 18, 6, 8, 2,
          16, 12, 10, 4
        ]

      }

    };


    const rounds = [

      {
        name: "Round 1",
        courseKey: "dinosaur"
      },

      {
        name: "Round 2",
        courseKey: "cholla"
      },

      {
        name: "Round 3",
        courseKey: "saguaro"
      },

      {
        name: "Round 4",
        courseKey: "saguaro"
      },

      {
        name: "Round 5",
        courseKey: "cholla"
      }

    ];


    /*
    ========================================
    PLAYER DATA
    These are the current handicap indexes.

    Before the trip, update these to the
    official frozen handicap indexes.
    ========================================
    */

    const players = {

      "Clayton": 9.7,
      "Marty": 7.2,
      "Raymond": 15,
      "Brian": 10.7,
      "Michael": 19,
      "Aaron": 20,

      "Ryan": 14,
      "Jon": 8,
      "Ryan D": 19.9,
      "Brad": 15,
      "Brent": 11.4,
      "Travis": 16

    };


    /*
    ========================================
    LOAD DATA
    ========================================
    */

    let pairings = JSON.parse(

      localStorage.getItem(
        "scottsdale26Pairings"
      )

    ) || {};


    let scores = JSON.parse(

      localStorage.getItem(
        "scottsdale26Scores"
      )

    ) || {};


    let currentRound = 0;

    let currentMatch = 0;


    /*
    ========================================
    SAVE SCORES
    ========================================
    */

    function saveScores() {

      localStorage.setItem(

        "scottsdale26Scores",

        JSON.stringify(scores)

      );

    }


    /*
    ========================================
    COURSE HANDICAP
    ========================================

    Formula:

    Course Handicap =
    Handicap Index ×
    (Slope ÷ 113) +
    (Course Rating − Par)

    Then:

    Playing Handicap =
    Course Handicap × 85%

    Rounded to nearest whole number.
    */

    function getPlayingHandicap(
      playerName
    ) {

      const handicapIndex =
        players[playerName];

      const course =
        courses[
          rounds[
            currentRound
          ].courseKey
        ];


      const courseHandicap =

        Math.round(

          handicapIndex *
          (
            course.slope / 113
          )

          +

          (
            course.rating -
            course.par
          )

        );


      return Math.round(
        courseHandicap * 0.85
      );

    }


    /*
    ========================================
    HANDICAP STROKES PER HOLE
    ========================================
    */

    function getStrokesOnHole(

      playerName,
      holeIndex

    ) {

      const playingHandicap =
        getPlayingHandicap(
          playerName
        );


      const course =
        courses[
          rounds[
            currentRound
          ].courseKey
        ];


      const strokeIndex =
        course.strokeIndexes[
          holeIndex
        ];


      const baseStrokes =
        Math.floor(
          playingHandicap / 18
        );


      const remainingStrokes =
        playingHandicap % 18;


      let strokes =
        baseStrokes;


      if (
        strokeIndex <=
        remainingStrokes
      ) {

        strokes++;

      }


      return strokes;

    }


    /*
    ========================================
    SCORE DATA HELPERS
    ========================================
    */

    function ensureScoreStructure() {

      if (
        !scores[currentRound]
      ) {

        scores[currentRound] = {};

      }


      if (
        !scores[currentRound][currentMatch]
      ) {

        scores[currentRound][
          currentMatch
        ] = {};

      }

    }


    function getGrossScore(

      playerName,
      holeIndex

    ) {

      ensureScoreStructure();


      const value =

        scores[currentRound]
          [currentMatch]
          [playerName]
          ?.[
            holeIndex
          ];


      return value === undefined
        ? ""
        : value;

    }


    function setGrossScore(

      playerName,
      holeIndex,
      value

    ) {

      ensureScoreStructure();


      if (
        !scores[currentRound]
          [currentMatch]
          [playerName]
      ) {

        scores[currentRound]
          [currentMatch]
          [playerName] = {};

      }


      scores[currentRound]
        [currentMatch]
        [playerName]
        [holeIndex] = value;


      saveScores();

      render();

    }


    /*
    ========================================
    ROUND TABS
    ========================================
    */

    function renderRoundTabs() {

      document.getElementById(
        "roundTabs"
      ).innerHTML =

        rounds.map(

          (
            round,
            index
          ) => `

            <button
              class="
                tab
                ${
                  index === currentRound
                    ? "active"
                    : ""
                }
              "
              onclick="
                changeRound(
                  ${index}
                )
              "
            >

              ${round.name}

            </button>

          `

        ).join("");

    }


    function changeRound(
      roundIndex
    ) {

      currentRound =
        roundIndex;

      currentMatch = 0;

      render();

    }


    /*
    ========================================
    MATCH TABS
    ========================================
    */

    function getCurrentRoundPairings() {

      return pairings[
        currentRound
      ] || null;

    }


    function renderMatchTabs() {

      const roundPairings =
        getCurrentRoundPairings();


      if (
        !roundPairings
      ) {

        document.getElementById(
          "matchTabs"
        ).innerHTML = "";

        return;

      }


      document.getElementById(
        "matchTabs"
      ).innerHTML =

        roundPairings.map(

          (
            match,
            index
          ) => `

            <button
              class="
                match-tab
                ${
                  index === currentMatch
                    ? "active"
                    : ""
                }
              "
              onclick="
                changeMatch(
                  ${index}
                )
              "
            >

              Match
              ${index + 1}

            </button>

          `

        ).join("");

    }


    function changeMatch(
      matchIndex
    ) {

      currentMatch =
        matchIndex;

      render();

    }


    /*
    ========================================
    COURSE INFORMATION
    ========================================
    */

    function renderCourseInfo() {

      const course =

        courses[
          rounds[
            currentRound
          ].courseKey
        ];


      document.getElementById(
        "courseInfo"
      ).innerHTML = `

        <div class="course-name">

          ${course.name}
          •
          ${course.tee} Tees

        </div>

        <div class="course-details">

          Rating:
          ${course.rating}

          &nbsp;•&nbsp;

          Slope:
          ${course.slope}

          &nbsp;•&nbsp;

          Par:
          ${course.par}

          &nbsp;•&nbsp;

          Playing Handicap:
          85%

        </div>

      `;

    }


    /*
    ========================================
    GROSS / NET HELPERS
    ========================================
    */

    function getNumericGross(

      playerName,
      holeIndex

    ) {

      const value =
        getGrossScore(
          playerName,
          holeIndex
        );


      if (
        value === ""
      ) {

        return null;

      }


      return Number(value);

    }


    function getNetScore(

      playerName,
      holeIndex

    ) {

      const gross =
        getNumericGross(
          playerName,
          holeIndex
        );


      if (
        gross === null
      ) {

        return null;

      }


      const strokes =
        getStrokesOnHole(

          playerName,
          holeIndex

        );


      return gross - strokes;

    }


    function getTeamBestNet(

      team,
      holeIndex

    ) {

      const nets =

        team

          .map(

            player =>
              getNetScore(
                player,
                holeIndex
              )

          )

          .filter(

            score =>
              score !== null

          );


      if (
        nets.length === 0
      ) {

        return null;

      }


      return Math.min(
        ...nets
      );

    }


    function getTeamBestGross(

      team,
      holeIndex

    ) {

      const grossScores =

        team

          .map(

            player =>
              getNumericGross(
                player,
                holeIndex
              )

          )

          .filter(

            score =>
              score !== null

          );


      if (
        grossScores.length === 0
      ) {

        return null;

      }


      return Math.min(
        ...grossScores
      );

    }


    /*
    ========================================
    HOLE RESULT
    ========================================
    */

    function getHoleResult(
      match,
      holeIndex
    ) {

      const claytonBest =

        getTeamBestNet(
          match.clayton,
          holeIndex
        );


      const ryanBest =

        getTeamBestNet(
          match.ryan,
          holeIndex
        );


      if (
        claytonBest === null ||
        ryanBest === null
      ) {

        return {

          winner: null,
          claytonPoints: 0,
          ryanPoints: 0,
          claytonBonus: 0,
          ryanBonus: 0

        };

      }


      let winner = "tie";


      if (
        claytonBest < ryanBest
      ) {

        winner = "clayton";

      }


      if (
        ryanBest < claytonBest
      ) {

        winner = "ryan";

      }


      let claytonPoints = 0;

      let ryanPoints = 0;


      if (
        winner === "clayton"
      ) {

        claytonPoints = 1;

      }


      if (
        winner === "ryan"
      ) {

        ryanPoints = 1;

      }


      /*
      Birdie / Eagle bonuses

      Bonus applies for every qualifying
      gross birdie or eagle.

      Only the side that wins the hole
      receives the bonus.
      */


      let claytonBonus = 0;

      let ryanBonus = 0;


      const course =

        courses[
          rounds[
            currentRound
          ].courseKey
        ];


      const par =
        course.holePars[
          holeIndex
        ];


      function calculateBonus(
        team
      ) {

        let bonus = 0;


        team.forEach(
          player => {

            const gross =
              getNumericGross(
                player,
                holeIndex
              );


            if (
              gross === null
            ) {

              return;

            }


            if (
              gross === par - 2
            ) {

              bonus += 2;

            }

            else if (
              gross === par - 1
            ) {

              bonus += 1;

            }

          }
        );


        return bonus;

      }


      if (
        winner === "clayton"
      ) {

        claytonBonus =
          calculateBonus(
            match.clayton
          );

      }


      if (
        winner === "ryan"
      ) {

        ryanBonus =
          calculateBonus(
            match.ryan
          );

      }


      /*
      On a tied hole, hole points
      remain tied with no winner.

      Gross bonus points are split
      evenly between sides when a
      qualifying bonus applies.
      */


      if (
        winner === "tie"
      ) {

        const totalTieBonus =

          calculateBonus(
            match.clayton
          )

          +

          calculateBonus(
            match.ryan
          );


        if (
          totalTieBonus > 0
        ) {

          claytonBonus =
            totalTieBonus / 2;

          ryanBonus =
            totalTieBonus / 2;

        }

      }


      return {

        winner,

        claytonPoints,

        ryanPoints,

        claytonBonus,

        ryanBonus,

        claytonBest,

        ryanBest

      };

    }


    /*
    ========================================
    TOTAL NET BEST BALL
    ========================================
    */

    function getRangeBestBallTotal(

      team,
      startHole,
      endHole

    ) {

      let total = 0;

      let completed = 0;


      for (

        let hole =
          startHole;

        hole <=
          endHole;

        hole++

      ) {

        const best =
          getTeamBestNet(
            team,
            hole
          );


        if (
          best === null
        ) {

          continue;

        }


        total += best;

        completed++;

      }


      return {

        total,

        completed

      };

    }


    /*
    ========================================
    FRONT / BACK / 18 POINTS
    ========================================
    */

    function getSegmentPoints(
      match
    ) {

      const claytonFront =

        getRangeBestBallTotal(
          match.clayton,
          0,
          8
        );


      const ryanFront =

        getRangeBestBallTotal(
          match.ryan,
          0,
          8
        );


      const claytonBack =

        getRangeBestBallTotal(
          match.clayton,
          9,
          17
        );


      const ryanBack =

        getRangeBestBallTotal(
          match.ryan,
          9,
          17
        );


      const claytonOverall =

        getRangeBestBallTotal(
          match.clayton,
          0,
          17
        );


      const ryanOverall =

        getRangeBestBallTotal(
          match.ryan,
          0,
          17
        );


      const result = {

        front:
          {
            clayton: 0,
            ryan: 0
          },

        back:
          {
            clayton: 0,
            ryan: 0
          },

        overall:
          {
            clayton: 0,
            ryan: 0
          },

        totals:
          {
            claytonFront,
            ryanFront,
            claytonBack,
            ryanBack,
            claytonOverall,
            ryanOverall
          }

      };


      if (

        claytonFront.completed === 9

        &&

        ryanFront.completed === 9

      ) {

        if (

          claytonFront.total <
          ryanFront.total

        ) {

          result.front.clayton = 3;

        }

        else if (

          ryanFront.total <
          claytonFront.total

        ) {

          result.front.ryan = 3;

        }

        else {

          result.front.clayton = 1.5;

          result.front.ryan = 1.5;

        }

      }


      if (

        claytonBack.completed === 9

        &&

        ryanBack.completed === 9

      ) {

        if (

          claytonBack.total <
          ryanBack.total

        ) {

          result.back.clayton = 3;

        }

        else if (

          ryanBack.total <
          claytonBack.total

        ) {

          result.back.ryan = 3;

        }

        else {

          result.back.clayton = 1.5;

          result.back.ryan = 1.5;

        }

      }


      if (

        claytonOverall.completed === 18

        &&

        ryanOverall.completed === 18

      ) {

        if (

          claytonOverall.total <
          ryanOverall.total

        ) {

          result.overall.clayton = 5;

        }

        else if (

          ryanOverall.total <
          claytonOverall.total

        ) {

          result.overall.ryan = 5;

        }

        else {

          result.overall.clayton = 2.5;

          result.overall.ryan = 2.5;

        }

      }


      return result;

    }


    /*
    ========================================
    PLAYER HEADER
    ========================================
    */

    function getPlayerHeader(

      player,
      teamClass

    ) {

      const handicapIndex =
        players[player];

      const playingHandicap =
        getPlayingHandicap(
          player
        );


      return `

        <div
          class="
            player-header
            ${teamClass}
          "
        >

          ${player}

          <span
            class="player-hcp"
          >

            HI
            ${handicapIndex}

          </span>

          <span
            class="
              player-course-hcp
            "
          >

            Playing
            ${playingHandicap}

          </span>

        </div>

      `;

    }


    /*
    ========================================
    RENDER SCORECARD
    ========================================
    */

    function renderScorecard() {

      const app =
        document.getElementById(
          "app"
        );


      const roundPairings =
        getCurrentRoundPairings();


      if (

        !roundPairings

        ||

        !roundPairings[
          currentMatch
        ]

      ) {

        app.innerHTML = `

          <div
            class="no-pairings"
          >

            <h2>
              No Pairing Found
            </h2>

            <p>

              Build the pairings for this
              round first on the Pairings
              Board.

            </p>

            <a
              href="index.html"
              class="back-link"
            >
              Go to Pairings
            </a>

          </div>

        `;

        return;

      }


      const match =
        roundPairings[
          currentMatch
        ];


      if (

        match.clayton.some(
          player => !player
        )

        ||

        match.ryan.some(
          player => !player
        )

      ) {

        app.innerHTML = `

          <div
            class="no-pairings"
          >

            <h2>
              Incomplete Match
            </h2>

            <p>

              Finish the pairings before
              entering scores.

            </p>

          </div>

        `;

        return;

      }


      const course =

        courses[
          rounds[
            currentRound
          ].courseKey
        ];


      const allMatchPlayers = [

        ...match.clayton,

        ...match.ryan

      ];


      let tableRows = "";


      for (

        let hole = 0;

        hole < 18;

        hole++

      ) {


        const claytonBest =

          getTeamBestNet(
            match.clayton,
            hole
          );


        const ryanBest =

          getTeamBestNet(
            match.ryan,
            hole
          );


        const holeResult =
          getHoleResult(
            match,
            hole
          );


        let resultText =
          "—";

        let resultClass =
          "";


        if (

          holeResult.winner ===
          "clayton"

        ) {

          resultText =
            `Clayton +${

              holeResult.claytonPoints

              +

              holeResult.claytonBonus

            }`;

          resultClass =
            "winner-clayton";

        }


        if (

          holeResult.winner ===
          "ryan"

        ) {

          resultText =
            `Ryan +${

              holeResult.ryanPoints

              +

              holeResult.ryanBonus

            }`;

          resultClass =
            "winner-ryan";

        }


        if (

          holeResult.winner ===
          "tie"

          &&

          (
            holeResult.claytonBest !==
            undefined
          )

        ) {

          resultText =
            "Tie";

          resultClass =
            "tie";

        }


        tableRows += `

          <tr
            class="hole-row"
          >

            <td>

              ${hole + 1}

              <div
                class="par-cell"
              >

                Par
                ${
                  course.holePars[
                    hole
                  ]
                }

              </div>

              <div
                class="si-cell"
              >

                SI
                ${
                  course.strokeIndexes[
                    hole
                  ]
                }

              </div>

            </td>


            ${

              allMatchPlayers.map(

                player => {

                  const gross =
                    getGrossScore(
                      player,
                      hole
                    );


                  const strokes =
                    getStrokesOnHole(
                      player,
                      hole
                    );


                  const net =
                    getNetScore(
                      player,
                      hole
                    );


                  return `

                    <td>

                      <input

                        class="gross-input"

                        type="number"

                        min="1"

                        max="20"

                        value="${gross}"

                        inputmode="numeric"

                        oninput="
                          setGrossScore(
                            '${player}',
                            ${hole},
                            this.value
                          )
                        "

                      >

                      <div
                        class="net-score"
                      >

                        Net

                        ${
                          net === null
                            ? "—"
                            : net
                        }

                      </div>

                      <div
                        class="stroke"
                      >

                        ${
                          strokes > 0
                            ? "−" +
                              strokes +
                              " stroke" +
                              (
                                strokes > 1
                                  ? "s"
                                  : ""
                              )
                            : ""
                        }

                      </div>

                    </td>

                  `;

                }

              ).join("")

            }


            <td
              class="best-ball"
            >

              ${
                claytonBest === null
                  ? "—"
                  : claytonBest
              }

            </td>


            <td
              class="best-ball"
            >

              ${
                ryanBest === null
                  ? "—"
                  : ryanBest
              }

            </td>


            <td
              class="${resultClass}"
            >

              ${resultText}

            </td>

          </tr>

        `;

      }


      const segmentPoints =
        getSegmentPoints(
          match
        );


      let claytonHolePoints = 0;

      let ryanHolePoints = 0;

      let claytonBonusPoints = 0;

      let ryanBonusPoints = 0;


      const holeResultCards = [];


      for (

        let hole = 0;

        hole < 18;

        hole++

      ) {

        const result =
          getHoleResult(
            match,
            hole
          );


        claytonHolePoints +=
          result.claytonPoints;

        ryanHolePoints +=
          result.ryanPoints;

        claytonBonusPoints +=
          result.claytonBonus;

        ryanBonusPoints +=
          result.ryanBonus;


        let holeWinner =
          "No score";

        let winnerClass =
          "";


        if (

          result.winner ===
          "clayton"

        ) {

          holeWinner =
            "Clayton wins";

          winnerClass =
            "winner-clayton";

        }


        if (

          result.winner ===
          "ryan"

        ) {

          holeWinner =
            "Ryan wins";

          winnerClass =
            "winner-ryan";

        }


        if (

          result.winner ===
          "tie"

          &&

          result.claytonBest !==
          undefined

        ) {

          holeWinner =
            "Tied";

          winnerClass =
            "tie";

        }


        const claytonBonus =
          result.claytonBonus
            ? ` + ${
                result.claytonBonus
              } bonus`
            : "";

        const ryanBonus =
          result.ryanBonus
            ? ` + ${
                result.ryanBonus
              } bonus`
            : "";


        holeResultCards.push(

          `

          <div
            class="hole-result"
          >

            <div
              class="hole-result-title"
            >

              Hole
              ${hole + 1}

            </div>

            <div
              class="${winnerClass}"
            >

              ${holeWinner}

            </div>

            <div
              style="
                font-size:12px;
                color:#a9b6c8;
                margin-top:5px;
              "
            >

              C:
              ${result.claytonPoints}
              ${claytonBonus}

              &nbsp;|&nbsp;

              R:
              ${result.ryanPoints}
              ${ryanBonus}

            </div>

          </div>

          `

        );

      }


      const claytonTotalPoints =

        claytonHolePoints

        +

        claytonBonusPoints

        +

        segmentPoints.front.clayton

        +

        segmentPoints.back.clayton

        +

        segmentPoints.overall.clayton;


      const ryanTotalPoints =

        ryanHolePoints

        +

        ryanBonusPoints

        +

        segmentPoints.front.ryan

        +

        segmentPoints.back.ryan

        +

        segmentPoints.overall.ryan;


      const frontClaytonTotal =

        segmentPoints.totals
          .claytonFront;

      const frontRyanTotal =

        segmentPoints.totals
          .ryanFront;


      const backClaytonTotal =

        segmentPoints.totals
          .claytonBack;

      const backRyanTotal =

        segmentPoints.totals
          .ryanBack;


      const overallClaytonTotal =

        segmentPoints.totals
          .claytonOverall;

      const overallRyanTotal =

        segmentPoints.totals
          .ryanOverall;


      app.innerHTML = `


        <div
          class="players-header"
        >

          <div
            class="player-header"
          >

            HOLE

          </div>


          ${

            getPlayerHeader(

              match.clayton[0],

              "clayton"

            )

          }


          ${

            getPlayerHeader(

              match.clayton[1],

              "clayton"

            )

          }


          ${

            getPlayerHeader(

              match.ryan[0],

              "ryan"

            )

          }


          ${

            getPlayerHeader(

              match.ryan[1],

              "ryan"

            )

          }

        </div>


        <div
          class="scorecard-wrap"
        >

          <table>

            <thead>

              <tr>

                <th>
                  Hole
                </th>

                <th>
                  Gross / Net
                </th>

                <th>
                  Gross / Net
                </th>

                <th>
                  Gross / Net
                </th>

                <th>
                  Gross / Net
                </th>

                <th>
                  Clayton
                  Best Ball
                </th>

                <th>
                  Ryan
                  Best Ball
                </th>

                <th>
                  Result
                </th>

              </tr>

            </thead>

            <tbody>

              ${tableRows}

            </tbody>

          </table>

        </div>


        <div
          class="summary-grid"
        >


          <div
            class="summary-card"
          >

            <h3>
              FRONT 9
            </h3>

            <div
              class="summary-score"
            >

              ${
                frontClaytonTotal.completed === 9
                  ? frontClaytonTotal.total
                  : "—"
              }

              -
              ${
                frontRyanTotal.completed === 9
                  ? frontRyanTotal.total
                  : "—"
              }

            </div>

            <div>
              Net Best Ball
            </div>

            <div
              class="points-row"
            >

              <div
                class="
                  team-points
                  clayton
                "
              >

                Clayton

                <br>

                ${
                  segmentPoints.front
                    .clayton
                }
                pts

              </div>

              <div
                class="
                  team-points
                  ryan
                "
              >

                Ryan

                <br>

                ${
                  segmentPoints.front
                    .ryan
                }
                pts

              </div>

            </div>

          </div>


          <div
            class="summary-card"
          >

            <h3>
              BACK 9
            </h3>

            <div
              class="summary-score"
            >

              ${
                backClaytonTotal.completed === 9
                  ? backClaytonTotal.total
                  : "—"
              }

              -
              ${
                backRyanTotal.completed === 9
                  ? backRyanTotal.total
                  : "—"
              }

            </div>

            <div>
              Net Best Ball
            </div>

            <div
              class="points-row"
            >

              <div
                class="
                  team-points
                  clayton
                "
              >

                Clayton

                <br>

                ${
                  segmentPoints.back
                    .clayton
                }
                pts

              </div>

              <div
                class="
                  team-points
                  ryan
                "
              >

                Ryan

                <br>

                ${
                  segmentPoints.back
                    .ryan
                }
                pts

              </div>

            </div>

          </div>


          <div
            class="summary-card"
          >

            <h3>
              OVERALL 18
            </h3>

            <div
              class="summary-score"
            >

              ${
                overallClaytonTotal.completed === 18
                  ? overallClaytonTotal.total
                  : "—"
              }

              -
              ${
                overallRyanTotal.completed === 18
                  ? overallRyanTotal.total
                  : "—"
              }

            </div>

            <div>
              Net Best Ball
            </div>

            <div
              class="points-row"
            >

              <div
                class="
                  team-points
                  clayton
                "
              >

                Clayton

                <br>

                ${
                  segmentPoints.overall
                    .clayton
                }
                pts

              </div>

              <div
                class="
                  team-points
                  ryan
                "
              >

                Ryan

                <br>

                ${
                  segmentPoints.overall
                    .ryan
                }
                pts

              </div>

            </div>

          </div>


        </div>


        <div
          class="bonus-section"
        >

          <h2>
            Hole-by-Hole Results
          </h2>

          <div
            class="hole-results"
          >

            ${holeResultCards.join("")}

          </div>

        </div>


        <div
          class="match-total"
        >

          <h2>
            MATCH TOTAL
          </h2>

          <div
            class="total-score-grid"
          >

            <div>

              <div
                class="
                  total-team-name
                "
              >

                CLAYTON'S TEAM

              </div>

              <div
                class="
                  total-team-score
                  winner-clayton
                "
              >

                ${claytonTotalPoints}

              </div>

            </div>


            <div
              class="total-vs"
            >

              VS

            </div>


            <div>

              <div
                class="
                  total-team-name
                "
              >

                RYAN'S TEAM

              </div>

              <div
                class="
                  total-team-score
                  winner-ryan
                "
              >

                ${ryanTotalPoints}

              </div>

            </div>


          </div>


          <div
            style="
              margin-top:15px;
              color:#a9b6c8;
              font-size:13px;
            "
          >

            Hole Points:
            ${claytonHolePoints}
            -
            ${ryanHolePoints}

            &nbsp;•&nbsp;

            Birdie/Eagle Bonus:
            ${claytonBonusPoints}
            -
            ${ryanBonusPoints}

            &nbsp;•&nbsp;

            Front 9:
            ${segmentPoints.front.clayton}
            -
            ${segmentPoints.front.ryan}

            &nbsp;•&nbsp;

            Back 9:
            ${segmentPoints.back.clayton}
            -
            ${segmentPoints.back.ryan}

            &nbsp;•&nbsp;

            18:
            ${segmentPoints.overall.clayton}
            -
            ${segmentPoints.overall.ryan}

          </div>

        </div>


        <div
          class="legend"
        >

          Enter gross scores only.
          Net scores, handicap strokes,
          best ball, hole winners,
          Front 9, Back 9,
          Overall 18, and
          birdie/eagle bonuses
          calculate automatically.

          <br>

          Hole winner receives 1 point.
          Front 9 is worth 3 points.
          Back 9 is worth 3 points.
          Overall 18 is worth 5 points.
          Gross birdie bonus = +1.
          Gross eagle bonus = +2.

        </div>

      `;

    }


    /*
    ========================================
    MAIN RENDER
    ========================================
    */

    function render() {

      renderRoundTabs();

      renderCourseInfo();

      renderMatchTabs();

      renderScorecard();

    }


    render();

  </script>

</body>

</html>

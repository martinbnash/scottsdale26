/* =========================================================

function getCourse(round){

  if(round === 1){

/* =========================================================

   TEE / HANDICAP

   ========================================================= */

function teeForPlayer(

  player,

  course

){

  if(course === dinosaurMountain){

    if(

      player === "Ryan D" ||

      player === "Brad"

    ){

      return "blue";

    }

    return "black";

  }

  return "purple";

}

function getTeeLabel(

  player,

  course

){

  if(course === dinosaurMountain){

    return teeForPlayer(

      player,

      course

    ) === "blue"

      ? "BLUE TEES"

      : "BLACK TEES";

  }

  return "PURPLE TEES";

}

/*

  Tournament handicap calculation:

  Course Handicap =

  Handicap Index × Slope / 113

  + (Course Rating - Par)

  Then 85% tournament allowance.

*/

function getPlayerCourseHandicap(

  playerName,

  course

){

  const hi =

    Number(

      players[playerName]?.handicap || 0

    );

  let rating;

  let slope;

  if(course === dinosaurMountain){

    if(

      teeForPlayer(

        playerName,

        course

      ) === "blue"

    ){

      rating = 67.5;

      slope = 125;

    }else{

      rating = 70.1;

      slope = 137;

    }

  }else if(

    course === weKoPaCholla

  ){

    rating = 71.7;

    slope = 135;

  }else{

    rating = 70.2;

    slope = 132;

  }

  return Math.round(

    (

      hi *

      (slope / 113)

      +

      (rating - course.par)

    ) *

    0.85

  );

}

function getMatchPlayingHandicaps(

  match,

  course

){

  const names = [

    ...match.ryan,

    ...match.clayton

  ];

  const raw =

    names.map(

      p => ({

        p,

        h:getPlayerCourseHandicap(

          p,

          course

        )

      })

    );

  const low =

    Math.min(

      ...raw.map(

        x => x.h

      )

    );

  return Object.fromEntries(

    raw.map(

      x => [

        x.p,

        Math.max(

          0,

          x.h - low

        )

      ]

    )

  );

}

/* =========================================================

   STROKES

   ========================================================= */

function strokesOnHole(

  player,

  holeIndex,

  course,

  matchHcp

){

  const h =

    Number(

      matchHcp?.[player]

      ??

      getPlayerCourseHandicap(

        player,

        course

      )

    );

  const rank =

    Number(

      course.handicap[holeIndex]

    );

  let s = 0;

  if(h >= rank){

    s++;

  }

  if(

    h > 18 &&

    h - 18 >= rank

  ){

    s++;

  }

  return s;

}

function netScore(

  player,

  gross,

  holeIndex,

  course,

  matchHcp

){

  return Number(gross)

    -

    strokesOnHole(

      player,

      holeIndex,

      course,

      matchHcp

    );

}

function isLocked(

){

  const c =

    certifications[

      certKey(

}

/* =========================================================

   LOAD PAIRINGS

   ========================================================= */

async function loadPairings(){

  const myToken =

    ++loadToken;

  try{

    const {

      data: pairingRows,

      error: pairingError

    } =

      await supabaseClient

        .from("pairings")

        .select("*")

        .eq(

          "round_number",

          currentRound

        )

        .order(

          "pairing_number",

          {

            ascending:true

          }

        );

    if(pairingError){

      throw pairingError;

    }

    const {

      data: playerRows,

      error: playerError

    } =

      await supabaseClient

        .from("pairing_players")

        .select("*");

    if(playerError){

      throw playerError;

    }

    if(myToken !== loadToken){

      return;

    }

    const loaded = [];

    (pairingRows || [])

      .forEach(

        pairing => {

          const rows =

            (playerRows || [])

              .filter(

                row =>

                  String(

                    row.pairing_id

                  )

                  ===

                  String(

                    pairing.id

                  )

              );

          const ryan =

            rows

              .filter(

                row =>

                  String(

                    row.side

                  ).toLowerCase()

                  ===

                  "ryan"

              )

              .map(

                row =>

                  row.player_name

                  ??

                  row.player

                  ??

                  row.name

              )

              .filter(Boolean);

          const clayton =

            rows

              .filter(

                row =>

                  String(

                    row.side

                  ).toLowerCase()

                  ===

                  "clayton"

              )

              .map(

                row =>

                  row.player_name

                  ??

                  row.player

                  ??

                  row.name

              )

              .filter(Boolean);

          loaded.push({

            pairingNumber:

              Number(

                pairing.pairing_number

              ),

            ryan,

            clayton

          });

        }

      );

    pairings[currentRound] =

      loaded;

  }catch(e){

    console.error(

      "PAIRING LOAD ERROR:",

      e

    );

    throw e;

  }

}

/* =========================================================

   PLAYER TOTALS

   ========================================================= */

function updatePlayerTotals(

  matchNumber

){

  const course =

    getCourse(

      currentRound

    );

  const match =

    (pairings[currentRound] || [])

      .find(

        m =>

          Number(

            m.pairingNumber

          )

          ===

          Number(

            matchNumber

          )

      );

  if(!match){

    return;

  }

  const mh =

    getMatchPlayingHandicaps(

      match,

      course

    );

  const all =

    [

      ...match.ryan,

      ...match.clayton

    ];

  all.forEach(

    player => {

      let front = 0;

      let back = 0;

      let total = 0;

      for(

        let i=0;

        i<18;

        i++

      ){

        const key =

          getScoreKey(

            currentRound,

            matchNumber,

            player,

            i+1

          );

        const v =

          scores[key];

        if(

          v === undefined ||

          v === null ||

          v === ""

        ){

          continue;

        }

        const n =

          Number(v);

        total += n;

        if(i < 9){

          front += n;

        }else{

          back += n;

        }

      }

      const safe =

        player.replace(

          /[^a-zA-Z0-9_-]/g,

          "_"

        );

      const frontEl =

        document.getElementById(

          `front-${currentRound}-${matchNumber}-${safe}`

        );

      const backEl =

        document.getElementById(

          `back-${currentRound}-${matchNumber}-${safe}`

        );

      const totalEl =

        document.getElementById(

          `total-${currentRound}-${matchNumber}-${safe}`

        );

      if(frontEl){

        frontEl.textContent =

          front || "-";

      }

      if(backEl){

        backEl.textContent =

          back || "-";

      }

      if(totalEl){

        totalEl.textContent =

          total || "-";

      }

    }

  );

}

/* =========================================================

function calculateBonus(

  course

){

  let ryanBonus = 0;

  let claytonBonus = 0;

  /*

    IMPORTANT:

    A team gets ONLY ONE birdie/eagle bonus

    per hole.

    The best qualifying gross score for the

    team determines the bonus.

    Birdie = +1

    Eagle = +2

    Bonus only counts when that team wins

    the hole.

  */

  const mh =

    getMatchPlayingHandicaps(

      match,

      course

    );

  for(

    let i=0;

    i<18;

    i++

  ){

    const ryanScores =

      match.ryan

        .map(

          p => {

            const key =

              getScoreKey(

                currentRound,

                match.pairingNumber,

                p,

                i+1

              );

            const gross =

              scores[key];

            if(

              gross === undefined ||

              gross === null ||

              gross === ""

            ){

              return null;

            }

            return {

              player:p,

              gross:Number(gross),

              net:netScore(

                p,

                gross,

                i,

                course,

                mh

              )

            };

          }

        )

        .filter(Boolean);

    const claytonScores =

      match.clayton

        .map(

          p => {

            const key =

              getScoreKey(

                currentRound,

                match.pairingNumber,

                p,

                i+1

              );

            const gross =

              scores[key];

            if(

              gross === undefined ||

              gross === null ||

              gross === ""

            ){

              return null;

            }

            return {

              player:p,

              gross:Number(gross),

              net:netScore(

                p,

                gross,

                i,

                course,

                mh

              )

            };

          }

        )

        .filter(Boolean);

    if(

      !ryanScores.length ||

      !claytonScores.length

    ){

      continue;

    }

    const ryanBest =

      Math.min(

        ...ryanScores.map(

          x => x.net

        )

      );

    const claytonBest =

      Math.min(

        ...claytonScores.map(

          x => x.net

        )

      );

    let winningTeam = null;

    if(

      ryanBest <

      claytonBest

    ){

      winningTeam = "ryan";

    }else if(

      claytonBest <

      ryanBest

    ){

      winningTeam = "clayton";

    }

    if(!winningTeam){

      continue;

    }

    const winningScores =

      winningTeam === "ryan"

        ? ryanScores

        : claytonScores;

    /*

      Only ONE bonus for the team on the hole.

      Use the lowest gross score among the

      team's players that won the hole.

    */

    const bestGross =

      Math.min(

        ...winningScores.map(

          x => x.gross

        )

      );

    const par =

      course.pars[i];

    if(

      bestGross <=

      par - 2

    ){

      if(

        winningTeam === "ryan"

      ){

        ryanBonus += 2;

      }else{

        claytonBonus += 2;

      }

    }else if(

      bestGross ===

      par - 1

    ){

      if(

        winningTeam === "ryan"

      ){

        ryanBonus += 1;

      }else{

        claytonBonus += 1;

      }

    }

  }

  return {

    ryan:ryanBonus,

    clayton:claytonBonus

  };

}

/* =========================================================

   MATCH CALCULATION

   ========================================================= */

function calculateMatch(

  matchNumber

){

  const course =

    getCourse(

      currentRound

    );

  const match =

    (pairings[currentRound] || [])

      .find(

        m =>

          Number(

            m.pairingNumber

          )

          ===

          Number(

            matchNumber

          )

      );

  if(!match){

    return;

  }

  const mh =

    getMatchPlayingHandicaps(

      match,

      course

    );

  const teams = {

    ryan:match.ryan,

    clayton:match.clayton

  };

  let frontRyan = 0;

  let frontClayton = 0;

  let backRyan = 0;

  let backClayton = 0;

  let strokeRyan = 0;

  let strokeClayton = 0;

  for(

    let i=0;

    i<18;

    i++

  ){

    const ryanNet = [];

    const claytonNet = [];

    match.ryan

      .forEach(

        p => {

          const key =

            getScoreKey(

              currentRound,

              matchNumber,

              p,

              i+1

            );

          const v =

            scores[key];

          if(

            v !== undefined &&

            v !== null &&

            v !== ""

          ){

            ryanNet.push(

              netScore(

                p,

                Number(v),

                i,

                course,

                mh

              )

            );

          }

        }

      );

    match.clayton

      .forEach(

        p => {

          const key =

            getScoreKey(

              currentRound,

              matchNumber,

              p,

              i+1

            );

          const v =

            scores[key];

          if(

            v !== undefined &&

            v !== null &&

            v !== ""

          ){

            claytonNet.push(

              netScore(

                p,

                Number(v),

                i,

                course,

                mh

              )

            );

          }

        }

      );

    if(

      ryanNet.length &&

      claytonNet.length

    ){

      const r =

        Math.min(

          ...ryanNet

        );

      const c =

        Math.min(

          ...claytonNet

        );

      if(i < 9){

        if(r < c){

          frontRyan++;

        }

        if(c < r){

          frontClayton++;

        }

      }else{

        if(r < c){

          backRyan++;

        }

        if(c < r){

          backClayton++;

        }

      }

    }

  }

  /*

    18-hole best-ball stroke play.

    Lowest total net score wins.

  */

  const ryanTotals =

    match.ryan.map(

      p => {

        let total = 0;

        for(

          let i=0;

          i<18;

          i++

        ){

          const key =

            getScoreKey(

              currentRound,

              matchNumber,

              p,

              i+1

            );

          const v =

            scores[key];

          if(

            v !== undefined &&

            v !== null &&

            v !== ""

          ){

            total += netScore(

              p,

              Number(v),

              i,

              course,

              mh

            );

          }

        }

        return total;

      }

    );

  const claytonTotals =

    match.clayton.map(

      p => {

        let total = 0;

        for(

          let i=0;

          i<18;

          i++

        ){

          const key =

            getScoreKey(

              currentRound,

              matchNumber,

              p,

              i+1

            );

          const v =

            scores[key];

          if(

            v !== undefined &&

            v !== null &&

            v !== ""

          ){

            total += netScore(

              p,

              Number(v),

              i,

              course,

              mh

            );

          }

        }

        return total;

      }

    );

  /*

    For 18-hole best ball, compare each team's

    best player's complete net total.

  */

  const r18 =

    ryanTotals.length

      ? Math.min(...ryanTotals)

      : null;

  const c18 =

    claytonTotals.length

      ? Math.min(...claytonTotals)

      : null;

  /*

    Match points:

    Front 9 = 3

    Back 9 = 3

    Overall 18 = 5

    Ties split.

  */

  let rPoints = 0;

  let cPoints = 0;

  if(

    frontRyan > frontClayton

  ){

    rPoints += 3;

  }else if(

    frontClayton > frontRyan

  ){

    cPoints += 3;

  }else{

    rPoints += 1.5;

    cPoints += 1.5;

  }

  if(

    backRyan > backClayton

  ){

    rPoints += 3;

  }else if(

    backClayton > backRyan

  ){

    cPoints += 3;

  }else{

    rPoints += 1.5;

    cPoints += 1.5;

  }

  if(

    r18 !== null &&

    c18 !== null

  ){

    if(r18 < c18){

      rPoints += 5;

    }else if(c18 < r18){

      cPoints += 5;

    }else{

      rPoints += 2.5;

      cPoints += 2.5;

    }

  }

  /*

    Birdie / eagle bonuses.

  */

  const bonus =

    calculateBonus(

      match,

      course

    );

  rPoints +=

    bonus.ryan;

  cPoints +=

    bonus.clayton;

  /*

    Display values.

  */

  let frontText =

    `${frontRyan}-${frontClayton}`;

  let backText =

    `${backRyan}-${backClayton}`;

  let strokeText = "-";

  if(

    r18 !== null &&

    c18 !== null

  ){

    if(r18 < c18){

      strokeText =

        `RYAN ${r18} - ${c18} CLAYTON`;

    }else if(

      c18 < r18

    ){

      strokeText =

        `CLAYTON ${c18} - ${r18} RYAN`;

    }else{

      strokeText =

        `TIED ${r18}`;

    }

  }

  const setText = (

    id,

    value

  ) => {

    const e =

      document.getElementById(id);

    if(e){

      e.textContent =

        value;

    }

  };

  setText(

    `front-result-${matchNumber}`,

    frontText

  );

  setText(

    `back-result-${matchNumber}`,

    backText

  );

  setText(

    `stroke-result-${matchNumber}`,

    strokeText

  );

  setText(

    `bonus-result-${matchNumber}`,

    `RYAN +${bonus.ryan} • CLAYTON +${bonus.clayton}`

  );

  setText(

    `points-result-${matchNumber}`,

    `RYAN ${rPoints} • CLAYTON ${cPoints}`

  );

}

/* =========================================================

   CERTIFICATION UI

   ========================================================= */

function applyCertificationState(

  el,

  matchNumber

){

  const locked =

    isLocked(

      matchNumber

    );

  el.classList.toggle(

    "scorecard-locked",

    locked

  );

  el.querySelectorAll(

    "input.score-input"

  )

  .forEach(

    x =>

      x.disabled = locked

  );

  const c =

    certifications[

      certKey(

        currentRound,

        matchNumber

      )

    ]

    ||

    {};

  const m =

    el.querySelector(

      '[data-cert-type="marker"]'

    );

  const o =

    el.querySelector(

      '[data-cert-type="opponent"]'

    );

  if(m){

    m.checked =

      !!c.marker_certified;

    m.disabled =

      locked;

  }

  if(o){

    o.checked =

      !!c.opponent_certified;

    o.disabled =

      locked;

  }

  const s =

    el.querySelector(

      ".certification-status"

    );

  if(s){

    s.textContent =

      locked

        ? "✓ Both certifications complete — scorecard is LOCKED"

        : "Both certifications are required to lock this scorecard.";

    s.classList.toggle(

      "locked",

      locked

    );

  }

}

/* =========================================================

   UPDATE SCORE

   ========================================================= */

async function updateScore(

  player,

  matchNumber,

  hole,

  value

){

  if(

    isLocked(

      matchNumber

    )

  ){

    showStatus(

      "This scorecard is certified and locked.",

      "error"

    );

    renderScorecards();

    return;

  }

  const key =

    getScoreKey(

      currentRound,

      matchNumber,

      player,

      hole

    );

  if(

    value === ""

  ){

    delete scores[key];

    await deleteScore(

      currentRound,

      matchNumber,

      player,

      hole

    );

  }else{

    scores[key] =

      Number(value);

    await saveScore(

      currentRound,

      matchNumber,

      player,

      hole,

      Number(value)

    );

  }

  updatePlayerTotals(

    matchNumber

  );

  calculateMatch(

    matchNumber

  );

}

/* =========================================================

   SAVE SCORE

   ========================================================= */

async function saveScore(

  round,

  match,

  player,

  hole,

  gross

){

  const st =

    document.getElementById(

      "autosave-status"

    );

  st.className =

    "autosave-status saving";

  st.textContent =

    "Saving...";

  try{

    const {

      error

    } =

      await supabaseClient

        .from("scores")

        .upsert(

          {

            round_number:

              Number(round),

            match_number:

              Number(match),

            player_name:

              player,

            hole_number:

              Number(hole),

            gross_score:

              Number(gross)

          },

          {

            onConflict:

              "round_number,match_number,player_name,hole_number"

          }

        );

    if(error){

      throw error;

    }

    st.className =

      "autosave-status saved";

    st.textContent =

      "Score saved ✓";

    setTimeout(

      () => {

        if(

          st.textContent ===

          "Score saved ✓"

        ){

          st.textContent =

            "";

          st.className =

            "autosave-status";

        }

      },

      1200

    );

  }catch(e){

    console.error(e);

    st.className =

      "autosave-status error";

    st.textContent =

      "SAVE ERROR: " +

      e.message;

  }

}

/* =========================================================

   DELETE SCORE

   ========================================================= */

async function deleteScore(

  round,

  match,

  player,

  hole

){

  const st =

    document.getElementById(

      "autosave-status"

    );

  st.className =

    "autosave-status saving";

  st.textContent =

    "Clearing score...";

  try{

    const {

      error

    } =

      await supabaseClient

        .from("scores")

        .delete()

        .eq(

          "round_number",

          Number(round)

        )

        .eq(

          "match_number",

          Number(match)

        )

        .eq(

          "player_name",

          player

        )

        .eq(

          "hole_number",

          Number(hole)

        );

    if(error){

      throw error;

    }

    st.className =

      "autosave-status saved";

    st.textContent =

      "Score cleared ✓";

    setTimeout(

      () => {

        if(

          st.textContent ===

          "Score cleared ✓"

        ){

          st.textContent =

            "";

          st.className =

            "autosave-status";

        }

      },

      1000

    );

  }catch(e){

    console.error(e);

    st.className =

      "autosave-status error";

    st.textContent =

      "CLEAR ERROR: " +

      e.message;

  }

}

/* =========================================================

   CLEAR ENTIRE MATCH

   ========================================================= */

async function clearMatchScores(

  match

){

  if(

    isLocked(match)

  ){

    showStatus(

      `Match ${match} is certified and locked. Uncheck both certifications first.`,

      "error"

    );

    return;

  }

  if(

    !confirm(

      `Clear ALL scores for Match ${match} in Round ${currentRound}?`

    )

  ){

    return;

  }

  try{

    const {

      error

    } =

      await supabaseClient

        .from("scores")

        .delete()

        .eq(

          "round_number",

          Number(currentRound)

        )

        .eq(

          "match_number",

          Number(match)

        );

    if(error){

      throw error;

    }

    Object.keys(

      scores

    )

    .forEach(

      k => {

        if(

          k.startsWith(

            `${currentRound}_${match}_`

          )

        ){

          delete scores[k];

        }

      }

    );

    renderScorecards();

  }catch(e){

    showStatus(

      "CLEAR ERROR: " +

      e.message,

      "error"

    );

  }

}

/* =========================================================

   CERTIFICATION

   ========================================================= */

async function updateCertification(

  match,

  type,

  checked

){

  const key =

    certKey(

      currentRound,

      match

    );

  const c =

    certifications[key]

    ||

    {

      marker_certified:false,

      opponent_certified:false

    };

  c[type] =

    !!checked;

  certifications[key] =

    c;

  const el =

    [

      ...document.querySelectorAll(

        ".match"

      )

    ]

    .find(

      x =>

        x.dataset.matchNumber

        ===

        String(match)

    );

  if(el){

    applyCertificationState(

      el,

      match

    );

  }

  if(

    !certificationTableAvailable

  ){

    showStatus(

      "Certification table is not available in Supabase.",

      "error"

    );

    return;

  }

  try{

    const {

      error

    } =

      await supabaseClient

        .from(

          "scorecard_certifications"

        )

        .upsert(

          {

            round_number:

              Number(

                currentRound

              ),

            match_number:

              Number(match),

            marker_certified:

              c.marker_certified,

            opponent_certified:

              c.opponent_certified,

            updated_at:

              new Date()

                .toISOString()

          },

          {

            onConflict:

              "round_number,match_number"

          }

        );

    if(error){

      throw error;

    }

  }catch(e){

    showStatus(

      "CERTIFICATION SAVE ERROR: " +

      e.message,

      "error"

    );

  }

}

/* =========================================================

   ROUND CHANGE

   ========================================================= */

async function setRound(

  round

){

  currentRound =

    Number(round);

  loadToken++;

  document

    .querySelectorAll(

      ".round-btn"

    )

    .forEach(

      (b,i) => {

        b.classList.toggle(

          "active",

          i === currentRound - 1

        );

      }

    );

  showStatus(

    `Loading Round ${currentRound}...`

  );

  await Promise.all(

    [

      loadPairings(),

      loadScores(),

      loadCertifications()

    ]

  );

  renderScorecards();

  clearStatus();

}

/* =========================================================

   REALTIME

   ========================================================= */

function startRealtime(){

  if(

    realtimeChannel

  ){

    supabaseClient

      .removeChannel(

        realtimeChannel

      );

  }

  realtimeChannel =

    supabaseClient

      .channel(

        "scottsdale26-live-scorecard"

      )

      .on(

        "postgres_changes",

        {

          event:"*",

          schema:"public",

          table:"scores"

        },

        async () => {

          await loadScores();

          renderScorecards();

        }

      )

      .on(

        "postgres_changes",

        {

          event:"*",

          schema:"public",

          table:"pairings"

        },

        async () => {

          await loadPairings();

          renderScorecards();

        }

      )

      .on(

        "postgres_changes",

        {

          event:"*",

          schema:"public",

          table:"pairing_players"

        },

        async () => {

          await loadPairings();

          renderScorecards();

        }

      )

      .on(

        "postgres_changes",

        {

          event:"*",

          schema:"public",

          table:"scorecard_certifications"

        },

        async () => {

          await loadCertifications();

          renderScorecards();

        }

      )

      .subscribe(

        s =>

          console.log(

            "SCOTTSDALE REALTIME:",

            s

          )

      );

}

/* =========================================================

   START APP

   ========================================================= */

async function startApp(){

  showStatus(

    "Loading Scottsdale 26 scorecard...",

    "loading"

  );

  try{

    await loadPairings();

    await loadScores();

    await loadCertifications();

    renderScorecards();

    clearStatus();

    startRealtime();

  }catch(e){

    console.error(e);

    showStatus(

      "STARTUP ERROR: " +

      e.message,

      "error"

    );

  }

}

/* =========================================================

   START

   ========================================================= */

startApp();

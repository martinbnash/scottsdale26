/* =========================================================

/* =========================================================

const dinosaurMountain = {

  ],

  ]
};

  name:"We-Ko-Pa Saguaro • Purple / White Tees",

  ]
};


/* =========================================================
   STATE
   ========================================================= */

let currentRound = 1;

let scores = {};

let certifications = {};

let realtimeChannel = null;


/* =========================================================
   COURSE
   ========================================================= */

function getCourse(round) {

  if (round === 1) {
    return dinosaurMountain;
  }

  if (round === 2 || round === 5) {
    return weKoPaCholla;
  }

  return weKoPaSaguaro;
}


/* =========================================================
   TEE ASSIGNMENT
   ========================================================= */

function getPlayerTee(playerName, course) {

  const specialPlayer =
    playerName === "Ryan D" ||
    playerName === "Brad";


  if (course === dinosaurMountain) {

    return specialPlayer
      ? "blue"
      : "black";
  }


  if (
    course === weKoPaCholla ||
    course === weKoPaSaguaro
  ) {

    return specialPlayer
      ? "white"
      : "purple";
  }


  return null;
}


/* =========================================================
   SCORE KEY
   ========================================================= */

function getScoreKey(
  round,
  match,
  player,
  hole
) {

  return `${round}_${match}_${player}_${hole}`;
}


/* =========================================================
   STATUS
   ========================================================= */

function showStatus(
  message,
  type="loading"
) {

  const status =
    document.getElementById("status");

  status.className =
    `status ${type}`;

  status.textContent =
    message;
}


function clearStatus() {

  const status =
    document.getElementById("status");

  status.className =
    "status";

  status.textContent =
    "";
}


/* =========================================================
   DATABASE TEST
   ========================================================= */

async function testDatabase() {

  try {

    const { error } =
      await supabaseClient
        .from("scores")
        .select("*")
        .limit(1);

    if (error) {

      console.error(
        "SUPABASE ERROR:",
        error
      );

      showStatus(
        "SUPABASE ERROR: " +
        error.message,
        "error"
      );

      return false;
    }

    return true;

  } catch(error) {

    showStatus(
      "DATABASE CONNECTION ERROR: " +
      error.message,
      "error"
    );

    return false;
  }
}


/* =========================================================
   LOAD PAIRINGS
   ========================================================= */

async function loadPairings() {

  try {

    const {
      data:pairingRows,
      error:pairingError
    } =
      await supabaseClient
        .from("pairings")
        .select("*")
        .eq(
          "round_number",
          currentRound
        )
        .order(
          "pairing_number",
          {
            ascending:true
          }
        );


    if (pairingError) {
      throw pairingError;
    }


    const {
      data:playerRows,
      error:playerError
    } =
      await supabaseClient
        .from("pairing_players")
        .select("*");


    if (playerError) {
      throw playerError;
    }


    const loaded = [];


    (pairingRows || []).forEach(
      pairing => {

        const rows =
          (playerRows || []).filter(
            row =>
              String(row.pairing_id) ===
              String(pairing.id)
          );


        const ryan =
          rows
            .filter(
              row =>
                String(row.side)
                  .toUpperCase() === "B"
            )
            .map(
              row => row.player_name
            )
            .filter(Boolean);


        const clayton =
          rows
            .filter(
              row =>
                String(row.side)
                  .toUpperCase() === "A"
            )
            .map(
              row => row.player_name
            )
            .filter(Boolean);


        if (
          ryan.length === 2 &&
          clayton.length === 2
        ) {

          loaded.push({
            pairingNumber:
              Number(pairing.pairing_number),

            ryan,

            clayton
          });
        }
      }
    );


    pairings[currentRound] =
      loaded.sort(
        (a,b) =>
          a.pairingNumber -
          b.pairingNumber
      );


  } catch(error) {

    console.error(
      "PAIRING LOAD ERROR:",
      error
    );

    pairings[currentRound] = [];

    showStatus(
      "PAIRING LOAD ERROR: " +
      error.message,
      "error"
    );
  }
}


/* =========================================================
   LOAD SCORES
   ========================================================= */

async function loadScores() {

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("scores")
        .select("*")
        .eq(
          "round_number",
          currentRound
        );


    if (error) {
      throw error;
    }


    scores = {};


    (data || []).forEach(
      row => {

        const key =
          getScoreKey(
            row.round_number,
            row.match_number,
            row.player_name,
            row.hole_number
          );


        scores[key] =
          row.gross_score;
      }
    );


  } catch(error) {

    console.error(
      "SCORE LOAD ERROR:",
      error
    );

    showStatus(
      "SCORE LOAD ERROR: " +
      error.message,
      "error"
    );
  }
}


/* =========================================================
   LOAD CERTIFICATIONS
   ========================================================= */

async function loadCertifications() {

  certifications = {};

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("scorecard_certifications")
        .select("*")
        .eq(
          "round_number",
          currentRound
        );


    if (error) {
      throw error;
    }


    (data || []).forEach(
      row => {

        certifications[
          `${row.round_number}_${row.match_number}`
        ] = {

          marker_certified:
            Boolean(
              row.marker_certified
            ),

          opponent_certified:
            Boolean(
              row.opponent_certified
            )
        };
      }
    );


  } catch(error) {

    console.error(
      "CERTIFICATION LOAD ERROR:",
      error
    );

    showStatus(
      "CERTIFICATION LOAD ERROR: " +
      error.message +
      " | Make sure the scorecard_certifications table exists.",
      "error"
    );
  }
}


/* =========================================================
   COURSE HANDICAP
   ========================================================= */

function getPlayerCourseHandicap(
  playerName,
  course
) {

  const handicapIndex =
    Number(
      players[playerName]?.handicap || 0
    );


  const tee =
    getPlayerTee(
      playerName,
      course
    );


  let courseRating;
  let slopeRating;
  let par;


  /* -------------------------
     DINOSAUR
     ------------------------- */

  if (course === dinosaurMountain) {

    par = 70;


    if (tee === "black") {

      courseRating = 70.1;
      slopeRating = 137;

    } else {

      courseRating = 67.5;
      slopeRating = 125;
    }
  }


  /* -------------------------
     CHOLLA
     ------------------------- */

  else if (course === weKoPaCholla) {

    par = 72;


    if (tee === "white") {

      courseRating = 68.6;
      slopeRating = 122;

    } else {

      courseRating = 71.7;
      slopeRating = 135;
    }
  }


  /* -------------------------
     SAGUARO
     ------------------------- */

  else if (course === weKoPaSaguaro) {

    par = 71;


    if (tee === "white") {

      courseRating = 68.8;
      slopeRating = 125;

    } else {

      courseRating = 70.2;
      slopeRating = 132;
    }
  }


  else {

    return 0;
  }


  /*
    WHS COURSE HANDICAP
  */

  const courseHandicap =
    handicapIndex *
      (slopeRating / 113) +
    (courseRating - par);


  /*
    SCOTTSDALE 26 = 85%
  */

  return Math.round(
    courseHandicap * 0.85
  );
}


/* =========================================================
   MATCH PLAYING HANDICAPS
   ========================================================= */

function getMatchPlayingHandicaps(
  match,
  course
) {

  const allPlayers = [
    ...match.ryan,
    ...match.clayton
  ];


  const courseHandicaps =
    allPlayers.map(
      playerName => ({

        playerName,

        playingHandicap:
          getPlayerCourseHandicap(
            playerName,
            course
          )
      })
    );


  /*
    LOWEST PLAYING HANDICAP
    = ZERO-STROKE BASELINE
  */

  const lowest =
    Math.min(
      ...courseHandicaps.map(
        p => p.playingHandicap
      )
    );


  return Object.fromEntries(

    courseHandicaps.map(
      p => [

        p.playerName,

        Math.max(
          0,
          p.playingHandicap -
          lowest
        )
      ]
    )
  );
}


/* =========================================================
   STROKES
   ========================================================= */

function getsStrokesOnHole(
  playerName,
  holeIndex,
  course,
  matchPlayingHandicaps=null
) {

  const playingHandicap =
    matchPlayingHandicaps
      ? Number(
          matchPlayingHandicaps[
            playerName
          ] || 0
        )
      : getPlayerCourseHandicap(
          playerName,
          course
        );


  const holeRank =
    Number(
      course.handicap[
        holeIndex
      ]
    );


  let strokes = 0;


  if (
    playingHandicap >=
    holeRank
  ) {

    strokes++;
  }


  if (
    playingHandicap > 18 &&
    playingHandicap - 18 >=
    holeRank
  ) {

    strokes++;
  }


  return strokes;
}


function getsStrokeDot(
  playerName,
  holeIndex,
  course,
  matchPlayingHandicaps=null
) {

  return (
    getsStrokesOnHole(
      playerName,
      holeIndex,
      course,
      matchPlayingHandicaps
    ) > 0
  );
}


function calculateNetScore(
  playerName,
  grossScore,
  holeIndex,
  course,
  matchPlayingHandicaps=null
) {

  if (
    grossScore === "" ||
    grossScore === null ||
    grossScore === undefined
  ) {

    return "";
  }


  return Number(grossScore) -
    getsStrokesOnHole(
      playerName,
      holeIndex,
      course,
      matchPlayingHandicaps
    );
}


/* =========================================================
   CERTIFICATION
   ========================================================= */

function getCertificationKey(
  round,
  matchNumber

  return `${round}_${matchNumber}`;
}


function isScorecardLocked(
  matchNumber
) {

  const certification =
    certifications[
      getCertificationKey(
        currentRound,
        matchNumber
      )
    ];


  return Boolean(
    certification?.marker_certified &&
    certification?.opponent_certified
  );
}


async function updateCertification(
  matchNumber,
  type,
  checked
) {

  const key =
    getCertificationKey(
      currentRound,
      matchNumber
    );


  const current =
    certifications[key] || {

      marker_certified:false,

      opponent_certified:false
    };


  current[type] =
    Boolean(checked);


  certifications[key] =
    current;


  const matchElement =
    [
      ...document.querySelectorAll(
        ".match"
      )
    ].find(
      el =>
        el.dataset.matchNumber ===
        String(matchNumber)
    );


  if (matchElement) {

    applyCertificationState(
      matchElement,
      matchNumber
    );
  }


  try {

    const { error } =
      await supabaseClient
        .from(
          "scorecard_certifications"
        )
        .upsert(

          {

            round_number:
              Number(currentRound),

            match_number:
              Number(matchNumber),

            marker_certified:
              current.marker_certified,

            opponent_certified:
              current.opponent_certified,

            updated_at:
              new Date().toISOString()
          },

          {
            onConflict:
              "round_number,match_number"
          }
        );


    if (error) {
      throw error;
    }


    showAutoSave(
      isScorecardLocked(
        matchNumber
      )
        ? "Scorecard certified and locked ✓"
        : "Certification updated ✓",
      "saved"
    );


  } catch(error) {

    console.error(
      "CERTIFICATION SAVE ERROR:",
      error
    );

    showStatus(
      "CERTIFICATION SAVE ERROR: " +
      error.message,
      "error"
    );
  }
}


function applyCertificationState(
  matchElement,
  matchNumber
) {

  const locked =
    isScorecardLocked(
      matchNumber
    );


  matchElement.classList.toggle(
    "scorecard-locked",
    locked
  );


  matchElement
    .querySelectorAll(
      "input.score-input"
    )
    .forEach(
      input => {
        input.disabled = locked;
      }
    );


  const certification =
    certifications[
      getCertificationKey(
        currentRound,
        matchNumber
      )
    ] || {};


  const markerBox =
    matchElement.querySelector(
      'input[data-cert-type="marker"]'
    );


  const opponentBox =
    matchElement.querySelector(
      'input[data-cert-type="opponent"]'
    );


  if (markerBox) {

    markerBox.checked =
      Boolean(
        certification.marker_certified
      );
  }


  if (opponentBox) {

    opponentBox.checked =
      Boolean(
        certification.opponent_certified
      );
  }


  const status =
    matchElement.querySelector(
      ".certification-status"
    );


  if (status) {

    status.textContent =
      locked
        ? "✓ Both certifications complete — scorecard is LOCKED"
        : "Both certifications are required to lock this scorecard.";


    status.classList.toggle(
      "locked",
      locked
    );
  }
}

/* =========================================================
   UPDATE SCORE
   ========================================================= */

async function updateScore(
  playerName,
  matchNumber,
  hole,
  value
) {

  if (
    isScorecardLocked(
      matchNumber
    )
  ) {

    showStatus(
      "This scorecard is certified by both marker and opponent and is locked.",
      "error"
    );

    renderScorecards();

    return;
  }


  const key =
    getScoreKey(
      currentRound,
      matchNumber,
      playerName,
      hole
    );


  if (value === "") {

    delete scores[key];

    updatePlayerTotals(
      matchNumber
    );

    calculateMatch(
      matchNumber
    );


    await deleteScoreAutomatically(
      currentRound,
      matchNumber,
      playerName,
      hole
    );

    return;
  }


  const numericValue =
    Number(value);


  scores[key] =
    numericValue;


  updatePlayerTotals(
    matchNumber
  );


  calculateMatch(
    matchNumber
  );


  await saveScoreAutomatically(
    currentRound,
    matchNumber,
    playerName,
    hole,
    numericValue
  );
}


/* =========================================================
   PLAYER TOTALS
   ========================================================= */

function updatePlayerTotals(
  matchNumber
) {

  const match =
    (pairings[currentRound] || [])
      .find(
        m =>
          Number(m.pairingNumber) ===
          Number(matchNumber)
      );


  if (!match) {
    return;
  }


  const allPlayers = [
    ...match.ryan,
    ...match.clayton
  ];


  allPlayers.forEach(
    playerName => {

      let front = 0;
      let back = 0;

      let frontComplete = true;
      let backComplete = true;


      for (
        let hole=1;
        hole<=18;
        hole++
      ) {

        const key =
          getScoreKey(
            currentRound,
            matchNumber,
            playerName,
            hole
          );


        const value =
          scores[key];


        if (
          value === undefined ||
          value === ""
        ) {

          if (hole <= 9) {

            frontComplete = false;

          } else {

            backComplete = false;
          }

          continue;
        }


        if (hole <= 9) {

          front += Number(value);

        } else {

          back += Number(value);
        }
      }


      const frontCell =
        document.getElementById(
          `front-${currentRound}-${matchNumber}-${playerName}`
        );


      const backCell =
        document.getElementById(
          `back-${currentRound}-${matchNumber}-${playerName}`
        );


      const totalCell =
        document.getElementById(
          `total-${currentRound}-${matchNumber}-${playerName}`
        );


      if (frontCell) {

        frontCell.textContent =
          frontComplete
            ? front
            : "-";
      }


      if (backCell) {

        backCell.textContent =
          backComplete
            ? back
            : "-";
      }


      if (totalCell) {

        totalCell.textContent =
          frontComplete &&
          backComplete
            ? front + back
            : "-";
      }

    }
  );
}


/* =========================================================
   MATCH CALCULATION
   ========================================================= */

function calculateMatch(
  matchNumber
) {

  const match =
    (pairings[currentRound] || [])
      .find(
        m =>
          Number(m.pairingNumber) ===
          Number(matchNumber)
      );


  if (!match) {
    return;
  }


  const course =
    getCourse(
      currentRound
    );


  const matchPlayingHandicaps =
    getMatchPlayingHandicaps(
      match,
      course
    );


  let ryanHolePoints = 0;
  let claytonHolePoints = 0;


  let ryanBirdieBonus = 0;
  let claytonBirdieBonus = 0;


  let frontRyan = 0;
  let frontClayton = 0;

  let backRyan = 0;
  let backClayton = 0;


  let frontRyanHoles = 0;
  let frontClaytonHoles = 0;

  let backRyanHoles = 0;
  let backClaytonHoles = 0;


  for (
    let holeIndex=0;
    holeIndex<18;
    holeIndex++
  ) {

    const hole =
      holeIndex + 1;


    const ryanScores =
      match.ryan.map(
        playerName => {

          const key =
            getScoreKey(
              currentRound,
              matchNumber,
              playerName,
              hole
            );


          const gross =
            scores[key];


          if (
            gross === undefined ||
            gross === ""
          ) {

            return null;
          }


          return {

            player:
              playerName,

            gross:
              Number(gross),

            net:
              calculateNetScore(
                playerName,
                gross,
                holeIndex,
                course,
                matchPlayingHandicaps
              )
          };
        }
      );


    const claytonScores =
      match.clayton.map(
        playerName => {

          const key =
            getScoreKey(
              currentRound,
              matchNumber,
              playerName,
              hole
            );


          const gross =
            scores[key];


          if (
            gross === undefined ||
            gross === ""
          ) {

            return null;
          }


          return {

            player:
              playerName,

            gross:
              Number(gross),

            net:
              calculateNetScore(
                playerName,
                gross,
                holeIndex,
                course,
                matchPlayingHandicaps
              )
          };
        }
      );


    /*
      Hole is not complete until
      all four players have a score.
    */

    if (
      ryanScores.includes(null) ||
      claytonScores.includes(null)
    ) {

      continue;
    }


    const ryanBest =
      Math.min(
        ...ryanScores.map(
          score => score.net
        )
      );


    const claytonBest =
      Math.min(
        ...claytonScores.map(
          score => score.net
        )
      );


    if (hole <= 9) {

      frontRyan += ryanBest;
      frontClayton += claytonBest;

    } else {

      backRyan += ryanBest;
      backClayton += claytonBest;
    }


    /*
      =====================================================
      HOLE WIN + BIRDIE/EAGLE BONUS

      ONLY ONE TEAM BONUS PER HOLE.

      Example:

      Team Ryan:
        Player 1 = birdie
        Player 2 = birdie

      Ryan gets +1 total.

      Team Ryan:
        Player 1 = eagle
        Player 2 = birdie

      Ryan gets +2 total.

      The bonus is GROSS.

      The team must WIN the hole.

      Tie = NO bonus.
      Losing = NO bonus.
      =====================================================
    */


    if (
      ryanBest < claytonBest
    ) {

      ryanHolePoints++;


      if (hole <= 9) {

        frontRyanHoles++;

      } else {

        backRyanHoles++;
      }


      const ryanHoleBonus =
        Math.max(
          ...ryanScores.map(
            score => {

              if (
                score.gross <=
                course.pars[holeIndex] - 2
              ) {

                return 2;
              }


              if (
                score.gross ===
                course.pars[holeIndex] - 1
              ) {

                return 1;
              }


              return 0;
            }
          )
        );


      ryanBirdieBonus +=
        ryanHoleBonus;

    }


    else if (
      claytonBest < ryanBest
    ) {

      claytonHolePoints++;


      if (hole <= 9) {

        frontClaytonHoles++;

      } else {

        backClaytonHoles++;
      }


      const claytonHoleBonus =
        Math.max(
          ...claytonScores.map(
            score => {

              if (
                score.gross <=
                course.pars[holeIndex] - 2
              ) {

                return 2;
              }


              if (
                score.gross ===
                course.pars[holeIndex] - 1
              ) {

                return 1;
              }


              return 0;
            }
          )
        );


      claytonBirdieBonus +=
        claytonHoleBonus;
    }

  }


  /* =====================================================
     MATCH POINTS
     ===================================================== */

  let ryanMatchPoints = 0;
  let claytonMatchPoints = 0;


  let frontResult =
    "IN PROGRESS";


  if (
    frontRyanHoles === 9 ||
    frontClaytonHoles === 9 ||
    (
      frontRyanHoles +
      frontClaytonHoles > 0
    )
  ) {

    if (
      frontRyanHoles >
      frontClaytonHoles
    ) {

      frontResult =
        "RYAN WINS FRONT";

      ryanMatchPoints += 3;

    }

    else if (
      frontClaytonHoles >
      frontRyanHoles
    ) {

      frontResult =
        "CLAYTON WINS FRONT";

      claytonMatchPoints += 3;

    }

    else {

      frontResult =
        "FRONT TIED";
    }
  }


  let backResult =
    "IN PROGRESS";


  if (
    backRyanHoles > 0 ||
    backClaytonHoles > 0
  ) {

    if (
      backRyanHoles >
      backClaytonHoles
    ) {

      backResult =
        "RYAN WINS BACK";

      ryanMatchPoints += 3;

    }

    else if (
      backClaytonHoles >
      backRyanHoles
    ) {

      backResult =
        "CLAYTON WINS BACK";

      claytonMatchPoints += 3;

    }

    else {

      backResult =
        "BACK TIED";
    }
  }


  /*
    18-HOLE STROKE PLAY

    Only award once all 18 holes
    have been completed for both teams.
  */

  const completedHoles =
    frontRyanHoles +
    frontClaytonHoles +
    backRyanHoles +
    backClaytonHoles;


  const all18Complete =
    completedHoles === 18;


  const ryan18 =
    frontRyan +
    backRyan;


  const clayton18 =
    frontClayton +
    backClayton;


  let strokeResult =
    "IN PROGRESS";


  if (all18Complete) {

    if (
      ryan18 < clayton18
    ) {

      strokeResult =
        "RYAN WINS 18";

      ryanMatchPoints += 5;

    }

    else if (
      clayton18 < ryan18
    ) {

      strokeResult =
        "CLAYTON WINS 18";

      claytonMatchPoints += 5;

    }

    else {

      strokeResult =
        "18 TIED";
    }
  }


  /*
    ROUND 5 = 1.5x MATCH POINTS.

    Birdie/eagle bonuses DO NOT
    receive the 1.5x multiplier.
  */

  let displayedRyanPoints =
    ryanMatchPoints;


  let displayedClaytonPoints =
    claytonMatchPoints;


  if (
    currentRound === 5
  ) {

    displayedRyanPoints =
      ryanMatchPoints * 1.5;

    displayedClaytonPoints =
      claytonMatchPoints * 1.5;
  }


  /*
    Birdie/eagle bonuses are then
    added separately at their normal
    value.
  */

  const totalRyanPoints =
    displayedRyanPoints +
    ryanBirdieBonus;


  const totalClaytonPoints =
    displayedClaytonPoints +
    claytonBirdieBonus;


  /*
    DISPLAY
  */

  const frontResultElement =
    document.getElementById(
      `front-result-${matchNumber}`
    );


  const backResultElement =
    document.getElementById(
      `back-result-${matchNumber}`
    );


  const strokeResultElement =
    document.getElementById(
      `stroke-result-${matchNumber}`
    );


  const bonusResultElement =
    document.getElementById(
      `bonus-result-${matchNumber}`
    );


  const pointsResultElement =
    document.getElementById(
      `points-result-${matchNumber}`
    );


  if (frontResultElement) {

    frontResultElement.textContent =
      `${frontResult} • ${frontRyanHoles}-${frontClaytonHoles}`;
  }


  if (backResultElement) {

    backResultElement.textContent =
      `${backResult} • ${backRyanHoles}-${backClaytonHoles}`;
  }


  if (strokeResultElement) {

    strokeResultElement.textContent =
      all18Complete
        ? `${strokeResult} • ${ryan18}-${clayton18}`
        : `IN PROGRESS • ${ryan18 || "-"}-${clayton18 || "-"}`;
  }


  if (bonusResultElement) {

    bonusResultElement.textContent =
      `RYAN +${ryanBirdieBonus} • CLAYTON +${claytonBirdieBonus}`;
  }


  if (pointsResultElement) {

    pointsResultElement.textContent =
      `RYAN ${totalRyanPoints} • CLAYTON ${totalClaytonPoints}`;
  }
}


/* =========================================================
   AUTOSAVE STATUS
   ========================================================= */

function showAutoSave(
  message,
  type
) {

  const status =
    document.getElementById(
      "autosave-status"
    );


  status.className =
    `autosave-status ${type}`;


  status.textContent =
    message;


  setTimeout(
    () => {

      if (
        status.textContent ===
        message
      ) {

        status.textContent =
          "";

        status.className =
          "autosave-status";
      }

    },
    1500
  );
}


/* =========================================================
   DELETE SINGLE SCORE
   ========================================================= */

async function deleteScoreAutomatically(
  roundNumber,
  matchNumber,
  playerName,
  holeNumber
) {

  showAutoSave(
    "Clearing score...",
    "saving"
  );


  try {

    const { error } =
      await supabaseClient
        .from("scores")
        .delete()
        .eq(
          "round_number",
          Number(roundNumber)
        )
        .eq(
          "match_number",
          Number(matchNumber)
        )
        .eq(
          "player_name",
          playerName
        )
        .eq(
          "hole_number",
          Number(holeNumber)
        );


    if (error) {
      throw error;
    }


    delete scores[
      getScoreKey(
        roundNumber,
        matchNumber,
        playerName,
        holeNumber
      )
    ];


    showAutoSave(
      "Score cleared ✓",
      "saved"
    );


  } catch(error) {

    console.error(
      "DELETE SCORE ERROR:",
      error
    );


    showAutoSave(
      "CLEAR ERROR: " +
      error.message,
      "error"
    );
  }
}


/* =========================================================
   CLEAR MATCH
   ========================================================= */

async function clearMatchScores(
  matchNumber
) {

  const numericMatch =
    Number(matchNumber);


  if (
    isScorecardLocked(
      numericMatch
    )
  ) {

    showStatus(
      `Match ${numericMatch} is certified and locked. Uncheck both certifications before clearing its scores.`,
      "error"
    );

    return;
  }


  const confirmed =
    window.confirm(
      `Clear ALL scores for Match ${numericMatch} in Round ${currentRound}?\n\nThis will permanently delete the saved scores for this match from Supabase.`
    );


  if (!confirmed) {
    return;
  }


  showAutoSave(
    `Clearing Match ${numericMatch}...`,
    "saving"
  );


  try {

    const { error } =
      await supabaseClient
        .from("scores")
        .delete()
        .eq(
          "round_number",
          Number(currentRound)
        )
        .eq(
          "match_number",
          numericMatch
        );


    if (error) {
      throw error;
    }


    const prefix =
      `${currentRound}_${numericMatch}_`;


    Object.keys(scores).forEach(
      key => {

        if (
          key.startsWith(prefix)
        ) {

          delete scores[key];
        }
      }
    );


    renderScorecards();


    showAutoSave(
      `Match ${numericMatch} scores cleared ✓`,
      "saved"
    );


  } catch(error) {

    console.error(
      "CLEAR MATCH ERROR:",
      error
    );


    showAutoSave(
      "CLEAR ERROR: " +
      error.message,
      "error"
    );
  }
}


/* =========================================================
   SAVE SINGLE SCORE
   ========================================================= */

async function saveScoreAutomatically(
  roundNumber,
  matchNumber,
  playerName,
  holeNumber,
  grossScore
) {

  showAutoSave(
    "Saving...",
    "saving"
  );


  try {

    const { error } =
      await supabaseClient
        .from("scores")
        .upsert(

          {

            round_number:
              Number(roundNumber),

            match_number:
              Number(matchNumber),

            player_name:
              playerName,

            hole_number:
              Number(holeNumber),

            gross_score:
              Number(grossScore)
          },

          {

            onConflict:
              "round_number,match_number,player_name,hole_number"
          }
        );


    if (error) {
      throw error;
    }


    showAutoSave(
      "Score saved ✓",
      "saved"
    );


  } catch(error) {

    console.error(
      "AUTO-SAVE ERROR:",
      error
    );


    showAutoSave(
      "SAVE ERROR: " +
      error.message,
      "error"
    );
  }
}


/* =========================================================
   ROUND CHANGE
   ========================================================= */

async function setRound(
  roundNumber
) {

  currentRound =
    Number(roundNumber);


  document
    .querySelectorAll(
      ".round-btn"
    )
    .forEach(
      (button,index) => {

        button.classList.toggle(
          "active",
          index ===
          currentRound - 1
        );
      }
    );


  showStatus(
    `Loading Round ${currentRound}...`,
    "loading"
  );


  await loadPairings();

  await loadScores();

  await loadCertifications();


  renderScorecards();


  clearStatus();
}


/* =========================================================
   REALTIME
   ========================================================= */

function startRealtime() {

  if (realtimeChannel) {
    return;
  }


  realtimeChannel =
    supabaseClient
      .channel(
        "scottsdale26-live-scorecard"
      )


      /*
        PAIRINGS
      */

      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"pairings"
        },
        async () => {

          await loadPairings();

          renderScorecards();
        }
      )


      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"pairing_players"
        },
        async () => {

          await loadPairings();

          renderScorecards();
        }
      )


      /*
        SCORES
      */

      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"scores"
        },
        async payload => {

          const row =
            payload.new ||
            payload.old;


          if (
            row &&
            Number(row.round_number) !==
            Number(currentRound)
          ) {

            return;
          }


          await loadScores();

          renderScorecards();
        }
      )


      /*
        CERTIFICATIONS
      */

      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"scorecard_certifications"
        },
        async payload => {

          const row =
            payload.new ||
            payload.old;


          if (
            row &&
            Number(row.round_number) !==
            Number(currentRound)
          ) {

            return;
          }


          await loadCertifications();

          renderScorecards();
        }
      )


      .subscribe(
        status => {

          console.log(
            "Realtime status:",
            status
          );
        }
      );
}


/* =========================================================
   START APP
   ========================================================= */

async function startApp() {

  const connected =
    await testDatabase();


  if (!connected) {
    return;
  }


  await loadPairings();

  await loadScores();

  await loadCertifications();


  renderScorecards();


  startRealtime();
}


startApp();

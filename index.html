  <style>

    :root {
      --bg: #0b1220;
      --panel: #172033;
      --card: #243247;
      --line: #40516a;
      --text: #f8fafc;
      --muted: #a9b6c8;
      --blue: #3b82f6;
      --red: #ef4444;
      --gold: #fbbf24;
      --green: #22c55e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: linear-gradient(
        160deg,
        #0b1220,
        #111c2f
      );
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 25px 15px 15px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 44px);
      letter-spacing: 1px;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 6px;
      font-weight: bold;
    }

    .sync-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 12px;
      padding: 7px 12px;
      border-radius: 999px;
      background: #111827;
      border: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
      font-weight: bold;
    }

    .sync-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--muted);
    }

    .sync-status.connected .sync-dot {
      background: var(--green);
    }

    .sync-status.saving .sync-dot {
      background: var(--gold);
    }

    .sync-status.error .sync-dot {
      background: var(--red);
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 20px 10px 10px;
    }

    .tab {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab.active {
      background: var(--gold);
      color: #111827;
      border-color: var(--gold);
    }

    .course {
      text-align: center;
      color: var(--muted);
      margin-bottom: 15px;
      font-weight: bold;
    }

    .board {

    }

    .instructions {

      background: var(--panel);

      color: #fde68a;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .matches {
      display: grid;
      gap: 15px;
    }

    .match {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 15px;
    }

    .match-title {
      text-align: center;
      color: var(--gold);
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 18px;
    }

    .match-row {
      display: grid;
      grid-template-columns: 1fr 60px 1fr;
      gap: 12px;
      align-items: center;
    }

    .pairing-side {
      background: #111827;
      padding: 10px;
      border-radius: 12px;
    }

    .pair-label {
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      color: var(--muted);

    }

    .player-slots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .slot {

      background: #0f172a;
      border: 2px dashed var(--line);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .clayton-slot {
      border-color: var(--blue);
    }

    .ryan-slot {
      border-color: var(--red);
    }

    .slot-handicap {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    .vs {
      text-align: center;
      font-weight: bold;
      color: var(--muted);
      font-size: 18px;
    }

    .rosters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 25px;
    }

    .roster {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 15px;
    }

    .roster h2 {
      text-align: center;

    }

    }

    }

    .player {

      font-weight: bold;
      cursor: pointer;
      background: var(--card);
      color: white;
      text-align: center;
    }

    .clayton-player {
      border: 2px solid var(--blue);
    }

    .ryan-player {
      border: 2px solid var(--red);
    }

    .player.selected {
      border-color: var(--gold);
      color: var(--gold);
      box-shadow: 0 0 0 2px rgba(251,191,36,.3);
    }

    .player.used {
      opacity: .35;
      cursor: not-allowed;
    }

    .handicap {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .pairing-history {
      margin-top: 25px;
      background: var(--panel);
      border: 1px solid var(--gold);
      border-radius: 15px;
      padding: 20px;
    }

    .history-title {
      text-align: center;
      color: var(--gold);
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .history-subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .history-section {
      margin-top: 20px;
    }

    .history-section h3 {
      color: var(--text);
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
    }

    .history-row {
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }

    .history-player {
      font-weight: bold;
      color: var(--gold);
      margin-bottom: 5px;
    }

    .history-names {
      color: var(--muted);
      line-height: 1.5;
    }

    .controls {
      text-align: center;
      margin-top: 20px;
    }

    .controls button {
      border: 0;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      margin: 4px;
    }

    .clear {
      background: #475569;
      color: white;
    }

    .reset {
      background: #991b1b;
      color: white;
    }

    .scorecard-link {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      background: #fbbf24;
      color: #111827;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    @media (max-width: 650px) {

      .match-row {
        grid-template-columns: 1fr 35px 1fr;
      }

      .player-slots {
        grid-template-columns: 1fr;
      }

      .rosters {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>

  <script>

    /* =========================================================
       SUPABASE CONNECTION
    ========================================================= */

    const SUPABASE_URL =
      "https://dxajaneijkrywjoveac.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable__CPedEYs1OS2ZYZh2DieiQ_0Ww_0e5k";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================================================
       TOURNAMENT DATA
    ========================================================= */

    const rounds = [

      {
        name: "Round 1",
        course: "Dinosaur Mountain • September 24"
      },

      {
        name: "Round 2",
        course: "We-Ko-Pa Cholla • September 25 AM"
      },

      {
        name: "Round 3",
        course: "We-Ko-Pa Saguaro • September 25 PM"
      },

      {
        name: "Round 4",
        course: "We-Ko-Pa Saguaro • September 26"
      },

      {
        name: "Round 5",
        course: "We-Ko-Pa Cholla • September 27"
      }

    ];


    const claytonTeam = [

      {
        name: "Clayton",
        handicap: 9.7
      },

      {
        name: "Marty",
        handicap: 7.2
      },

      {
        name: "Raymond",
        handicap: 15
      },

      {
        name: "Brian",
        handicap: 10.7
      },

      {
        name: "Michael",
        handicap: 19
      },

      {
        name: "Aaron",
        handicap: 20
      }

    ];


    const ryanTeam = [

      {
        name: "Ryan",
        handicap: 14
      },

      {
        name: "Jon",
        handicap: 8
      },

      {
        name: "Ryan D",
        handicap: 19.9
      },

      {
        name: "Brad",
        handicap: 15
      },

      {
        name: "Brent",
        handicap: 11.4
      },

      {
        name: "Travis",
        handicap: 16
      }

    ];


    const allPlayers = [
      ...claytonTeam,
      ...ryanTeam
    ];


    /* =========================================================
       APP STATE
    ========================================================= */

    let currentRound = 0;

    let selectedPlayer = null;

    let pairings = {};

    let isLoading = false;

    let realtimeTimer = null;


    /* =========================================================
       STATUS
    ========================================================= */

    function setSyncStatus(
      text,
      status = "connected"
    ) {

      const statusDiv =
        document.getElementById(
          "syncStatus"
        );

      const textDiv =
        document.getElementById(
          "syncText"
        );

      statusDiv.className =
        `sync-status ${status}`;

      textDiv.textContent = text;

    }


    /* =========================================================
       PLAYER HELPERS
    ========================================================= */

    function getPlayer(name) {

      return allPlayers.find(
        player => player.name === name
      );

    }


    function getPlayerNames(team) {

      return team.map(
        player => player.name
      );

    }


    function emptyRound() {

      return [

        {
          clayton: ["", ""],
          ryan: ["", ""]
        },

        {
          clayton: ["", ""],
          ryan: ["", ""]
        },

        {
          clayton: ["", ""],
          ryan: ["", ""]
        }

      ];

    }


    function getRoundData() {

      if (!pairings[currentRound]) {

        pairings[currentRound] =
          emptyRound();

      }

      return pairings[currentRound];

    }


    /* =========================================================
       LOAD PAIRINGS FROM SUPABASE
    ========================================================= */

    async function loadPairingsFromSupabase() {

      if (isLoading) {
        return;
      }

      isLoading = true;

      setSyncStatus(
        "Loading shared pairings...",
        "saving"
      );

      try {

        const {
          data: pairingRows,
          error: pairingError
        } = await supabaseClient
          .from("pairings")
          .select("*")
          .order(
            "round_number",
            {
              ascending: true
            }
          )
          .order(
            "pairing_number",
            {
              ascending: true
            }
          );


        if (pairingError) {
          throw pairingError;
        }


        const {
          data: playerRows,
          error: playerError
        } = await supabaseClient
          .from("pairing_players")
          .select("*")
          .order(
            "created_at",
            {
              ascending: true
            }
          );


        if (playerError) {
          throw playerError;
        }


        const newPairings = {};

        const playersByPairing = {};


        playerRows.forEach(
          row => {

            if (
              !playersByPairing[
                row.pairing_id
              ]
            ) {

              playersByPairing[
                row.pairing_id
              ] = {
                A: [],
                B: []
              };

            }


            playersByPairing[
              row.pairing_id
            ][
              row.side
            ].push(
              row.player_name
            );

          }
        );


        pairingRows.forEach(
          row => {

            const roundIndex =
              row.round_number - 1;

            const pairingIndex =
              row.pairing_number - 1;


            if (
              !newPairings[
                roundIndex
              ]
            ) {

              newPairings[
                roundIndex
              ] = emptyRound();

            }


            const assignedPlayers =
              playersByPairing[
                row.id
              ] || {
                A: [],
                B: []
              };


            newPairings[
              roundIndex
            ][
              pairingIndex
            ] = {

              clayton: [
                assignedPlayers.A[0] || "",
                assignedPlayers.A[1] || ""
              ],

              ryan: [
                assignedPlayers.B[0] || "",
                assignedPlayers.B[1] || ""
              ]

            };

          }
        );


        pairings = newPairings;

        render();

        setSyncStatus(
          "Live shared database connected",
          "connected"
        );

      }

      catch (error) {

        console.error(
          "Supabase load error:",
          error
        );

        setSyncStatus(
          "Database connection error",
          "error"
        );

        alert(
          "Could not load the shared pairings database."
        );

      }

      finally {

        isLoading = false;

      }

    }


    /* =========================================================
       SAVE CURRENT ROUND TO SUPABASE
    ========================================================= */

    async function saveCurrentRoundToSupabase() {

      setSyncStatus(
        "Saving changes...",
        "saving"
      );


      try {

        const roundNumber =
          currentRound + 1;


        const roundData =
          getRoundData();


        const pairingPayload =
          roundData.map(
            (match, index) => ({

              round_number:
                roundNumber,

              pairing_number:
                index + 1,

              team_a:
                "Clayton",

              team_b:
                "Ryan"

            })
          );


        const {
          data: savedPairings,
          error: pairingError
        } = await supabaseClient
          .from("pairings")
          .upsert(
            pairingPayload,
            {
              onConflict:
                "round_number,pairing_number"
            }
          )
          .select();


        if (pairingError) {
          throw pairingError;
        }


        for (
          let index = 0;
          index < savedPairings.length;
          index++
        ) {

          const savedPairing =
            savedPairings.find(
              row =>
                row.pairing_number ===
                index + 1
            );


          await supabaseClient
            .from("pairing_players")
            .delete()
            .eq(
              "pairing_id",
              savedPairing.id
            );


          const match =
            roundData[index];


          const playerPayload = [];


          match.clayton
            .filter(
              player => player
            )
            .forEach(
              player => {

                playerPayload.push({

                  pairing_id:
                    savedPairing.id,

                  player_name:
                    player,

                  side:
                    "A"

                });

              }
            );


          match.ryan
            .filter(
              player => player
            )
            .forEach(
              player => {

                playerPayload.push({

                  pairing_id:
                    savedPairing.id,

                  player_name:
                    player,

                  side:
                    "B"

                });

              }
            );


          if (
            playerPayload.length > 0
          ) {

            const {
              error: playerInsertError
            } = await supabaseClient
              .from("pairing_players")
              .insert(
                playerPayload
              );


            if (
              playerInsertError
            ) {
              throw playerInsertError;
            }

          }

        }


        setSyncStatus(
          "Changes saved for everyone",
          "connected"
        );

      }

      catch (error) {

        console.error(
          "Supabase save error:",
          error
        );

        setSyncStatus(
          "Could not save changes",
          "error"
        );

        alert(
          "Your pairing change could not be saved."
        );

      }

    }


    /* =========================================================
       CLEAR ROUND FROM SUPABASE
    ========================================================= */

    async function clearRoundFromSupabase(
      roundNumber
    ) {

      const {
        data: existingPairings,
        error: lookupError
      } = await supabaseClient
        .from("pairings")
        .select("id")
        .eq(
          "round_number",
          roundNumber
        );


      if (lookupError) {
        throw lookupError;
      }


      const pairingIds =
        existingPairings.map(
          row => row.id
        );


      if (
        pairingIds.length > 0
      ) {

        const {
          error: playersDeleteError
        } = await supabaseClient
          .from("pairing_players")
          .delete()
          .in(
            "pairing_id",
            pairingIds
          );


        if (
          playersDeleteError
        ) {
          throw playersDeleteError;
        }

      }


      const {
        error: pairingDeleteError
      } = await supabaseClient
        .from("pairings")
        .delete()
        .eq(
          "round_number",
          roundNumber
        );


      if (
        pairingDeleteError
      ) {
        throw pairingDeleteError;
      }

    }


    /* =========================================================
       RENDER
    ========================================================= */

    function render() {

      renderTabs();

      document.getElementById(
        "course"
      ).textContent =
        rounds[currentRound].course;

      renderMatches();

      renderPlayers();

      renderPairingHistory();

    }


    function renderTabs() {

      document.getElementById(
        "tabs"
      ).innerHTML =

        rounds.map(
          (round, index) => `

            <button
              class="tab ${
                index === currentRound
                  ? "active"
                  : ""
              }"
              onclick="changeRound(${index})"
            >
              ${round.name}
            </button>

          `
        ).join("");

    }


    function renderMatches() {

      const roundData =
        getRoundData();


      document.getElementById(
        "matches"
      ).innerHTML =

        roundData.map(
          (match, matchIndex) => `

            <div class="match">

              <div class="match-title">
                MATCH ${matchIndex + 1}
              </div>

              <div class="match-row">

                <div class="pairing-side">

                  <div class="pair-label">
                    CLAYTON'S TEAM
                  </div>

                  <div class="player-slots">

                    ${
                      match.clayton.map(
                        (
                          player,
                          slotIndex
                        ) => `

                          <div
                            class="slot clayton-slot"
                            onclick="
                              placePlayer(
                                ${matchIndex},
                                'clayton',
                                ${slotIndex}
                              )
                            "
                          >

                            ${
                              player

                                ? `

                                  <div>
                                    ${player}
                                  </div>

                                  <div
                                    class="slot-handicap"
                                  >
                                    HCP ${
                                      getPlayer(player)
                                        .handicap
                                    }
                                  </div>

                                `

                                : "Select Player"
                            }

                          </div>

                        `
                      ).join("")
                    }

                  </div>

                </div>


                <div class="vs">
                  VS
                </div>


                <div class="pairing-side">

                  <div class="pair-label">
                    RYAN'S TEAM
                  </div>

                  <div class="player-slots">

                    ${
                      match.ryan.map(
                        (
                          player,
                          slotIndex
                        ) => `

                          <div
                            class="slot ryan-slot"
                            onclick="
                              placePlayer(
                                ${matchIndex},
                                'ryan',
                                ${slotIndex}
                              )
                            "
                          >

                            ${
                              player

                                ? `

                                  <div>
                                    ${player}
                                  </div>

                                  <div
                                    class="slot-handicap"
                                  >
                                    HCP ${
                                      getPlayer(player)
                                        .handicap
                                    }
                                  </div>

                                `

                                : "Select Player"
                            }

                          </div>

                        `
                      ).join("")
                    }

                  </div>

                </div>

              </div>

            </div>

          `
        ).join("");

    }


    function getUsedPlayers() {

      return getRoundData()

        .flatMap(
          match => [
            ...match.clayton,
            ...match.ryan
          ]
        )

        .filter(
          player => player
        );

    }


    function renderPlayers() {

      const usedPlayers =
        getUsedPlayers();


      document.getElementById(
        "claytonPlayers"
      ).innerHTML =

        claytonTeam.map(
          player =>
            playerButton(
              player,
              "clayton-player",
              usedPlayers
            )
        ).join("");


      document.getElementById(
        "ryanPlayers"
      ).innerHTML =

        ryanTeam.map(
          player =>
            playerButton(
              player,
              "ryan-player",
              usedPlayers
            )
        ).join("");

    }


    function playerButton(
      player,
      teamClass,
      usedPlayers
    ) {

      const used =
        usedPlayers.includes(
          player.name
        );


      return `

        <button
          class="
            player
            ${teamClass}
            ${
              selectedPlayer === player.name
                ? "selected"
                : ""
            }
            ${
              used
                ? "used"
                : ""
            }
          "

          onclick="
            selectPlayer(
              '${player.name}'
            )
          "

          ${
            used
              ? "disabled"
              : ""
          }

        >

          <span>
            ${player.name}
          </span>

          <span class="handicap">
            HCP ${player.handicap}
          </span>

        </button>

      `;

    }


    function selectPlayer(
      player
    ) {

      selectedPlayer =
        selectedPlayer === player
          ? null
          : player;

      render();

    }


    /* =========================================================
       PLACE PLAYER
    ========================================================= */

    async function placePlayer(
      matchIndex,
      team,
      slotIndex
    ) {

      if (
        !selectedPlayer
      ) {

        alert(
          "Select a player first."
        );

        return;

      }


      const claytonNames =
        getPlayerNames(
          claytonTeam
        );


      const ryanNames =
        getPlayerNames(
          ryanTeam
        );


      if (
        team === "clayton" &&
        !claytonNames.includes(
          selectedPlayer
        )
      ) {

        alert(
          "That player belongs on Ryan's team."
        );

        return;

      }


      if (
        team === "ryan" &&
        !ryanNames.includes(
          selectedPlayer
        )
      ) {

        alert(
          "That player belongs on Clayton's team."
        );

        return;

      }


      const roundData =
        getRoundData();


      roundData[
        matchIndex
      ][
        team
      ][
        slotIndex
      ] = selectedPlayer;


      selectedPlayer = null;

      render();

      await saveCurrentRoundToSupabase();

    }


    /* =========================================================
       ROUND CHANGE
    ========================================================= */

    function changeRound(
      index
    ) {

      currentRound = index;

      selectedPlayer = null;

      render();

    }


    /* =========================================================
       CLEAR CURRENT ROUND
    ========================================================= */

    async function clearRound() {

      if (
        !confirm(
          "Clear this round for everyone?"
        )
      ) {
        return;
      }


      try {

        setSyncStatus(
          "Clearing round...",
          "saving"
        );


        await clearRoundFromSupabase(
          currentRound + 1
        );


        pairings[
          currentRound
        ] = emptyRound();


        selectedPlayer = null;

        render();


        setSyncStatus(
          "Round cleared for everyone",
          "connected"
        );

      }

      catch (error) {

        console.error(
          error
        );

        setSyncStatus(
          "Could not clear round",
          "error"
        );

        alert(
          "Could not clear the round."
        );

      }

    }


    /* =========================================================
       RESET ALL ROUNDS
    ========================================================= */

    async function resetAll() {

      if (
        !confirm(
          "Reset all five rounds for everyone?"
        )
      ) {
        return;
      }


      try {

        setSyncStatus(
          "Resetting all rounds...",
          "saving"
        );


        const {
          data: existingPairings,
          error: lookupError
        } = await supabaseClient
          .from("pairings")
          .select("id");


        if (
          lookupError
        ) {
          throw lookupError;
        }


        const pairingIds =
          existingPairings.map(
            row => row.id
          );


        if (
          pairingIds.length > 0
        ) {

          const {
            error: playersDeleteError
          } = await supabaseClient
            .from("pairing_players")
            .delete()
            .in(
              "pairing_id",
              pairingIds
            );


          if (
            playersDeleteError
          ) {
            throw playersDeleteError;
          }

        }


        const {
          error: pairingDeleteError
        } = await supabaseClient
          .from("pairings")
          .delete()
          .neq(
            "id",
            "00000000-0000-0000-0000-000000000000"
          );


        if (
          pairingDeleteError
        ) {
          throw pairingDeleteError;
        }


        pairings = {};

        selectedPlayer = null;

        render();


        setSyncStatus(
          "All rounds reset",
          "connected"
        );

      }

      catch (error) {

        console.error(
          error
        );

        setSyncStatus(
          "Could not reset rounds",
          "error"
        );

        alert(
          "Could not reset the tournament."
        );

      }

    }


    /* =========================================================
       PAIRING HISTORY
    ========================================================= */

    function renderPairingHistory() {

      const historyDiv =
        document.getElementById(
          "pairingHistory"
        );


      if (
        currentRound === 0
      ) {

        historyDiv.style.display =
          "none";

        return;

      }


      historyDiv.style.display =
        "block";


      const playerNames =
        allPlayers.map(
          player => player.name
        );


      const teammates = {};

      const opponents = {};


      playerNames.forEach(
        player => {

          teammates[player] =
            new Set();

          opponents[player] =
            new Set();

        }
      );


      for (
        let roundIndex = 0;
        roundIndex < currentRound;
        roundIndex++
      ) {

        const round =
          pairings[
            roundIndex
          ];


        if (
          !round
        ) {
          continue;
        }


        round.forEach(
          match => {

            const claytonPair =
              match.clayton.filter(
                player => player
              );


            const ryanPair =
              match.ryan.filter(
                player => player
              );


            if (
              claytonPair.length === 2
            ) {

              teammates[
                claytonPair[0]
              ].add(
                claytonPair[1]
              );


              teammates[
                claytonPair[1]
              ].add(
                claytonPair[0]
              );

            }


            if (
              ryanPair.length === 2
            ) {

              teammates[
                ryanPair[0]
              ].add(
                ryanPair[1]
              );


              teammates[
                ryanPair[1]
              ].add(
                ryanPair[0]
              );

            }


            claytonPair.forEach(
              claytonPlayer => {

                ryanPair.forEach(
                  ryanPlayer => {

                    opponents[
                      claytonPlayer
                    ].add(
                      ryanPlayer
                    );


                    opponents[
                      ryanPlayer
                    ].add(
                      claytonPlayer
                    );

                  }
                );

              }
            );

          }
        );

      }


      let teammateHTML = "";

      let opponentHTML = "";


      playerNames.forEach(
        player => {

          const playerData =
            getPlayer(player);


          const isClaytonTeam =
            getPlayerNames(
              claytonTeam
            ).includes(
              player
            );


          const sameTeam =
            isClaytonTeam
              ? getPlayerNames(
                  claytonTeam
                )
              : getPlayerNames(
                  ryanTeam
                );


          const oppositeTeam =
            isClaytonTeam
              ? getPlayerNames(
                  ryanTeam
                )
              : getPlayerNames(
                  claytonTeam
                );


          const availableTeammates =
            sameTeam.filter(
              otherPlayer =>
                otherPlayer !== player &&
                !teammates[
                  player
                ].has(
                  otherPlayer
                )
            );


          const availableOpponents =
            oppositeTeam.filter(
              otherPlayer =>
                !opponents[
                  player
                ].has(
                  otherPlayer
                )
            );


          teammateHTML += `

            <div class="history-row">

              <div
                class="history-player"
              >

                ${playerData.name}
                • HCP
                ${playerData.handicap}

              </div>

              <div
                class="history-names"
              >

                ${
                  availableTeammates.length
                    ? availableTeammates.join(", ")
                    : "Has played with everyone"
                }

              </div>

            </div>

          `;


          opponentHTML += `

            <div class="history-row">

              <div
                class="history-player"
              >

                ${playerData.name}
                • HCP
                ${playerData.handicap}

              </div>

              <div
                class="history-names"
              >

                ${
                  availableOpponents.length
                    ? availableOpponents.join(", ")
                    : "Has played against everyone"
                }

              </div>

            </div>

          `;

        }
      );


      historyDiv.innerHTML = `

        <div class="history-title">
          PAIRING HISTORY
        </div>

        <div class="history-subtitle">
          Based on all previous rounds
        </div>

        <div class="history-section">

          <h3>
            Players Not Yet Paired With
          </h3>

          ${teammateHTML}

        </div>

        <div class="history-section">

          <h3>
            Players Not Yet Played Against
          </h3>

          ${opponentHTML}

        </div>

      `;

    }


    /* =========================================================
       REALTIME UPDATES
    ========================================================= */

    function scheduleRealtimeReload() {

      clearTimeout(
        realtimeTimer
      );


      realtimeTimer =
        setTimeout(
          () => {

            loadPairingsFromSupabase();

          },
          500
        );

    }


    supabaseClient

      .channel(
        "scottsdale-pairings-live"
      )

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "pairings"
        },
        scheduleRealtimeReload
      )

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "pairing_players"
        },
        scheduleRealtimeReload
      )

      .subscribe(
        status => {

          if (
            status === "SUBSCRIBED"
          ) {

            setSyncStatus(
              "Live shared database connected",
              "connected"
            );

          }

        }
      );


    /* =========================================================
       START APP
    ========================================================= */

    loadPairingsFromSupabase();

  </script>

</body>

</html>

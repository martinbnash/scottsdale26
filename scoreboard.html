<script>


/*

const SUPABASE_URL =
  "https://ljgedmrpyuseamwmndwu.supabase.co";

const supabaseClient =

/*

PLAYERS

MATCHES SCORECARD
=====================================================
*/

const players = {

    team:"Clayton"
  },

  "Marty": {

  },

  },

  },

    team:"Ryan"
  }

};


/*
=====================================================
COURSES

MATCHES SCORECARD
=====================================================
*/

const dinosaurMountain = {

  name:
    "Dinosaur Mountain • Black / Blue Tees",

  pars:[
    4,3,5,4,3,5,4,3,5,
    3,5,4,5,3,4,5,3,4
  ],

  handicap:[
    5,15,3,1,9,11,7,13,17,
    16,18,12,2,6,4,14,8,10
  ]

};


const weKoPaCholla = {

  name:
    "We-Ko-Pa Cholla • Purple / White Tees",

  pars:[
    4,4,5,4,3,4,4,3,5,
    4,5,3,4,4,3,5,4,4
  ],

  handicap:[
    13,3,17,9,15,7,11,1,5,
    4,16,10,12,18,14,6,2,8
  ]

};


const weKoPaSaguaro = {

  name:
    "We-Ko-Pa Saguaro • Purple / White Tees",

  pars:[
    4,4,5,4,3,4,4,3,5,
    4,5,3,4,4,3,5,4,4
  ],

  handicap:[
    5,11,9,1,15,7,13,3,17,
    14,18,6,8,2,16,12,10,4
  ]

};


/*
=====================================================
COURSE BY ROUND
=====================================================
*/

function getCourse(round) {

  round =
    Number(round);

  if(round === 1) {
    return dinosaurMountain;
  }

  if(
    round === 2 ||
    round === 5
  ) {
    return weKoPaCholla;
  }

  return weKoPaSaguaro;

}


/*
=====================================================
TEE ASSIGNMENT

EVERYONE:
DINOSAUR = BLACK
WE-KO-PA = PURPLE

RYAN D + BRAD:
DINOSAUR = BLUE
WE-KO-PA = WHITE
=====================================================
*/

function getPlayerTee(
  playerName,
  course
) {

  if(
    course === dinosaurMountain
  ) {

    return (
      playerName === "Ryan D" ||
      playerName === "Brad"
    )
      ? "blue"
      : "black";

  }


  if(
    course === weKoPaCholla ||
    course === weKoPaSaguaro
  ) {

    return (
      playerName === "Ryan D" ||
      playerName === "Brad"
    )
      ? "white"
      : "purple";

  }


  return null;

}


/*
=====================================================
COURSE HANDICAP

WHS:

INDEX × SLOPE / 113
+
COURSE RATING - PAR

THEN 85%

MATCHES SCORECARD
=====================================================
*/

function getPlayerCourseHandicap(
  playerName,
  course
) {

  const handicapIndex =
    Number(
      players[playerName]?.handicap || 0
    );


  const tee =
    getPlayerTee(
      playerName,
      course
    );


  let courseRating;

  let slopeRating;

  let par;


  /*
  DINOSAUR
  */

  if(
    course === dinosaurMountain
  ) {

    par = 70;


    if(
      tee === "blue"
    ) {

      courseRating = 67.5;
      slopeRating = 125;

    }

    else {

      courseRating = 70.1;
      slopeRating = 137;

    }

  }


  /*
  CHOLLA
  */

  else if(
    course === weKoPaCholla
  ) {

    par = 72;


    if(
      tee === "white"
    ) {

      courseRating = 68.6;
      slopeRating = 122;

    }

    else {

      courseRating = 71.7;
      slopeRating = 135;

    }

  }


  /*
  SAGUARO
  */

  else if(
    course === weKoPaSaguaro
  ) {

    par = 71;


    if(
      tee === "white"
    ) {

      courseRating = 68.8;
      slopeRating = 125;

    }

    else {

      courseRating = 70.2;
      slopeRating = 132;

    }

  }


  else {

    return 0;

  }


  const courseHandicap =
    handicapIndex *
      (slopeRating / 113) +
    (courseRating - par);


  return Math.round(
    courseHandicap * 0.85
  );

}


/*
=====================================================
MATCH PLAYING HANDICAPS

LOWEST = ZERO

EVERYONE ELSE =
COURSE HANDICAP - LOWEST
=====================================================
*/

function getMatchPlayingHandicaps(
  match,
  course
) {

  const allPlayers = [

    ...match.clayton,

    ...match.ryan

  ];


  const courseHandicaps =
    allPlayers.map(
      playerName => ({

        playerName,

        playingHandicap:
          getPlayerCourseHandicap(
            playerName,
            course
          )

      })
    );


  if(
    courseHandicaps.length === 0
  ) {

    return {};

  }


  const lowest =
    Math.min(
      ...courseHandicaps.map(
        p =>
          p.playingHandicap
      )
    );


  return Object.fromEntries(

    courseHandicaps.map(
      p => [

        p.playerName,

        Math.max(
          0,
          p.playingHandicap -
          lowest
        )

      ]
    )

  );

}


/*
=====================================================
STROKES ON HOLE
=====================================================
*/

function getStrokesOnHole(
  playerName,
  holeIndex,
  course,
  matchPlayingHandicaps
) {

  const playingHandicap =
    Number(
      matchPlayingHandicaps[
        playerName
      ] || 0
    );


  const holeRank =
    Number(
      course.handicap[
        holeIndex
      ]
    );


  let strokes = 0;


  if(
    playingHandicap >=
    holeRank
  ) {

    strokes++;

  }


  if(
    playingHandicap > 18 &&
    playingHandicap - 18 >=
    holeRank
  ) {

    strokes++;

  }


  return strokes;

}


/*
=====================================================
DATABASE STATE
=====================================================
*/

let allScores = [];

let allPairings = [];

let allPairingPlayers = [];

let parlayBonuses = {

  Clayton:0,

  Ryan:0

};


/*
=====================================================
TEAM LOOKUP
=====================================================
*/

const teamByPlayer = {

  "Clayton":"Clayton",
  "Marty":"Clayton",
  "Raymond":"Clayton",
  "Brian":"Clayton",
  "Michael":"Clayton",
  "Aaron":"Clayton",

  "Ryan":"Ryan",
  "Jon":"Ryan",
  "Ryan D":"Ryan",
  "Brad":"Ryan",
  "Brent":"Ryan",
  "Travis":"Ryan"

};


/*
=====================================================
STATUS
=====================================================
*/

function setStatus(
  message,
  isError=false
) {

  const element =
    document.getElementById(
      "status"
    );


  element.innerHTML =
    isError

      ? `<span class="error">${message}</span>`

      : `<span class="live">●</span> ${message}`;

}


/*
=====================================================
LOAD PAIRING SIDES

A = CLAYTON
B = RYAN
=====================================================
*/

function getPairingSides(
  pairing
) {

  const pairingPlayers =
    allPairingPlayers.filter(
      player =>
        String(
          player.pairing_id
        ) ===
        String(pairing.id)
    );


  let clayton =
    pairingPlayers
      .filter(
        player =>
          String(
            player.side
          ).toUpperCase() === "A"
      )
      .map(
        player =>
          player.player_name
      )
      .filter(Boolean);


  let ryan =
    pairingPlayers
      .filter(
        player =>
          String(
            player.side
          ).toUpperCase() === "B"
      )
      .map(
        player =>
          player.player_name
      )
      .filter(Boolean);


  return {

    clayton,

    ryan

  };

}


/*
=====================================================
GET GROSS SCORE
=====================================================
*/

function getGrossScore(
  roundNumber,
  matchNumber,
  playerName,
  holeNumber
) {

  const row =
    allScores.find(
      score =>

        Number(
          score.round_number
        ) ===
        Number(roundNumber)

        &&

        Number(
          score.match_number
        ) ===
        Number(matchNumber)

        &&

        score.player_name ===
        playerName

        &&

        Number(
          score.hole_number
        ) ===
        Number(holeNumber)
    );


  if(!row) {

    return null;

  }


  const value =
    Number(
      row.gross_score
    );


  if(
    !Number.isFinite(value)
  ) {

    return null;

  }


  return value;

}


/*
=====================================================
TEAM BIRDIE / EAGLE BONUS

BIRDIE = +1
EAGLE = +2

ONLY IF TEAM WINS HOLE

ONLY ONE BONUS PER TEAM
PER HOLE
=====================================================
*/

function getTeamHoleBonus(
  scores,
  par
) {

  if(
    !scores ||
    scores.length === 0
  ) {

    return 0;

  }


  return Math.max(

    ...scores.map(
      score => {

        if(
          score.gross <=
          par - 2
        ) {

          return 2;

        }


        if(
          score.gross ===
          par - 1
        ) {

          return 1;

        }


        return 0;

      }
    )

  );

}


/*
=====================================================
CALCULATE ONE MATCH
=====================================================
*/

function calculateMatch(
  roundNumber,
  pairing
) {

  const course =
    getCourse(
      roundNumber
    );


  const sides =
    getPairingSides(
      pairing
    );


  if(
    sides.clayton.length !== 2 ||
    sides.ryan.length !== 2
  ) {

    return {

      complete:false,

      completedHoles:0,

      clayton:0,

      ryan:0,

      front:"PAIRING INCOMPLETE",

      back:"PAIRING INCOMPLETE",

      stroke:"PAIRING INCOMPLETE",

      details:{

        claytonHolePoints:0,

        ryanHolePoints:0,

        claytonBirdieBonus:0,

        ryanBirdieBonus:0

      }

    };

  }


  const match = {

    clayton:
      sides.clayton,

    ryan:
      sides.ryan

  };


  const matchPlayingHandicaps =
    getMatchPlayingHandicaps(
      match,
      course
    );


  let ryanHolePoints = 0;

  let claytonHolePoints = 0;


  let ryanBirdieBonus = 0;

  let claytonBirdieBonus = 0;


  let frontRyanHoles = 0;

  let frontClaytonHoles = 0;


  let backRyanHoles = 0;

  let backClaytonHoles = 0;


  let frontRyan = 0;

  let frontClayton = 0;


  let backRyan = 0;

  let backClayton = 0;


  let completedHoles = 0;


  /*
  ================================================
  HOLE BY HOLE
  ================================================
  */

  for(
    let holeIndex = 0;
    holeIndex < 18;
    holeIndex++
  ) {

    const hole =
      holeIndex + 1;


    const ryanScores =
      sides.ryan.map(
        playerName => {

          const gross =
            getGrossScore(
              roundNumber,
              pairing.pairing_number,
              playerName,
              hole
            );


          if(
            gross === null
          ) {

            return null;

          }


          return {

            player:playerName,

            gross:gross,

            net:
              gross -
              getStrokesOnHole(
                playerName,
                holeIndex,
                course,
                matchPlayingHandicaps
              )

          };

        }
      );


    const claytonScores =
      sides.clayton.map(
        playerName => {

          const gross =
            getGrossScore(
              roundNumber,
              pairing.pairing_number,
              playerName,
              hole
            );


          if(
            gross === null
          ) {

            return null;

          }


          return {

            player:playerName,

            gross:gross,

            net:
              gross -
              getStrokesOnHole(
                playerName,
                holeIndex,
                course,
                matchPlayingHandicaps
              )

          };

        }
      );


    /*
    ALL FOUR SCORES REQUIRED
    */

    if(
      ryanScores.includes(null) ||
      claytonScores.includes(null)
    ) {

      continue;

    }


    completedHoles++;


    const ryanBest =
      Math.min(
        ...ryanScores.map(
          score =>
            score.net
        )
      );


    const claytonBest =
      Math.min(
        ...claytonScores.map(
          score =>
            score.net
        )
      );


    /*
    NET BEST BALL TOTALS
    */

    if(
      hole <= 9
    ) {

      frontRyan +=
        ryanBest;

      frontClayton +=
        claytonBest;

    }

    else {

      backRyan +=
        ryanBest;

      backClayton +=
        claytonBest;

    }


    /*
    RYAN WINS HOLE
    */

    if(
      ryanBest <
      claytonBest
    ) {

      ryanHolePoints++;


      if(
        hole <= 9
      ) {

        frontRyanHoles++;

      }

      else {

        backRyanHoles++;

      }


      const bonus =
        getTeamHoleBonus(
          ryanScores,
          course.pars[holeIndex]
        );


      ryanBirdieBonus +=
        bonus;

    }


    /*
    CLAYTON WINS HOLE
    */

    else if(
      claytonBest <
      ryanBest
    ) {

      claytonHolePoints++;


      if(
        hole <= 9
      ) {

        frontClaytonHoles++;

      }

      else {

        backClaytonHoles++;

      }


      const bonus =
        getTeamHoleBonus(
          claytonScores,
          course.pars[holeIndex]
        );


      claytonBirdieBonus +=
        bonus;

    }


    /*
    TIED HOLE

    NO POINT
    NO BONUS
    */

  }


  /*
  ================================================
  MATCH POINTS
  ================================================
  */

  let ryanPoints = 0;

  let claytonPoints = 0;


  /*
  HOLE POINTS
  */

  ryanPoints +=
    ryanHolePoints;

  claytonPoints +=
    claytonHolePoints;


  /*
  BIRDIE / EAGLE BONUS
  */

  ryanPoints +=
    ryanBirdieBonus;

  claytonPoints +=
    claytonBirdieBonus;


  /*
  ================================================
  FRONT 9

  ONLY AWARD AFTER ALL 9 HOLES
  ================================================
  */

  let frontText =
    "IN PROGRESS";


  const frontComplete =
    completedHoles >= 9;


  if(
    frontComplete
  ) {

    if(
      ryanFrontHoles >
      claytonFrontHoles
    ) {

      ryanPoints += 3;

      frontText =
        `RYAN WINS FRONT +3 • ${ryanFrontHoles}-${claytonFrontHoles}`;

    }

    else if(
      claytonFrontHoles >
      ryanFrontHoles
    ) {

      claytonPoints += 3;

      frontText =
        `CLAYTON WINS FRONT +3 • ${claytonFrontHoles}-${ryanFrontHoles}`;

    }

    else {

      frontText =
        `FRONT TIED • ${ryanFrontHoles}-${claytonFrontHoles}`;

    }

  }


  /*
  ================================================
  BACK 9
  ================================================
  */

  let backText =
    "IN PROGRESS";


  const matchComplete =
    completedHoles === 18;


  if(
    matchComplete
  ) {

    if(
      ryanBackHoles >
      claytonBackHoles
    ) {

      ryanPoints += 3;

      backText =
        `RYAN WINS BACK +3 • ${ryanBackHoles}-${claytonBackHoles}`;

    }

    else if(
      claytonBackHoles >
      ryanBackHoles
    ) {

      claytonPoints += 3;

      backText =
        `CLAYTON WINS BACK +3 • ${claytonBackHoles}-${ryanBackHoles}`;

    }

    else {

      backText =
        `BACK TIED • ${ryanBackHoles}-${claytonBackHoles}`;

    }

  }


  /*
  ================================================
  18 HOLE NET STROKE
  ================================================
  */

  let strokeText =
    "IN PROGRESS";


  const ryan18 =
    frontRyan +
    backRyan;


  const clayton18 =
    frontClayton +
    backClayton;


  if(
    matchComplete
  ) {

    if(
      ryan18 <
      clayton18
    ) {

      ryanPoints += 5;

      strokeText =
        `RYAN WINS 18 +5 • ${ryan18}-${clayton18}`;

    }

    else if(
      clayton18 <
      ryan18
    ) {

      claytonPoints += 5;

      strokeText =
        `CLAYTON WINS 18 +5 • ${clayton18}-${ryan18}`;

    }

    else {

      strokeText =
        `18 TIED • ${ryan18}-${clayton18}`;

    }

  }


  /*
  ================================================
  ROUND 5 = 1.5X
  ================================================
  */

  if(
    Number(roundNumber) === 5
  ) {

    ryanPoints *= 1.5;

    claytonPoints *= 1.5;

  }


  return {

    complete:
      matchComplete,

    completedHoles,

    clayton:
      claytonPoints,

    ryan:
      ryanPoints,

    front:
      frontText,

    back:
      backText,

    stroke:
      strokeText,

    details:{

      claytonHolePoints,

      ryanHolePoints,

      claytonBirdieBonus,

      ryanBirdieBonus

    }

  };

}


/*
=====================================================
LOAD DATABASE
=====================================================
*/

async function loadData() {

  try {

    setStatus(
      "Loading live championship data..."
    );


    const [

      scoresResponse,

      pairingsResponse,

      playersResponse,

      parlayResponse

    ] = await Promise.all([


      supabaseClient
        .from("scores")
        .select("*"),


      supabaseClient
        .from("pairings")
        .select("*")
        .order(
          "round_number"
        )
        .order(
          "pairing_number"
        ),


      supabaseClient
        .from("pairing_players")
        .select("*"),


      supabaseClient
        .from("parlay_results")
        .select(
          "player_name,pick,won"
        )

    ]);


    /*
    REQUIRED TABLES
    */

    if(
      scoresResponse.error
    ) {

      throw scoresResponse.error;

    }


    if(
      pairingsResponse.error
    ) {

      throw pairingsResponse.error;

    }


    if(
      playersResponse.error
    ) {

      throw playersResponse.error;

    }


    allScores =
      scoresResponse.data || [];


    allPairings =
      pairingsResponse.data || [];


    allPairingPlayers =
      playersResponse.data || [];


    /*
    PARLAY IS OPTIONAL
    */

    parlayBonuses = {

      Clayton:0,

      Ryan:0

    };


    if(
      !parlayResponse.error &&
      parlayResponse.data
    ) {

      parlayResponse.data.forEach(
        row => {

          const team =
            teamByPlayer[
              row.player_name
            ];


          if(
            row.won === true &&
            team
          ) {

            parlayBonuses[
              team
            ]++;

          }

        }
      );

    }


    renderScoreboard();


    setStatus(
      "LIVE • Automatically updating"
    );


    document.getElementById(
      "lastUpdate"
    ).textContent =
      "Last updated: " +
      new Date().toLocaleTimeString();


  }

  catch(error) {

    console.error(
      "SCOREBOARD ERROR:",
      error
    );


    setStatus(
      "Database error: " +
      error.message,
      true
    );

  }

}


/*
=====================================================
RENDER SCOREBOARD
=====================================================
*/

function renderScoreboard() {

  let championshipClayton = 0;

  let championshipRyan = 0;


  const roundsContainer =
    document.getElementById(
      "rounds"
    );


  roundsContainer.innerHTML = "";


  /*
  ================================================
  FIVE ROUNDS
  ================================================
  */

  for(
    let roundNumber = 1;
    roundNumber <= 5;
    roundNumber++
  ) {

    const course =
      getCourse(
        roundNumber
      );


    const roundPairings =
      allPairings.filter(
        pairing =>
          Number(
            pairing.round_number
          ) ===
          roundNumber
      );


    let roundClayton = 0;

    let roundRyan = 0;


    let matchCards = "";


    if(
      roundPairings.length === 0
    ) {

      matchCards = `

        <div class="in-progress">
          Pairings have not been set yet.
        </div>

      `;

    }


    roundPairings.forEach(
      pairing => {

        const sides =
          getPairingSides(
            pairing
          );


        const result =
          calculateMatch(
            roundNumber,
            pairing
          );


        roundClayton +=
          result.clayton;


        roundRyan +=
          result.ryan;


        let resultClass =
          "tie";


        if(
          result.clayton >
          result.ryan
        ) {

          resultClass =
            "winner-clayton";

        }

        else if(
          result.ryan >
          result.clayton
        ) {

          resultClass =
            "winner-ryan";

        }


        matchCards += `

          <div class="match-card">

            <h3>
              MATCH ${pairing.pairing_number}
            </h3>


            <div class="pairing clayton">

              ${
                sides.clayton.length
                  ? sides.clayton.join(" & ")
                  : "TBD"
              }

            </div>


            <div class="pairing ryan">

              ${
                sides.ryan.length
                  ? sides.ryan.join(" & ")
                  : "TBD"
              }

            </div>


            <div class="result-row">

              <span>
                Holes
              </span>

              <strong>
                ${result.completedHoles}/18
              </strong>

            </div>


            <div class="result-row">

              <span>
                Front 9
              </span>

              <strong>
                ${result.front}
              </strong>

            </div>


            <div class="result-row">

              <span>
                Back 9
              </span>

              <strong>
                ${result.back}
              </strong>

            </div>


            <div class="result-row">

              <span>
                18-Hole
              </span>

              <strong>
                ${result.stroke}
              </strong>

            </div>


            <div class="details">

              <div class="details-title">
                POINT BREAKDOWN
              </div>


              <div class="bonus-row">

                <span>
                  Hole Points
                </span>

                <span>

                  C ${result.details.claytonHolePoints}

                  &nbsp;•&nbsp;

                  R ${result.details.ryanHolePoints}

                </span>

              </div>


              <div class="bonus-row">

                <span>
                  Birdie / Eagle
                </span>

                <span>

                  C +${result.details.claytonBirdieBonus}

                  &nbsp;•&nbsp;

                  R +${result.details.ryanBirdieBonus}

                </span>

              </div>

            </div>


            <div
              class="result-row ${resultClass}"
            >

              <span>
                MATCH POINTS
              </span>

              <strong>

                C ${result.clayton}

                &nbsp;•&nbsp;

                R ${result.ryan}

              </strong>

            </div>


          </div>

        `;

      }
    );


    championshipClayton +=
      roundClayton;


    championshipRyan +=
      roundRyan;


    roundsContainer.innerHTML += `

      <div class="round-section">


        <div class="round-title">

          <div>

            <h2>

              ROUND ${roundNumber}

              ${
                roundNumber === 5
                  ? " • 1.5× POINTS"
                  : ""
              }

            </h2>


            <div class="course-name">

              ${course.name}

            </div>

          </div>


          <div class="round-total">

            <span class="clayton-total">

              CLAYTON:
              ${roundClayton}

            </span>


            <span class="ryan-total">

              RYAN:
              ${roundRyan}

            </span>

          </div>

        </div>


        <div class="match-grid">

          ${matchCards}

        </div>


      </div>

    `;

  }


  /*
  ================================================
  PARLAY
  ================================================
  */

  championshipClayton +=
    parlayBonuses.Clayton;


  championshipRyan +=
    parlayBonuses.Ryan;


  /*
  ================================================
  MAIN TOTALS
  ================================================
  */

  document.getElementById(
    "claytonTotal"
  ).textContent =
    formatPoints(
      championshipClayton
    );


  document.getElementById(
    "ryanTotal"
  ).textContent =
    formatPoints(
      championshipRyan
    );


  document.getElementById(
    "parlayClaytonBonus"
  ).textContent =
    "+" +
    formatPoints(
      parlayBonuses.Clayton
    );


  document.getElementById(
    "parlayRyanBonus"
  ).textContent =
    "+" +
    formatPoints(
      parlayBonuses.Ryan
    );


  /*
  ================================================
  LEADER
  ================================================
  */

  const leader =
    document.getElementById(
      "leaderText"
    );


  if(
    championshipClayton >
    championshipRyan
  ) {

    leader.textContent =
      "TEAM CLAYTON LEADS BY " +
      formatPoints(
        championshipClayton -
        championshipRyan
      );

  }

  else if(
    championshipRyan >
    championshipClayton
  ) {

    leader.textContent =
      "TEAM RYAN LEADS BY " +
      formatPoints(
        championshipRyan -
        championshipClayton
      );

  }

  else {

    leader.textContent =
      "CHAMPIONSHIP TIED";

  }

}


/*
=====================================================
FORMAT POINTS

Keeps 1.5 / 2.5 when applicable
but displays whole numbers normally.
=====================================================
*/

function formatPoints(
  value
) {

  if(
    Number.isInteger(value)
  ) {

    return String(value);

  }


  return Number(
    value.toFixed(1)
  ).toString();

}


/*
=====================================================
SAFE REFRESH
=====================================================
*/

let refreshInProgress = false;

let refreshQueued = false;


async function refreshScoreboard() {

  if(
    refreshInProgress
  ) {

    refreshQueued = true;

    return;

  }


  refreshInProgress = true;


  try {

    await loadData();

  }

  finally {

    refreshInProgress = false;


    if(
      refreshQueued
    ) {

      refreshQueued = false;


      setTimeout(
        refreshScoreboard,
        100
      );

    }

  }

}


/*
=====================================================
SUPABASE REALTIME
=====================================================
*/

function startRealtime() {

  supabaseClient

    .channel(
      "scottsdale-live-scoreboard"
    )


    .on(

      "postgres_changes",

      {
        event:"*",
        schema:"public",
        table:"scores"
      },

      () => {

        refreshScoreboard();

      }

    )


    .on(

      "postgres_changes",

      {
        event:"*",
        schema:"public",
        table:"pairings"
      },

      () => {

        refreshScoreboard();

      }

    )


    .on(

      "postgres_changes",

      {
        event:"*",
        schema:"public",
        table:"pairing_players"
      },

      () => {

        refreshScoreboard();

      }

    )


    .on(

      "postgres_changes",

      {
        event:"*",
        schema:"public",
        table:"parlay_results"
      },

      () => {

        refreshScoreboard();

      }

    )


    .subscribe(
      status => {

        console.log(
          "Realtime status:",
          status
        );

      }
    );

}


/*
=====================================================
START
=====================================================
*/

refreshScoreboard();

startRealtime();


/*
=====================================================
BACKUP REFRESH

If Supabase realtime misses an event,
this catches it within 5 seconds.
=====================================================
*/

setInterval(
  refreshScoreboard,
  5000
);

</script>

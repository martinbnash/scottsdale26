<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://ljgedmrpyuseamwmndwu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_09A0o2ImL-FLS8AiunnNTw_iWP1tG8L";

const supabaseClient =
  supabase.createClient(

  );


/* =====================================================

   SAME VALUES AS SCORECARD
===================================================== */

const players = {

  "Marty": 7.3,

  "Raymond": 13.5,

  "Brian": 12,

  "Michael": 20.4,

  "Aaron": 18.6,

};


/* =====================================================
   TEAM ASSIGNMENTS
===================================================== */

const teamByPlayer = {

  "Clayton":"Clayton",
  "Marty":"Clayton",
  "Raymond":"Clayton",
  "Brian":"Clayton",
  "Michael":"Clayton",
  "Aaron":"Clayton",

  "Ryan":"Ryan",
  "Jon":"Ryan",

  "Brad":"Ryan",
  "Brent":"Ryan",
  "Travis":"Ryan"

};


/* =====================================================
   COURSE DATA

   EXACT SAME HOLE HANDICAPS AS SCORECARD
===================================================== */

const courses = {

  1: {

    name:
      "Dinosaur Mountain • Black / Blue Tees",

    pars:[
      4,3,5,4,3,5,4,3,5,
      3,5,4,5,3,4,5,3,4
    ],

    handicap:[

    ]

  },


  2: {

    ],

    handicap:[
      13,3,17,9,15,7,11,1,5,
      4,16,10,12,18,14,6,2,8
    ]

  },


  3: {

    name:
      "We-Ko-Pa Saguaro • Purple / White Tees",

    pars:[
      4,4,5,4,3,4,4,3,5,
      4,5,3,4,4,3,5,4,4
    ],

    handicap:[
      5,11,9,1,15,7,13,3,17,
      14,18,6,8,2,16,12,10,4
    ]

  },


  4: {

    name:
      "We-Ko-Pa Saguaro • Purple / White Tees",

    pars:[
      4,4,5,4,3,4,4,3,5,
      4,5,3,4,4,3,5,4,4
    ],

    handicap:[
      5,11,9,1,15,7,13,3,17,
      14,18,6,8,2,16,12,10,4
    ]

  },


  5: {

    name:
      "We-Ko-Pa Cholla • Purple / White Tees",

    pars:[
      4,4,5,4,3,4,4,3,5,
      4,5,3,4,4,3,5,4,4
    ],

    handicap:[
      13,3,17,9,15,7,11,1,5,
      4,16,10,12,18,14,6,2,8
    ]

  }

};


/* =====================================================
   DATABASE STATE
===================================================== */

let allScores = [];

let allPairings = [];

let allPairingPlayers = [];

let parlayBonuses = {
  Clayton:0,
  Ryan:0
};

let refreshInProgress = false;

let refreshQueued = false;


/* =====================================================
   STATUS
===================================================== */

function setStatus(message) {

  document.getElementById(
    "status"
  ).innerHTML = message;

}


/* =====================================================
   TEE ASSIGNMENT

   RYAN D + BRAD:
   Dinosaur = BLUE
   We-Ko-Pa = WHITE

   Everyone else:
   Dinosaur = BLACK
   We-Ko-Pa = PURPLE
===================================================== */

function getPlayerTee(
  playerName,
  roundNumber
) {

  if(
    playerName === "Ryan D" ||
    playerName === "Brad"
  ) {

    if(roundNumber === 1) {
      return "blue";
    }

    return "white";

  }

  if(roundNumber === 1) {
    return "black";
  }

  return "purple";
}


/* =====================================================
   COURSE HANDICAP

   WHS:
   Handicap Index × Slope / 113
   + Course Rating - Par

   THEN:
   Scottsdale 26 = 85%
===================================================== */

function getPlayerCourseHandicap(
  playerName,
  roundNumber
) {

  const handicapIndex =
    Number(
      players[playerName] || 0
    );

  const tee =
    getPlayerTee(
      playerName,
      roundNumber
    );

  let courseRating;

  let slopeRating;

  let par;


  /* DINOSAUR */

  if(roundNumber === 1) {

    par = 70;

    if(tee === "blue") {

      courseRating = 67.5;
      slopeRating = 125;

    } else {

      courseRating = 70.1;
      slopeRating = 137;

    }

  }


  /* CHOLLA */

  else if(
    roundNumber === 2 ||
    roundNumber === 5
  ) {

    par = 72;

    if(tee === "white") {

      courseRating = 68.6;
      slopeRating = 122;

    } else {

      courseRating = 71.7;
      slopeRating = 135;

    }

  }


  /* SAGUARO */

  else {

    par = 71;

    if(tee === "white") {

      courseRating = 68.8;
      slopeRating = 125;

    } else {

      courseRating = 70.2;
      slopeRating = 132;

    }

  }


  const courseHandicap =
    handicapIndex *
      (slopeRating / 113) +
    (courseRating - par);


  return Math.round(
    courseHandicap * 0.85
  );

}


/* =====================================================
   MATCH PLAYING HANDICAPS

   LOWEST PLAYER = 0

   EVERYONE ELSE =
   THEIR COURSE HANDICAP
   MINUS LOWEST
===================================================== */

function getMatchPlayingHandicaps(
  pairing,
  roundNumber
) {

  const sides =
    getPairingSides(pairing);

  const allPlayersInMatch = [
    ...sides.clayton,
    ...sides.ryan
  ];

  const courseHandicaps =
    allPlayersInMatch.map(
      playerName => ({

        playerName,

        playingHandicap:
          getPlayerCourseHandicap(
            playerName,
            roundNumber
          )

      })
    );


  if(courseHandicaps.length === 0) {
    return {};
  }


  const lowest =
    Math.min(
      ...courseHandicaps.map(
        player =>
          player.playingHandicap
      )
    );


  return Object.fromEntries(

    courseHandicaps.map(
      player => [

        player.playerName,

        Math.max(
          0,
          player.playingHandicap -
          lowest
        )

      ]
    )

  );

}


/* =====================================================
   STROKES ON HOLE
===================================================== */

function strokesOnHole(
  playerName,
  holeIndex,
  course,
  matchPlayingHandicaps
) {

  const playingHandicap =
    Number(
      matchPlayingHandicaps[
        playerName
      ] || 0
    );


  const holeRank =
    Number(
      course.handicap[
        holeIndex
      ]
    );


  let strokes = 0;


  if(
    playingHandicap >=
    holeRank
  ) {

    strokes++;

  }


  if(
    playingHandicap > 18 &&
    playingHandicap - 18 >=
    holeRank
  ) {

    strokes++;

  }


  return strokes;

}


/* =====================================================
   GET PAIRING SIDES

   SIDE A = CLAYTON
   SIDE B = RYAN
===================================================== */

function getPairingSides(
  pairing
) {

  const pairingPlayers =
    allPairingPlayers.filter(
      player =>
        String(
          player.pairing_id
        ) ===
        String(pairing.id)
    );


  const clayton =
    pairingPlayers
      .filter(
        player =>
          String(
            player.side
          ).toUpperCase() === "A"
      )
      .map(
        player =>
          player.player_name
      )
      .filter(Boolean);


  const ryan =
    pairingPlayers
      .filter(
        player =>
          String(
            player.side
          ).toUpperCase() === "B"
      )
      .map(
        player =>
          player.player_name
      )
      .filter(Boolean);


  return {
    clayton,
    ryan
  };

}


/* =====================================================
   GET GROSS SCORE
===================================================== */

function getGrossScore(
  roundNumber,
  matchNumber,
  playerName,
  holeNumber
) {

  const row =
    allScores.find(
      score =>

        Number(
          score.round_number
        ) === Number(roundNumber)

        &&

        Number(
          score.match_number
        ) === Number(matchNumber)

        &&

        score.player_name ===
          playerName

        &&

        Number(
          score.hole_number
        ) === Number(holeNumber)
    );


  if(!row) {
    return null;
  }


  const value =
    Number(
      row.gross_score
    );


  if(
    !Number.isFinite(value)
  ) {

    return null;

  }


  return value;

}


/* =====================================================
   BIRDIE / EAGLE BONUS

   EAGLE = 2
   BIRDIE = 1
   PAR / WORSE = 0

   MAXIMUM ONE BONUS PER TEAM
   PER HOLE
===================================================== */

function getTeamHoleBonus(
  scores,
  par
) {

  if(
    !scores ||
    scores.length === 0
  ) {

    return 0;

  }


  return Math.max(

    ...scores.map(
      score => {

        if(
          score.gross <=
          par - 2
        ) {

          return 2;

        }


        if(
          score.gross ===
          par - 1
        ) {

          return 1;

        }


        return 0;

      }
    )

  );

}


/* =====================================================
   CALCULATE MATCH
===================================================== */

function calculateMatch(
  roundNumber,
  pairing
) {

  const course =
    courses[roundNumber];


  const sides =
    getPairingSides(pairing);


  if(
    sides.clayton.length !== 2 ||
    sides.ryan.length !== 2
  ) {

    return {

      complete:false,

      clayton:0,

      ryan:0,

      completedHoles:0,

      front:
        "Pairing incomplete",

      back:
        "Pairing incomplete",

      stroke:
        "Pairing incomplete",

      details:{

        claytonHolePoints:0,

        ryanHolePoints:0,

        claytonBirdieBonus:0,

        ryanBirdieBonus:0

      }

    };

  }


  const matchPlayingHandicaps =
    getMatchPlayingHandicaps(
      pairing,
      roundNumber
    );


  let claytonHolePoints = 0;

  let ryanHolePoints = 0;


  let claytonBirdieBonus = 0;

  let ryanBirdieBonus = 0;


  let frontClaytonHoles = 0;

  let frontRyanHoles = 0;


  let backClaytonHoles = 0;

  let backRyanHoles = 0;


  let frontClaytonNet = 0;

  let frontRyanNet = 0;


  let backClaytonNet = 0;

  let backRyanNet = 0;


  let completedHoles = 0;


  /* =================================================
     HOLE-BY-HOLE
  ================================================= */

  for(
    let holeIndex = 0;
    holeIndex < 18;
    holeIndex++
  ) {

    const holeNumber =
      holeIndex + 1;


    const claytonScores =
      sides.clayton.map(
        playerName => {

          const gross =
            getGrossScore(
              roundNumber,
              pairing.pairing_number,
              playerName,
              holeNumber
            );


          if(gross === null) {
            return null;
          }


          const strokes =
            strokesOnHole(
              playerName,
              holeIndex,
              course,
              matchPlayingHandicaps
            );


          return {

            player:playerName,

            gross:gross,

            net:gross - strokes

          };

        }
      );


    const ryanScores =
      sides.ryan.map(
        playerName => {

          const gross =
            getGrossScore(
              roundNumber,
              pairing.pairing_number,
              playerName,
              holeNumber
            );


          if(gross === null) {
            return null;
          }


          const strokes =
            strokesOnHole(
              playerName,
              holeIndex,
              course,
              matchPlayingHandicaps
            );


          return {

            player:playerName,

            gross:gross,

            net:gross - strokes

          };

        }
      );


    /*
       A HOLE COUNTS ONLY WHEN
       ALL FOUR PLAYERS HAVE SCORES
    */

    if(
      claytonScores.includes(null) ||
      ryanScores.includes(null)
    ) {

      continue;

    }


    completedHoles++;


    const claytonBest =
      Math.min(
        ...claytonScores.map(
          score => score.net
        )
      );


    const ryanBest =
      Math.min(
        ...ryanScores.map(
          score => score.net
        )
      );


    /* ================================================
       NET STROKE TOTALS
    ================================================ */

    if(holeNumber <= 9) {

      frontClaytonNet +=
        claytonBest;

      frontRyanNet +=
        ryanBest;

    } else {

      backClaytonNet +=
        claytonBest;

      backRyanNet +=
        ryanBest;

    }


    /* ================================================
       HOLE WINNER
    ================================================ */

    if(
      ryanBest <
      claytonBest
    ) {

      ryanHolePoints++;


      if(holeNumber <= 9) {

        frontRyanHoles++;

      } else {

        backRyanHoles++;

      }


      const bonus =
        getTeamHoleBonus(
          ryanScores,
          course.pars[holeIndex]
        );


      ryanBirdieBonus +=
        bonus;

    }


    else if(
      claytonBest <
      ryanBest
    ) {

      claytonHolePoints++;


      if(holeNumber <= 9) {

        frontClaytonHoles++;

      } else {

        backClaytonHoles++;

      }


      const bonus =
        getTeamHoleBonus(
          claytonScores,
          course.pars[holeIndex]
        );


      claytonBirdieBonus +=
        bonus;

    }

    /*
       TIED HOLE:
       NO HOLE POINT
       NO BIRDIE/EAGLE BONUS
    */

  }


  /* =================================================
     FRONT 9
  ================================================= */

  let claytonPoints = 0;

  let ryanPoints = 0;


  let frontText =
    "IN PROGRESS";


  const frontComplete =
    completedHoles >= 9;


  if(frontComplete) {

    if(
      claytonFrontHoles >
      ryanFrontHoles
    ) {

      claytonPoints += 3;

      frontText =
        `Clayton wins Front +3 (${claytonFrontHoles}-${ryanFrontHoles})`;

    }

    else if(
      ryanFrontHoles >
      claytonFrontHoles
    ) {

      ryanPoints += 3;

      frontText =
        `Ryan wins Front +3 (${ryanFrontHoles}-${claytonFrontHoles})`;

    }

    else {

      frontText =
        `Front 9 tied (${claytonFrontHoles}-${ryanFrontHoles})`;

    }

  }


  /* =================================================
     BACK 9
  ================================================= */

  let backText =
    "IN PROGRESS";


  const matchComplete =
    completedHoles === 18;


  if(matchComplete) {

    if(
      claytonBackHoles >
      ryanBackHoles
    ) {

      claytonPoints += 3;

      backText =
        `Clayton wins Back +3 (${claytonBackHoles}-${ryanBackHoles})`;

    }

    else if(
      ryanBackHoles >
      claytonBackHoles
    ) {

      ryanPoints += 3;

      backText =
        `Ryan wins Back +3 (${ryanBackHoles}-${claytonBackHoles})`;

    }

    else {

      backText =
        `Back 9 tied (${claytonBackHoles}-${ryanBackHoles})`;

    }

  }


  /* =================================================
     18-HOLE NET STROKE
  ================================================= */

  let strokeText =
    "IN PROGRESS";


  const clayton18 =
    frontClaytonNet +
    backClaytonNet;


  const ryan18 =
    frontRyanNet +
    backRyanNet;


  if(matchComplete) {

    if(
      clayton18 <
      ryan18
    ) {

      claytonPoints += 5;

      strokeText =
        `Clayton wins 18 +5 (${clayton18}-${ryan18})`;

    }

    else if(
      ryan18 <
      clayton18
    ) {

      ryanPoints += 5;

      strokeText =
        `Ryan wins 18 +5 (${ryan18}-${clayton18})`;

    }

    else {

      strokeText =
        `18 tied (${clayton18}-${ryan18})`;

    }

  }


  /* =================================================
     HOLE POINTS + BIRDIE/EAGLE BONUS
  ================================================= */

  claytonPoints +=
    claytonHolePoints +
    claytonBirdieBonus;


  ryanPoints +=
    ryanHolePoints +
    ryanBirdieBonus;


  /* =================================================
     ROUND 5 = 1.5X
  ================================================= */

  if(
    Number(roundNumber) === 5
  ) {

    claytonPoints *= 1.5;

    ryanPoints *= 1.5;

  }


  return {

    complete:matchComplete,

    clayton:claytonPoints,

    ryan:ryanPoints,

    completedHoles,

    front:frontText,

    back:backText,

    stroke:strokeText,

    details:{

      claytonHolePoints,

      ryanHolePoints,

      claytonBirdieBonus,

      ryanBirdieBonus

    }

  };

}


/* =====================================================
   LOAD DATABASE
===================================================== */

async function loadData() {

  try {

    const results =
      await Promise.all([

        supabaseClient
          .from("scores")
          .select("*"),

        supabaseClient
          .from("pairings")
          .select("*")
          .order(
            "round_number"
          )
          .order(
            "pairing_number"
          ),

        supabaseClient
          .from("pairing_players")
          .select("*"),

        /*
          Parlay is optional.
          If table is unavailable,
          golf scoreboard still works.
        */

        supabaseClient
          .from("parlay_results")
          .select(
            "player_name,pick,won"
          )

      ]);


    const scoresResponse =
      results[0];

    const pairingsResponse =
      results[1];

    const playersResponse =
      results[2];

    const parlayResponse =
      results[3];


    if(scoresResponse.error) {
      throw scoresResponse.error;
    }


    if(pairingsResponse.error) {
      throw pairingsResponse.error;
    }


    if(playersResponse.error) {
      throw playersResponse.error;
    }


    allScores =
      scoresResponse.data || [];


    allPairings =
      pairingsResponse.data || [];


    allPairingPlayers =
      playersResponse.data || [];


    /* ================================================
       PARLAY
    ================================================ */

    parlayBonuses = {
      Clayton:0,
      Ryan:0
    };


    if(
      !parlayResponse.error &&
      parlayResponse.data
    ) {

      parlayResponse.data.forEach(
        row => {

          const team =
            teamByPlayer[
              row.player_name
            ];


          if(
            row.won === true &&
            team
          ) {

            parlayBonuses[
              team
            ]++;

          }

        }
      );

    }


    renderScoreboard();


    setStatus(
      '<span class="live-dot"></span>LIVE • Automatically updating'
    );


    document.getElementById(
      "lastUpdate"
    ).textContent =
      "Last updated: " +
      new Date().toLocaleTimeString();


  }

  catch(error) {

    console.error(
      "SCOREBOARD LOAD ERROR:",
      error
    );


    setStatus(
      '<span class="error">Database error: ' +
      error.message +
      '</span>'
    );

  }

}


/* =====================================================
   RENDER SCOREBOARD
===================================================== */

function renderScoreboard() {

  let championshipClayton = 0;

  let championshipRyan = 0;


  const roundsContainer =
    document.getElementById(
      "rounds"
    );


  roundsContainer.innerHTML = "";


  /* ================================================
     ROUNDS
  ================================================ */

  for(
    let roundNumber = 1;
    roundNumber <= 5;
    roundNumber++
  ) {

    const roundPairings =
      allPairings.filter(
        pairing =>
          Number(
            pairing.round_number
          ) ===
          roundNumber
      );


    let roundClayton = 0;

    let roundRyan = 0;


    let matchCards = "";


    if(
      roundPairings.length === 0
    ) {

      matchCards = `

        <div class="in-progress">
          Pairings have not been set yet.
        </div>

      `;

    }


    roundPairings.forEach(
      pairing => {

        const sides =
          getPairingSides(
            pairing
          );


        const result =
          calculateMatch(
            roundNumber,
            pairing
          );


        roundClayton +=
          result.clayton;


        roundRyan +=
          result.ryan;


        let resultClass =
          "tie";


        if(
          result.clayton >
          result.ryan
        ) {

          resultClass =
            "winner-clayton";

        }

        else if(
          result.ryan >
          result.clayton
        ) {

          resultClass =
            "winner-ryan";

        }


        matchCards += `

          <div class="match-card">

            <h3>
              MATCH
              ${pairing.pairing_number}
            </h3>


            <div class="pairing clayton">

              ${

                sides.clayton.join(
                  " & "
                ) ||

                "TBD"

              }

            </div>


            <div class="pairing ryan">

              ${

                sides.ryan.join(
                  " & "
                ) ||

                "TBD"

              }

            </div>


            <div class="result-row">

              <span>
                Holes Completed
              </span>

              <strong>
                ${result.completedHoles}/18
              </strong>

            </div>


            <div class="result-row">

              <span>
                Front 9
              </span>

              <strong>
                ${result.front}
              </strong>

            </div>


            <div class="result-row">

              <span>
                Back 9
              </span>

              <strong>
                ${result.back}
              </strong>

            </div>


            <div class="result-row">

              <span>
                18 Hole Stroke
              </span>

              <strong>
                ${result.stroke}
              </strong>

            </div>


            <div class="details">

              <div class="details-title">
                POINT BREAKDOWN
              </div>


              <div class="bonus-row">

                <span>
                  Hole Points
                </span>

                <span>

                  C
                  ${result.details.claytonHolePoints}

                  •

                  R
                  ${result.details.ryanHolePoints}

                </span>

              </div>


              <div class="bonus-row">

                <span>
                  Birdie Bonus
                </span>

                <span>

                  C
                  +${result.details.claytonBirdieBonus}

                  •

                  R
                  +${result.details.ryanBirdieBonus}

                </span>

              </div>


              <div class="bonus-row">

                <span>
                  18-Hole / Segment Points
                </span>

                <span>

                  Included in match total

                </span>

              </div>

            </div>


            <div
              class="result-row ${resultClass}"
            >

              <span>
                MATCH TOTAL
              </span>

              <strong>

                C
                ${result.clayton}

                •

                R
                ${result.ryan}

              </strong>

            </div>


          </div>

        `;

      }
    );


    championshipClayton +=
      roundClayton;


    championshipRyan +=
      roundRyan;


    roundsContainer.innerHTML += `

      <div class="round-section">

        <div class="round-title">

          <div>

            <h2>

              ROUND
              ${roundNumber}

              ${
                roundNumber === 5
                  ? " • 1.5× POINTS"
                  : ""
              }

            </h2>


            <div
              style="
                color:#a9b6c8;
                font-size:13px;
                margin-top:5px;
              "
            >

              ${courses[
                roundNumber
              ].name}

            </div>

          </div>


          <div class="round-total">

            <span class="clayton-total">

              CLAYTON:
              ${roundClayton}

            </span>


            <span class="ryan-total">

              RYAN:
              ${roundRyan}

            </span>

          </div>

        </div>


        <div class="match-grid">

          ${matchCards}

        </div>

      </div>

    `;

  }


  /* ================================================
     PARLAY BONUS
  ================================================ */

  championshipClayton +=
    parlayBonuses.Clayton;


  championshipRyan +=
    parlayBonuses.Ryan;


  document.getElementById(
    "claytonTotal"
  ).textContent =
    championshipClayton;


  document.getElementById(
    "ryanTotal"
  ).textContent =
    championshipRyan;


  document.getElementById(
    "parlayClaytonBonus"
  ).textContent =
    `+${parlayBonuses.Clayton}`;


  document.getElementById(
    "parlayRyanBonus"
  ).textContent =
    `+${parlayBonuses.Ryan}`;


  /* ================================================
     LEADER
  ================================================ */

  const leaderText =
    document.getElementById(
      "leaderText"
    );


  if(
    championshipClayton >
    championshipRyan
  ) {

    leaderText.textContent =
      `TEAM CLAYTON LEADS BY ${
        championshipClayton -
        championshipRyan
      }`;

  }

  else if(
    championshipRyan >
    championshipClayton
  ) {

    leaderText.textContent =
      `TEAM RYAN LEADS BY ${
        championshipRyan -
        championshipClayton
      }`;

  }

  else {

    leaderText.textContent =
      "CHAMPIONSHIP TIED";

  }

}


/* =====================================================
   SAFE REFRESH

   Prevents multiple database requests
   from piling on top of one another.
===================================================== */

async function refreshScoreboard() {

  if(refreshInProgress) {

    refreshQueued = true;

    return;

  }


  refreshInProgress = true;


  try {

    await loadData();

  }

  finally {

    refreshInProgress = false;


    if(refreshQueued) {

      refreshQueued = false;


      setTimeout(
        refreshScoreboard,
        100
      );

    }

  }

}


/* =====================================================
   REALTIME
===================================================== */

function startRealtime() {

  const channel =
    supabaseClient
      .channel(
        "scottsdale-live-scoreboard"
      );


  channel

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"scores"
      },
      () => {

        refreshScoreboard();

      }
    )


    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"pairings"
      },
      () => {

        refreshScoreboard();

      }
    )


    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"pairing_players"
      },
      () => {

        refreshScoreboard();

      }
    )


    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"parlay_results"
      },
      () => {

        refreshScoreboard();

      }
    )


    .subscribe(
      status => {

        console.log(
          "Scoreboard realtime:",
          status
        );

      }
    );

}


/* =====================================================
   START
===================================================== */

refreshScoreboard();

startRealtime();


/*
=====================================================
BACKUP POLLING

Every 5 seconds.

This means even if Supabase realtime
misses an event, the scoreboard catches
the new score quickly.
=====================================================
*/

setInterval(
  refreshScoreboard,
  5000
);

</script>

/* =====================================================

/* =====================================================

/*
   DINOSAUR MOUNTAIN

   Par 70

   Hole pars confirmed:
   4 3 5 4 3 4 4 3 5
   3 5 4 4 3 4 5 3 4

   Stroke indexes:
   5 15 3 1 9 11 7 13 17
   16 18 12 2 6 4 14 8 10
*/

const dinosaurMountain = {

  name:
    "Dinosaur Mountain • Black / Blue Tees",

  par:70,

  pars:[
    4,3,5,4,3,4,4,3,5,
    3,5,4,4,3,4,5,3,4
  ],

  handicap:[
    5,15,3,1,9,11,7,13,17,
    16,18,12,2,6,4,14,8,10
  ]

};


/*
   WE-KO-PA CHOLLA

   Par 72
*/

const weKoPaCholla = {

  name:
    "We-Ko-Pa Cholla • Purple Tees",

  par:72,

  pars:[
    4,4,5,4,3,4,4,3,5,
    4,5,3,4,4,3,5,4,4
  ],

  handicap:[
    13,3,17,9,15,7,11,1,5,
    4,16,10,12,18,14,6,2,8
  ]

};


/*
   WE-KO-PA SAGUARO

   IMPORTANT:
   Saguaro is PAR 71.

   Front 9 = 36
   Back 9  = 35
*/

const weKoPaSaguaro = {

  name:
    "We-Ko-Pa Saguaro • Purple Tees",

  par:71,

  pars:[
    4,4,4,5,3,4,4,5,3,
    4,3,4,4,5,3,4,4,4
  ],

  handicap:[
    5,11,9,1,15,7,13,3,17,
    14,18,6,8,2,16,12,10,4
  ]

};


/* =====================================================
   COURSE BY ROUND
===================================================== */

function getCourse(round){

  round = Number(round);

  if(round === 1){
    return dinosaurMountain;
  }

  if(round === 2 || round === 5){
    return weKoPaCholla;
  }

  return weKoPaSaguaro;

}


/* =====================================================
   TEE ASSIGNMENT
===================================================== */

/*
   FINAL TEE RULE:

   Dinosaur:
   Ryan D + Brad = BLUE
   Everyone else = BLACK

   We-Ko-Pa:
   Ryan D + Brad = PURPLE
   Everyone else = PURPLE

   Therefore EVERYONE is Purple at We-Ko-Pa.
*/

function getPlayerTee(playerName,course){

  if(course === dinosaurMountain){

    if(
      playerName === "Ryan D" ||
      playerName === "Brad"
    ){
      return "blue";
    }

    return "black";
  }


  /*
     ALL WEE-KO-PA PLAYERS ARE PURPLE
  */

  return "purple";

}


/* =====================================================
   COURSE RATING / SLOPE
===================================================== */

function getCourseRatingSlope(
  course,
  tee
){

  /*
     DINOSAUR
  */

  if(course === dinosaurMountain){

    if(tee === "blue"){

      return {
        rating:67.5,
        slope:125
      };

    }

    return {
      rating:70.1,
      slope:137
    };

  }


  /*
     CHOLLA
  */

  if(course === weKoPaCholla){

    return {
      rating:71.7,
      slope:135
    };

  }


  /*
     SAGUARO
  */

  return {
    rating:70.2,
    slope:132
  };

}


/* =====================================================
   COURSE HANDICAP
===================================================== */

/*
   IMPORTANT HANDICAP RULE

   1. Calculate Course Handicap.
   2. ROUND Course Handicap to whole number.
   3. Apply 85%.
   4. ROUND resulting playing handicap.

   This is different from multiplying the raw
   decimal Course Handicap by .85 first.
*/

function getPlayerCourseHandicap(
  playerName,
  course
){

  const handicapIndex =
    Number(
      players[playerName]?.handicap || 0
    );


  const tee =
    getPlayerTee(
      playerName,
      course
    );


  const ratingSlope =
    getCourseRatingSlope(
      course,
      tee
    );


  const rawCourseHandicap =
    handicapIndex *
      (
        ratingSlope.slope / 113
      ) +
    (
      ratingSlope.rating -
      course.par
    );


  /*
     FIRST ROUND COURSE HANDICAP
  */

  const courseHandicap =
    Math.round(
      rawCourseHandicap
    );


  /*
     THEN APPLY 85%
  */

  const playingHandicap =
    Math.round(
      courseHandicap * 0.85
    );


  return playingHandicap;

}


/* =====================================================
   MATCH PLAYING HANDICAPS
===================================================== */

function getMatchPlayingHandicaps(
  match,
  course
){

  const names = [

    ...match.clayton,
    ...match.ryan

  ];


  const handicaps =
    names.map(
      name =>
        getPlayerCourseHandicap(
          name,
          course
        )
    );


  const lowest =
    Math.min(
      ...handicaps
    );


  return Object.fromEntries(

    names.map(
      (name,index) => [

        name,

        Math.max(
          0,
          handicaps[index] -
          lowest
        )

      ]
    )

  );

}


/* =====================================================
   STROKES ON HOLE
===================================================== */

function getStrokesOnHole(
  playerName,
  holeIndex,
  course,
  playingHandicaps
){

  const handicap =
    Number(
      playingHandicaps[playerName] || 0
    );


  const holeRank =
    Number(
      course.handicap[holeIndex]
    );


  let strokes = 0;


  /*
     FIRST 18 STROKES
  */

  if(
    handicap >= holeRank
  ){

    strokes++;

  }


  /*
     SECOND 18 STROKES
  */

  if(
    handicap > 18 &&
    handicap - 18 >= holeRank
  ){

    strokes++;

  }


  /*
     THIRD 18 STROKES
     Included for safety if a handicap
     ever exceeds 36.
  */

  if(
    handicap > 36 &&
    handicap - 36 >= holeRank
  ){

    strokes++;

  }


  return strokes;

}


/* =====================================================
   DATABASE STATE
===================================================== */

let allScores = [];
let allPairings = [];
let allPairingPlayers = [];


let parlayBonuses = {

  Clayton:0,
  Ryan:0

};


/* =====================================================
   TEAM LOOKUP
===================================================== */

const teamByPlayer = {

  "Clayton":"Clayton",
  "Marty":"Clayton",
  "Raymond":"Clayton",
  "Brian":"Clayton",
  "Michael":"Clayton",
  "Aaron":"Clayton",

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    character => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"

    }[character])
  );

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  message,
  isError=false
){

  const element =
    document.getElementById(
      "status"
    );


  element.innerHTML =
    isError

      ? `<span class="error">
           ${escapeHtml(message)}
         </span>`

      : `<span class="live">
           ●
         </span>
         ${escapeHtml(message)}`;

}


/* =====================================================
   GET PAIRING SIDES
===================================================== */

function getPairingSides(pairing){

  const rows =
    allPairingPlayers.filter(
      player =>
        String(player.pairing_id) ===
        String(pairing.id)
    );


  const clayton =
    rows
      .filter(
        player =>
          String(
            player.side
          ).toUpperCase() === "A"
      )
      .map(
        player =>
          player.player_name
      )
      .filter(Boolean);


  const ryan =
    rows
      .filter(
        player =>
          String(
            player.side
          ).toUpperCase() === "B"
      )
      .map(
        player =>
          player.player_name
      )
      .filter(Boolean);


  return {

    clayton,
    ryan

  };

}


/* =====================================================
   GET GROSS SCORE
===================================================== */

function getGrossScore(
  roundNumber,
  pairingNumber,
  playerName,
  holeNumber
){

  const candidates =
    allScores.filter(
      score =>

        Number(
          score.round_number
        ) ===
        Number(
          roundNumber
        )

        &&

        score.player_name ===
        playerName

        &&

        Number(
          score.hole_number
        ) ===
        Number(
          holeNumber
        )
    );


  if(
    candidates.length === 0
  ){

    return null;

  }


  /*
     Prefer pairing_number.
  */

  const exactPairing =
    candidates.find(
      score =>

        score.pairing_number !== null &&
        score.pairing_number !== undefined &&

        Number(
          score.pairing_number
        ) ===
        Number(
          pairingNumber
        )
    );


  if(
    exactPairing
  ){

    const value =
      Number(
        exactPairing.gross_score
      );


    return Number.isFinite(value)
      ? value
      : null;

  }


  /*
     Fallback to match_number.
  */

  const exactMatch =
    candidates.find(
      score =>

        score.match_number !== null &&
        score.match_number !== undefined &&

        Number(
          score.match_number
        ) ===
        Number(
          pairingNumber
        )
    );


  if(
    exactMatch
  ){

    const value =
      Number(
        exactMatch.gross_score
      );


    return Number.isFinite(value)
      ? value
      : null;

  }


  return null;

}


/* =====================================================
   TEAM GROSS BONUS
===================================================== */

function getTeamGrossBonus(
  teamScores,
  holePar
){

  if(
    !Array.isArray(teamScores)
  ){

    return 0;

  }


  const par =
    Number(
      holePar
    );


  const grossScores =
    teamScores

      .filter(Boolean)

      .map(
        score =>
          Number(
            score.gross
          )
      )

      .filter(
        score =>
          Number.isFinite(score)
      );


  if(
    !grossScores.length ||
    !Number.isFinite(par)
  ){

    return 0;

  }


  const bestGross =
    Math.min(
      ...grossScores
    );


  /*
     EAGLE
  */

  if(
    bestGross <= par - 2
  ){

    return 2;

  }


  /*
     BIRDIE
  */

  if(
    bestGross === par - 1
  ){

    return 1;

  }


  return 0;

}


/* =====================================================
   CALCULATE MATCH
===================================================== */

function calculateMatch(
  roundNumber,
  pairing
){

  const course =
    getCourse(
      roundNumber
    );


  const sides =
    getPairingSides(
      pairing
    );


  if(
    sides.clayton.length !== 2 ||
    sides.ryan.length !== 2
  ){

    return {

      complete:false,

      completedHoles:0,

      clayton:0,
      ryan:0,

      front:"PAIRING INCOMPLETE",
      back:"PAIRING INCOMPLETE",
      stroke:"PAIRING INCOMPLETE",

      details:{

        claytonHolePoints:0,
        ryanHolePoints:0,

        claytonBonus:0,
        ryanBonus:0,

        claytonBirdies:0,
        claytonEagles:0,

        ryanBirdies:0,
        ryanEagles:0,

        cancelledBonuses:0,

        multiplier:1,

        handicaps:{}

      }

    };

  }


  const match = {

    clayton:sides.clayton,
    ryan:sides.ryan

  };


  const playingHandicaps =
    getMatchPlayingHandicaps(
      match,
      course
    );


  let claytonHolePoints = 0;
  let ryanHolePoints = 0;


  let claytonBonus = 0;
  let ryanBonus = 0;


  let claytonBirdies = 0;
  let claytonEagles = 0;

  let ryanBirdies = 0;
  let ryanEagles = 0;


  let cancelledBonuses = 0;


  let claytonFrontWins = 0;
  let ryanFrontWins = 0;


  let claytonBackWins = 0;
  let ryanBackWins = 0;


  let claytonFrontNet = 0;
  let ryanFrontNet = 0;


  let claytonBackNet = 0;
  let ryanBackNet = 0;


  let completedHoles = 0;
  let frontCompleted = 0;
  let backCompleted = 0;


  /*
     LOOP THROUGH 18 HOLES
  */

  for(
    let holeIndex = 0;
    holeIndex < 18;
    holeIndex++
  ){

    const hole =
      holeIndex + 1;


    /*
       CLAYTON
    */

    const claytonScores =
      sides.clayton.map(
        playerName => {

          const gross =
            getGrossScore(
              roundNumber,
              pairing.pairing_number,
              playerName,
              hole
            );


          if(
            gross === null
          ){

            return null;

          }


          const strokes =
            getStrokesOnHole(
              playerName,
              holeIndex,
              course,
              playingHandicaps
            );


          return {

            player:playerName,

            gross:gross,

            strokes:strokes,

            net:
              gross -
              strokes

          };

        }
      );


    /*
       RYAN
    */

    const ryanScores =
      sides.ryan.map(
        playerName => {

          const gross =
            getGrossScore(
              roundNumber,
              pairing.pairing_number,
              playerName,
              hole
            );


          if(
            gross === null
          ){

            return null;

          }


          const strokes =
            getStrokesOnHole(
              playerName,
              holeIndex,
              course,
              playingHandicaps
            );


          return {

            player:playerName,

            gross:gross,

            strokes:strokes,

            net:
              gross -
              strokes

          };

        }
      );


    /*
       DO NOT SCORE INCOMPLETE HOLES
    */

    if(
      claytonScores.includes(null) ||
      ryanScores.includes(null)
    ){

      continue;

    }


    completedHoles++;


    if(
      hole <= 9
    ){

      frontCompleted++;

    }
    else{

      backCompleted++;

    }


    /*
       BEST NET BALL
    */

    const claytonBestNet =
      Math.min(
        ...claytonScores.map(
          score =>
            score.net
        )
      );


    const ryanBestNet =
      Math.min(
        ...ryanScores.map(
          score =>
            score.net
        )
      );


    /*
       18-HOLE STROKE PLAY
    */

    if(
      hole <= 9
    ){

      claytonFrontNet +=
        claytonBestNet;

      ryanFrontNet +=
        ryanBestNet;

    }
    else{

      claytonBackNet +=
        claytonBestNet;

      ryanBackNet +=
        ryanBestNet;

    }


    /*
       GROSS BONUS
    */

    const claytonGrossBonus =
      getTeamGrossBonus(
        claytonScores,
        course.pars[holeIndex]
      );


    const ryanGrossBonus =
      getTeamGrossBonus(
        ryanScores,
        course.pars[holeIndex]
      );


    /*
       CLAYTON WINS HOLE
    */

    if(
      claytonBestNet <
      ryanBestNet
    ){

      claytonHolePoints++;


      if(
        hole <= 9
      ){

        claytonFrontWins++;

      }
      else{

        claytonBackWins++;

      }


      /*
         BONUS ONLY IF:
         - Clayton has birdie/eagle
         - Ryan does NOT
      */

      if(
        claytonGrossBonus > 0 &&
        ryanGrossBonus === 0
      ){

        claytonBonus +=
          claytonGrossBonus;


        if(
          claytonGrossBonus === 1
        ){

          claytonBirdies++;

        }


        if(
          claytonGrossBonus === 2
        ){

          claytonEagles++;

        }

      }


      /*
         BOTH HAVE BIRDIE/EAGLE:
         NO BONUS
      */

      else if(
        claytonGrossBonus > 0 &&
        ryanGrossBonus > 0
      ){

        cancelledBonuses++;

      }

    }


    /*
       RYAN WINS HOLE
    */

    else if(
      ryanBestNet <
      claytonBestNet
    ){

      ryanHolePoints++;


      if(
        hole <= 9
      ){

        ryanFrontWins++;

      }
      else{

        ryanBackWins++;

      }


      /*
         BONUS ONLY IF:
         - Ryan has birdie/eagle
         - Clayton does NOT
      */

      if(
        ryanGrossBonus > 0 &&
        claytonGrossBonus === 0
      ){

        ryanBonus +=
          ryanGrossBonus;


        if(
          ryanGrossBonus === 1
        ){

          ryanBirdies++;

        }


        if(
          ryanGrossBonus === 2
        ){

          ryanEagles++;

        }

      }


      /*
         BOTH HAVE BIRDIE/EAGLE:
         NO BONUS
      */

      else if(
        ryanGrossBonus > 0 &&
        claytonGrossBonus > 0
      ){

        cancelledBonuses++;

      }

    }

  }


  /*
   =====================================================
   BASE POINTS

   1 point per hole won
   + birdie/eagle bonuses
   =====================================================
  */

  let claytonPoints =
    claytonHolePoints +
    claytonBonus;


  let ryanPoints =
    ryanHolePoints +
    ryanBonus;


  /*
   =====================================================
   FRONT 9
   =====================================================
  */

  let frontText =
    "IN PROGRESS";


  if(
    frontCompleted === 9
  ){

    if(
      claytonFrontWins >
      ryanFrontWins
    ){

      claytonPoints += 3;


      frontText =
        `CLAYTON WINS FRONT +3 • ` +
        `${claytonFrontWins}-${ryanFrontWins}`;

    }

    else if(
      ryanFrontWins >
      claytonFrontWins
    ){

      ryanPoints += 3;


      frontText =
        `RYAN WINS FRONT +3 • ` +
        `${ryanFrontWins}-${claytonFrontWins}`;

    }

    else{

      claytonPoints += 1.5;
      ryanPoints += 1.5;


      frontText =
        `FRONT TIED +1.5 EACH • ` +
        `${claytonFrontWins}-${ryanFrontWins}`;

    }

  }


  /*
   =====================================================
   BACK 9
   =====================================================
  */

  let backText =
    "IN PROGRESS";


  if(
    backCompleted === 9
  ){

    if(
      claytonBackWins >
      ryanBackWins
    ){

      claytonPoints += 3;


      backText =
        `CLAYTON WINS BACK +3 • ` +
        `${claytonBackWins}-${ryanBackWins}`;

    }

    else if(
      ryanBackWins >
      claytonBackWins
    ){

      ryanPoints += 3;


      backText =
        `RYAN WINS BACK +3 • ` +
        `${ryanBackWins}-${claytonBackWins}`;

    }

    else{

      claytonPoints += 1.5;
      ryanPoints += 1.5;


      backText =
        `BACK TIED +1.5 EACH • ` +
        `${claytonBackWins}-${ryanBackWins}`;

    }

  }


  /*
   =====================================================
   18-HOLE NET STROKE PLAY
   =====================================================
  */

  let strokeText =
    "IN PROGRESS";


  const clayton18 =
    claytonFrontNet +
    claytonBackNet;


  const ryan18 =
    ryanFrontNet +
    ryanBackNet;


  const matchComplete =
    frontCompleted === 9 &&
    backCompleted === 9;


  if(
    matchComplete
  ){

    if(
      clayton18 <
      ryan18
    ){

      claytonPoints += 5;


      strokeText =
        `CLAYTON WINS 18 +5 • ` +
        `${clayton18}-${ryan18}`;

    }

    else if(
      ryan18 <
      clayton18
    ){

      ryanPoints += 5;


      strokeText =
        `RYAN WINS 18 +5 • ` +
        `${ryan18}-${clayton18}`;

    }

    else{

      claytonPoints += 2.5;
      ryanPoints += 2.5;


      strokeText =
        `18 TIED +2.5 EACH • ` +
        `${clayton18}-${ryan18}`;

    }

  }


  /*
   =====================================================
   ROUND 5 = 1.5×
   =====================================================
  */

  const multiplier =
    Number(roundNumber) === 5
      ? 1.5
      : 1;


  claytonPoints *=
    multiplier;


  ryanPoints *=
    multiplier;


  /*
   =====================================================
   RETURN
   =====================================================
  */

  return {

    complete:
      matchComplete,

    completedHoles,

    clayton:
      claytonPoints,

    ryan:
      ryanPoints,

    front:
      frontText,

    back:
      backText,

    stroke:
      strokeText,

    details:{

      claytonHolePoints,
      ryanHolePoints,

      claytonBonus,
      ryanBonus,

      claytonBirdies,
      claytonEagles,

      ryanBirdies,
      ryanEagles,

      cancelledBonuses,

      multiplier,

      handicaps:
        playingHandicaps

    }

  };

}


/* =====================================================
   LOAD DATABASE
===================================================== */

async function loadData(){

  try{

    setStatus(
      "Loading live championship data..."
    );


    const [

      scoresResponse,

      pairingsResponse,

      playersResponse,

      parlayResponse

    ] = await Promise.all([

      supabaseClient
        .from("scores")
        .select("*"),

      supabaseClient
        .from("pairings")
        .select("*")
        .order("round_number")
        .order("pairing_number"),

      supabaseClient
        .from("pairing_players")
        .select("*"),

      supabaseClient
        .from("parlay_results")
        .select(
          "player_name,pick,won"
        )

    ]);


    if(
      scoresResponse.error
    ){

      throw scoresResponse.error;

    }


    if(
      pairingsResponse.error
    ){

      throw pairingsResponse.error;

    }


    if(
      playersResponse.error
    ){

      throw playersResponse.error;

    }


    allScores =
      scoresResponse.data || [];


    allPairings =
      pairingsResponse.data || [];


    allPairingPlayers =
      playersResponse.data || [];


    /*
       PARLAY
    */

    parlayBonuses = {

      Clayton:0,
      Ryan:0

    };


    if(
      !parlayResponse.error &&
      parlayResponse.data
    ){

      parlayResponse.data.forEach(
        row => {

          const team =
            teamByPlayer[
              row.player_name
            ];


          const won =
            row.won === true ||
            row.won === "true";


          if(
            won &&
            team
          ){

            parlayBonuses[team]++;

          }

        }
      );

    }


    renderScoreboard();


    setStatus(
      "LIVE • Automatically updating"
    );


    document.getElementById(
      "lastUpdate"
    ).textContent =
      "Last updated: " +
      new Date().toLocaleTimeString();

  }

  catch(error){

    console.error(
      "SCOREBOARD ERROR:",
      error
    );


    setStatus(
      "Database error: " +
      (
        error?.message ||
        "Unknown error"
      ),
      true
    );

  }

}


/* =====================================================
   FORMAT POINTS
===================================================== */

function formatPoints(value){

  const number =
    Number(value);


  if(
    !Number.isFinite(number)
  ){

    return "0";

  }


  if(
    Number.isInteger(number)
  ){

    return String(number);

  }


  return Number(
    number.toFixed(2)
  ).toString();

}


/* =====================================================
   FORMAT HANDICAP AUDIT
===================================================== */

function formatHandicapAudit(
  pairing,
  handicaps
){

  const sides =
    getPairingSides(
      pairing
    );


  const names = [

    ...sides.clayton,
    ...sides.ryan

  ];


  return names.map(
    name =>

      `${escapeHtml(name)}: ` +
      `${formatPoints(
        handicaps[name]
      )}`

  ).join(
    " • "
  );

}


/* =====================================================
   RENDER SCOREBOARD
===================================================== */

function renderScoreboard(){

  let championshipClayton = 0;
  let championshipRyan = 0;


  const roundsContainer =
    document.getElementById(
      "rounds"
    );


  roundsContainer.innerHTML = "";


  /*
     FIVE ROUNDS
  */

  for(
    let roundNumber = 1;
    roundNumber <= 5;
    roundNumber++
  ){

    const course =
      getCourse(
        roundNumber
      );


    const roundPairings =
      allPairings.filter(
        pairing =>
          Number(
            pairing.round_number
          ) ===
          roundNumber
      );


    let roundClayton = 0;
    let roundRyan = 0;


    let matchCards = "";


    if(
      roundPairings.length === 0
    ){

      matchCards = `

        <div class="in-progress">

          Pairings have not been set yet.

        </div>

      `;

    }


    /*
       EACH MATCH
    */

    roundPairings.forEach(
      pairing => {

        const sides =
          getPairingSides(
            pairing
          );


        const result =
          calculateMatch(
            roundNumber,
            pairing
          );


        roundClayton +=
          result.clayton;


        roundRyan +=
          result.ryan;


        let resultClass =
          "tie";


        if(
          result.clayton >
          result.ryan
        ){

          resultClass =
            "winner-clayton";

        }

        else if(
          result.ryan >
          result.clayton
        ){

          resultClass =
            "winner-ryan";

        }


        /*
           FINAL ROUND AUDIT
        */

        let multiplierText = "";


        if(
          result.details.multiplier === 1.5
        ){

          multiplierText = `

            <div class="bonus-row">

              <span>
                Final Round Multiplier
              </span>

              <span class="audit">
                1.5×
              </span>

            </div>

          `;

        }


        /*
           CANCELLED BONUS AUDIT
        */

        let cancelledText = "";


        if(
          result.details.cancelledBonuses > 0
        ){

          cancelledText = `

            <div class="bonus-row">

              <span>
                Both Teams Birdie/Eagle
              </span>

              <span class="audit">

                ${result.details.cancelledBonuses}
                cancelled

              </span>

            </div>

          `;

        }


        /*
           HANDICAP AUDIT
        */

        let handicapText = "";


        if(
          sides.clayton.length === 2 &&
          sides.ryan.length === 2
        ){

          handicapText = `

            <div class="handicap-audit">

              Playing Handicaps:
              ${formatHandicapAudit(
                pairing,
                result.details.handicaps
              )}

            </div>

          `;

        }


        matchCards += `

          <div class="match-card">

            <h3>

              MATCH
              ${escapeHtml(
                pairing.pairing_number
              )}

            </h3>


            <div class="pairing clayton">

              ${
                sides.clayton.length

                  ? sides.clayton
                      .map(
                        escapeHtml
                      )
                      .join(" &amp; ")

                  : "TBD"
              }

            </div>


            <div class="pairing ryan">

              ${
                sides.ryan.length

                  ? sides.ryan
                      .map(
                        escapeHtml
                      )
                      .join(" &amp; ")

                  : "TBD"
              }

            </div>


            <div class="result-row">

              <span>
                Holes
              </span>

              <strong>
                ${result.completedHoles}/18
              </strong>

            </div>


            <div class="result-row">

              <span>
                Front 9
              </span>

              <strong>

                ${escapeHtml(
                  result.front
                )}

              </strong>

            </div>


            <div class="result-row">

              <span>
                Back 9
              </span>

              <strong>

                ${escapeHtml(
                  result.back
                )}

              </strong>

            </div>


            <div class="result-row">

              <span>
                18-Hole
              </span>

              <strong>

                ${escapeHtml(
                  result.stroke
                )}

              </strong>

            </div>


            <div class="details">

              <div class="details-title">
                POINT BREAKDOWN
              </div>


              <div class="bonus-row">

                <span>
                  Net Hole Points
                </span>

                <span>

                  C
                  ${formatPoints(
                    result.details
                      .claytonHolePoints
                  )}

                  &nbsp;•&nbsp;

                  R
                  ${formatPoints(
                    result.details
                      .ryanHolePoints
                  )}

                </span>

              </div>


              <div class="bonus-row">

                <span>
                  Gross Birdie / Eagle
                </span>

                <span>

                  C +
                  ${formatPoints(
                    result.details
                      .claytonBonus
                  )}

                  &nbsp;•&nbsp;

                  R +
                  ${formatPoints(
                    result.details
                      .ryanBonus
                  )}

                </span>

              </div>


              <div class="bonus-row">

                <span>
                  Birdies / Eagles
                </span>

                <span>

                  C
                  ${result.details.claytonBirdies}
                  /
                  ${result.details.claytonEagles}

                  &nbsp;•&nbsp;

                  R
                  ${result.details.ryanBirdies}
                  /
                  ${result.details.ryanEagles}

                </span>

              </div>


              ${cancelledText}

              ${multiplierText}

              ${handicapText}

            </div>


            <div
              class="result-row ${resultClass}"
            >

              <span>
                MATCH POINTS
              </span>

              <strong>

                C
                ${formatPoints(
                  result.clayton
                )}

                &nbsp;•&nbsp;

                R
                ${formatPoints(
                  result.ryan
                )}

              </strong>

            </div>


          </div>

        `;

      }
    );


    championshipClayton +=
      roundClayton;


    championshipRyan +=
      roundRyan;


    roundsContainer.innerHTML += `

      <div class="round-section">

        <div class="round-title">

          <div>

            <h2>

              ROUND ${roundNumber}

              ${
                roundNumber === 5
                  ? " • 1.5× POINTS"
                  : ""
              }

            </h2>


            <div class="course-name">

              ${escapeHtml(
                course.name
              )}

            </div>

          </div>


          <div class="round-total">

            <span class="clayton-total">

              CLAYTON:
              ${formatPoints(
                roundClayton
              )}

            </span>


            <span class="ryan-total">

              RYAN:
              ${formatPoints(
                roundRyan
              )}

            </span>

          </div>

        </div>


        <div class="match-grid">

          ${matchCards}

        </div>

      </div>

    `;

  }


  /*
     PARLAY
  */

  championshipClayton +=
    parlayBonuses.Clayton;


  championshipRyan +=
    parlayBonuses.Ryan;


  /*
     MAIN TOTALS
  */

  document.getElementById(
    "claytonTotal"
  ).textContent =
    formatPoints(
      championshipClayton
    );


  document.getElementById(
    "ryanTotal"
  ).textContent =
    formatPoints(
      championshipRyan
    );


  /*
     PARLAY
  */

  document.getElementById(
    "parlayClaytonBonus"
  ).textContent =
    "+" +
    formatPoints(
      parlayBonuses.Clayton
    );


  document.getElementById(
    "parlayRyanBonus"
  ).textContent =
    "+" +
    formatPoints(
      parlayBonuses.Ryan
    );


  /*
     LEADER
  */

  const leader =
    document.getElementById(
      "leaderText"
    );


  if(
    championshipClayton >
    championshipRyan
  ){

    leader.textContent =
      "TEAM CLAYTON LEADS BY " +
      formatPoints(
        championshipClayton -
        championshipRyan
      );

  }

  else if(
    championshipRyan >
    championshipClayton
  ){

    leader.textContent =
      "TEAM RYAN LEADS BY " +
      formatPoints(
        championshipRyan -
        championshipClayton
      );

  }

  else{

    leader.textContent =
      "CHAMPIONSHIP TIED";

  }

}


/* =====================================================
   SAFE REFRESH
===================================================== */

let refreshInProgress = false;
let refreshQueued = false;


async function refreshScoreboard(){

  if(
    refreshInProgress
  ){

    refreshQueued = true;

    return;

  }


  refreshInProgress = true;


  try{

    await loadData();

  }

  finally{

    refreshInProgress = false;


    if(
      refreshQueued
    ){

      refreshQueued = false;


      setTimeout(
        refreshScoreboard,
        100
      );

    }

  }

}


/* =====================================================
   SUPABASE REALTIME
===================================================== */

function startRealtime(){

  supabaseClient

    .channel(
      "scottsdale-live-scoreboard"
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"scores"
      },
      () => {

        refreshScoreboard();

      }
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"pairings"
      },
      () => {

        refreshScoreboard();

      }
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"pairing_players"
      },
      () => {

        refreshScoreboard();

      }
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"parlay_results"
      },
      () => {

        refreshScoreboard();

      }
    )

    .subscribe(
      status => {

        console.log(
          "Realtime status:",
          status
        );

      }
    );

}


/* =====================================================
   START
===================================================== */

refreshScoreboard();

startRealtime();


/* =====================================================
   BACKUP REFRESH
===================================================== */

setInterval(
  refreshScoreboard,
  5000
);

</script>
